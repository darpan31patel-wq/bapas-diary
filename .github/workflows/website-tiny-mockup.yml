# Website only: before and after pictures of the live Calendar and Search with the tiny photo copies (R2 t/), for
# Darpan to see before anything changes (whole website review, 28 Oct 2026). Changes no page: the "after" pictures
# swap s/ for t/ only inside this test browser. Pictures and numbers go to release website-review.
name: website-tiny-mockup
on:
  push:
    branches: ['claude/project-thread-mwunnf']
    paths: ['.github/workflows/website-tiny-mockup.yml']
jobs:
  shots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Before and after
        run: |
          npm i -s playwright@1.49.1 > /dev/null && npx playwright install --with-deps chromium > /dev/null
          cat > shots.js <<'JS'
          const { chromium } = require('playwright');
          const pages = [['calendar', '/calendar/'], ['search', '/search/#q=annakut'], ['today', '/']];
          const sizes = [['phone', 390, 844, 3, true], ['laptop', 1440, 900, 1, false]];
          (async () => {
            const b = await chromium.launch();
            for (const [sz, w, h, dpr, mob] of sizes) for (const [name, path] of pages) for (const tiny of [false, true]) {
              const ctx = await b.newContext({ viewport: { width: w, height: h }, deviceScaleFactor: dpr, isMobile: mob, hasTouch: mob, serviceWorkers: 'block' });
              let bytes = 0, n = 0, miss = 0;
              await ctx.route(/photos\.bapas-diary\.com\/s\//, async r => {
                try {
                  const u = tiny ? r.request().url().replace('.com/s/', '.com/t/') : r.request().url();
                  const res = await r.fetch({ url: u }).catch(() => null);
                  if (!res || !res.ok()) { miss++; return await r.continue(); }
                  const body = await res.body(); bytes += body.length; n++;
                  await r.fulfill({ status: 200, body, headers: { 'content-type': res.headers()['content-type'], 'access-control-allow-origin': '*' } });
                } catch (e) {}   // the page was closed while a photo was still on its way
              });
              const p = await ctx.newPage();
              const t0 = Date.now();
              await p.goto('https://bapas-diary.com' + path, { waitUntil: 'networkidle', timeout: 90000 }).catch(() => {});
              await p.waitForTimeout(4000);
              const f = `${name}-${sz}-${tiny ? 'after' : 'before'}.jpg`;
              await p.screenshot({ path: f, type: 'jpeg', quality: 80 });
              if (name === 'calendar') await p.locator('img[src*="photos.bapas-diary.com"]').first().screenshot({ path: `zoom-${sz}-${tiny ? 'after' : 'before'}.png` }).catch(() => {});
              console.log(`${f}: ${n} small photos, ${(bytes / 1024).toFixed(0)} KB, ${miss} not in t/, ${Date.now() - t0} ms`);
              await p.unrouteAll({ behavior: 'ignoreErrors' }).catch(() => {}); await ctx.close().catch(() => {});
            }
            await b.close();
          })();
          JS
          node shots.js | tee numbers.txt; true
      - name: Keep them in release website-review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view website-review -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create website-review -R "$GITHUB_REPOSITORY" --prerelease --title "Website review pictures" --notes "Before and after pictures for the whole website review (28 Oct 2026). Website only."
          gh release upload website-review -R "$GITHUB_REPOSITORY" --clobber *.jpg zoom-*.png numbers.txt
