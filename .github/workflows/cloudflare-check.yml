# Checks the Cloudflare key for the website works. Prints only yes/no and names, never the key.
name: cloudflare-check
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/cloudflare-check.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check key, account, zone, R2 and Pages
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api() { curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          [ -n "$CF_TOKEN" ] && echo "token secret: present" || echo "token secret: MISSING"
          [ -n "$CF_ACCOUNT" ] && echo "account secret: present" || echo "account secret: MISSING"
          echo "verify (user token):";    api /user/tokens/verify | jq -c '{success, status: .result.status, errors}'
          echo "verify (account token):"; api "/accounts/$CF_ACCOUNT/tokens/verify" | jq -c '{success, status: .result.status, errors}'
          echo "zone bapas-diary.com:";   api "/zones?name=bapas-diary.com" | jq -c '{success, zones: [.result[]? | {name, status}], errors}'
          echo "R2 buckets:";             api "/accounts/$CF_ACCOUNT/r2/buckets" | jq -c '{success, buckets: [.result.buckets[]?.name], errors}'
          echo "Pages projects:";         api "/accounts/$CF_ACCOUNT/pages/projects" | jq -c '{success, projects: [.result[]?.name], errors}'
