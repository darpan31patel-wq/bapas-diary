# Website only (bapas-diary.com). Separate from the daily 2pm picture: touches nothing in that chain, fetches nothing
# from swaminarayan.org or baps.org, and changes nothing on the live website.
# The old BAPS website's photos, day reports and towns, made ready for the website (Darpan, 13 Nov 2026: older years on
# Today, the Calendar and Through the years; the vicharan report under a clicked Calendar day's photos; Travels for the
# early years). One gentle round each time this file is pushed:
#   1. reads the detail lists the "Collect other BAPS websites" thread puts in release `database`
#   2. puts the new photos (not those baps.org already gave us) into the photo store at the five usual sizes, from Drive
#   3. face checks them, so Bapa's own pages take only photos where he is recognised
#   4. keeps everything in release `swaminarayan-org-web`, which the website build reads once Darpan says yes
#   5. builds the whole site exactly like a deploy, without publishing it, and photographs the pages for his mockup
name: swaminarayan-org-web
on:
  push:
    branches: ['claude/project-thread-2l8drg']
    paths: ['.github/workflows/swaminarayan-org-web-2l8drg.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: website-photos   # never at the same time as the other copies into the photo store
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      ready: ${{ steps.lists.outputs.ready }}
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: bapas-diary-photos
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The detail lists
        id: lists
        run: |
          gh release download database -p bapas.db.gz -p swaminarayan-org-photos.jsonl -p swaminarayan-org-pages.jsonl || true
          if [ ! -s swaminarayan-org-pages.jsonl ]; then echo "The swaminarayan.org lists are not in the release yet"; echo ready=no >> "$GITHUB_OUTPUT"; exit 0; fi
          touch swaminarayan-org-photos.jsonl
          gunzip -f bapas.db.gz
          echo "pages: $(wc -l < swaminarayan-org-pages.jsonl), photos: $(wc -l < swaminarayan-org-photos.jsonl)"
          echo ready=yes >> "$GITHUB_OUTPUT"
      - name: Day reports, prasangs and towns
        if: steps.lists.outputs.ready == 'yes'
        run: |
          python3 tools/sorg_reports.py --pages swaminarayan-org-pages.jsonl --out reports --full sorg-reports.jsonl --days sorg-days.json --known places.json
          tar -czf sorg-reports.tgz -C reports .
          curl -sSfL https://download.geonames.org/export/dump/cities500.zip -o cities500.zip && unzip -oq cities500.zip
          python3 tools/sorg_travels.py geo --days sorg-days.json --travels live/travels/index.html --geonames cities500.txt --out sorg-geo.json
      - name: Photos into the photo store, then the face check
        if: steps.lists.outputs.ready == 'yes'
        env:
          TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
          CLIENT_ID: ${{ secrets.RCLONE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.RCLONE_CLIENT_SECRET }}
        run: |
          pip install -q -r requirements.txt
          python3 tools/sorg_photos.py rows --photos swaminarayan-org-photos.jsonl --db bapas.db --out sorg-rows.json --captions sorg-captions.json
          curl -s https://rclone.org/install.sh | sudo bash >/dev/null
          git fetch -q --depth 1 origin main && git show FETCH_HEAD:tools/rclone_conf.py > "$RUNNER_TEMP/rclone_conf.py"   # his own Google login, as the copy into Drive used
          mkdir -p ~/.config/rclone && python3 "$RUNNER_TEMP/rclone_conf.py" > ~/.config/rclone/rclone.conf
          rclone lsf "gdrive:Bapa's Archive/sites/swaminarayan.org" --max-depth 1 > drive-top.txt || { echo '::error::Drive folder not reachable'; exit 1; }; echo "$(wc -l < drive-top.txt) folders in Drive"
          id=$(curl -s -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -r .result.id)
          key=$(printf %s "$CF_TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$id"; echo "::add-mask::$key"   # keep both out of the run logs
          export AWS_ACCESS_KEY_ID=$id AWS_SECRET_ACCESS_KEY=$key AWS_DEFAULT_REGION=auto R2="https://$CF_ACCOUNT.r2.cloudflarestorage.com"
          list() { aws s3 ls "s3://$BUCKET/$1/sorg-" --recursive --endpoint-url "$R2" | awk '{ $1=$2=$3=""; sub(/^ +/, ""); print }' || true; }
          list o > have.txt
          python3 tools/sorg_photos.py store --rows sorg-rows.json --have have.txt --minutes 200 \
            --send 'aws s3 cp --recursive "$OUT" "s3://$BUCKET/" --endpoint-url "$R2" --only-show-errors --cache-control "public, max-age=31536000, immutable" --content-type image/jpeg'
          { list o; list s; } > sorg-have.txt
          n=$(grep -c '^s/' sorg-have.txt || true); echo "$n old site photos in the photo store"
          [ "$n" -gt 0 ] || { echo '::error::No old site photos reached the photo store'; exit 1; }
          python3 tools/sorg_photos.py same --rows sorg-rows.json --db bapas.db --have sorg-have.txt --out sorg-same.json
          python3 tools/sorg_photos.py db --rows sorg-rows.json --same sorg-same.json --have sorg-have.txt --out sorg.db
          for y in $(python3 -c "import sqlite3; print(' '.join(str(y) for (y,) in sqlite3.connect('sorg.db').execute('SELECT DISTINCT year FROM photos ORDER BY year')))"); do
            python3 tools/web_faces.py scan --db sorg.db --shard "$y-0-1" --out "face2-$y-sorg.json.gz"
          done
      - name: Keep it all in release swaminarayan-org-web
        if: steps.lists.outputs.ready == 'yes'
        run: |
          gh release view swaminarayan-org-web >/dev/null 2>&1 || gh release create swaminarayan-org-web --prerelease \
            --title "Old BAPS website for the website" --notes "swaminarayan.org photos, day reports and towns for bapas-diary.com. Not used by the daily picture."
          shopt -s nullglob
          for f in sorg-rows.json sorg-have.txt sorg-captions.json sorg-same.json; do [ -s $f ] || echo >> $f; done   # GitHub refuses an empty file
          gh release upload swaminarayan-org-web sorg-rows.json sorg-have.txt sorg-captions.json sorg-same.json sorg.db sorg-reports.tgz sorg-reports.jsonl sorg-days.json sorg-geo.json face2-*-sorg.json.gz --clobber
# round 9 (fingerprints on 8 machines; photos already in the store are skipped): the old site's photos, same photo check, face check, picture fingerprints, mockup 2 with Calendar from 1981,
# Through the years and Legacy (14 Nov 2026)
  deep:   # the picture fingerprints Legacy matches pairs by (same model as website-deeptags on vcys74)
    needs: prepare
    if: needs.prepare.outputs.ready == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]   # one machine reads about 2,500 photos in the time (like website-deeptags' shards)
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fingerprints of the old site's photos
        run: |
          git fetch -q origin claude/project-thread-vcys74 && mkdir dt && git archive FETCH_HEAD tools | tar -x -C dt
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -q 'open_clip_torch>=2.31' 'timm>=1.0.15' transformers sentencepiece pillow numpy
          gh release download swaminarayan-org-web -p sorg.db
          for y in $(python3 -c "import sqlite3; print(' '.join(str(y) for (y,) in sqlite3.connect('sorg.db').execute('SELECT DISTINCT year FROM photos ORDER BY year')))"); do
            python3 dt/tools/deep_tags.py shard --db sorg.db --shard "$y-${{ matrix.part }}-8" --out photos
          done
          echo "$(find photos -type f | wc -l) photos"
          python3 dt/tools/deep_tags.py embed --photos photos --out emb-sorg-${{ matrix.part }}.npz
          gh release upload swaminarayan-org-web emb-sorg-${{ matrix.part }}.npz --clobber
  mockup:
    needs: [prepare, deep]
    if: always() && needs.prepare.outputs.ready == 'yes'   # Legacy uses whichever fingerprint parts are ready
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      PROJECT: bapas-diary
      DOMAIN: bapas-diary.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The whole site, built exactly like a deploy (not published)
        run: |
          export CAL_COMMIT=$(grep -oP 'CAL_COMMIT: \K[0-9a-f]{40}' .github/workflows/website-deploy.yml)
          pip install -q pyyaml
          gh release download database -p bapas.db.gz -O - | gunzip > old.db
          python3 - <<'PY'
          import re, yaml
          wf = yaml.safe_load(open('.github/workflows/website-deploy.yml'))
          job = wf['jobs']['deploy']
          step = next(s for s in job['steps'] if s.get('name', '').startswith('Photo search'))
          run = step['run']
          # mockup 2: the old site's photos join this build (the live deploy has them only after Darpan's yes)
          dl = 'gh release download database -p bapas.db.gz -O - | gunzip > bapas.db\n'
          run = run.replace(dl, dl + 'gh release download swaminarayan-org-web -p sorg-rows.json -p sorg-have.txt -p sorg-captions.json -p sorg-same.json\n'
                            'python3 tools/sorg_photos.py add --rows sorg-rows.json --db bapas.db --have sorg-have.txt --captions sorg-captions.json --same sorg-same.json\n', 1)
          fc = "mkdir faces && gh release download website-faces -p 'face2-*.json.gz' -D faces\n"
          run = run.replace(fc, fc + "gh release download swaminarayan-org-web -p 'face2-*-sorg.json.gz' -D faces\n", 1)
          # the Calendar reaches back to 1981, the first year of the old site's festival photos
          cal = 'tar -x -C calsrc\n'
          run = run.replace(cal, cal + "sed -i 's/^FIRST = (1999, 1)/FIRST = (1981, 1)/' calsrc/tools/web_calendar.py && grep -q '^FIRST = (1981, 1)' calsrc/tools/web_calendar.py\n", 1)
          assert 'sorg_photos.py add' in run and 'sorg.json.gz' in run and 'FIRST = (1981' in run
          open('build.sh', 'w').write('set -eo pipefail\n' + run)
          PY
          bash build.sh
      - name: Through the years with the old site's photos (its own thread's tools, branch lfiln1)
        continue-on-error: true
        run: |
          pip install -q opencv-python-headless numpy pillow open_clip_torch torch --extra-index-url https://download.pytorch.org/whl/cpu
          git fetch -q origin claude/project-thread-lfiln1 && mkdir ty && git archive FETCH_HEAD tools site models | tar -x -C ty
          cp bapas.db ty.db && python3 ty/tools/news_ready.py --db ty.db --out news-ready.txt --prune
          { curl -sf https://photos.bapas-diary.com/years.txt || true; sqlite3 ty.db "SELECT DISTINCT year FROM photos WHERE source = 'swaminarayan.org'"; } | grep -E '^[0-9]{4}$' | sort -un > ty-years.txt
          mkdir hints && cp faces/face2-*.json.gz hints/
          mkdir tys && gh release download faces-mockup -p faces.tgz -O - | tar -xz -C tys
          python3 ty/tools/faces_years.py --db ty.db --years ty-years.txt --hints hints --out tys/faces --sheet sheet 2>&1 | grep -v WARN | tail -40
          python3 ty/tools/build_faces.py --faces tys/faces --db ty.db --out ytt --site
          rsync -a --delete ytt/ out/through-the-years/ && python3 tools/web_places.py --page out/through-the-years/index.html
          echo "days with an old site close up: $(grep -o 'sorg-' tys/faces/faces.json | wc -l)"
      - name: Legacy with the old site's photos (its own thread's picker, branch dmnrb9)
        continue-on-error: true
        run: |
          pip install -q numpy
          git fetch -q origin claude/project-thread-dmnrb9 && mkdir lg && git archive FETCH_HEAD tools site | tar -x -C lg
          mkdir emb && gh release download deep-tags -p 'emb-*.npz' -p words.npz -D emb
          gh release download swaminarayan-org-web -p 'emb-sorg-*.npz' -D emb || true
          [ -d hints ] || { mkdir hints && cp faces/face2-*.json.gz hints/; }
          cp out/then-and-now/more.json old-more.json
          python3 lg/tools/legacy_auto.py --db bapas.db --emb emb --faces hints --picks lg/site/then-now-picks.json \
            --more old-more.json --out more.json --sheet legacy-new.json --week 12
          cp more.json out/then-and-now/more.json
          echo "Legacy pairs: $(jq length old-more.json) before, $(jq length more.json) now, with an old site photo: $(grep -o 'sorg-' more.json | wc -l)"
      - name: Photographs of the pages
        run: |
          pip install -q playwright && python3 -m playwright install --with-deps chromium >/dev/null
          python3 tools/sorg_mockup.py --site out --days sorg-days.json --reports out/data/reports --bapa bapa.db --old old.db --shots shots
          tar -czf sorg-mockup.tgz shots
          gh release upload swaminarayan-org-web sorg-mockup.tgz --clobber
