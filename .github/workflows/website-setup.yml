# Website only (bapas-diary.com). Separate from the daily 2pm picture: touches nothing in that chain.
# Makes the R2 photo bucket and an empty Pages project (no deployment, nothing public), and tests
# R2 file access. R2 file keys come from the same API token: key id = token id, secret = sha256(token).
name: website-setup
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/website-setup.yml']
  workflow_dispatch:
jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: bapas-diary-photos
      PROJECT: bapas-diary
    steps:
      - name: R2 bucket and Pages project
        run: |
          api() { curl -s -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json' "$@"; }
          A=https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT
          echo "bucket:";  api -X POST "$A/r2/buckets" -d "{\"name\":\"$BUCKET\",\"locationHint\":\"weur\"}" | jq -c '{success, errors}'
          echo "project:"; api -X POST "$A/pages/projects" -d "{\"name\":\"$PROJECT\",\"production_branch\":\"main\"}" | jq -c '{success, subdomain: .result.subdomain, errors}'
          echo "buckets now:";  api "$A/r2/buckets" | jq -c '[.result.buckets[]?.name]'
          echo "projects now:"; api "$A/pages/projects" | jq -c '[.result[]? | {name, subdomain, deployments: (.latest_deployment != null)}]'
      - name: R2 file access test (put, list, delete one tiny file)
        run: |
          id=$(curl -s -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -r .result.id)
          export AWS_ACCESS_KEY_ID=$id AWS_SECRET_ACCESS_KEY=$(printf %s "$CF_TOKEN" | sha256sum | cut -d' ' -f1) AWS_DEFAULT_REGION=auto
          E=https://$CF_ACCOUNT.r2.cloudflarestorage.com
          echo ok > test.txt
          aws s3 cp test.txt s3://$BUCKET/setup-test.txt --endpoint-url $E --only-show-errors && echo "put: ok"
          aws s3 ls s3://$BUCKET/ --endpoint-url $E
          aws s3 rm s3://$BUCKET/setup-test.txt --endpoint-url $E --only-show-errors && echo "delete: ok"
