# Website only (bapas-diary.com), read only check: never deploys and touches nothing in the daily 2pm picture chain.
# Opens every live page on phone and tablet sizes (mockups/device-check/shoot.js) and keeps the screenshots and
# notes in the release `device-check`. Runs when this file changes. Never hand this file to the website branch.
name: device-check
on:
  push:
    branches: ['claude/project-thread-q7xtjj']
    paths: ['.github/workflows/device-check.yml']
permissions:
  contents: write
jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_NO: '1'
    steps:
      - uses: actions/checkout@v4
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium webkit
      - run: node mockups/device-check/shoot.js shots; tar czf device-shots.tgz shots && ls shots | wc -l
      - run: |
          gh release view device-check >/dev/null 2>&1 || gh release create device-check --prerelease --title "Device check" --notes "Screenshots of the live website on phones and tablets. Not used by the website or the daily picture."
          gh release upload device-check device-shots.tgz --clobber
