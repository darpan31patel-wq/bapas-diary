name: Album scan

# Darpan, 22 Oct 2026: every single baps.org picture, not only the ones the day pages list. Each night
# tools/album_scan.py asks baps.org for the photo numbers each album could hold that no page showed, and for
# albums newer than the database, then keeps its finds in scan.json in the release `database`. The first
# pass over every album takes a few nights; after that a night only looks for new albums. When it found
# something new it rebuilds the database, so the Mac script downloads those photos too.

on:
  schedule:
    - cron: '0 23 * * *'    # 11pm or midnight UK
  workflow_dispatch:
    inputs:
      probe:
        description: 'Type yes to only test which photos have full size originals (fullsize-probe.json)'
        required: false
      where:
        description: 'With probe: only photos matching this, e.g. file LIKE ''%Robbinsville%'''
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: album-scan

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get the database and what earlier nights found
        run: |
          gh release download database -p bapas.db.gz -p scan.json || gh release download database -p bapas.db.gz
          gunzip -f bapas.db.gz
          python -c "import json; print(len(json.load(open('scan.json'))['extra']))" > before.txt 2>/dev/null || echo 0 > before.txt
      - name: Test which photos have full size originals
        if: inputs.probe == 'yes'
        run: |
          python tools/fullsize_probe.py --db bapas.db --out fullsize-probe.json ${{ inputs.where && format('--where "{0}"', inputs.where) || '' }}
          gh release upload database fullsize-probe.json --clobber
      - name: Scan the albums (stops after 5 hours, the next night carries on)
        if: inputs.probe != 'yes'
        run: python tools/album_scan.py --db bapas.db --scan scan.json --hours 5
      - name: Keep the finds, and rebuild the database when there are new ones
        if: always() && inputs.probe != 'yes'
        run: |
          [ -s scan.json ] || exit 0
          gh release upload database scan.json --clobber
          after=$(python -c "import json; print(len(json.load(open('scan.json'))['extra']))")
          echo "$after photos found that no page lists (was $(cat before.txt))"
          if [ "$after" != "$(cat before.txt)" ]; then gh workflow run archive.yml --ref main; fi
