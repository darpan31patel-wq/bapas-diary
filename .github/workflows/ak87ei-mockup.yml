# Website only, mockup only (never handed over, deploys nothing). Builds the whole site exactly as the deploy's build
# step does (read from website-deploy.yml on this branch), serves it here on the runner with the real photos from R2,
# and takes pictures of the new Mandirs view in Travels and A day with Bapa on Today into the release ak87ei-mockup.
name: ak87ei-mockup
on:
  push:
    branches: ['claude/project-thread-ak87ei']
    paths: ['.github/workflows/ak87ei-mockup.yml']
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PROJECT: bapas-diary
      DOMAIN: bapas-diary.com
    steps:
      - uses: actions/checkout@v4
      - name: Build the site as the deploy does
        run: |
          python3 - <<'PY'
          import yaml
          w = yaml.safe_load(open('.github/workflows/website-deploy.yml'))
          d = w['jobs']['deploy']
          step = next(s for s in d['steps'] if s.get('name', '').startswith('Photo search'))
          env = ''.join(f"export {k}='{v}'\n" for k, v in d['env'].items() if 'secrets' not in str(v))
          open('build.sh', 'w').write('set -e\n' + env + step['run'])
          PY
          echo '{}' > calendar-looks.json
          bash build.sh > build-log.txt 2>&1 || { tail -80 build-log.txt; exit 1; }
          grep -E '^(mandirs|dayflow):' build-log.txt || true
          ls out/travels/mandirs out/data/dayflow | head
      - name: Pictures of the pages
        run: |
          pip install -q playwright && python3 -m playwright install --with-deps chromium > /dev/null
          (cd out && python3 -m http.server 8000 > /dev/null 2>&1 &) && sleep 2
          mkdir shots
          python3 - <<'PY' 2>&1 | tee shots/shots-log.txt
          from playwright.sync_api import sync_playwright
          B = 'http://localhost:8000'
          import traceback
          def safe(f):
              try: f()
              except Exception: traceback.print_exc()
          def eager(p):
              p.evaluate("document.querySelectorAll('img[loading=lazy]').forEach(i => i.loading = 'eager')")
              p.wait_for_timeout(2500)
          with sync_playwright() as pw:
              br = pw.chromium.launch()
              for name, w, h, mob in (('computer', 1600, 1000, False), ('phone', 390, 844, True)):
                  ctx = br.new_context(viewport={'width': w, 'height': h}, device_scale_factor=2 if mob else 1, is_mobile=mob, has_touch=mob)
                  p = ctx.new_page()
                  p.on('pageerror', lambda e: print('PAGE ERROR', e))
                  p.goto(B + '/travels/mandirs/'); p.wait_for_timeout(4500); eager(p)
                  p.screenshot(path=f'shots/mandirs-{name}.jpg', quality=82)
                  p.goto(B + '/travels/places/'); p.wait_for_timeout(3000)
                  p.screenshot(path=f'shots/places-switch-{name}.jpg', quality=82, clip={'x': 0, 'y': 0, 'width': w, 'height': 160})
                  p.goto(B + '/travels/mandirs/#place=Sarangpur'); p.reload(); p.wait_for_timeout(4500); eager(p)
                  p.screenshot(path=f'shots/mandirs-town-{name}.jpg', quality=82)
                  p.goto(B + '/travels/mandirs/'); p.reload(); p.wait_for_timeout(3500)
                  def sydney():
                      if mob: p.click('#grab'); p.wait_for_timeout(600)
                      p.click('.years button:has-text("2025")', timeout=5000); p.wait_for_timeout(800)
                      p.click('.ev:has-text("Sydney") .vt', timeout=5000); p.wait_for_timeout(3000); eager(p)
                      p.screenshot(path=f'shots/mandirs-sydney-{name}.jpg', quality=82)
                  safe(sydney)
                  for v in ('a', 'b'):
                      c2 = br.new_context(viewport={'width': w, 'height': h}, device_scale_factor=2 if mob else 1, is_mobile=mob, has_touch=mob)
                      c2.add_init_script(f"window.DAYFLOW = '{v}'")
                      q = c2.new_page()
                      q.goto(B + "/#10-31"); q.wait_for_timeout(9500)
                      q.evaluate("document.getElementById('dflow').scrollIntoView()"); eager(q)
                      q.evaluate("scrollBy(0, -260)"); q.wait_for_timeout(1500)
                      q.screenshot(path=f'shots/today-{v}-{name}-top.jpg', quality=82)
                      safe(lambda: q.screenshot(path=f"shots/today-{v}-{name}.jpg", quality=82, full_page=True, animations="disabled", timeout=60000, clip=q.evaluate("(() => { const r = document.getElementById('dflow').getBoundingClientRect(); return {x: 0, y: r.top + scrollY, width: innerWidth, height: r.height}; })()")))
                      print(v, name, q.evaluate("document.getElementById('dflow').hidden"), q.evaluate("document.querySelectorAll('#dflow img').length"))
                      c2.close()
                  ctx.close()
              br.close()
          PY
          ls -la shots
          cp build-log.txt shots/ ; cp out/travels/mandirs/index.html shots/mandirs.html; cp out/data/dayflow/10-31.json out/data/dayflow/day.json shots/ || true; ls out/data/dayflow | wc -l
          gh release view ak87ei-mockup >/dev/null 2>&1 || gh release create ak87ei-mockup --prerelease --title "Mandirs and A day with Bapa mockup" --notes "Pictures of two new website pieces, for a mockup. Not used by the daily picture or the website."
          gh release upload ak87ei-mockup shots/* --clobber
      - name: The logs, when something failed
        if: failure()
        run: |
          gh release view ak87ei-mockup >/dev/null 2>&1 || gh release create ak87ei-mockup --prerelease --title "Mandirs and A day with Bapa mockup" --notes "Mockup only."
          tail -200 build-log.txt > fail-log.txt 2>/dev/null || echo none > fail-log.txt
          gh release upload ak87ei-mockup fail-log.txt shots/shots-log.txt --clobber || gh release upload ak87ei-mockup fail-log.txt --clobber
