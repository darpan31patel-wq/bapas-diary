# Old BAPS websites that are gone now, copied from the Internet Archive's Wayback Machine into Darpan's Drive archive
# ("Bapa's Archive/sites/web.archive.org/<old site>/...") with the same full detail lists as the live sites, plus the
# day the Archive took each copy (Darpan, 13 Nov 2026: "Yes to all"; "Everything from the other websites need to have
# full detail"). Archive only: touches nothing in the 2pm picture's chain, the website, R2 or bapas.db, never runs
# 03:45 to 07:30 UTC, one gentle reader per old site. Pushing this file again carries each site on from where it
# stopped. Lists: <key>-pages.jsonl and <key>-photos.jsonl in the release `database` once a site is finished.
# Round 1: 17 Nov 2026 11:45 UTC: mandir.org, kids.swaminarayan.org, bapscare.org (bapscare.org no longer answers).
# Round 2: 17 Nov 15:40 UTC: 1,606 files in (mandir.org 535 of 10,513, kids 879 of 1,447, bapscare 805 of 810). The
# Archive slowed the two readers down, so now one reader at the Archive's own pace, copying for 4h.
# Round 3: 17 Nov 20:20 UTC: round 2 got only 617 files (the Archive keeps asking GitHub's machines to wait); this
# round counts the Archive's answers to see why, and gives up on files that failed twice (bapscare.org's last 5).
# Round 4: 18 Nov 08:05 UTC: round 3 went well (mandir.org 3,055 files in 4h, 6,637 left); kids.swaminarayan.org
# (14) and bapscare.org (5) only have files that failed twice, so both finish and get their lists.
# Round 5: 18 Nov 12:35 UTC: kids.swaminarayan.org and bapscare.org finished; mandir.org 4,417 left.
# Round 6: 18 Nov 17:35 UTC: mandir.org 3,878 left (the Archive was slow in the daytime: 539 files).
# Round 7: 18 Nov 21:55 UTC: mandir.org 3,449 left (round 6: 429 files, the Archive often refused to connect).
# Round 8: 19 Nov 08:05 UTC: mandir.org 3,157 left (round 7: 289 files); shorter wait per file, and the reason for each
# failed connection is counted.
# Round 9: 19 Nov 12:35 UTC: mandir.org 2,557 left (round 8: 597 files). Most failures were 'Connection refused', the
# Archive's way of saying too many: now five seconds between files, and three minutes' rest after a refusal.
# Round 10: 19 Nov 17:05 UTC: mandir.org 2,265 left (round 9: 290 files, 64 refusals). Each round now starts the next
# by itself until the site is finished (a round that would start in the morning stops the chain).
# 20 Nov 07:45 UTC: fixed a round that started at 03:32 running on to 07:34; the free morning is now 03:00 to 07:30
# and copying never goes past 03:30. mandir.org 1,141 left.
name: wayback
on:
  push:
    branches: ['claude/project-thread-2nikpj']
    paths: ['.github/workflows/wayback-2nikpj.yml']
  workflow_dispatch:   # the next round starts itself while a site is unfinished
permissions:
  contents: write   # the lists into the release `database`
  actions: write    # to start the next round
concurrency:
  group: wayback
jobs:
  copy:
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        include:
          - { host: mandir.org, key: wayback-mandir-org }
          # kids.swaminarayan.org and bapscare.org finished 18 Nov
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      REMOTE: "gdrive:Bapa's Archive/sites/web.archive.org/${{ matrix.host }}"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Never in the 2pm picture's morning
        run: |
          m=$(( 10#$(date -u +%H) * 60 + 10#$(date -u +%M) ))
          if [ $m -ge 180 ] && [ $m -lt 450 ]; then echo "::error::03:00 to 07:30 UTC is kept free"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Drive access
        env:
          TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
          CLIENT_ID: ${{ secrets.RCLONE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.RCLONE_CLIENT_SECRET }}
        run: |
          curl -s https://rclone.org/install.sh | sudo bash >/dev/null
          git fetch -q --depth 1 origin main && git show FETCH_HEAD:tools/rclone_conf.py > "$RUNNER_TEMP/rclone_conf.py"
          mkdir -p ~/.config/rclone && python3 "$RUNNER_TEMP/rclone_conf.py" > ~/.config/rclone/rclone.conf
      - name: Where the last round stopped
        run: |
          mkdir -p state
          rclone copy "$REMOTE/_state" state 2>/dev/null || true
          rclone lsf -R --files-only "$REMOTE" --filter "- _state/**" --filter "- _index/**" > have.txt || : > have.txt
          wc -l have.txt
      - name: Copy from the Archive (4h at most, by 03:30 UTC at the latest)
        run: |
          ( while sleep 600; do [ -d work/files ] && rclone move work/files "$REMOTE" --transfers 16 --checkers 16 \
              --min-age 30s --stats 0 2>&1 | tail -2; rclone copy state "$REMOTE/_state" --stats 0 2>&1 | tail -1; done ) &
          mover=$!
          # 4h from now, but never past 03:30 UTC (a round that starts in the evening stops at 03:30)
          stop=$(python3 -c "import datetime as d; n=d.datetime.now(d.timezone.utc); e=n+d.timedelta(minutes=240); c=n.replace(hour=3,minute=30,second=0,microsecond=0); c=c if c>n else c+d.timedelta(days=1); print(min(e,c).strftime('%H:%M'))")
          echo "stopping at $stop UTC"
          python3 -I tools/wayback.py --host ${{ matrix.host }} --work work --state state --stop-at $stop --have have.txt | tee run.log || true
          kill $mover || true; pkill -f 'rclone move work/files' || true; sleep 5
      - name: Into Drive
        if: always()
        run: |
          rclone copy state "$REMOTE/_state" --stats 0
          [ -d work/files ] && timeout 90m rclone move work/files "$REMOTE" --transfers 16 --checkers 16 --stats-one-line --stats 0 || true
          rclone copy state "$REMOTE/_state" --stats 0
      - name: Full detail for every page and photo (once a site is finished)
        if: always()
        run: |
          if ! grep -q '"finished": true' state/last-run.json; then echo "not finished yet"; exit 0; fi
          rclone copy "$REMOTE" pages --filter "- _state/**" --filter "- _index/**" --filter "+ *.{htm,html,HTM,HTML,shtml,asp,php}" \
            --filter "+ *__*" --filter "- *" --transfers 16 --checkers 16 --stats 0
          python3 -I tools/sites_index.py --site ${{ matrix.host }} --base http://${{ matrix.host }}/ --files pages --headers state/files.jsonl --out idx
          rclone copy idx "$REMOTE/_index" --stats 0
          cp idx/pages.jsonl ${{ matrix.key }}-pages.jsonl && cp idx/photos.jsonl ${{ matrix.key }}-photos.jsonl
          gh release upload database ${{ matrix.key }}-pages.jsonl ${{ matrix.key }}-photos.jsonl --clobber
          cp state/last-run.json ${{ matrix.key }}-last-run.json && gh release upload database ${{ matrix.key }}-last-run.json --clobber
          cat state/last-run.json
      - name: Next round, while unfinished (the morning guard stops the chain; it is restarted after 07:30)
        if: always()
        run: |
          if [ -f state/last-run.json ] && ! grep -q '"finished": true' state/last-run.json; then
            gh workflow run wayback-2nikpj.yml --ref claude/project-thread-2nikpj && echo "next round asked for"; fi
