# Website only (bapas-diary.com). Separate from the daily 2pm picture: touches nothing in that chain.
# Tags what is happening in each small R2 photo (tools/photo_tags.py, an open CLIP model, no Claude) and keeps
# tags.json in the release `website-mockup`. Runs when this file or the tagger changes on a claude/** branch.
name: website-tags
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/website-tags.yml', 'tools/photo_tags.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: website-tags
jobs:
  tags:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: bapas-diary-photos
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get ready
        run: |
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -q open_clip_torch pillow
          id=$(curl -s -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -r .result.id)
          key=$(printf %s "$CF_TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$id"; echo "::add-mask::$key"   # keep both out of the run logs
          export AWS_ACCESS_KEY_ID=$id AWS_SECRET_ACCESS_KEY=$key AWS_DEFAULT_REGION=auto
          aws s3 sync "s3://$BUCKET/s" small --endpoint-url "https://$CF_ACCOUNT.r2.cloudflarestorage.com" --only-show-errors
          echo "$(find small -type f | wc -l) small photos"
      - name: Tag
        run: python3 tools/photo_tags.py --photos small --out tags.json
      - name: Keep
        run: |
          gh release view website-mockup -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create website-mockup -R "$GITHUB_REPOSITORY" --prerelease --title "Website mockup photos" --notes "For building website mockups. Not used by the daily picture."
          gh release upload website-mockup tags.json --clobber -R "$GITHUB_REPOSITORY"
