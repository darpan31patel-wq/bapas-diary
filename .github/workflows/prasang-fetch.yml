# Website only. Reads the public channel t.me/bapsprasangs (stories tied to a day) into telegram/prasang/posts.json on
# this branch, for the "Prasang from today" button on Today (Darpan, 30 Oct 2026). Touches nothing in the 2pm chain.
name: prasang-fetch
on:
  push:
    branches: ['claude/project-thread-xrmlfo']
    paths: ['.github/workflows/prasang-fetch.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/tg_fetch.py bapsprasangs telegram/prasang/posts.json
      - run: |
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add telegram/prasang/posts.json
          git commit -m "Prasang channel read (t.me/bapsprasangs) [skip ci]" || exit 0
          git push
