name: Refresh the Telegram channels

# Refreshes Bapa's Diary's saved copies of the two Telegram channels (Today in BAPS History, Satpurush in UK & Europe)
# that the older cards, the history line and the 2pm caption stories come from. Telegram refuses Claude's own machines
# (a 403 at the door), so the reading happens here on GitHub, which Telegram lets in.
# Runs only when started (Darpan, 22 Oct 2026: no automatic refresh; the monthly reminder issue asks for it).
# A thread starts it when he says "refresh the Telegram channels", then writes the short lines for any story listed in
# telegram/new-stories.json (new History stories are left out of the picture until they have lines).

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tools for reading the captions off the Satpurush photos
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y tesseract-ocr > /dev/null
          pip -q install pillow numpy

      - name: Read both channels from their public web pages
        run: |
          python tools/tg_fetch.py TodayinBAPShistory /tmp/history.json
          python tools/tg_fetch.py SatpurushInUKEurope /tmp/satpurush.json

      - name: Add the new posts to the saved copies (old posts are kept, a short read never shrinks them)
        run: |
          python - <<'PY'
          import json
          for new, old in [('/tmp/history.json', 'telegram/posts.json'), ('/tmp/satpurush.json', 'telegram/satpurush/posts.json')]:
              was = json.load(open(old, encoding='utf-8'))
              got = json.load(open(new, encoding='utf-8'))
              if len(got) < 0.9 * len(was):
                  raise SystemExit(f'{new}: only {len(got)} posts read, {len(was)} saved before, nothing changed')
              merged = {p['id']: p for p in was}
              merged.update({p['id']: p for p in got})
              json.dump(sorted(merged.values(), key=lambda p: p['id']), open(old, 'w', encoding='utf-8'), ensure_ascii=False, indent=0)
              print(old, len(was), '->', len(merged), 'posts')
          PY

      - name: Rebuild the stories
        run: |
          python tools/satpurush.py ocr
          python tools/satpurush.py
          python tools/telegram.py

      - name: Save to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram
          if git diff --cached --quiet; then echo "Nothing new on either channel"; exit 0; fi
          git commit -q -m "Telegram channels refreshed $(date +'%-d %B %Y') [skip ci]"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 20))
          done
          exit 1
