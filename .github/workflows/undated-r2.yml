# Undated photos (Darpan, 30 Oct 2026): copies the ready photos (release undated-build) into the website's photo store
# R2 under o/ l/ m/ s/ undated/, where Search reads them. Only new keys, nothing else in R2 changes. Runs when
# site/undated/go-live.txt changes, which happens only once Darpan has said yes on the Website thread.
name: Undated photos to R2
on:
  push:
    branches: [claude/project-thread-8ib4kr]
    paths: [site/undated/go-live.txt]
permissions:
  contents: read
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: bapas-diary-photos
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Photos into R2
        run: |
          gh release download undated-build -R "$GITHUB_REPOSITORY" -p undated-photos.zip
          mkdir out && cd out && unzip -q ../undated-photos.zip && cd ..
          id=$(curl -s -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -r .result.id)
          key=$(printf %s "$CF_TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$id"; echo "::add-mask::$key"   # keep both out of the run logs
          export AWS_ACCESS_KEY_ID=$id AWS_SECRET_ACCESS_KEY=$key AWS_DEFAULT_REGION=auto
          for t in o l m s; do
            aws s3 sync "out/$t/undated" "s3://$BUCKET/$t/undated" --endpoint-url "https://$CF_ACCOUNT.r2.cloudflarestorage.com" \
              --only-show-errors --cache-control "public, max-age=31536000, immutable" --content-type image/jpeg
          done
          echo "copied $(find out -type f | wc -l) files"
          curl -sf -o /dev/null -w "s/undated/u0001.jpg: %{http_code}\n" https://photos.bapas-diary.com/s/undated/u0001.jpg || true
