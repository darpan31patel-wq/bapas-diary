name: Close up faces

# Contact sheets of close up face shots of Bapa for every year of a date (tools/closeups.py), to choose from.
# Run it by hand on a test branch; the sheets are committed to preview/close-ups/<date>/ on that branch.

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date (YYYY-MM-DD). Leave blank for today.'
        required: false

permissions:
  contents: write

concurrency:
  group: closeups-${{ github.ref }}

jobs:
  sheets:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Make the sheets
        env:
          DATE: ${{ inputs.date }}
        run: python tools/closeups.py ${DATE:+--date "$DATE"}
      - uses: actions/upload-artifact@v4
        with:
          name: close-ups
          path: out/close-ups/
          retention-days: 14
      - name: Keep them on this branch (never main)
        if: github.ref != 'refs/heads/main'
        run: |
          mkdir -p preview/close-ups && cp -r out/close-ups/* preview/close-ups/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/close-ups
          git commit -q -m "Close up sheets for $(ls out/close-ups)"
          git push -q
