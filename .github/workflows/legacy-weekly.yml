# Website only (bapas-diary.com): new Legacy pairs every week, with no one checking them (Darpan, 28 Oct 2026:
# "update every week, dont need to show me, just go live"). Separate from the daily 2pm picture: touches nothing in
# that chain, fetches nothing from baps.org, no AI at run time. tools/legacy_auto.py reads the photo fingerprints
# (release deep-tags) and the face scan (release website-faces), which the timers on main keep up to date as new
# photos arrive, and adds at most 6 pairs to more.json in release legacy-auto. This workflow never deploys: the
# website's own builds (website-deploy.yml) copy more.json next to /then-and-now/, so the pairs appear with the next
# build. The timer on main (website-legacy-timer.yml) runs this; it can also be run by hand.
name: legacy-weekly
on:
  workflow_call:
  workflow_dispatch:
concurrency:
  group: legacy-weekly
permissions:
  contents: write
jobs:
  pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: bapas-diary-photos
      GH_TOKEN: ${{ github.token }}
      R: darpan31patel-wq/bapas-diary
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/project-thread-dmnrb9
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get ready
        run: |
          echo "::add-mask::$CF_TOKEN"
          pip install -q numpy
          gh release download database -R $R -p bapas.db.gz -O - | gunzip > bapas.db
          mkdir emb face
          gh release download deep-tags -R $R -p 'emb-*.npz' -p words.npz -D emb
          gh release download website-faces -R $R -p 'face2-*.json.gz' -D face
          gh release download legacy-auto -R $R -p more.json -O old-more.json 2>/dev/null || echo '[]' > old-more.json
          id=$(curl -s -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -r .result.id)
          key=$(printf %s "$CF_TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$id"; echo "::add-mask::$key"
          AWS_ACCESS_KEY_ID=$id AWS_SECRET_ACCESS_KEY=$key AWS_DEFAULT_REGION=auto \
            aws s3 ls "s3://$BUCKET/l/" --recursive --endpoint-url "https://$CF_ACCOUNT.r2.cloudflarestorage.com" | awk '{print $4}' > large-keys.txt
          echo "$(wc -l < large-keys.txt) high res photos in R2"
      - name: New pairs
        id: pick
        run: |
          python3 tools/legacy_auto.py --db bapas.db --emb emb --faces face --picks site/then-now-picks.json \
            --more old-more.json --large large-keys.txt --out more.json
          echo "added=$(( $(jq length more.json) - $(jq length old-more.json) ))" >> "$GITHUB_OUTPUT"
      - name: Into the release
        if: steps.pick.outputs.added != '0'
        run: |
          gh release view legacy-auto -R $R >/dev/null 2>&1 || \
            gh release create legacy-auto -R $R --prerelease --title "Legacy weekly pairs" --notes "New Legacy pairs found each week by tools/legacy_auto.py (website only). Not used by the daily picture."
          gh release upload legacy-auto more.json --clobber -R $R
