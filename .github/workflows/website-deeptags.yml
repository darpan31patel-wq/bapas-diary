# Website only (bapas-diary.com). Separate from the daily 2pm picture: touches nothing in that chain, fetches nothing
# from baps.org (the small photos come from R2, photos.bapas-diary.com, which is public, so no secrets are needed).
# Deep photo tags for Search (Darpan, 25 Oct 2026: "red flowers or blue sky or smiling or food or animals"):
# every year in R2 is cut into shards, each shard is embedded with the open SigLIP 2 model on its own machine and
# kept in the release deep-tags, then all of them become deep-tags.json with the words checked by eye.
# Carries on where it stopped: shards already kept are skipped. The website build reads deep-tags.json (Darpan: yes deep tags, 25 Oct).
name: website-deeptags
on:
  push:
    branches: ['claude/project-thread-vcys74']
    paths: ['.github/workflows/website-deeptags.yml', 'tools/deep_tags.py', 'tools/deep_words.py', 'tools/deep_words_big.py', 'tools/deep_big.py']
  workflow_dispatch:
  workflow_call:   # the timer on main (website-deeptags-timer.yml) runs this every few hours
permissions:
  contents: write
concurrency:
  group: website-deeptags
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/project-thread-vcys74   # also when the timer on main calls this file
      - id: plan
        run: |
          gh release view deep-tags >/dev/null 2>&1 || \
            gh release create deep-tags --prerelease --title "Deep photo tags" --notes "Website search: what is in each photo. Not used by the daily picture."
          gh release download database -p bapas.db.gz -O - | gunzip > bapas.db
          curl -sf https://photos.bapas-diary.com/years.txt -o years.txt; echo "years in R2: $(tr '\n' ' ' < years.txt)"
          gh release view deep-tags --json assets -q '.assets[].name' > have.txt
          echo "shards=$(python3 tools/deep_tags.py plan --years years.txt --have have.txt)" | tee -a "$GITHUB_OUTPUT"
  shard:
    needs: plan
    if: needs.plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 10   # the high res photo copy uses up to 6 of the 20 machines at once
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/project-thread-vcys74   # also when the timer on main calls this file
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get ready
        run: |
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -q 'open_clip_torch>=2.31' 'timm>=1.0.15' transformers sentencepiece pillow numpy
          gh release download database -p bapas.db.gz -O - | gunzip > bapas.db
          python3 tools/deep_tags.py shard --shard ${{ matrix.shard }} --out photos
      - name: Photo numbers
        run: |
          python3 tools/deep_tags.py embed --photos photos --out emb-${{ matrix.shard }}.npz
          gh release upload deep-tags emb-${{ matrix.shard }}.npz --clobber
  tags:
    needs: [plan, shard]
    if: always() && needs.plan.result == 'success' && (needs.plan.outputs.shards != '[]' || github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/project-thread-vcys74   # also when the timer on main calls this file
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tags from every kept shard
        run: |
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -q 'open_clip_torch>=2.31' 'timm>=1.0.15' transformers sentencepiece numpy
          mkdir emb && gh release download deep-tags -p 'emb-*.npz' -D emb
          python3 tools/deep_tags.py words --out words.npz
          python3 tools/deep_big.py words --out words-big.npz
          # the wide words too (grass, blue flowers, plane, football...; Darpan: yes wide tags, 26 Oct)
          python3 tools/deep_tags.py tags --emb emb --words words.npz --big words-big.npz --out deep-tags.json
          gh release upload deep-tags deep-tags.json words.npz words-big.npz --clobber
  # new photos were tagged, or the words changed (run by hand): rebuild the website (the same build as every deploy) so Search finds them.
  # Never from a push here: website-deploy then builds this branch's own files, which are not the website.
  site:
    needs: [plan, tags]
    if: always() && needs.tags.result == 'success' && github.event_name != 'push' && (needs.plan.outputs.shards != '[]' || github.event_name == 'workflow_dispatch')
    uses: darpan31patel-wq/bapas-diary/.github/workflows/website-deploy.yml@claude/project-thread-eawr12
    secrets: inherit
