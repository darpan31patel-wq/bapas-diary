name: Calendar mockups (test branch only, never ship)

on:
  push:
    branches: [claude/project-thread-r58sg0]
    paths: ['.github/workflows/calmock.yml', 'tools/festival_mock.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mock:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Pick the photos (run 1)
        run: |
          mkdir -p preview/cal
          for d in 2026-10-24 2026-11-05 2026-11-08; do
            python make.py --date "$d" --styles W2 --out "out/$d"
            rm -rf "preview/cal/$d-photos"; cp -r "out/$d/photos-W2" "preview/cal/$d-photos"
            cp "out/$d/caption-W2.png" "preview/cal/$d.png"
            [ -e "out/$d/caption.txt" ] && cp "out/$d/caption.txt" "preview/cal/$d-caption.txt" || true
          done
          python tools/festival_mock.py Diwali preview/cal/diwali-photos | tee preview/cal/diwali.txt
      - name: Save to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/cal
          git commit -q -m "Calendar mockup photos"
          git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q
