name: Backup everything

# Darpan, 9 Nov 2026: "I never ever want to be in a situation where I'm reliant on one thing."
# One gentle run a night (go gentle on GitHub, 6 Nov): tools/backup_everything.sh copies the code to GitLab, the database
# to Google Drive and the private R2 bucket bapas-diary-backups, the Studio log and email sign ups to Drive, and emails
# Darpan only when something needs a look. It reads the 2pm picture chain but never changes it.
# Secrets used: RCLONE_DRIVE_TOKEN, RCLONE_CLIENT_ID, RCLONE_CLIENT_SECRET, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# RESEND_API_KEY, SUMMARY_TO (all already there) and, once he has a GitLab account, GITLAB_TOKEN (GITLAB_REPO variable optional).

on:
  schedule:
    - cron: '30 0 * * *'    # 00:30 UTC, well away from the 2pm picture's morning (04:30 to 07:30 UTC)
  workflow_dispatch:
    inputs:
      full:
        description: 'Also make the full code copy (normally Sundays only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backup-everything

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # the first Sunday copies about 7 GB of release files once; after that only changes
    steps:
      - uses: actions/checkout@v4
      - name: Keep the code copy between nights, so only what changed is fetched
        uses: actions/cache@v4
        with:
          path: mirror.git
          key: mirror-${{ github.run_id }}
          restore-keys: mirror-
      - name: Connect to Drive and R2
        env:
          TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
          CLIENT_ID: ${{ secrets.RCLONE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.RCLONE_CLIENT_SECRET }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -s https://rclone.org/install.sh | sudo bash >/dev/null
          mkdir -p ~/.config/rclone && python3 tools/rclone_conf.py > ~/.config/rclone/rclone.conf
          id=$(curl -s -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -r .result.id)
          key=$(printf %s "$CF_TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$id"; echo "::add-mask::$key"
          { echo "AWS_ACCESS_KEY_ID=$id"; echo "AWS_SECRET_ACCESS_KEY=$key"
            echo "AWS_DEFAULT_REGION=auto"; echo "R2=https://$CF_ACCOUNT.r2.cloudflarestorage.com"; } >> "$GITHUB_ENV"
      - name: Copy everything
        env:
          GH_TOKEN: ${{ github.token }}
          GH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUMMARY_TO: ${{ secrets.SUMMARY_TO }}
          STUDIO_PASSWORD: ${{ secrets.STUDIO_PASSWORD }}
          MISSED_KEY: ${{ secrets.MISSED_KEY }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPO: ${{ vars.GITLAB_REPO }}
          FULL: ${{ inputs.full && 'yes' || '' }}
        run: bash tools/backup_everything.sh
