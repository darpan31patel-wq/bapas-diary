# swaminarayan.org, the old BAPS website from before baps.org, copied page by page and photo by photo into Darpan's
# Drive archive ("Bapa's Archive/sites/swaminarayan.org/...") (Darpan, 13 Nov 2026: "Yes to all, prioritise
# swaminarayan.org, ASAP"). Archive only: touches nothing in the 2pm picture's chain, the website, R2 or bapas.db,
# and never runs 04:00 to 07:30 UTC. One run, one machine, three gentle readers. It carries on where the last run
# stopped (state kept in Drive), so pushing this file again starts the next round.
# Every round also rebuilds the full detail list (Darpan, 13 Nov 2026: "all the captions, all the date information, any
# location, where the actual resource is from"): tools/sites_index.py reads every saved page and writes pages.jsonl and
# photos.jsonl (caption, date as written and as YYYY-MM-DD, place, gallery, page, Drive path, file details).
# Round 1: 13 Nov 2026 evening (6,725 pages, 46,464 photos). Round 2: 14 Nov 2026 07:40 UTC.
name: swaminarayan-org
on:
  push:
    branches: ['claude/project-thread-2nikpj']
    paths: ['.github/workflows/swaminarayan-org-2nikpj.yml']
permissions:
  contents: write   # the page list into the release `database`
concurrency:
  group: swaminarayan-org
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      REMOTE: "gdrive:Bapa's Archive/sites/swaminarayan.org"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Never in the 2pm picture's morning
        run: |
          m=$(( 10#$(date -u +%H) * 60 + 10#$(date -u +%M) ))
          if [ $m -ge 225 ] && [ $m -lt 450 ]; then echo "::error::03:45 to 07:30 UTC is kept free"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Drive access
        env:
          TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
          CLIENT_ID: ${{ secrets.RCLONE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.RCLONE_CLIENT_SECRET }}
        run: |
          curl -s https://rclone.org/install.sh | sudo bash >/dev/null
          git fetch -q --depth 1 origin main && git show FETCH_HEAD:tools/rclone_conf.py > "$RUNNER_TEMP/rclone_conf.py"
          mkdir -p ~/.config/rclone && python3 "$RUNNER_TEMP/rclone_conf.py" > ~/.config/rclone/rclone.conf
      - name: Where the last round stopped
        run: |
          mkdir -p state
          rclone copy "$REMOTE/_state" state 2>/dev/null || true
          ls -la state
      - name: Copy (stops by itself 5h20 after starting, by 03:30 UTC at the latest, or when everything is in)
        run: |
          # every 20 minutes the new files move to Drive, so the runner's disk never fills
          ( while sleep 1200; do [ -d work/files ] && rclone move work/files "$REMOTE" --transfers 8 --min-age 30s \
              --stats 0 2>&1 | tail -2; done ) &
          mover=$!
          # stop 5h20 after starting (the job's own limit is 5h45) and never after 03:30 UTC
          stop=$(date -u -d '+320 minutes' +%H:%M); now=$(date -u +%H%M); s=${stop/:/}
          if [ $((10#$s)) -gt 330 ] && { [ $((10#$now)) -lt 330 ] || [ $((10#$s)) -lt $((10#$now)) ]; }; then stop=03:30; fi
          echo "stopping at $stop UTC"
          python3 -I tools/swaminarayan_org.py --work work --state state --stop-at $stop --workers 3 --gap 0.7 \
            --heads state/heads.txt \
            | tee run.log | grep -E '^\{|stopping' || true
          kill $mover || true; pkill -f 'rclone move work/files' || true; sleep 5
      - name: Into Drive
        if: always()
        run: |
          [ -d work/files ] && rclone move work/files "$REMOTE" --transfers 8 --stats-one-line --stats 0 || true
          rclone copy state "$REMOTE/_state" --stats 0
      - name: Full detail for every page and photo
        if: always()
        run: |
          # every saved page back from Drive (pages only, small), then the lists rebuilt from all of them
          rclone copy "$REMOTE" pages --filter "- _state/**" --filter "- _index/**" --filter "+ *.{htm,html,HTM,HTML}" \
            --filter "+ *.php*" --filter "- *" --transfers 8 --stats 0
          python3 -I tools/sites_index.py --site swaminarayan.org --files pages --headers state/files.jsonl --out idx
          # saved files whose details (type, size, Last-Modified) round 1 did not keep: asked once next round
          rclone lsf -R --files-only "$REMOTE" --filter "- _state/**" --filter "- _index/**" \
            | python3 -c "import sys,urllib.parse as u; [print('https://www.swaminarayan.org/' + u.quote(l.rstrip('\n'), safe=\"/%-_.~()!'\$&+,;=:@\")) for l in sys.stdin]" \
            | sort > drive.txt
          python3 -c "import json,sys; [print(json.loads(l)['url']) for l in open('state/files.jsonl')]" | sort -u > known.txt || : > known.txt
          comm -23 drive.txt known.txt > state/heads.txt; wc -l drive.txt state/heads.txt
          rclone copy state "$REMOTE/_state" --stats 0
          rclone copy idx "$REMOTE/_index" --stats 0
          cp idx/pages.jsonl swaminarayan-org-pages.jsonl && cp idx/photos.jsonl swaminarayan-org-photos.jsonl
          gh release upload database swaminarayan-org-pages.jsonl swaminarayan-org-photos.jsonl --clobber
          cp state/last-run.json swaminarayan-org-last-run.json && gh release upload database swaminarayan-org-last-run.json --clobber
          cat state/last-run.json
