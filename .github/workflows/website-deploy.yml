# Website only (bapas-diary.com). Separate from the daily 2pm picture: touches nothing in that chain.
# Puts the live/ folder plus the photo search (built here from the database, tools/build_search.py) on Cloudflare
# Pages (project bapas-diary, production), makes sure bapas-diary.com and www point at it, and serves the R2 photos
# at photos.bapas-diary.com. Only pages Darpan has typed yes to go live (see live/README.md).
name: website-deploy
on:
  push:
    branches: ['claude/**']
    paths: ['live/**', 'site/day.html', 'tools/web_day.py', 'tools/web_rules.py', 'site/search.html', 'site/search-ask.js', 'site/search-people.js', 'site/search-image.js', 'tools/search_people.py', 'site/art/**', 'tools/web_share.py', 'tools/web_head.py', 'tools/web_seo.py', 'site/404.html', 'site/extras/**', 'tools/web_extras.py', 'site/player/**', 'tools/web_player.py', 'tools/web_dayshare.py', 'site/phone/**', 'tools/web_phone.py', 'tools/web_faces.py', 'tools/web_bapa_rules.py', 'site/offline/**', 'tools/web_offline.py', 'tools/web_secure.py', 'tools/web_tiny.py', 'site/gujarati/**', 'tools/web_gujarati.py', 'tools/build_search.py', 'tools/site_menu.py', 'functions/**', 'site/weekly/**', '.github/workflows/website-deploy.yml', 'tools/web_type.py']
  workflow_call:   # website-hires (on main) rebuilds the site when a year of full size photos is in R2
concurrency: website-deploy
jobs:
  # Bapa Through The Years updates itself first: only new years and new days, from R2 and website-faces, never baps.org
  # (Darpan, 26 Oct 2026: "this should always auto update"). A failure here never stops the deploy.
  through-the-years:
    permissions:
      contents: write
    uses: darpan31patel-wq/bapas-diary/.github/workflows/faces-years.yml@claude/project-thread-lfiln1
  deploy:
    needs: through-the-years
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: bapas-diary
      DOMAIN: bapas-diary.com
      CAL_COMMIT: 8fab292e87adf172e3a7dcdf659eb12f45cd8f7f   # claude/project-thread-tbkjl3: 737b25f (look C) plus a day's photos in a box over the Calendar
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'claude/project-thread-eawr12' }}
      - uses: actions/cache@v4   # the Calendar's tiny looks of each photo, kept between runs
        with:
          path: calendar-looks.json
          key: calendar-looks-${{ github.run_id }}
          restore-keys: calendar-looks-
      - name: Photo search (database from release database, photo tags from release website-mockup)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out && rsync -a --exclude README.md live/ out/
          gh release download legacy-auto -p more.json -D out/then-and-now 2>/dev/null || echo '[]' > out/then-and-now/more.json   # weekly Legacy pairs (Darpan: just go live, 28 Oct)
          gh release download database -p bapas.db.gz -O - | gunzip > bapas.db
          # Bapa's own pages (Today, Calendar, share pictures) show only photos with Bapa in them; Search keeps every photo
          # (Darpan, 25 Oct 2026: "anything Bapa specific should only have pictures of Bapa on there")
          # Darpan, 25 Oct 2026: chosen by face with the On this day rules (tools/web_faces.py): only photos where Bapa's face is
          # recognised, best darshan first; years whose faces are not looked at yet keep the caption based choice (is_bapa = 1)
          pip install -q -r requirements.txt
          mkdir faces && gh release download website-faces -p 'face2-*.json.gz' -D faces
          python3 tools/web_faces.py pick --db bapas.db --faces faces --out bapa.db --top bapa-top.db
          # the On this day picture's rules (Darpan, 25 Oct 2026, tools/web_rules.py): captions say what Bapa does
          python3 tools/web_rules.py captions --db bapa.db --db bapa-top.db
          python3 tools/web_rules.py calendar --db bapas.db --db bapa.db --db bapa-top.db   # the calendar days the picture shows
          gh release download website-mockup -p tags.json
          gh release download deep-tags -p deep-tags.json   # what is in each photo (Darpan: yes deep tags)
          gh release download people-faces -p people-faces.json || echo '{}' > people-faces.json   # Who was with Bapa, by face
          # Bapa through the years (its own thread builds it into release faces-mockup; Darpan: "okay go live")
          gh release download faces-mockup -p faces-site.tgz && tar -xzf faces-site.tgz -C out
          test -f out/through-the-years/index.html
          # The home page, On this day (site/day.html and tools/web_day.py, merged here from claude/project-thread-2nuqbl)
          python3 tools/web_day.py --db bapa.db --site day --photos-url https://photos.bapas-diary.com/ --search-url /search/ > /dev/null
          python3 tools/web_faces.py order --db bapa.db --day day/data/day   # each year opens on its best darshan, centred on his face
          # the picture's rules: whole head framed, nearby days only for an empty date, darshan before 1999, no story twice
          gh release download website-rules -p tg-cards.json || echo '{}' > tg-cards.json
          python3 tools/web_rules.py day --day day/data/day --db bapa.db --faces faces --tg tg-cards.json
          rsync -a day/ out/ && test -f out/index.html && ls out/data/day | wc -l
          # years with photos in R2: site/photo-years.txt plus every year website-hires has finished
          { cat site/photo-years.txt; curl -fs https://photos.$DOMAIN/years.txt || true; } | grep -E '^[0-9]{4}$' | sort -un > photo-years.txt
          echo "photo years: $(tr '\n' ' ' < photo-years.txt)"
          # The scrolling years calendar (its own thread, branch pinned to the approved commit; Darpan: "perfect go live")
          git fetch -q --depth 1 origin "$CAL_COMMIT" && mkdir calsrc && git archive "$CAL_COMMIT" tools/web_calendar.py site/calendar.html fonts | tar -x -C calsrc
          git fetch -q --depth 1 origin refs/heads/database && git show FETCH_HEAD:crawl/schedule/latest.json > schedule.json || echo '{}' > schedule.json   # where Bapa will be (Future Vicharan)
          python3 calsrc/tools/web_calendar.py --db bapa-top.db --site cal --photos-url https://photos.bapas-diary.com/ --search-url /search/ --photo-years photo-years.txt --pool bapa.db --sigs calendar-looks.json --faces faces --schedule schedule.json   # a different looking photo each day, and the days ahead (Darpan: yes perfect go live, 26 Oct)
          python3 tools/web_rules.py calfaces --site cal --faces faces   # Bapa's whole head in each Calendar photo (Darpan, 25 Oct 2026)
          rsync -a cal/ out/ && test -f out/calendar/index.html
          sqlite3 bapas.db 'SELECT count(*) FROM calendar'
          # opens on 1999 while only 1999 photos are copied to R2 (site/photo-years.txt)
          # Search by photo (Darpan: yes search by photo, 28 Oct 2026): the model, the code that runs it and the photo numbers, made by website-image-search
          gh release download image-search -p image-search.tgz && tar -xzf image-search.tgz   # -> image/
          python3 tools/build_search.py --db bapas.db --out out/search --tags tags.json --deep-tags deep-tags.json --people-faces people-faces.json --start-year 1999 --image image
          python3 tools/site_menu.py out   # every page's tabs in the same order
          # share look (Darpan: yes share look): WhatsApp preview picture, icons, per page titles and lines, home screen manifest
          pip install -q pillow
          python3 tools/web_share.py --out out
          python3 tools/web_head.py --out out
          python3 tools/web_seo.py --out out   # 404 page (Darpan: yes not found page), robots.txt, sitemap.xml
          # favourites, share a day and the TV slideshow (Darpan: 3 yes, 4 yes, 1 yes)
          python3 tools/web_dayshare.py --db bapa-top.db --out out --tags tags.json --photo-years photo-years.txt
          python3 tools/web_extras.py --out out
          python3 tools/web_player.py --out out   # full screen player for a TV on Today (Darpan: yes go live, 26 Oct)
          python3 tools/web_phone.py --out out   # phone design: bottom tab bar, phone Today and Calendar (Darpan: yes)
          python3 tools/web_rules.py look --out out   # the On this day picture's finish, look D, on the photos (Darpan: 2)
          python3 tools/web_gujarati.py --out out   # English / Gujarati switch (Darpan: yes Gujarati)
          python3 tools/web_tiny.py --out out   # Calendar squares use the tiny photo copies (whole website review, 28 Oct)
          python3 tools/web_secure.py --out out   # the globe's helper scripts from our own site (whole website review, 28 Oct)
          python3 tools/web_type.py --out out   # Lora headings, Poppins subtitles, labels and buttons (Darpan, 28 Oct)
          python3 tools/web_offline.py --out out --photo-years photo-years.txt   # works with no internet, Save for travelling (Darpan: yes offline)
          python3 tools/web_gujarati.py --out out   # again, for the page the offline step just added
          du -sh out/*
          if grep -rli 'telegram\|t\.me/' out --include='*.html'; then echo 'Telegram found: not deploying'; exit 1; fi   # never on the public site
      - name: Deploy to Pages
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          # the email sign up (/api/weekly, functions/ next to out/) needs the Resend key as a Pages secret (Darpan: ALL GOOD, 26 Oct)
          if [ -n "$RESEND_API_KEY" ]; then printf %s "$RESEND_API_KEY" | npx --yes wrangler@3.114.0 pages secret put RESEND_API_KEY --project-name "$PROJECT" > /dev/null && echo "Resend key: set"; fi
          npx --yes wrangler@3.114.0 pages deploy out --project-name "$PROJECT" --branch main --commit-dirty=true
      - name: bapas-diary.com and www point at the site
        run: |
          api() { curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' "$@"; }
          A=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT
          ZONE=$(api "https://api.cloudflare.com/client/v4/zones?name=$DOMAIN" | jq -r '.result[0].id')
          Z=https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records
          for name in $DOMAIN www.$DOMAIN; do
            echo "== $name"
            echo "records there now:"; api "$Z?name=$name" | jq -c '[.result[] | {type, content, proxied}]'
            api -X POST "$A/domains" -d "{\"name\":\"$name\"}" | jq -c '{success, status: .result.status, errors}'
            if [ "$(api "$Z?name=$name" | jq '.result | length')" = 0 ]; then
              api -X POST "$Z" -d "{\"type\":\"CNAME\",\"name\":\"$name\",\"content\":\"$PROJECT.pages.dev\",\"proxied\":true}" | jq -c '{success, errors}'
            fi
          done
          sleep 30
          api "$A/domains" | jq -c '[.result[] | {name, status, verification: .verification_data.status, validation: .validation_data.status}]'
          B=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/bapas-diary-photos/domains/custom
          echo "== photos.$DOMAIN"
          api -X POST "$B" -d "{\"domain\":\"photos.$DOMAIN\",\"zoneId\":\"$ZONE\",\"enabled\":true,\"minTLS\":\"1.2\"}" | jq -c '{success, errors}'
          api "$B" | jq -c '[.result.domains[]? | {domain, status}]'
          echo "== photos CORS, so the offline version saves real copies"
          api -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/bapas-diary-photos/cors" -d '{"rules":[{"allowed":{"origins":["https://bapas-diary.com","https://www.bapas-diary.com"],"methods":["GET","HEAD"]},"maxAgeSeconds":86400}]}' | jq -c '{success, errors}'
          sleep 20
          for u in https://photos.$DOMAIN/s/ https://$PROJECT.pages.dev/search/ https://$PROJECT.pages.dev/travels/ https://$DOMAIN/ https://$DOMAIN/travels/ https://$DOMAIN/through-the-years/ https://$DOMAIN/calendar/ https://$DOMAIN/share.jpg https://$DOMAIN/manifest.webmanifest https://$DOMAIN/no-such-page https://$DOMAIN/favourites/ https://$DOMAIN/day/10-24/ https://$DOMAIN/share/day/10-24.jpg https://$DOMAIN/then-and-now/ https://$DOMAIN/travels/places/ https://$DOMAIN/sw.js https://$DOMAIN/offline.js https://$DOMAIN/offline/ https://$DOMAIN/offline/files.json https://$DOMAIN/gu/gu.js https://$DOMAIN/gu/words.json; do
            echo "$u -> $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$u")"
          done
