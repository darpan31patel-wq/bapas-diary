# Website only (bapas-diary.com). Separate from the daily 2pm picture: touches nothing in that chain.
# Puts the live/ folder plus the photo search (built here from the database, tools/build_search.py) on Cloudflare
# Pages (project bapas-diary, production), makes sure bapas-diary.com and www point at it, and serves the R2 photos
# at photos.bapas-diary.com. Only pages Darpan has typed yes to go live (see live/README.md).
name: website-deploy
on:
  push:
    branches: ['claude/**']
    paths: ['live/**', 'site/search.html', 'site/art/**', 'tools/web_share.py', 'tools/web_head.py', 'tools/web_seo.py', 'site/404.html', 'site/extras/**', 'tools/web_extras.py', 'tools/web_dayshare.py', 'site/phone/**', 'tools/web_phone.py', 'tools/build_search.py', 'tools/site_menu.py', '.github/workflows/website-deploy.yml']
  workflow_call:   # website-hires (on main) rebuilds the site when a year of full size photos is in R2
concurrency: website-deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: bapas-diary
      DOMAIN: bapas-diary.com
      DAY_COMMIT: b70e8d6027107e96bc14ce457e61143ab5c95e32   # claude/project-thread-2nuqbl, as Darpan approved it
      CAL_COMMIT: 5b85edc002d8a2f85922e00d6ffdc932882df298   # claude/project-thread-69b2ir, as Darpan approved it
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'claude/project-thread-eawr12' }}
      - name: Photo search (database from release database, photo tags from release website-mockup)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out && rsync -a --exclude README.md live/ out/
          gh release download database -p bapas.db.gz -O - | gunzip > bapas.db
          gh release download website-mockup -p tags.json
          # Bapa through the years (its own thread builds it into release faces-mockup; Darpan: "okay go live")
          gh release download faces-mockup -p faces-site.tgz && tar -xzf faces-site.tgz -C out
          test -f out/through-the-years/index.html
          # The home page, On this day (built by its own thread on its branch, pinned to the approved commit)
          git fetch -q --depth 1 origin "$DAY_COMMIT" && mkdir daysrc && git archive "$DAY_COMMIT" tools site fonts | tar -x -C daysrc
          (cd daysrc && python3 tools/web_day.py --db ../bapas.db --site ../day --photos-url https://photos.bapas-diary.com/ --search-url /search/ > /dev/null)
          rsync -a day/ out/ && test -f out/index.html && ls out/data/day | wc -l
          # years with photos in R2: site/photo-years.txt plus every year website-hires has finished
          { cat site/photo-years.txt; curl -fs https://photos.$DOMAIN/years.txt || true; } | grep -E '^[0-9]{4}$' | sort -un > photo-years.txt
          echo "photo years: $(tr '\n' ' ' < photo-years.txt)"
          # The scrolling years calendar (its own thread, branch pinned to the approved commit; Darpan: "perfect go live")
          git fetch -q --depth 1 origin "$CAL_COMMIT" && mkdir calsrc && git archive "$CAL_COMMIT" tools/web_calendar.py site/calendar.html fonts | tar -x -C calsrc
          python3 calsrc/tools/web_calendar.py --db bapas.db --site cal --photos-url https://photos.bapas-diary.com/ --search-url /search/ --photo-years photo-years.txt
          rsync -a cal/ out/ && test -f out/calendar/index.html
          sqlite3 bapas.db 'SELECT count(*) FROM calendar'
          # opens on 1999 while only 1999 photos are copied to R2 (site/photo-years.txt)
          python3 tools/build_search.py --db bapas.db --out out/search --tags tags.json --start-year 1999
          python3 tools/site_menu.py out   # every page's tabs in the same order
          # share look (Darpan: yes share look): WhatsApp preview picture, icons, per page titles and lines, home screen manifest
          pip install -q pillow
          python3 tools/web_share.py --out out
          python3 tools/web_head.py --out out
          python3 tools/web_seo.py --out out   # 404 page (Darpan: yes not found page), robots.txt, sitemap.xml
          # favourites, share a day and the TV slideshow (Darpan: 3 yes, 4 yes, 1 yes)
          python3 tools/web_dayshare.py --db bapas.db --out out --tags tags.json --photo-years photo-years.txt
          python3 tools/web_extras.py --out out
          python3 tools/web_phone.py --out out   # phone design: bottom tab bar, phone Today and Calendar (Darpan: yes)
          du -sh out/*
          if grep -rli 'telegram\|t\.me/' out --include='*.html'; then echo 'Telegram found: not deploying'; exit 1; fi   # never on the public site
      - name: Deploy to Pages
        run: |
          npx --yes wrangler@3.114.0 pages deploy out --project-name "$PROJECT" --branch main --commit-dirty=true
      - name: bapas-diary.com and www point at the site
        run: |
          api() { curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' "$@"; }
          A=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT
          ZONE=$(api "https://api.cloudflare.com/client/v4/zones?name=$DOMAIN" | jq -r '.result[0].id')
          Z=https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records
          for name in $DOMAIN www.$DOMAIN; do
            echo "== $name"
            echo "records there now:"; api "$Z?name=$name" | jq -c '[.result[] | {type, content, proxied}]'
            api -X POST "$A/domains" -d "{\"name\":\"$name\"}" | jq -c '{success, status: .result.status, errors}'
            if [ "$(api "$Z?name=$name" | jq '.result | length')" = 0 ]; then
              api -X POST "$Z" -d "{\"type\":\"CNAME\",\"name\":\"$name\",\"content\":\"$PROJECT.pages.dev\",\"proxied\":true}" | jq -c '{success, errors}'
            fi
          done
          sleep 30
          api "$A/domains" | jq -c '[.result[] | {name, status, verification: .verification_data.status, validation: .validation_data.status}]'
          B=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/bapas-diary-photos/domains/custom
          echo "== photos.$DOMAIN"
          api -X POST "$B" -d "{\"domain\":\"photos.$DOMAIN\",\"zoneId\":\"$ZONE\",\"enabled\":true,\"minTLS\":\"1.2\"}" | jq -c '{success, errors}'
          api "$B" | jq -c '[.result.domains[]? | {domain, status}]'
          sleep 20
          for u in https://photos.$DOMAIN/s/ https://$PROJECT.pages.dev/search/ https://$PROJECT.pages.dev/travels/ https://$DOMAIN/ https://$DOMAIN/travels/ https://$DOMAIN/through-the-years/ https://$DOMAIN/calendar/ https://$DOMAIN/share.jpg https://$DOMAIN/manifest.webmanifest https://$DOMAIN/no-such-page https://$DOMAIN/favourites/ https://$DOMAIN/day/10-24/ https://$DOMAIN/share/day/10-24.jpg https://$DOMAIN/then-and-now/ https://$DOMAIN/travels/places/; do
            echo "$u -> $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$u")"
          done
