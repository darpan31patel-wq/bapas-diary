# Website only, read only: the live site on tablets (Darpan, 28 Oct 2026: "double check using on a tablet"). Every tab
# on iPad mini, iPad Air, iPad Pro and an Android tablet, upright and sideways, as a touch screen. Pictures and a report
# go to release website-review (tab-*.jpg, tab-report.txt). Changes nothing on the site.
name: website-tablet
on:
  push:
    branches: ['claude/project-thread-mwunnf']
    paths: ['.github/workflows/website-tablet.yml']
jobs:
  shots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Every tab on tablets
        run: |
          npm i -s playwright@1.49.1 > /dev/null && npx playwright install --with-deps chromium > /dev/null
          cat > tab.js <<'JS'
          const { chromium } = require('playwright');
          const sizes = [['ipadmini-up', 768, 1024], ['ipadmini-side', 1024, 768], ['ipadair-up', 820, 1180], ['ipadair-side', 1180, 820],
                         ['ipadpro-up', 1024, 1366], ['android-up', 800, 1280], ['android-side', 1280, 800]];
          const pages = [['today', '/'], ['calendar', '/calendar/'], ['search', '/search/'], ['travels', '/travels/'],
                         ['years', '/through-the-years/'], ['then-and-now', '/then-and-now/'], ['about', '/about/']];
          (async () => {
            const b = await chromium.launch();
            for (const [sz, w, h] of sizes) for (const [name, path] of pages) {
              const ctx = await b.newContext({ viewport: { width: w, height: h }, deviceScaleFactor: 1.5, isMobile: true, hasTouch: true, serviceWorkers: 'block',
                userAgent: sz.startsWith('ipad') ? 'Mozilla/5.0 (iPad; CPU OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1'
                                                 : 'Mozilla/5.0 (Linux; Android 14; SM-X710) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36' });
              const p = await ctx.newPage(); const errs = [];
              p.on('pageerror', e => errs.push('page: ' + String(e).slice(0, 120)));
              p.on('console', m => { if (m.type() === 'error') errs.push('console: ' + m.text().slice(0, 120)); });
              await p.goto('https://bapas-diary.com' + path, { waitUntil: 'networkidle', timeout: 90000 }).catch(e => errs.push('load: ' + String(e).slice(0, 80)));
              await p.waitForTimeout(4000);
              const r = await p.evaluate(() => {
                const W = innerWidth, sel = e => e.tagName.toLowerCase() + (e.id ? '#' + e.id : '') + (typeof e.className === 'string' && e.className.trim() ? '.' + e.className.trim().split(/\s+/).slice(0, 2).join('.') : '');
                const vis = e => { const s = getComputedStyle(e); const b = e.getBoundingClientRect(); return s.visibility !== 'hidden' && s.display !== 'none' && b.width > 0 && b.height > 0; };
                const out = { scrollW: document.documentElement.scrollWidth, W, H: innerHeight, pageH: document.documentElement.scrollHeight };
                out.wide = [...document.querySelectorAll('body *')].filter(e => vis(e) && e.getBoundingClientRect().right > W + 2 && !e.closest('[style*="overflow"], .ph-years, .ph-stays, nav')).slice(0, 6).map(e => sel(e) + ' right=' + Math.round(e.getBoundingClientRect().right));
                const taps = [...document.querySelectorAll('a, button, select, input, [role=button]')].filter(e => { if (!vis(e)) return false; const b = e.getBoundingClientRect(); return b.top < innerHeight * 2 && (b.width < 36 || b.height < 36); });
                out.smallTaps = taps.length; out.tapEg = [...new Set(taps.map(e => sel(e) + ' ' + Math.round(e.getBoundingClientRect().width) + 'x' + Math.round(e.getBoundingClientRect().height)))].slice(0, 6);
                let small = {}; for (const e of document.querySelectorAll('body *')) { if (!vis(e)) continue; const t = [...e.childNodes].filter(n => n.nodeType === 3).map(n => n.textContent.trim()).join('').trim(); if (t.length < 2) continue;
                  const fs = parseFloat(getComputedStyle(e).fontSize); if (fs < 12) { const k = fs + 'px ' + sel(e); small[k] = (small[k] || 0) + 1; } }
                out.small = Object.entries(small).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([k, n]) => n + 'x ' + k);
                const menus = [...document.querySelectorAll('nav, .tabbar, .ph-tabs, [class*="tab-bar"], [class*="bottom"]')].filter(vis).map(e => sel(e) + ' ' + Math.round(e.getBoundingClientRect().width) + 'w@y' + Math.round(e.getBoundingClientRect().top));
                out.menus = menus.slice(0, 4);
                // how much of the width the main content uses
                let L = W, R = 0; for (const e of document.querySelectorAll('main *, body > section *, body > div *')) { if (!vis(e)) continue; const b = e.getBoundingClientRect(); if (b.top > innerHeight || b.bottom < 0 || b.width > W - 2) continue; if (b.width < 20) continue; L = Math.min(L, b.left); R = Math.max(R, b.right); }
                out.used = Math.round(L) + '..' + Math.round(R);
                return out;
              }).catch(e => ({ err: String(e) }));
              console.log(`== ${sz} ${w}x${h} ${name}: page ${r.scrollW}w x ${r.pageH}h${r.scrollW > w + 1 ? '  SIDEWAYS SCROLL' : ''}, content ${r.used}`);
              if (r.wide && r.wide.length) console.log('   sticks out: ' + r.wide.join(' | '));
              console.log(`   small taps (<36px): ${r.smallTaps}  ${(r.tapEg || []).join(' | ')}`);
              if (r.small && r.small.length) console.log('   small words: ' + r.small.join(' | '));
              console.log('   menus: ' + (r.menus || []).join(' | '));
              for (const e of [...new Set(errs)].slice(0, 4)) console.log('   ' + e);
              await p.screenshot({ path: `tab-${sz}-${name}-1.jpg`, type: 'jpeg', quality: 70 }).catch(() => {});
              await p.mouse.wheel(0, h * 0.9).catch(() => {}); await p.evaluate(y => scrollBy(0, y), Math.round(h * 0.9)).catch(() => {});
              await p.waitForTimeout(2500);
              await p.screenshot({ path: `tab-${sz}-${name}-2.jpg`, type: 'jpeg', quality: 70 }).catch(() => {});
              await ctx.close().catch(() => {});
            }
            await b.close();
          })();
          JS
          node tab.js | tee tab-report.txt; true
      - name: Keep them in release website-review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload website-review -R "$GITHUB_REPOSITORY" --clobber tab-*.jpg tab-report.txt
