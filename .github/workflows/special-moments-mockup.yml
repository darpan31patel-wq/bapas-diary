# Pictures of Today with the special moments of the day (Darpan, 13 Nov 2026), taken on the live page on the runner with
# the page's change put in. Runs only for this mockup file on this branch, never deploys anything.
name: Special moments mockup
on:
  push:
    branches: [claude/project-thread-ii03da]
    paths: [.github/workflows/special-moments-mockup.yml]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: pip -q install playwright && python3 -m playwright install --with-deps chromium >/dev/null
      - name: The live page with the change put in
        run: |
          curl -fsSL https://bapas-diary.com/ -o live.html
          python3 - <<'PY'
          import re
          html = open('live.html', encoding='utf-8').read()
          data = re.search(r"fetch\('([^']*)' \+ mmdd \+ '\.json'\)", html)
          data = data.group(1) if data else '/data/day/'
          hunks, cur = [], None
          for line in open('tools/mockups/special-moments.patch', encoding='utf-8').read().split('\n'):
              if line.startswith('@@'): cur = {'before': None, 'add': []}; hunks.append(cur); continue
              if cur is None or line.startswith(('---', '+++')): continue
              if line.startswith('+'): cur['add'].append(line[1:])
              elif line.startswith(' ') and not cur['add']: cur['before'] = line[1:]
          for h in hunks:
              b = h['before'] + '\n'
              assert html.count(b) >= 1, 'not found: ' + b
              add = '\n'.join(h['add']).replace('{{DATA}}', data) + '\n'
              html = html.replace(b, b + add, 1)
          open('mock.html', 'w', encoding='utf-8').write(html)
          print('hunks put in:', len(hunks), 'data at', data)
          PY
      - name: Pictures
        run: |
          mkdir -p shots
          python3 - <<'PY'
          import base64
          from playwright.sync_api import sync_playwright
          MOCK = open('mock.html', encoding='utf-8').read()
          def snap(pg, path, clip=None):
              cdp = pg.context.new_cdp_session(pg)
              args = {'format': 'jpeg', 'quality': 86, 'captureBeyondViewport': True}
              if clip: args['clip'] = dict(clip, scale=1)
              open(path, 'wb').write(base64.b64decode(cdp.send('Page.captureScreenshot', args)['data']))
          def box(pg, sel, pad=18):
              b = pg.evaluate("s=>{const r=document.querySelector(s).getBoundingClientRect();return {x:r.left+scrollX,y:r.top+scrollY,width:r.width,height:r.height}}", sel)
              return {'x': max(0, b['x'] - pad), 'y': max(0, b['y'] - pad), 'width': b['width'] + 2 * pad, 'height': b['height'] + 2 * pad}
          with sync_playwright() as p:
              br = p.chromium.launch()
              for day in ['2026-11-13', '2026-08-13', '2027-11-10', '2026-03-06']:
                  for w, h, dpr, tag in [(1600, 1000, 1, 'computer'), (390, 844, 2, 'phone')]:
                      if tag == 'phone' and day not in ('2026-11-13', '2026-08-13'): continue
                      ctx = br.new_context(viewport={'width': w, 'height': h}, device_scale_factor=dpr)
                      pg = ctx.new_page()
                      pg.on('pageerror', lambda e: print('page error', e))
                      pg.clock.set_fixed_time(day + 'T09:00:00')
                      pg.route(lambda u: u.rstrip('/') == 'https://bapas-diary.com', lambda r: r.fulfill(status=200, content_type='text/html; charset=utf-8', body=MOCK))
                      try: pg.goto('https://bapas-diary.com/', wait_until='load', timeout=40000)
                      except Exception as e: print('goto', e)
                      pg.wait_for_timeout(6000)
                      if pg.evaluate("!document.getElementById('moments') || document.getElementById('moments').hidden"):
                          print(day, tag, 'no moments shown'); ctx.close(); continue
                      print(day, tag, pg.evaluate("document.getElementById('momentsline').innerText"))
                      snap(pg, f'shots/{day}-{tag}-top.jpg', {'x': 0, 'y': 0, 'width': w, 'height': min(h, 1000)})
                      pg.evaluate("document.getElementById('moments').scrollIntoView()")
                      for _ in range(6):
                          pg.mouse.wheel(0, 500); pg.wait_for_timeout(500)
                      pg.evaluate("document.getElementById('moments').scrollIntoView()")
                      pg.wait_for_timeout(3500)
                      snap(pg, f'shots/{day}-{tag}-moments.jpg', box(pg, '#moments'))
                      if tag == 'computer':
                          pg.evaluate("document.getElementById('momore-btn') && document.getElementById('momore-btn').click()")
                          pg.wait_for_timeout(3500)
                          snap(pg, f'shots/{day}-{tag}-more.jpg', box(pg, '#moments'))
                          first = pg.query_selector('#momentlist .mo[data-m] .mi')
                          if first:
                              first.click(); pg.wait_for_timeout(3000)
                              snap(pg, f'shots/{day}-{tag}-open.jpg', {'x': 0, 'y': pg.evaluate('scrollY'), 'width': w, 'height': h})
                      ctx.close()
              br.close()
          PY
          ls -la shots
      - name: Keep them
        run: |
          gh release delete special-moments-mockup -y --cleanup-tag -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create special-moments-mockup shots/*.jpg -R "$GITHUB_REPOSITORY" --title "Special moments mockup pictures" --notes "Mockup pictures only, not part of the website" --target "$GITHUB_SHA"
