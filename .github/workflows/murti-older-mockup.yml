# Helper for the "Add more Telegram channels" thread only: pictures of the real Darshan tab with the older days change
# (mockup/murti-older/), committed back to this branch. Deploys nothing. Touches nothing in the daily picture.
name: murti-older-mockup
on:
  push:
    branches: [claude/project-thread-zlkxot]
    paths: ['.github/workflows/murti-older-mockup.yml']
permissions:
  contents: write
jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 31
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The website branch with the change
        run: |
          git worktree add web origin/claude/project-thread-eawr12
          cd web && git -c user.name=x -c user.email=x@x am -3 -q ../mockup/murti-older/darshan-older-days.patch
      - name: The Darshan tab's calendar words from the database
        run: |
          gh release download database -p bapas.db.gz
          gunzip bapas.db.gz
          python3 web/tools/web_darshan.py --db bapas.db --out out
      - run: |
          npm i -q playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          node mockup/murti-older/shoot.js web/live/darshan/index.html out/darshan/cal.js
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898309+github-actions[bot]@users.noreply.github.com"
          git add mockup/murti-older/*.jpg && git commit -q -m "Darshan older days: mockup pictures [skip ci]" && git push -q origin HEAD:claude/project-thread-zlkxot
