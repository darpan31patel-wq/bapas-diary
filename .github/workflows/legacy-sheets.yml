# Website only (bapas-diary.com): contact sheets for the Legacy pairs found by what is in the photos
# (tools/legacy_match.py writes site/legacy-cands.json; tools/legacy_sheets.py draws them). Separate from the daily
# 2pm picture: touches nothing in that chain. Photos come only from R2 (m/ALBUM/FILE), never baps.org.
# The photos and sheets go into the release `then-now-mockup` as legacy.tgz.
name: legacy-sheets
on:
  push:
    branches: ['claude/project-thread-dmnrb9']
    paths: ['site/legacy-cands.json']
  workflow_dispatch:
concurrency:
  group: legacy-sheets
permissions:
  contents: write
jobs:
  sheets:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: bapas-diary-photos
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sheets
        run: |
          echo "::add-mask::$CF_TOKEN"
          pip install -q opencv-python-headless numpy boto3
          python3 tools/legacy_sheets.py site/legacy-cands.json legacy
      - name: Into the release
        run: |
          tar czf legacy.tgz legacy
          gh release upload then-now-mockup legacy.tgz --clobber -R "$GITHUB_REPOSITORY"
