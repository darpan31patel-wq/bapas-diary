name: Festival mockup fetch (test branch only, never ship)

on:
  push:
    branches: [claude/project-thread-lcbb5g]
    paths: ['.github/workflows/festfetch.yml', 'preview/fest/want.txt', 'preview/fest/chosen.txt']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Contact sheets of every candidate, and the chosen photos big (run 5)
        run: |
          pip install -q pillow
          mkdir -p /tmp/th preview/fest/sheets preview/fest/img
          touch preview/fest/want.txt preview/fest/chosen.txt
          if [ "$(cat preview/fest/want.txt | md5sum)" != "$(cat preview/fest/sheets/.done 2>/dev/null)" ]; then
            while IFS=$'\t' read -r alb f; do
              [ -z "$f" ] && continue
              curl -sSfL -o "/tmp/th/$alb-${f##*/}" "https://photos.bapas-diary.com/s/$alb/$f" || echo "miss $alb $f" &
              while [ "$(jobs -r | wc -l)" -ge 12 ]; do sleep .1; done
            done < preview/fest/want.txt
            wait
            ls /tmp/th | wc -l
            python3 tools/fest_sheet.py /tmp/th preview/fest/sheets
            cat preview/fest/want.txt | md5sum > preview/fest/sheets/.done
          fi
          while IFS=$'\t' read -r alb f; do
            [ -z "$f" ] && continue
            o="preview/fest/img/$alb-${f##*/}"; [ -e "$o" ] && continue
            for z in l o m; do curl -sSfL -o "$o" "https://photos.bapas-diary.com/$z/$alb/$f" && break; done || echo "miss $alb $f"
          done < preview/fest/chosen.txt
      - name: Save to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/fest
          git commit -q -m "Festival mockup photos [skip ci]" || exit 0
          git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q
