# Website only (bapas-diary.com): read-only check that the live pages and the R2 photo address answer.
# 28 Oct 2026 (whole website review): also prints the headers each page and photo comes with (caching, security)
# and a Lighthouse speed score for each main page on a phone. Reads only, changes nothing.
name: website-check
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/website-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Pages and photos answer
        run: |
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/bapas-diary-photos/domains/custom | jq -c '[.result.domains[]? | {domain, status}]'
          for u in https://bapas-diary.com/ https://www.bapas-diary.com/ https://bapas-diary.com/search/ https://bapas-diary.com/search/data/about.json https://bapas-diary.com/travels/ \
                   https://photos.bapas-diary.com/s/3148/01_TP_1998_80_17.jpg https://photos.bapas-diary.com/m/3148/01_TP_1998_80_17.jpg; do
            echo "$u -> $(curl -s -o /dev/null -w '%{http_code} %{content_type} %{size_download}B %{redirect_url}' "$u")"
          done
      - name: Headers (caching and security)
        run: |
          for u in https://bapas-diary.com/ https://bapas-diary.com/search/ https://bapas-diary.com/search/data/2025.json https://bapas-diary.com/through-the-years/ \
                   https://bapas-diary.com/calendar/ https://bapas-diary.com/menu.css https://bapas-diary.com/sw.js https://bapas-diary.com/data/day/10-28.json \
                   https://bapas-diary.com/search/image/vec-0.bin http://bapas-diary.com/ https://photos.bapas-diary.com/s/3148/01_TP_1998_80_17.jpg \
                   https://photos.bapas-diary.com/l/3148/01_TP_1998_80_17.jpg https://photos.bapas-diary.com/s/3148/01_TP_1998_80_17.jpg; do
            echo "== $u"
            curl -s -o /dev/null -D - -H 'Accept-Encoding: br, gzip' -H 'Origin: https://bapas-diary.com' "$u" | grep -iE '^(HTTP|cache-control|cf-cache-status|age|content-encoding|content-length|content-type|etag|last-modified|location|strict-transport|content-security|x-frame|x-content-type|referrer-policy|permissions-policy|access-control-allow-origin|server)' 
          done
          echo "== sizes as a phone downloads them (compressed)"
          for u in https://bapas-diary.com/ https://bapas-diary.com/search/ https://bapas-diary.com/through-the-years/ https://bapas-diary.com/calendar/ https://bapas-diary.com/travels/; do
            echo "$u $(curl -s -o /dev/null --compressed -w '%{size_download}B in %{time_total}s' "$u")"
          done
      - name: Lighthouse on a phone
        run: |
          for p in / /search/ /through-the-years/ /calendar/ /travels/ /then-and-now/; do
            n=$(echo "$p" | tr -dc 'a-z-'); n=${n:-today}
            npx --yes lighthouse@12.2.1 "https://bapas-diary.com$p" --quiet --chrome-flags='--headless=new --no-sandbox' \
              --only-categories=performance,accessibility,best-practices,seo --output=json --output-path="lh-$n.json" > /dev/null 2>&1 || { echo "$p: lighthouse failed"; continue; }
            jq -r --arg p "$p" '"\($p): perf \(.categories.performance.score*100|round) a11y \(.categories.accessibility.score*100|round) best \(.categories["best-practices"].score*100|round) seo \(.categories.seo.score*100|round) | first paint \(.audits["first-contentful-paint"].displayValue) | biggest paint \(.audits["largest-contentful-paint"].displayValue) | blocking \(.audits["total-blocking-time"].displayValue) | shift \(.audits["cumulative-layout-shift"].displayValue) | bytes \(.audits["total-byte-weight"].displayValue)"' "lh-$n.json"
            jq -r '[.audits | to_entries[] | select(.value.score != null and .value.score < 0.9 and (.value.details.type == "opportunity" or .value.details.type == "table")) | "   - \(.value.title) \(.value.displayValue // "")"] | .[:12][]' "lh-$n.json"
          done
