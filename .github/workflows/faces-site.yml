# Website only (bapas-diary.com): builds the "Bapa through the years" page from the frames in the release
# faces-mockup (made by faces-years.yml) into faces-site.tgz (folder through-the-years/) in the same release,
# for the website deploy to pick up. Separate from the daily 2pm picture: touches nothing in that chain.
name: faces-site
on:
  push:
    branches: ['claude/**']
    paths: ['site/faces.html', 'tools/build_faces.py', '.github/workflows/faces-site.yml']
  workflow_run:
    workflows: [faces-years]
    types: [completed]
  workflow_dispatch:
concurrency:
  group: faces-site
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the page
        run: |
          curl -sL -o bapas.db.gz https://github.com/${{ github.repository }}/releases/download/database/bapas.db.gz && gunzip bapas.db.gz
          gh release download faces-mockup -p faces.tgz -R "$GITHUB_REPOSITORY" && tar xzf faces.tgz
          python3 tools/build_faces.py --faces faces --db bapas.db --out through-the-years --site
          echo "$(find through-the-years -type f | wc -l) files"
          tar czf faces-site.tgz through-the-years
          gh release upload faces-mockup faces-site.tgz --clobber -R "$GITHUB_REPOSITORY"
