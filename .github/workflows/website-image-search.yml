# Website only (bapas-diary.com). Separate from the daily 2pm picture: touches nothing in that chain, fetches nothing
# from baps.org. Search by image (Darpan, 26 Oct 2026: "upload an image, or paste an image or a part of the image ...
# try and find the same image"): an open DINOv2 model (no Claude, no paid service) turns each photo into numbers;
# the same small model then runs in the visitor's own browser, so nothing costs anything to run.
name: website-image-search
on:
  push:
    branches: ['claude/project-thread-hi1iz6']
    paths: ['.github/workflows/website-image-search.yml', 'tools/image_index.py', 'tools/image_mockup_keys.txt']
  workflow_dispatch:
    inputs:
      model:
        description: 'Make the model file again'
        type: boolean
        default: false
permissions:
  contents: write
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  model:
    if: github.event_name == 'workflow_dispatch' && inputs.model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Model as a file the browser can run
        run: |
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch
          pip install -q 'transformers<4.50' onnx onnxruntime
          mkdir -p dino-s
          python3 - <<'PY'
          import torch
          from transformers import Dinov2Model
          from onnxruntime.quantization import quantize_dynamic, QuantType
          m = Dinov2Model.from_pretrained('facebook/dinov2-small').eval()
          class Out(torch.nn.Module):   # every token (CLS first, then 16x16 patches) so pooling can be chosen later
              def __init__(s, m): super().__init__(); s.m = m
              def forward(s, x): return s.m(pixel_values=x).last_hidden_state
          torch.onnx.export(Out(m), torch.randn(1, 3, 224, 224), 'dino-s/model.onnx', input_names=['x'], output_names=['t'],
                            dynamic_axes={'x': {0: 'n'}, 't': {0: 'n'}}, opset_version=17, dynamo=False)
          quantize_dynamic('dino-s/model.onnx', 'dino-s/model-q8.onnx', weight_type=QuantType.QUInt8)
          PY
          ls -la dino-s
          gh release view image-search >/dev/null 2>&1 || \
            gh release create image-search --prerelease --title "Search by image" --notes "Website search by image. Not used by the daily picture."
          cp dino-s/model.onnx dinov2-small.onnx; cp dino-s/model-q8.onnx dinov2-small-q8.onnx
          gh release upload image-search dinov2-small.onnx dinov2-small-q8.onnx --clobber
  # every photo in R2 -> numbers, one machine per slice of a year; slices already kept in the release are skipped
  plan:
    needs: model
    if: always() && needs.model.result != 'failure'
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          gh release download database -p bapas.db.gz -O - | gunzip > bapas.db
          curl -sf https://photos.bapas-diary.com/years.txt -o years.txt; echo "years in R2: $(tr '\n' ' ' < years.txt)"
          gh release view image-search --json assets -q '.assets[].name' > have.txt
          shards=$(python3 tools/image_index.py plan --years years.txt --have have.txt)
          echo "shards=$shards" | tee -a "$GITHUB_OUTPUT"
  shard:
    needs: plan
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8   # leaves machines free for website deploys
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Photo numbers
        run: |
          pip install -q onnxruntime pillow numpy
          gh release download database -p bapas.db.gz -O - | gunzip > bapas.db
          gh release download image-search -p dinov2-small-q8.onnx
          python3 tools/image_index.py shard --shard ${{ matrix.shard }} --out photos
          python3 tools/image_index.py embed --model dinov2-small-q8.onnx --photos photos --out pic-${{ matrix.shard }}.npz
          gh release upload image-search pic-${{ matrix.shard }}.npz --clobber
  build:
    needs: [plan, shard]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The files the search page reads
        run: |
          pip install -q numpy
          mkdir emb && gh release download image-search -p 'pic-*.npz' -D emb
          gh release download image-search -p dinov2-small-q8.onnx
          python3 tools/image_index.py build --emb emb --model dinov2-small-q8.onnx --out image
          cp dinov2-small-q8.onnx image/
          # the code that runs the model in the browser (onnxruntime-web, Microsoft, MIT), kept with it so no outside CDN is needed
          npm pack onnxruntime-web@1.20.1 && tar -xzf onnxruntime-web-1.20.1.tgz
          cp package/dist/ort.min.js package/dist/ort-wasm-simd-threaded.wasm package/dist/ort-wasm-simd-threaded.mjs image/
          ls -la image
          tar -czf image-search.tgz image
          gh release upload image-search image-search.tgz --clobber
  # the small photos a mockup of Search by photo shows (tools/image_mockup_keys.txt, ALBUM/FILE per line), from R2
  mockup:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p mock
          while read -r k; do mkdir -p "mock/$(dirname "$k")"; curl -sf "https://photos.bapas-diary.com/s/$k" -o "mock/$k" || echo "missing $k"; sleep 0.2; done < tools/image_mockup_keys.txt
          tar -czf mockup-photos.tgz -C mock . && gh release upload image-search mockup-photos.tgz --clobber
  # read only: is Search by photo on the live site?
  live:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf https://bapas-diary.com/search/ | grep -c 'pic-btn'
          curl -sf https://bapas-diary.com/search/image/meta.json | python3 -c "import json,sys; m=json.load(sys.stdin); print(m['n'], m['vecs'], m['model'])"
          for f in dinov2-small-q8.onnx vec-0.bin vec-1.bin keys.json ort.min.js ort-wasm-simd-threaded.wasm ort-wasm-simd-threaded.mjs; do echo "$f $(curl -s -o /dev/null -w '%{http_code} %{size_download} %{content_type}' https://bapas-diary.com/search/image/$f)"; done
