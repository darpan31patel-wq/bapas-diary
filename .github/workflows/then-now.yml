# Website only (bapas-diary.com): "Same place, then and now", both Bapas at the same mandir side by side, years
# apart (tools/then_now.py). Separate from the daily 2pm picture: touches nothing in that chain.
# The places are in site/then-now.txt; changing that file on a claude/** branch starts a run. Photos come only from
# R2 (m/ALBUM/FILE), never baps.org. The chosen photos and contact sheets go into the release `then-now-mockup`.
name: then-now
on:
  push:
    branches: ['claude/**']
    paths: ['site/then-now.txt']
  workflow_dispatch:
concurrency:
  group: then-now
permissions:
  contents: write
jobs:
  pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: bapas-diary-photos
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get ready
        run: |
          pip install -q opencv-python-headless numpy boto3
          git fetch -q --depth 1 origin claude/project-thread-lfiln1
          git show FETCH_HEAD:tools/faces_years.py > tools/faces_years.py
          curl -sL -o bapas.db.gz https://github.com/${{ github.repository }}/releases/download/database/bapas.db.gz && gunzip bapas.db.gz
          id=$(curl -s -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -r .result.id)
          export AWS_ACCESS_KEY_ID=$id AWS_SECRET_ACCESS_KEY=$(printf %s "$CF_TOKEN" | sha256sum | cut -d' ' -f1) AWS_DEFAULT_REGION=auto
          aws s3 ls "s3://$BUCKET/m/" --recursive --endpoint-url "https://$CF_ACCOUNT.r2.cloudflarestorage.com" | awk '{print $4}' > keys.txt
          echo "$(wc -l < keys.txt) web photos in R2"
          aws s3 ls "s3://$BUCKET/l/" --recursive --endpoint-url "https://$CF_ACCOUNT.r2.cloudflarestorage.com" | awk '{print $4}' > large-keys.txt
          echo "$(wc -l < large-keys.txt) full screen (l/) photos in R2"
          for f in keys.txt large-keys.txt; do python3 -c "import sqlite3,collections,sys;db=sqlite3.connect('bapas.db');a=dict(((r[0],r[1]),r[2]) for r in db.execute('select album,file,year from photos'));c=collections.Counter(a.get(tuple(k.strip().split('/',2)[1:]),0) for k in open(sys.argv[1]));print(sys.argv[1],sorted(c.items()))" $f; done
      - name: Pairs
        run: python3 tools/then_now.py --db bapas.db --keys keys.txt --out then-now
      - name: Into the release
        if: success()
        run: |
          cp large-keys.txt then-now/ && tar czf then-now.tgz then-now
          gh release view then-now-mockup -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create then-now-mockup -R "$GITHUB_REPOSITORY" --prerelease --title "Then and now mockup" --notes "Both Bapas at the same place, years apart, for the website mockup. Not used by the daily picture."
          gh release upload then-now-mockup then-now.tgz --clobber -R "$GITHUB_REPOSITORY"
