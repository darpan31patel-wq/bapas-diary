# Mockup only (website, never the daily picture): records the live Today page's Share this day on a computer and a
# phone, and saves the outputs to this branch under mockups/dayshare/rec so a mockup can be made on the real page.
# Runs only when this file or the recorder changes on a claude/** branch. Removed before handing anything over.
name: dayshare-mockup
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/dayshare-mockup.yml', 'mockups/dayshare/record.js']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node mockups/dayshare/record.js mockups/dayshare/rec
      - name: Save the recording to this branch
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mockups/dayshare/rec && git commit -qm 'Share a day mockup: recording of the live Today page [skip ci]' && git pull -q --rebase && git push -q
