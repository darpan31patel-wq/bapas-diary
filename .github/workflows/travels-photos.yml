# Website only (bapas-diary.com): the Travels globe's close up of Bapa for each place (tools/travels_photos.py).
# Separate from the daily 2pm picture: touches nothing in that chain.
# Changing site/travels-stops.json on a claude/** branch starts a run. The close ups go into the release
# `travels-mockup` so Claude can build a private mockup page.
name: travels-photos
on:
  push:
    branches: ['claude/**']
    paths: ['site/travels-stops.json', 'site/travels-lookup.txt', 'tools/travels_photos.py', 'tools/travels_geocode.py', '.github/workflows/travels-photos.yml']
  workflow_dispatch:
concurrency:
  group: travels-photos
permissions:
  contents: write
jobs:
  places:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Look up villages on the map
        run: python3 tools/travels_geocode.py site/travels-lookup.txt travels-geo.json
      - name: Into the release
        run: |
          gh release view travels-mockup -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create travels-mockup -R "$GITHUB_REPOSITORY" --prerelease --title "Travels globe mockup" --notes "Close ups for the Travels globe mockup. Not used by the daily picture."
          gh release upload travels-mockup travels-geo.json --clobber -R "$GITHUB_REPOSITORY"
  photos:
    needs: places
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: bapas-diary-photos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get ready
        run: |
          pip install -q opencv-python-headless numpy
          # carry on from the last run (travels-all.tgz), and use the R2 web photos so baps.org is asked less
          gh release download travels-mockup -p travels-all.tgz -R "$GITHUB_REPOSITORY" && tar xzf travels-all.tgz || mkdir -p travels
          id=$(curl -s -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -r .result.id)
          export AWS_ACCESS_KEY_ID=$id AWS_SECRET_ACCESS_KEY=$(printf %s "$CF_TOKEN" | sha256sum | cut -d' ' -f1) AWS_DEFAULT_REGION=auto
          aws s3 sync "s3://$BUCKET/m" r2 --endpoint-url "https://$CF_ACCOUNT.r2.cloudflarestorage.com" --only-show-errors || true
          echo "$(find r2 -type f 2>/dev/null | wc -l) web photos from R2, $(ls travels | wc -l) files carried on"
      - name: Close ups
        run: python3 tools/travels_photos.py --stops site/travels-stops.json --out travels --r2 r2 --tries 4 --gap 2.5
      - name: Into the release
        if: always()
        run: |
          tar czf travels-all.tgz travels
          gh release upload travels-mockup travels-all.tgz --clobber -R "$GITHUB_REPOSITORY"
