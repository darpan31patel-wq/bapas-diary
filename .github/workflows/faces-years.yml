# Website only (bapas-diary.com): "Bapa Through The Years", one close up a day with the eyes lined up
# (tools/faces_years.py --years). Separate from the daily 2pm picture: touches nothing in that chain, fetches nothing
# from baps.org. Every year in R2 (photos.bapas-diary.com/years.txt, filled by the high res copy) is done straight from
# R2's public m/ copies, narrowed to each day's best photos of Bapa by website-faces' scan; each run only does new
# years and new days (Darpan, 26 Oct 2026: "yes more years, this should always auto update"). The page goes into
# release faces-mockup as faces-site.tgz (folder through-the-years/), which every website deploy unpacks; the website
# deploy calls this first, so a new year shows as soon as it is in R2.
# Run by hand with live off, it keeps its result to the side (faces-test.tgz, faces-site-test.tgz) with screenshots.
name: faces-years
on:
  workflow_dispatch:
    inputs:
      live:
        description: 'Update the live page (off: a test copy with screenshots)'
        type: boolean
        default: false
      redo:
        description: 'Choose every day again (after a rule change)'
        type: boolean
        default: false
  workflow_call:
permissions:
  contents: write
jobs:
  faces:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      group: faces-years
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      T: ${{ (github.event_name == 'workflow_dispatch' && !inputs.live) && '-test' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/project-thread-lfiln1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get ready
        run: |
          pip install -q opencv-python-headless numpy pillow open_clip_torch torch --extra-index-url https://download.pytorch.org/whl/cpu
          gh release download database -p bapas.db.gz -O - | gunzip > bapas.db
          # the old BAPS website's photos (swaminarayan.org), as the website build adds them (Darpan, 15 Nov 2026: "Yes push old photos")
          git fetch -q --depth 1 origin claude/project-thread-2l8drg && git show FETCH_HEAD:tools/sorg_photos.py > "$RUNNER_TEMP/sorg_photos.py"
          if gh release download swaminarayan-org-web -p sorg-rows.json -p sorg-have.txt -p sorg-captions.json -p sorg-same.json 2>/dev/null; then
            python3 "$RUNNER_TEMP/sorg_photos.py" add --rows sorg-rows.json --db bapas.db --have sorg-have.txt --captions sorg-captions.json --same sorg-same.json
          fi
          # News story photos (source 'news') count only once their files are in the photo store, so every day is not chosen
          # again over photos that are not there yet (Darpan, 9 Nov 2026: 'yes push search news')
          python3 tools/news_ready.py --db bapas.db --out news-ready.txt --prune
          { curl -sf https://photos.bapas-diary.com/years.txt || true; sqlite3 bapas.db "SELECT DISTINCT year FROM photos WHERE source = 'swaminarayan.org'"; } | grep -E '^[0-9]{4}$' | sort -un > years.txt; echo "years in R2: $(tr '\n' ' ' < years.txt)"
          # baps.org's daily darshan photos, with their month and place, only those in the photo store (baps.org find 2, Darpan 17 Nov 2026: "everything else, go live")
          if gh release download baps-darshan -p ds-rows.json -p ds-have.txt 2>/dev/null; then
            git fetch -q --depth 1 origin claude/project-thread-0f0un6 && git show FETCH_HEAD:tools/ds_darshan.py > "$RUNNER_TEMP/ds_darshan.py"
            python3 "$RUNNER_TEMP/ds_darshan.py" add --rows ds-rows.json --db bapas.db --have ds-have.txt --years years.txt
            sort -un years.txt -o years.txt; echo "years with daily darshan: $(tr '\n' ' ' < years.txt)"
          fi
          mkdir hints && gh release download website-faces -p 'face2-*.json.gz' -D hints
          gh release download swaminarayan-org-web -p 'face2-*-sorg.json.gz' -D hints 2>/dev/null || true
          gh release download baps-darshan -p 'face2-*-bapsds.json.gz' -D hints 2>/dev/null || true   # baps.org daily darshan face scan (find 2)
          gh release download faces-mockup -p faces.tgz   # a test copy starts from the live one too
          tar xzf faces.tgz
          # the daily darshan months were marked looked at before their face scan existed: look at them again, once (baps.org find 2, 18 Nov 2026)
          python3 - <<'EOF'
          import json, os, sqlite3
          p = 'faces/seen.json'
          if os.path.exists(p):
              s = json.load(open(p))
              if s.get('_bapsds') != 1:
                  days = {d for (d,) in sqlite3.connect('bapas.db').execute("SELECT DISTINCT date_from FROM photos WHERE album LIKE 'bapsds-%'")}
                  n = sum(1 for d in days if s.pop(d, None) is not None)
                  s['_bapsds'] = 1
                  json.dump(s, open(p, 'w'), sort_keys=True)
                  print(f'daily darshan days to look at again: {n}')
          EOF
      - name: Close ups
        run: python3 tools/faces_years.py --db bapas.db --years years.txt --hints hints --out faces --sheet sheet ${{ inputs.redo && '--redo' || '' }} 2>&1 | grep -v WARN | tee faces-log.txt
      - name: The page
        run: |
          python3 tools/build_faces.py --faces faces --db bapas.db --out through-the-years --site
          echo "$(find through-the-years -type f | wc -l) files"
          tar czf faces.tgz faces && tar czf faces-site.tgz through-the-years
      - name: Screenshots of the test copy
        if: env.T != ''
        run: |
          pip install -q playwright && python3 -m playwright install --with-deps chromium >/dev/null
          python3 tools/faces_years.py --sheets sheet --db bapas.db --out shots
          mkdir -p shots && (cd through-the-years && python3 -m http.server 8000 >/dev/null 2>&1 &) && sleep 2
          python3 - <<'EOF'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              for name, w, h in (('wide', 1440, 900), ('phone', 390, 844)):
                  for era in ('psm', 'msm'):
                      pg = b.new_page(viewport={'width': w, 'height': h})
                      pg.goto(f'http://localhost:8000/#{era}'); pg.wait_for_timeout(2500)
                      pg.keyboard.press('End'); pg.wait_for_timeout(2500)
                      pg.screenshot(path=f'shots/{name}-{era}.png')
              b.close()
          EOF
          python3 - <<'EOF'   # small copies of the shown photos, for a private mockup page that can't reach R2
          import cv2, json, numpy as np, os, urllib.parse, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          def one(x):
              key = f"{x['album']}/{x['file']}"
              body = urllib.request.urlopen(urllib.request.Request('https://photos.bapas-diary.com/m/' + urllib.parse.quote(key), headers={'User-Agent': 'bapas-diary-years'}), timeout=60).read()
              im = cv2.imdecode(np.frombuffer(body, np.uint8), cv2.IMREAD_COLOR)
              k = 720 / max(im.shape[:2])
              os.makedirs(f"mock/m/{x['album']}", exist_ok=True)
              cv2.imwrite(f'mock/m/{key}', cv2.resize(im, None, fx=k, fy=k, interpolation=cv2.INTER_AREA), [cv2.IMWRITE_JPEG_QUALITY, 72])
          with ThreadPoolExecutor(16) as ex:
              list(ex.map(one, [x for x in json.load(open('faces/faces.json')) if x.get('src') == 'm']))
          EOF
          tar czf shots/mock-photos.tgz -C mock m
          cd shots && for f in *; do mv "$f" "faces-shot-$f"; done
          gh release upload faces-mockup faces-shot-* ../faces-log.txt --clobber
      - name: Into the release
        run: |
          gh release view faces-mockup >/dev/null 2>&1 || \
            gh release create faces-mockup --prerelease --title "Bapa Through The Years" --notes "Website only: the lined up close ups. Not used by the daily picture."
          if [ -n "$T" ]; then mv faces.tgz "faces$T.tgz"; mv faces-site.tgz "faces-site$T.tgz"; fi
          gh release upload faces-mockup "faces$T.tgz" "faces-site$T.tgz" --clobber
