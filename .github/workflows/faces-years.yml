# Website only (bapas-diary.com): "Bapa Through The Years", one close up a day with the eyes lined up
# (tools/faces_years.py --years). Separate from the daily 2pm picture: touches nothing in that chain, fetches nothing
# from baps.org. Every year in R2 (photos.bapas-diary.com/years.txt, filled by the high res copy) is done straight from
# R2's public m/ copies, narrowed to each day's best photos of Bapa by website-faces' scan; each run only does new
# years and new days (Darpan, 26 Oct 2026: "yes more years, this should always auto update"). The page goes into
# release faces-mockup as faces-site.tgz (folder through-the-years/), which every website deploy unpacks; the website
# deploy calls this first, so a new year shows as soon as it is in R2.
# Run by hand with live off, it keeps its result to the side (faces-test.tgz, faces-site-test.tgz) with screenshots.
name: faces-years
on:
  workflow_dispatch:
    inputs:
      live:
        description: 'Update the live page (off: a test copy with screenshots)'
        type: boolean
        default: false
  workflow_call:
permissions:
  contents: write
jobs:
  faces:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      group: faces-years
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      T: ${{ (github.event_name == 'workflow_dispatch' && !inputs.live) && '-test' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/project-thread-lfiln1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get ready
        run: |
          pip install -q opencv-python-headless numpy pillow open_clip_torch torch --extra-index-url https://download.pytorch.org/whl/cpu
          gh release download database -p bapas.db.gz -O - | gunzip > bapas.db
          curl -sf https://photos.bapas-diary.com/years.txt -o years.txt; echo "years in R2: $(tr '\n' ' ' < years.txt)"
          mkdir hints && gh release download website-faces -p 'face2-*.json.gz' -D hints
          gh release download faces-mockup -p faces.tgz   # a test copy starts from the live one too
          tar xzf faces.tgz
      - name: Close ups
        run: python3 tools/faces_years.py --db bapas.db --years years.txt --hints hints --out faces --sheet sheet 2>&1 | grep -v WARN | tee faces-log.txt
      - name: The page
        run: |
          python3 tools/build_faces.py --faces faces --db bapas.db --out through-the-years --site
          echo "$(find through-the-years -type f | wc -l) files"
          tar czf faces.tgz faces && tar czf faces-site.tgz through-the-years
      - name: Screenshots of the test copy
        if: env.T != ''
        run: |
          pip install -q playwright && python3 -m playwright install --with-deps chromium >/dev/null
          python3 tools/faces_years.py --sheets sheet --db bapas.db --out shots
          mkdir -p shots && (cd through-the-years && python3 -m http.server 8000 >/dev/null 2>&1 &) && sleep 2
          python3 - <<'EOF'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              for name, w, h in (('wide', 1440, 900), ('phone', 390, 844)):
                  for era in ('psm', 'msm'):
                      pg = b.new_page(viewport={'width': w, 'height': h})
                      pg.goto(f'http://localhost:8000/#{era}'); pg.wait_for_timeout(2500)
                      pg.keyboard.press('End'); pg.wait_for_timeout(2500)
                      pg.screenshot(path=f'shots/{name}-{era}.png')
              b.close()
          EOF
          cd shots && for f in *; do mv "$f" "faces-shot-$f"; done
          gh release upload faces-mockup faces-shot-* ../faces-log.txt --clobber
      - name: Into the release
        run: |
          gh release view faces-mockup >/dev/null 2>&1 || \
            gh release create faces-mockup --prerelease --title "Bapa Through The Years" --notes "Website only: the lined up close ups. Not used by the daily picture."
          mv faces.tgz "faces$T.tgz"; mv faces-site.tgz "faces-site$T.tgz"
          gh release upload faces-mockup "faces$T.tgz" "faces-site$T.tgz" --clobber
