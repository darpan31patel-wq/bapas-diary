# Website only (bapas-diary.com). Separate from the daily 2pm picture: touches nothing in that chain, fetches nothing
# from baps.org. Tries deep photo tags (tools/deep_tags.py, open SigLIP 2) and sentences (tools/deep_captions.py,
# open Florence-2) on a sample of the photos already in R2, and keeps contact sheets in the release deep-tags-test
# for checking by eye. Runs when these files change on a claude/** branch. Needs no secrets: the photos are public.
name: website-deeptags-test
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/website-deeptags-test.yml', 'tools/deep_*.py']
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  tags:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get ready
        run: |
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -q 'open_clip_torch>=2.31' 'timm>=1.0.15' transformers sentencepiece pillow numpy
          python3 -c "import open_clip; print([p for p in open_clip.list_pretrained() if 'SigLIP2' in p[0]])"
          gh release download database -p bapas.db.gz -O - | gunzip > bapas.db
          curl -sf https://photos.bapas-diary.com/years.txt -o years.txt; echo "years in R2: $(tr '\n' ' ' < years.txt)"
          python3 tools/deep_tags.py sample --years years.txt --n 2000 --out photos
      - name: Tag
        run: |
          python3 tools/deep_tags.py embed --photos photos --out emb.npz
          python3 tools/deep_tags.py sheets --emb emb.npz --photos photos --out sheets
      - name: Keep
        run: |
          zip -qr deep-tags-sheets.zip sheets
          gh release view deep-tags-test >/dev/null 2>&1 || \
            gh release create deep-tags-test --prerelease --title "Deep photo tags test" --notes "Website search test sheets. Not used by the daily picture."
          gh release upload deep-tags-test deep-tags-sheets.zip emb.npz --clobber
  captions:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get ready
        run: |
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -q 'transformers==4.46.3' timm einops pillow numpy
          gh release download database -p bapas.db.gz -O - | gunzip > bapas.db
          curl -sf https://photos.bapas-diary.com/years.txt -o years.txt
          python3 tools/deep_tags.py sample --years years.txt --n 2000 --out photos
      - name: Sentences
        run: mkdir cap && python3 tools/deep_captions.py --photos photos --n 96 --out cap/captions.json
      - name: Keep
        run: |
          zip -qr deep-captions.zip cap
          gh release view deep-tags-test >/dev/null 2>&1 || sleep 60
          gh release upload deep-tags-test deep-captions.zip --clobber
