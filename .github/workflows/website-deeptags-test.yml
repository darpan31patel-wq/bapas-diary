# Website only (bapas-diary.com). Separate from the daily 2pm picture: touches nothing in that chain, fetches nothing
# from baps.org. Tries deep photo tags (tools/deep_tags.py, open SigLIP 2) on a sample of the photos already in R2.
# Keeps the photos' numbers and the words' numbers in the release deep-tags-test, so contact sheets can be made and
# checked by eye without the model. Runs when these files change on a claude/** branch. Needs no secrets: the photos are public.
name: website-deeptags-test
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/website-deeptags-test.yml', 'tools/deep_*.py']
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  tags:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get ready
        run: |
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -q 'open_clip_torch>=2.31' 'timm>=1.0.15' transformers sentencepiece pillow numpy
          python3 -c "import open_clip; print([p for p in open_clip.list_pretrained() if 'SigLIP2' in p[0]])"
          gh release download database -p bapas.db.gz -O - | gunzip > bapas.db
          printf '1999\n2026\n' > years.txt   # the first two years in R2; the test sample stays the same photos
      - name: Photo numbers (once; kept in the release with the sample photos)
        run: |
          gh release view deep-tags-test >/dev/null 2>&1 || \
            gh release create deep-tags-test --prerelease --title "Deep photo tags test" --notes "Website search test. Not used by the daily picture."
          gh release download deep-tags-test -p sample-photos.zip || {
            python3 tools/deep_tags.py sample --years years.txt --n 2000 --out photos
            zip -qr sample-photos.zip photos && gh release upload deep-tags-test sample-photos.zip; }
          gh release download deep-tags-test -p emb.npz || {
            [ -d photos ] || unzip -q sample-photos.zip
            python3 tools/deep_tags.py embed --photos photos --out emb.npz && gh release upload deep-tags-test emb.npz; }
      - name: Word numbers
        run: |
          python3 tools/deep_tags.py words --out words.npz
          gh release upload deep-tags-test words.npz --clobber
      - name: Wide word numbers (Darpan, 26 Oct, "type in anything")
        run: |
          python3 tools/deep_big.py words --out words-big.npz
          gh release upload deep-tags-test words-big.npz --clobber
      - name: Photos to check by eye (the list check-keys.txt is put in the release by hand)
        run: |
          gh release download deep-tags-test -p check-keys.txt || exit 0
          python3 tools/deep_big.py fetch --keys check-keys.txt --out check
          (cd check && zip -qr ../check-photos.zip .) && gh release upload deep-tags-test check-photos.zip --clobber
