# The other BAPS websites Darpan confirmed (13 Nov 2026: "Yes to all"), one after another, each copied page by page
# and photo by photo into his Drive archive ("Bapa's Archive/sites/<site>/...") with the same full detail lists as
# swaminarayan.org ("Everything from the other websites need to have full detail"): <site>-pages.jsonl and
# <site>-photos.jsonl in the release `database`. Archive only: touches nothing in the 2pm picture's chain, the
# website, R2 or bapas.db, never runs 03:45 to 07:30 UTC, and stops at once on any protection check page (never
# tries to get past one). Each site starts from its home page and its own sitemaps. Pushing this file again
# carries every site on from where it stopped.
# Round 1: 15 Nov 2026 10:30 UTC: akshardham.com, na.baps.org, research.baps.org, bapscharities.org, kids.baps.org.
# Round 2, 15 Nov 17:50 UTC: the same, carrying on (research.baps.org was cut off handing over; copying now stops
# after 3h and anything saved but not in Drive is fetched again), then londonmandir.baps.org.
# Round 3, 16 Nov 01:10 UTC: all sites at once, each on its own machine. akshardham.com, na.baps.org (first page
# only, the site builds itself in the browser), bapscharities.org and kids.baps.org finished.
# Round 4, 16 Nov 08:05 UTC: only the two with work left (research.baps.org about 137,000 addresses, londonmandir
# about 1,500). More time copying: pages are no longer pulled back from Drive first, and the lists are rebuilt only
# when a site is finished (or a commit message says [lists]), which took most of round 3's time.
name: other-sites
on:
  push:
    branches: ['claude/project-thread-2nikpj']
    paths: ['.github/workflows/other-sites-2nikpj.yml']
permissions:
  contents: write   # the page list into the release `database`
concurrency:
  group: other-sites
jobs:
  copy:
    strategy:
      max-parallel: 6     # every site on its own machine at once (Darpan, 16 Nov: "more machines ... Faster"); each site still gets only one gentle reader set
      fail-fast: false
      matrix:
        include:
          - { site: research.baps.org, base: 'https://research.baps.org/', key: research-baps-org }
          # Neasden's own site: copied from here only if it answers normally (no check page, no 403), else it stops at
          # once and is left to the News crawl thread for his Chrome (agreed 15 Nov 2026)
          - { site: londonmandir.baps.org, base: 'https://londonmandir.baps.org/', key: londonmandir-baps-org }
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      REMOTE: "gdrive:Bapa's Archive/sites/${{ matrix.site }}"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Never in the 2pm picture's morning
        run: |
          m=$(( 10#$(date -u +%H) * 60 + 10#$(date -u +%M) ))
          if [ $m -ge 225 ] && [ $m -lt 450 ]; then echo "::error::03:45 to 07:30 UTC is kept free"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Drive access
        env:
          TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
          CLIENT_ID: ${{ secrets.RCLONE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.RCLONE_CLIENT_SECRET }}
        run: |
          curl -s https://rclone.org/install.sh | sudo bash >/dev/null
          git fetch -q --depth 1 origin main && git show FETCH_HEAD:tools/rclone_conf.py > "$RUNNER_TEMP/rclone_conf.py"
          mkdir -p ~/.config/rclone && python3 "$RUNNER_TEMP/rclone_conf.py" > ~/.config/rclone/rclone.conf
      - name: Where the last round stopped
        run: |
          mkdir -p state
          rclone copy "$REMOTE/_state" state 2>/dev/null || true
          ls -la state
          # what is already in Drive: those files are not fetched again
          rclone lsf -R --files-only "$REMOTE" --filter "- _state/**" --filter "- _index/**" > have.txt || : > have.txt
          mkdir -p pages
          wc -l have.txt
      - name: Copy (stops by itself 3h50 after starting, by 03:30 UTC at the latest, or when everything is in)
        if: ${{ !contains(github.event.head_commit.message, '[lists only]') }}
        run: |
          # every 20 minutes the new files move to Drive, so the runner's disk never fills
          # and where it got to goes to Drive too, so a round cut short still carries on from there
          ( while sleep 600; do [ -d work/files ] && rclone move work/files "$REMOTE" --transfers 16 --checkers 16 \
              --min-age 30s --stats 0 2>&1 | tail -2; rclone copy state "$REMOTE/_state" --stats 0 2>&1 | tail -1; done ) &
          mover=$!
          # stop 3h50 after starting (the job's own limit is 6h; handing the last files to Drive can take over an hour) and never after 03:30 UTC
          stop=$(date -u -d '+230 minutes' +%H:%M); now=$(date -u +%H%M); s=${stop/:/}
          if [ $((10#$s)) -gt 330 ] && { [ $((10#$now)) -lt 330 ] || [ $((10#$s)) -lt $((10#$now)) ]; }; then stop=03:30; fi
          echo "stopping at $stop UTC"
          # the site's own sitemaps are the starting list (one level of sitemap index followed)
          for sm in sitemap.xml wp-sitemap.xml sitemap_index.xml; do curl -s -A 'Mozilla/5.0' "${{ matrix.base }}$sm"; sleep 1; done \
            | grep -o '<loc>[^<]*' | sed 's/<loc>//' | sort -u > top.txt || true
          { grep -v '\.xml$' top.txt; for sm in $(grep '\.xml$' top.txt | head -200); do curl -s -A 'Mozilla/5.0' "$sm" \
            | grep -o '<loc>[^<]*' | sed 's/<loc>//'; sleep 1; done; } | grep -v '\.xml$' | sort -u > seeds.txt || true
          wc -l seeds.txt
          python3 -I tools/swaminarayan_org.py --site ${{ matrix.site }} --base ${{ matrix.base }} --seeds seeds.txt --work work --state state --stop-at $stop --workers 3 --gap 0.7 \
            --heads state/heads.txt --have have.txt --pages-dir pages \
            | tee run.log | grep -E '^\{|stopping' || true
          kill $mover || true; pkill -f 'rclone move work/files' || true; sleep 5
      - name: Into Drive
        if: always()
        run: |
          rclone copy state "$REMOTE/_state" --stats 0
          [ -d work/files ] && timeout 100m rclone move work/files "$REMOTE" --transfers 16 --checkers 16 --stats-one-line --stats 0 || true
          rclone copy state "$REMOTE/_state" --stats 0
      - name: Full detail for every page and photo
        if: always()
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          # only once the site is finished (or the commit message says [lists]): rebuilding takes hours on a big site
          if ! grep -q '"finished": true' state/last-run.json && ! echo "$MSG" | grep -q '\[lists\]'; then
            echo "not finished yet: the lists wait for the last round"; rclone copy state "$REMOTE/_state" --stats 0; exit 0; fi
          # every saved page back from Drive (pages only), then the lists rebuilt
          rclone copy "$REMOTE" pages --filter "- _state/**" --filter "- _index/**" --filter "+ *.{htm,html,HTM,HTML}" \
            --filter "+ *.php*" --filter "- *" --transfers 16 --checkers 16 --stats 0
          python3 -I tools/sites_index.py --site ${{ matrix.site }} --base ${{ matrix.base }} --folders --files pages --headers state/files.jsonl --out idx
          # saved files whose details (type, size, Last-Modified) round 1 did not keep: asked once next round
          rclone lsf -R --files-only "$REMOTE" --filter "- _state/**" --filter "- _index/**" \
            | python3 -c "import sys,urllib.parse as u; [print('${{ matrix.base }}' + u.quote(l.rstrip('\n')[:-9] if l.rstrip('\n').endswith('index.htm') else l.rstrip('\n'), safe=\"/%-_.~()!'\$&+,;=:@\")) for l in sys.stdin]" \
            | sort > drive.txt
          python3 -c "import json,sys; [print(json.loads(l)['url']) for l in open('state/files.jsonl')]" | sort -u > known.txt || : > known.txt
          comm -23 drive.txt known.txt > state/heads.txt; wc -l drive.txt state/heads.txt
          rclone copy state "$REMOTE/_state" --stats 0
          rclone copy idx "$REMOTE/_index" --stats 0
          cp idx/pages.jsonl ${{ matrix.key }}-pages.jsonl && cp idx/photos.jsonl ${{ matrix.key }}-photos.jsonl
          gh release upload database ${{ matrix.key }}-pages.jsonl ${{ matrix.key }}-photos.jsonl --clobber
          cp state/last-run.json ${{ matrix.key }}-last-run.json && gh release upload database ${{ matrix.key }}-last-run.json --clobber
          cat state/last-run.json
