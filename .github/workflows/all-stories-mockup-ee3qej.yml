# Mockup pictures of Today and Search with every collected story (Darpan, 16 Nov 2026), taken on the live pages on the
# runner with the change put in (round 5, centred box words). Runs only when this file changes on this branch; never deploys anything.
name: All stories mockup
on:
  push:
    branches: [claude/project-thread-ee3qej]
    paths: [.github/workflows/all-stories-mockup-ee3qej.yml]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: pip -q install playwright && python3 -m playwright install --with-deps chromium >/dev/null
      - name: Search's written list with the new stories
        run: |
          gh release download swaminarayan-org-web -p sorg-reports.tgz
          mkdir -p reports && tar -xzf sorg-reports.tgz -C reports
          gh release download database -p akshardham-com-pages.jsonl || true
          python3 tools/web_reads.py --prasang data/baps/prasang.json --reports reports --akshardham akshardham-com-pages.jsonl --out reads.json
      - name: Pictures
        run: python3 tools/mockups/all-stories/shoot.py --reads reads.json --reports reports --out shots && ls -la shots
      - name: Keep them
        if: always()
        run: |
          gh release delete all-stories-mockup -y --cleanup-tag -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          tar czf all-stories-mockup.tgz shots
          gh release create all-stories-mockup all-stories-mockup.tgz -R "$GITHUB_REPOSITORY" --prerelease --title "All stories mockup pictures" --notes "Mockup pictures only, not part of the website" --target "$GITHUB_SHA"
