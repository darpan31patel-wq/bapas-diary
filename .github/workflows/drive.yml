name: Download to Drive

# Darpan, 23 Oct 2026: every baps.org photo with its caption and both Telegram channels, saved straight into his
# Google Drive ("Bapa's Archive") by GitHub instead of his Mac. tools/archive_download.py does the downloading, the
# same script as on the Mac; rclone hands each 1,500 files to Drive so the runner's disk never fills.
# Ten runs share the baps.org years and one does Telegram. A round stops after 4 to 4.5 hours (then hands its last files over); while anything
# is left it starts the next round itself, and each round writes check.txt (known against saved) into the folder.
# Needs the secret RCLONE_DRIVE_TOKEN (from "rclone authorize", scope drive.file: it only sees what it made).

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'    # a daily nudge in case a round's hand-on to the next ever fails

permissions:
  contents: write   # check.txt is also kept in the release `database`, so Claude can read the numbers
  actions: write

concurrency:
  group: drive    # one round at a time, so two runs never save the same file twice

env:
  REMOTE: "gdrive:Bapa's Archive"

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Connect to Drive
        env:
          TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
          CLIENT_ID: ${{ secrets.RCLONE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.RCLONE_CLIENT_SECRET }}
        run: |
          [ -n "$TOKEN" ] || { echo "::error::The RCLONE_DRIVE_TOKEN secret isn't set yet"; exit 1; }
          curl -s https://rclone.org/install.sh | sudo bash >/dev/null
          mkdir -p ~/.config/rclone
          python3 tools/rclone_conf.py > ~/.config/rclone/rclone.conf
      - name: Make the folders first, so the runs never make the same one twice
        run: |
          for d in "" photos photos/baps.org telegram; do rclone mkdir "$REMOTE/$d"; done
          seq 1999 2026 | while read -r y; do rclone mkdir "$REMOTE/photos/baps.org/$y"; done
          curl -sL -o bapas.db.gz https://github.com/${{ github.repository }}/releases/download/database/bapas.db.gz
          gunzip bapas.db.gz && rclone copyto bapas.db "$REMOTE/bapas.db"

  download:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:   # about 26,000 photos each, ten at once (Darpan 24 Oct 2026: more machines); 2026 alone, its originals are big
          - { name: year-2026, only: baps, years: '2026' }
          - { name: year-2025, only: baps, years: '2005,2025' }
          - { name: year-2024, only: baps, years: '2024' }
          - { name: year-2023, only: baps, years: '2003,2023' }
          - { name: year-2022, only: baps, years: '2008,2012,2022' }
          - { name: year-2021, only: baps, years: '2006,2007,2014,2021' }
          - { name: year-2020, only: baps, years: '2000,2009,2013,2020' }
          - { name: year-2019, only: baps, years: '2002,2004,2019' }
          - { name: year-2018, only: baps, years: '2001,2011,2016,2018' }
          - { name: year-2017, only: baps, years: '1999,2010,2015,2017' }
          - { name: telegram, only: telegram, years: '' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Connect to Drive
        env:
          TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
          CLIENT_ID: ${{ secrets.RCLONE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.RCLONE_CLIENT_SECRET }}
        run: |
          curl -s https://rclone.org/install.sh | sudo bash >/dev/null
          mkdir -p ~/.config/rclone
          python3 tools/rclone_conf.py > ~/.config/rclone/rclone.conf
      - name: List what is already in Drive
        run: |
          : > have.txt
          if [ "${{ matrix.only }}" = telegram ]; then dirs="telegram"; else dirs=$(echo "${{ matrix.years }}" | tr , '\n' | sed 's|^|photos/baps.org/|'); fi
          for d in $dirs; do rclone lsf -R --files-only --fast-list "$REMOTE/$d" | sed "s|^|$d/|" >> have.txt || true; done
          echo "$(wc -l < have.txt) files already in Drive"
          mkdir -p work/photos work/telegram   # this run's notes carry on from the last round's
          rclone copy "$REMOTE" work --include "photos/missing (${{ matrix.name }}).txt" --include "telegram/too-big-for-the-web.txt" || true
      - name: Download, handing every 1,500 files to Drive (stops after 5 hours)
        run: |
          MOVE='rclone move work "$REMOTE" --exclude bapas.db --exclude "*.part" --exclude "photos/missing*" --exclude "telegram/too-big*" --transfers 8 --stats-one-line --stats 0'
          set +e
          python tools/archive_download.py --to work --only ${{ matrix.only }} ${{ matrix.years && format('--years {0}', matrix.years) || '' }} \
            --have have.txt --hook "$MOVE" --notes "work/photos/missing (${{ matrix.name }}).txt" --gap 0.5 --hours ${{ matrix.only == 'telegram' && '4' || '4.5' }} 2>&1 | tee run.log   # 4.5 h leaves time for the last hand-over
          code=${PIPESTATUS[0]}
          rclone copy work "$REMOTE" --include "photos/missing*" --include "telegram/too-big*"
          mkdir -p status && { [ $code = 0 ] && echo done || echo more; } > "status/${{ matrix.name }}"
          echo "${{ matrix.name }}: $(cat status/${{ matrix.name }})"
          # how far this run got, in the release so Claude can read it (job logs can't be read from Claude's side)
          { echo "${{ matrix.name }} $(date -u '+%d %b %H:%M UTC'): $(cat status/${{ matrix.name }}), $(wc -l < have.txt) files were already in Drive"
            grep -E 'checked|Stopped|All done|time to stop|already saved' run.log | tail -12; } > "progress-${{ matrix.name }}.txt"
          GH_TOKEN=${{ github.token }} gh release upload database "progress-${{ matrix.name }}.txt" --clobber || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: status-${{ matrix.name }}
          path: status/

  next:
    needs: [setup, download]
    if: always() && needs.setup.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: status-*
          merge-multiple: true
          path: status
      - name: Start the next round while anything is left
        run: |
          cat status/* 2>/dev/null || true
          if [ "$(cat status/* 2>/dev/null | grep -c done)" -lt 11 ]; then
            gh workflow run drive.yml --ref main && echo "Next round started"
          else
            echo "Everything is in Drive"
          fi
      - name: Write check.txt (every photo and post known, against what is in Drive)
        env:
          TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
          CLIENT_ID: ${{ secrets.RCLONE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.RCLONE_CLIENT_SECRET }}
        run: |
          curl -s https://rclone.org/install.sh | sudo bash >/dev/null
          mkdir -p ~/.config/rclone
          python3 tools/rclone_conf.py > ~/.config/rclone/rclone.conf
          # one listing per year and channel, eight at a time (one listing of the whole folder ran past an hour, 25 Oct)
          { seq 1999 2026 | sed 's|^|photos/baps.org/|'; rclone lsf --dirs-only "$REMOTE/telegram" | sed 's|/$||; s|^|telegram/|'; } > dirs.txt
          mkdir -p lists
          xargs -d '\n' -P 8 -I{} sh -c 'f="lists/$(echo "$1" | tr "/ " "__").txt"; for i in 1 2 3; do rclone lsf -R --files-only --fast-list "$REMOTE/$1" > "$f" && break; sleep 30; done; awk -v p="$1/" "{print p \$0}" "$f" > "$f.x" && mv "$f.x" "$f"' _ {} < dirs.txt
          cat lists/*.txt > have.txt
          rclone lsf --files-only "$REMOTE" >> have.txt
          echo "$(wc -l < have.txt) files in Drive"
          mkdir -p work/photos && rclone copy "$REMOTE/photos" work/photos --include "missing*" --max-depth 1
          python tools/archive_download.py --to work --check --have have.txt
          rclone copyto work/check.txt "$REMOTE/check.txt"
          gh release upload database work/check.txt --clobber
