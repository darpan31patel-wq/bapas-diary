# Website only, read only: before and after pictures of the live Search opening on this day in every year instead of
# 1999 (Darpan, 28 Oct 2026). The change exists only inside this test browser.
name: website-search-mockup
on:
  push:
    branches: ['claude/project-thread-mwunnf']
    paths: ['.github/workflows/website-search-mockup.yml', 'site/review/search-today.js']
jobs:
  shots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Search, before and after
        run: |
          npm i -s playwright@1.49.1 > /dev/null && npx playwright install --with-deps chromium > /dev/null
          cat > m.js <<'JS'
          const { chromium } = require('playwright'); const SWAPS = require('./site/review/search-today.js');
          const sizes = [['phone', 390, 844, 3, true], ['laptop', 1440, 900, 1, false]];
          (async () => {
            const b = await chromium.launch();
            for (const [sz, w, h, dpr, mob] of sizes) for (const after of [false, true]) {
              const ctx = await b.newContext({ viewport: { width: w, height: h }, deviceScaleFactor: dpr, isMobile: mob, hasTouch: mob, serviceWorkers: 'block', timezoneId: 'Europe/London' });
              const p = await ctx.newPage(); let hit = [];
              if (after) await p.route(/\/search\/(index\.html)?$/, async r => {
                try { const res = await r.fetch(); let t = await res.text(); for (const [o, n] of SWAPS) { hit.push(t.includes(o)); t = t.replace(o, n); } await r.fulfill({ response: res, body: t }); } catch (e) {}
              });
              await p.goto('https://bapas-diary.com/search/', { waitUntil: 'networkidle', timeout: 120000 }).catch(() => {});
              await p.waitForTimeout(8000);
              const info = await p.evaluate(() => ['year', 'month', 'day'].map(i => document.getElementById(i)?.selectedOptions[0]?.textContent).join(' / ') + ' | ' + (document.getElementById('count')?.textContent || '').trim().slice(0, 120)).catch(e => String(e));
              console.log(`${sz} ${after ? 'AFTER ' + JSON.stringify(hit) : 'before'}: ${info}`);
              const first = await p.$('#results, .results, #list'); if (first) await first.scrollIntoViewIfNeeded().catch(() => {});
              await p.evaluate(() => { const e = document.getElementById('count'); if (e) e.scrollIntoView({ block: 'start' }); scrollBy(0, -80); }).catch(() => {});
              await p.waitForTimeout(2500);
              await p.screenshot({ path: `search-${sz}-${after ? 'after' : 'before'}.jpg`, type: 'jpeg', quality: 75 });
              await ctx.close().catch(() => {});
            }
            await b.close();
          })();
          JS
          node m.js | tee search-report.txt; true
      - name: Keep them in release website-review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload website-review -R "$GITHUB_REPOSITORY" --clobber search-*.jpg search-report.txt
