# One off check (Darpan's own Google Drive key, 26 Oct 2026): can rclone open "Bapa's Archive" with the
# RCLONE_CLIENT_ID / RCLONE_CLIENT_SECRET / RCLONE_DRIVE_TOKEN secrets? Prints only a count, never names or keys.
# Lives on this branch only; touches nothing in the daily picture chain.
name: drive-key-check
on:
  push:
    branches: ['claude/project-thread-ttpzxb']
    paths: ['.github/workflows/drive-key-check.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/project-thread-eawr12
      - name: Open the Drive archive with Darpan's own key
        env:
          TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
          CLIENT_ID: ${{ secrets.RCLONE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.RCLONE_CLIENT_SECRET }}
        run: |
          [ -n "$CLIENT_ID" ] && echo "own key secret is set" || echo "::warning::RCLONE_CLIENT_ID is not set"
          curl -s https://rclone.org/install.sh | sudo bash >/dev/null
          [ -n "$CLIENT_ID" ] && [ -n "$CLIENT_SECRET" ] || { echo "::error::The RCLONE_CLIENT_ID and RCLONE_CLIENT_SECRET secrets are needed"; exit 1; }
          git fetch -q --depth 1 origin main && git show FETCH_HEAD:tools/rclone_conf.py > "$RUNNER_TEMP/rclone_conf.py"
          mkdir -p ~/.config/rclone && python3 "$RUNNER_TEMP/rclone_conf.py" > ~/.config/rclone/rclone.conf
          grep -q '^client_id' ~/.config/rclone/rclone.conf && echo "using his own Google login"
          rclone lsf --max-depth 1 "gdrive:Bapa's Archive" > /dev/null || { echo "::error::Drive would not open with Darpan's own key"; exit 1; }
          echo "Drive opened with Darpan's own Google key"
