name: Bapa's Diary

on:
  schedule:
    # GitHub's clock is UTC and often runs late, so build twice well before 8:30am UK time:
    # 05:15 and 06:15 UTC = 6:15 and 7:15am in summer (BST), 5:15 and 6:15am in winter (GMT).
    # The second run only does anything if the first one didn't finish.
    - cron: '15 5 * * *'
    - cron: '15 6 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to make (YYYY-MM-DD). Leave blank for today.'
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: diary-${{ github.ref }}

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.ref == 'refs/heads/main' && 40 || 170 }}
    steps:
      - uses: actions/checkout@v4

      - name: Already made today?
        id: done
        if: github.event_name == 'schedule'
        run: |
          if grep -q "^$(TZ=Europe/London date +%F) " log.md; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v5
        if: steps.done.outputs.skip != '1'
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        if: steps.done.outputs.skip != '1'
        run: pip install -q -r requirements.txt

      - name: Collect new vicharan photos of Bapa (they join this date's picture from next year)
        if: steps.done.outputs.skip != '1' && github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 15
        run: python collect.py

      - name: Open an issue (GitHub emails you) if no new photos have turned up for two weeks
        if: steps.done.outputs.skip != '1' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(python -c "import json; print(json.load(open('archive/state.json'))['last_date'])")
          days=$(( ( $(date +%s) - $(date -d "$last" +%s) ) / 86400 ))
          open=$(gh issue list --state open --search "No new vicharan photos in:title" --json number -q '.[].number')
          if [ "$days" -ge 14 ] && [ -z "$open" ]; then
            gh issue create --title "No new vicharan photos since $last" --body "The daily collector hasn't found new vicharan photos of Bapa for $days days. Either baps.org hasn't uploaded any, or it has changed how its photos are named (see collect.py and archive/state.json). The daily picture keeps working with every photo already saved. Close this issue once it's sorted."
          fi

      - name: Open Darpan's downloaded archive in Drive (the photos come from there, baps.org only for anything it lacks)
        if: steps.done.outputs.skip != '1'
        continue-on-error: true
        timeout-minutes: 8
        env:
          TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
          CLIENT_ID: ${{ secrets.RCLONE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.RCLONE_CLIENT_SECRET }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$TOKEN" ] || { echo "The RCLONE_DRIVE_TOKEN secret isn't set, so the photos come from baps.org"; exit 0; }
          curl -s https://rclone.org/install.sh | sudo bash >/dev/null
          mkdir -p ~/.config/rclone && python3 tools/rclone_conf.py > ~/.config/rclone/rclone.conf
          gh release download database -p bapas.db.gz --clobber && gunzip -f bapas.db.gz
          echo "ARCHIVE=gdrive:Bapa's Archive" >> "$GITHUB_ENV"

      - name: Make the picture
        if: steps.done.outputs.skip != '1'
        env:
          DATE: ${{ inputs.date }}
          STYLES: ${{ github.ref != 'refs/heads/main' && 'H2' || '' }}
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ] && [ "${DATE#before:}" != "$DATE" ]; then
            # test branches only, 'before:2026-11-10,2026-11-14': each date made twice, by main as it is today and by this
            # branch, and set one above the other (Darpan, 9 Nov 2026: test pictures next to today's picture for the same date)
            git fetch -q --depth 1 origin main && git worktree add -q ../before FETCH_HEAD
            export ARCHIVE_DB="$PWD/bapas.db"
            mkdir -p compare
            for d in $(echo "${DATE#before:}" | tr ',' ' '); do
              (cd ../before && python make.py --date "$d" --out "out/$d" --cache "$GITHUB_WORKSPACE/cache") > "compare/$d-before-log.txt" 2>&1 || true
              python make.py --date "$d" --out "out/$d" --cache cache > "compare/$d-after-log.txt" 2>&1 || true
              for w in before after; do
                o="out/$d"; [ "$w" = before ] && o="../before/out/$d"
                cp "$o/bapas-diary.jpg" "compare/$d-$w.jpg" || true
                cp "$o/summary.txt" "compare/$d-$w-summary.txt" || true
                [ -e "$o/caption.txt" ] && cp "$o/caption.txt" "compare/$d-$w-caption.txt"
              done
              python - "$d" <<'PY' || true
          import sys
          from PIL import Image, ImageDraw, ImageFont
          d = sys.argv[1]
          a, b = (Image.open(f'compare/{d}-{w}.jpg').convert('RGB') for w in ('before', 'after'))
          k = 2400 / a.width
          a, b = (im.resize((2400, round(im.height * k))) for im in (a, b))
          font = ImageFont.truetype('fonts/arimo-latin-700-normal.woff2', 44)
          out = Image.new('RGB', (2400, a.height + b.height + 160), (24, 16, 16))
          draw = ImageDraw.Draw(out)
          draw.text((30, 16), f'{d}  BEFORE: the picture as main makes it today', font=font, fill=(240, 220, 170))
          out.paste(a, (0, 80))
          draw.text((30, a.height + 96), f'{d}  AFTER: with the News articles and photos', font=font, fill=(240, 220, 170))
          out.paste(b, (0, a.height + 160))
          out.save(f'compare/{d}-side-by-side.jpg', quality=90)
          PY
            done
            rm -rf out && mkdir out && mv compare out/compare; echo "compare" > out/date.txt; exit 0
          fi
          if [ "${GITHUB_REF}" != "refs/heads/main" ] && [ "${DATE#*,}" != "$DATE" ]; then
            # test branches only: several dates at once, original and unique caption picks side by side
            for d in ${DATE//,/ }; do
              python make.py --date "$d" --compare --out "out/$d"
              mkdir -p compare && cp "out/$d/original.jpg" "compare/$d-original.jpg"
              cp "out/$d/unique.jpg" "compare/$d-unique.jpg"; cp "out/$d/captions.txt" "compare/$d-captions.txt"
            done
            rm -rf out && mkdir out && mv compare out/compare; echo "compare" > out/date.txt; exit 0
          fi
          python make.py ${DATE:+--date "$DATE"} ${STYLES:+--styles "$STYLES"} ${STYLES:+--workings}
          if [ -n "$STYLES" ]; then python probe.py --date "$(cat out/date.txt)" --out out || true; fi

      - name: Keep a copy on this run's page
        if: steps.done.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: bapas-diary
          path: out/
          retention-days: 14

      - name: Publish today's picture for Google Drive to collect
        if: steps.done.outputs.skip != '1' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(cat out/date.txt)" != "$(TZ=Europe/London date +%F)" ]; then
            echo "Not today's date, so it stays on this run's page and today's picture is left alone"; exit 0
          fi
          gh release view today >/dev/null 2>&1 || gh release create today --title "Today's picture" \
            --notes "Rebuilt every morning. Your Google script collects bapas-diary.png from here at 8:30am."
          gh release edit today --title "Today's picture" \
            --notes "Rebuilt every morning. Your Google script collects bapas-diary.png from here at 8:30am."
          gh release upload today out/bapas-diary.png out/bapas-diary.jpg out/date.txt --clobber
          # the channel's story for the 2pm caption, and on big days the special picture; yesterday's are taken down
          for f in caption.txt bapas-diary-special.png bapas-diary-special.jpg flags.txt bapas-diary-backup.png; do
            if [ -e "out/$f" ]; then gh release upload today "out/$f" --clobber
            else gh release delete-asset today "$f" -y 2>/dev/null || true; fi
          done

      - name: Flag a channel card Bapa's face wasn't surely found in (GitHub emails you)
        if: steps.done.outputs.skip != '1' && github.ref == 'refs/heads/main' && hashFiles('out/flags.txt') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Today's picture has a card from the Today in BAPS History channel where Bapa's face could not be surely recognised:"
            echo; cat out/flags.txt; echo
            echo "If it is not Bapa, the same picture without that card is bapas-diary-backup.png on https://github.com/${{ github.repository }}/releases/tag/today (swap it into the Drive folder before 2pm). Close this issue once checked."
          } > flag-body.md
          gh issue create --title "Check today's older card ($(cat out/date.txt))" --body-file flag-body.md

      - name: Test branches keep their picture in preview/ (nothing reaches Google Drive)
        if: github.ref != 'refs/heads/main'
        run: |
          mkdir -p preview
          if [ -d out/compare ]; then cp out/compare/* preview/; else
          cp out/bapas-diary.jpg "preview/$(cat out/date.txt).jpg"
          cp out/bapas-diary.png "preview/$(cat out/date.txt).png"
          cp out/summary.txt "preview/$(cat out/date.txt).txt"
          [ -e out/caption.txt ] && cp out/caption.txt "preview/$(cat out/date.txt)-caption.txt"
          [ -e out/bapas-diary-special.png ] && cp out/bapas-diary-special.png "preview/$(cat out/date.txt)-special.png"
          [ -e out/flags.txt ] && cp out/flags.txt "preview/$(cat out/date.txt)-flags.txt"; fi
          for f in out/all-photos.txt out/album-check.txt; do [ -e "$f" ] && cp "$f" "preview/$(cat out/date.txt)-$(basename "$f")"; done
          for f in out/caption-*.jpg out/caption-*.png; do [ -e "$f" ] && cp "$f" "preview/$(cat out/date.txt)-$(basename "$f")"; done
          for d in out/photos-*; do [ -d "$d" ] && rm -rf "preview/$(cat out/date.txt)-$(basename "$d")" && cp -r "$d" "preview/$(cat out/date.txt)-$(basename "$d")"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview
          git commit -q -m "Preview for $(cat out/date.txt)"
          git push -q

      - name: Log it (this also keeps GitHub's daily timer switched on)
        if: steps.done.outputs.skip != '1' && github.ref == 'refs/heads/main'
        run: |
          echo "$(cat out/date.txt) $(cat out/summary.txt)" >> log.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add log.md archive
          git commit -q -m "Bapa's Diary for $(cat out/date.txt)"
          git push -q
