name: Bapa's Diary

on:
  schedule:
    # GitHub's clock is UTC and often runs late, so build twice well before 8:30am UK time:
    # 05:15 and 06:15 UTC = 6:15 and 7:15am in summer (BST), 5:15 and 6:15am in winter (GMT).
    # The second run only does anything if the first one didn't finish.
    - cron: '15 5 * * *'
    - cron: '15 6 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to make (YYYY-MM-DD). Leave blank for today.'
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: diary-${{ github.ref }}

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Already made today?
        id: done
        if: github.event_name == 'schedule'
        run: |
          if grep -q "^$(TZ=Europe/London date +%F) " log.md; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v5
        if: steps.done.outputs.skip != '1'
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        if: steps.done.outputs.skip != '1'
        run: pip install -q -r requirements.txt

      - name: Collect new vicharan photos of Bapa (they join this date's picture from next year)
        if: steps.done.outputs.skip != '1' && github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 15
        run: python collect.py

      - name: Open an issue (GitHub emails you) if no new photos have turned up for two weeks
        if: steps.done.outputs.skip != '1' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(python -c "import json; print(json.load(open('archive/state.json'))['last_date'])")
          days=$(( ( $(date +%s) - $(date -d "$last" +%s) ) / 86400 ))
          open=$(gh issue list --state open --search "No new vicharan photos in:title" --json number -q '.[].number')
          if [ "$days" -ge 14 ] && [ -z "$open" ]; then
            gh issue create --title "No new vicharan photos since $last" --body "The daily collector hasn't found new vicharan photos of Bapa for $days days. Either baps.org hasn't uploaded any, or it has changed how its photos are named (see collect.py and archive/state.json). The daily picture keeps working with every photo already saved. Close this issue once it's sorted."
          fi

      - name: Make the picture
        if: steps.done.outputs.skip != '1'
        env:
          DATE: ${{ inputs.date }}
          STYLES: ${{ github.ref != 'refs/heads/main' && 'A,B,C,D' || '' }}
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ] && [ "${DATE#*,}" != "$DATE" ]; then
            # test branches only: several dates at once, original and unique caption picks side by side
            for d in ${DATE//,/ }; do
              python make.py --date "$d" --compare --out "out/$d"
              mkdir -p compare && cp "out/$d/original.jpg" "compare/$d-original.jpg"
              cp "out/$d/unique.jpg" "compare/$d-unique.jpg"; cp "out/$d/captions.txt" "compare/$d-captions.txt"
            done
            rm -rf out && mkdir out && mv compare out/compare; echo "compare" > out/date.txt; exit 0
          fi
          python make.py ${DATE:+--date "$DATE"} ${STYLES:+--styles "$STYLES"}

      - name: Keep a copy on this run's page
        if: steps.done.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: bapas-diary
          path: out/
          retention-days: 14

      - name: Publish today's picture for Google Drive to collect
        if: steps.done.outputs.skip != '1' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(cat out/date.txt)" != "$(TZ=Europe/London date +%F)" ]; then
            echo "Not today's date, so it stays on this run's page and today's picture is left alone"; exit 0
          fi
          gh release view today >/dev/null 2>&1 || gh release create today --title "Today's picture" \
            --notes "Rebuilt every morning. Your Google script collects bapas-diary.jpg from here at 8:30am."
          gh release edit today --title "Today's picture" \
            --notes "Rebuilt every morning. Your Google script collects bapas-diary.jpg from here at 8:30am."
          gh release upload today out/bapas-diary.jpg out/date.txt --clobber

      - name: Test branches keep their picture in preview/ (nothing reaches Google Drive)
        if: github.ref != 'refs/heads/main'
        run: |
          mkdir -p preview
          if [ -d out/compare ]; then cp out/compare/* preview/; else
          cp out/bapas-diary.jpg "preview/$(cat out/date.txt).jpg"
          cp out/summary.txt "preview/$(cat out/date.txt).txt"; fi
          for f in out/caption-*.jpg; do [ -e "$f" ] && cp "$f" "preview/$(cat out/date.txt)-$(basename "$f")"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview
          git commit -q -m "Preview for $(cat out/date.txt)"
          git push -q

      - name: Log it (this also keeps GitHub's daily timer switched on)
        if: steps.done.outputs.skip != '1' && github.ref == 'refs/heads/main'
        run: |
          echo "$(cat out/date.txt) $(cat out/summary.txt)" >> log.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add log.md archive
          git commit -q -m "Bapa's Diary for $(cat out/date.txt)"
          git push -q
