# Website only (bapas-diary.com). Separate from the daily 2pm picture: touches nothing in that chain, fetches nothing
# from baps.org. Fetches a few small photos from R2 (photos.bapas-diary.com, public) so a Search preview can be made
# and the deep photo tags checked by eye. Keeps them as preview-photos.zip in the release deep-tags-test.
name: website-deeptags-fetch
on:
  workflow_dispatch:
    inputs:
      keys:
        description: 'ALBUM/FILE|ALBUM/FILE|...'
        required: true
permissions:
  contents: write
env:
  GH_TOKEN: ${{ github.token }}
  KEYS: ${{ inputs.keys }}
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Small photos from R2
        run: |
          mkdir -p p && cd p
          echo "$KEYS" | tr '|' '\n' | while read -r k; do
            [ -n "$k" ] || continue
            mkdir -p "$(dirname "$k")"
            curl -sf --retry 3 -A bapas-diary-tags "https://photos.bapas-diary.com/s/$k" -o "$k" || echo "missing $k"
          done
          zip -qr ../preview-photos.zip . && cd .. && ls -la preview-photos.zip
          gh release upload deep-tags-test preview-photos.zip --clobber -R "$GITHUB_REPOSITORY"
