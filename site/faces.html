<style>
/* Layout: the whole photo lit in the middle like a darshan in a dim mandir, the day's facts either side, the years running underneath */
:root {
  --bg: #15100d; --panel: #201814; --line: #3b2d25; --ink: #f4e9dc; --muted: #b8a28c; --saffron: #ec8a2d; --glow: rgba(236,138,45,.18);

  --body: 'Mukta', 'Segoe UI', system-ui, sans-serif;

}
html, body { background: var(--bg); color: var(--ink); margin: 0; height: 100%; }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
body { font-family: var(--body); font-size: 16px; line-height: 1.5; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 52px 10px; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }   /* 46px kept free for the shared site menu */
/* one screen: title row, the photo filling whatever height is left, the controls always on the bottom edge (Darpan, 24 Oct 2026) */
.wrap { flex: 1; min-height: 0; width: 100%; max-width: 1560px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.top, .note, .scrub { flex: none; }
.top { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); grid-template-areas: "psm title msm"; align-items: center; gap: 12px 24px; }
header { grid-area: title; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
#tab-psm { grid-area: psm; } #tab-msm { grid-area: msm; text-align: right; align-items: flex-end; }
@media (max-width: 900px) { .top { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "title title" "psm msm"; } #tab-msm { text-align: left; align-items: flex-start; } }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(24px, 3.6vw, 40px); line-height: 1; margin: 0; letter-spacing: .01em; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: 14px; }
.tab { font: inherit; text-align: left; color: var(--ink); background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 8px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.tab .who { font-family: var(--display); font-size: clamp(16px, 2.2vw, 24px); line-height: 1.15; }
.tab .yrs { font-size: 13px; color: var(--muted); }
.tab:hover { border-color: var(--saffron); }
.tab[aria-selected="true"] { color: var(--bg); background: var(--saffron); border-color: var(--saffron); }
.tab[aria-selected="true"] .yrs { color: var(--bg); opacity: .8; }
.tab:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; }
.note { font-size: 12.5px; color: var(--muted); text-align: center; margin: 0; }
.stage { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2.2fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); grid-template-areas: "left slot right"; gap: 8px 28px; align-items: center; }
.slot { grid-area: slot; height: 100%; min-height: 0; min-width: 0; display: flex; align-items: center; justify-content: center; }
.frame { position: relative; flex: none; overflow: hidden; background: radial-gradient(closest-side, var(--glow), transparent); touch-action: none; }
.frame img { position: absolute; left: 0; top: 0; max-width: none; transform-origin: 0 0; opacity: 0; transition: opacity var(--fade) linear; box-shadow: 0 12px 40px -10px rgba(0,0,0,.7); }
.frame img.on { opacity: 1; }
.frame img.rest { transition: opacity var(--fade) linear, transform 1.4s ease-in-out, width 1.4s ease-in-out, height 1.4s ease-in-out; }
/* a year opens with its own card for a moment: the year, his age, how many days, where he was most */
.intro { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 16px; text-align: center; background: radial-gradient(closest-side, rgba(21,16,13,.86), rgba(21,16,13,.62)); opacity: 0; transition: opacity .7s ease; pointer-events: none; }
.intro.on { opacity: 1; }
.intro .iy { font-family: var(--display); font-size: clamp(56px, 13vmin, 128px); line-height: 1; }
.intro .ia { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--saffron); }
.intro .in { font-size: clamp(15px, 2vmin, 19px); }
.intro .ip { font-size: clamp(14px, 1.8vmin, 17px); color: var(--muted); max-width: 24em; }

.eyes { position: absolute; inset: 0; pointer-events: none; }
.eyes i { position: absolute; top: var(--eye-y); width: 24px; height: 24px; margin: -12px 0 0 -12px; border: 1.5px solid rgba(255,255,255,.8); border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
.eyes::after { content: ""; position: absolute; left: 0; right: 0; top: var(--eye-y); border-top: 1px dashed rgba(255,255,255,.35); }
.info { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.info.l { grid-area: left; text-align: right; align-items: flex-end; }
.info.r { grid-area: right; }
.age { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--saffron); }
.date { font-family: var(--display); font-size: clamp(26px, 3.4vw, 38px); line-height: 1.1; margin: 0; text-wrap: balance; }
.place { font-size: 18px; margin: 0; }
.cap { font-size: 18px; font-weight: 300; margin: 0; max-width: 34em; }
.cal { font-size: 14.5px; color: var(--muted); margin: 0; }
.cal b { color: var(--ink); font-weight: 600; }
.more { align-self: start; text-decoration: none; font: inherit; font-weight: 600; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 16px; cursor: pointer; }
.more:hover { border-color: var(--saffron); }
.count { font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.scrub { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
/* every year as a button in one row; the years gone by and the part of this year passed fill with saffron, like a progress bar (Darpan, 28 Oct 2026) */
.years { display: flex; align-items: center; gap: 8px; min-width: 0; }
/* all the years side by side in one row that never slides (Darpan, 28 Oct 2026: 'want all the years in one row static') */
.years .list { flex: 1; min-width: 0; display: flex; gap: 4px; padding: 2px; }
.yr { flex: 1 1 0; min-width: 0; font: inherit; font-size: clamp(11px, 1.05vw, 15px); font-variant-numeric: tabular-nums; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 0; cursor: pointer; text-align: center; white-space: nowrap; overflow: hidden; }
.yr .s { display: none; }
@media (max-width: 1100px) { .yr .f { display: none; } .yr .s { display: inline; } }   /* narrow screens: '99, '00 ... so every year still fits */
.yr:hover { border-color: var(--saffron); }
.yr[aria-pressed="true"] { border-color: var(--saffron); font-weight: 600; background: linear-gradient(90deg, var(--saffron) 0 var(--p), var(--panel) var(--p) 100%); text-shadow: 0 1px 3px rgba(0,0,0,.65); transition: --p .35s ease-out; }
/* years already passed are full saffron */
.yr.past { color: var(--bg); background: var(--saffron); border-color: var(--saffron); }
@property --p { syntax: '<percentage>'; inherits: false; initial-value: 0%; }
.yr:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.bar .days { flex: 1 1 240px; min-width: 0; }   /* the scroller takes all the room the buttons leave (Darpan, 28 Oct 2026: 'get rid of year month eye line button, extend the scroller bar') */
.btn { font: inherit; font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.btn[aria-pressed="true"] { border-color: var(--saffron); color: var(--saffron); }
.btn.play { min-width: 84px; font-weight: 600; }
select.btn { padding-right: 8px; }

.days { -webkit-appearance: none; appearance: none; width: 100%; height: 60px; margin: 0; background: transparent; cursor: pointer; touch-action: none; }
.days::-webkit-slider-runnable-track { height: 30px; border-radius: 15px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.days::-moz-range-track { height: 30px; border-radius: 15px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.days::-moz-range-progress { height: 30px; border-radius: 15px; background: var(--saffron); opacity: .55; }
.days::-webkit-slider-thumb { -webkit-appearance: none; width: 54px; height: 54px; margin-top: -12px; border-radius: 50%; background: var(--saffron); border: 4px solid var(--ink); box-shadow: 0 4px 14px rgba(0,0,0,.5); }
.days::-moz-range-thumb { width: 54px; height: 54px; border-radius: 50%; background: var(--saffron); border: 4px solid var(--ink); box-shadow: 0 4px 14px rgba(0,0,0,.5); }
.days:focus-visible { outline: 2px solid var(--saffron); outline-offset: 4px; border-radius: 12px; }
.speed { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.speed input { width: 120px; accent-color: var(--saffron); }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
@media (max-width: 900px) {
  .stage { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "slot slot" "left right"; gap: 8px 16px; align-items: start; }
  .info { gap: 4px; }
  .info.l { text-align: left; align-items: flex-start; }
  .age { font-size: 11px; } .date { font-size: 20px; } .place, .cap { font-size: 15px; } .cal { font-size: 13px; }
  .more { font-size: 14px; padding: 5px 12px; } .count { display: none; }
  .speed span { display: none; }
}
@media (max-height: 640px) { .sub, .note { display: none; } }
@media (max-width: 600px) {
  .sub, .note, .speed { display: none; }
  .bar { flex-wrap: nowrap; } .bar .days { flex: 1 1 0; }   /* Play and the scroller side by side */
  .tab .yrs { font-size: 12px; }
  .years .list { gap: 2px; } .yr { font-size: 12px; border-radius: 6px; padding: 6px 0; } .yr .q { display: none; }
}
/* a phone on its side: the photo on the left, the day's facts beside it, the controls kept small underneath */
@media (orientation: landscape) and (max-height: 560px) {
  body { padding-block: 48px 6px; }
  .wrap { gap: 6px; }
  .top { grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "title psm msm"; gap: 8px 12px; }
  h1 { font-size: 20px; }
  .tab { padding: 3px 12px; border-radius: 10px; } .tab .who { font-size: 15px; } .tab .yrs { display: none; }
  #tab-msm { text-align: right; align-items: flex-end; }
  .stage { grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "slot left" "slot right"; gap: 4px 16px; align-items: start; }
  .slot { width: calc(100dvh - 186px); max-width: 52vw; }
  .info.l { text-align: left; align-items: flex-start; }
  .sub, .note, .speed, .count { display: none; }
  .bar .days { order: 0; flex-basis: 160px; height: 36px; }
  .yr { padding: 2px 0; }
}
@media (prefers-reduced-motion: reduce) { :root { --fade: 0ms; } .frame img.rest { transition: none; } }
</style>

<script>
const DAYS = /*DAYS*/[];
const BORN = { psm: '1921-12-07', msm: '1933-09-13' };
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WEEK = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAYMS = 864e5;
const tOf = d => Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10)) / DAYMS;
const dOf = t => new Date(t * DAYMS);

const eras = { psm: [], msm: [] };
for (const r of DAYS) eras[r[5]].push({ day: r[0], to: r[1] > r[0] ? r[1] : '', place: r[2], cap: r[3], photos: r[4], tithi: r[6], fest: r[7], eyes: r.slice(8, 12), span: r[12], w: r[13], h: r[14], path: r[15] || '', rank: r[16] || 0, y: +r[0].slice(0, 4), t: tOf(r[0]) });
const EYE_X = .5, EYE_Y = .45, GAP = .21;   // where his eyes sit in the square frame, and how big his face is (eyes to mouth, share of the frame's width)
const BLOW = 1.8;   // never shown more than this many screen pixels for each pixel of the photo, so a small old photo is never blown up blurry

const $ = id => document.getElementById(id);
let era = 'psm', list = eras.psm, idx = 0, playing = null, front = $('imgA'), back = $('imgB'), token = 0, years = new Map(), shownYear = 0;
const still = matchMedia('(prefers-reduced-motion: reduce)');

function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function longDate(d) { const x = dOf(tOf(d)); return `${WEEK[x.getUTCDay()]} ${x.getUTCDate()} ${MONTHS[x.getUTCMonth()]} ${x.getUTCFullYear()}`; }
function rangeDate(a, b) {
  const [ya, ma, da] = [+a.slice(0, 4), +a.slice(5, 7) - 1, +a.slice(8)], [yb, mb, db] = [+b.slice(0, 4), +b.slice(5, 7) - 1, +b.slice(8)];
  if (ya === yb && ma === mb) return `${da} to ${db} ${MONTHS[mb]} ${yb}`;
  if (ya === yb) return `${da} ${MONTHS[ma]} to ${db} ${MONTHS[mb]} ${yb}`;
  return `${da} ${MONTHS[ma]} ${ya} to ${db} ${MONTHS[mb]} ${yb}`;
}
function ageOn(d) { const b = BORN[era]; let a = +d.slice(0, 4) - +b.slice(0, 4); if (d.slice(5) < b.slice(5)) a--; return a; }

// a close up framed on his face in a square that never changes shape (Darpan, 26 Oct 2026: 'very jarring that the
// shape keeps changing ... keep the picture as a square box'): the photo turned and sized so his eyes sit at
// (EYE_X, EYE_Y) every day, made a little bigger when needed so it always fills the square. Once the days stop moving
// it eases back to the whole photo as it was taken, straight and uncut (Darpan, 23 and 26 Oct 2026).
// The photo is laid out at the size it is shown (not shown small and stretched), so the browser draws it sharp, and
// always keeps its own shape, whichever copy (m/ or the bigger l/) is in it (Darpan, 28 Oct 2026: 'some pictures
// don't stretch, resize or scale correctly').
function place(img, x, rest) {
  const fr = $('frame'), W = fr.clientWidth, H = fr.clientHeight, ex = EYE_X * W, ey = EYE_Y * H;
  const [nw, nh] = img.nat || [x.w, x.h], w = x.w, h = x.w * nh / nw;   // in the units its eyes were measured in
  const size = (k, e, f, c = 1, s = 0) => {
    img.style.width = k * w + 'px'; img.style.height = k * h + 'px';
    img.style.transform = `matrix(${c},${-s},${s},${c},${e},${f})`;
  };
  if (rest || Math.abs(h - x.h) > x.h * .03) {   // a copy of another shape than the one measured: never guess where his eyes are
    const k = Math.min(W / w, H / h);
    size(k, (W - k * w) / 2, (H - k * h) / 2);
    return;
  }
  const [rx, ry, lx, ly] = x.eyes, mx = (rx + lx) / 2, my = (ry + ly) / 2;
  const a = Math.atan2(ly - ry, lx - rx), c = Math.cos(a), s = Math.sin(a);
  let k = Math.min(GAP * W / x.span, BLOW * nw / w);
  for (const [px, py] of [[0, 0], [W, 0], [0, H], [W, H]]) {   // each corner of the square must land on the photo
    const vx = px - ex, vy = py - ey, dx = c * vx - s * vy, dy = s * vx + c * vy;
    if (dx > 0) k = Math.max(k, dx / Math.max(1, x.w - mx)); else if (dx < 0) k = Math.max(k, -dx / Math.max(1, mx));
    if (dy > 0) k = Math.max(k, dy / Math.max(1, x.h - my)); else if (dy < 0) k = Math.max(k, -dy / Math.max(1, my));
  }
  size(k, ex - k * (c * mx + s * my), ey - k * (-s * mx + c * my), c, s);
  fr.style.setProperty('--eye-y', EYE_Y * 100 + '%');
  const g = Math.hypot(lx - rx, ly - ry) * k / 2;
  $('eyeR').style.left = (ex - g) + 'px'; $('eyeL').style.left = (ex + g) + 'px';
}

// Photos are fetched one at a time, newest wish first (Darpan, 28 Oct 2026: 'sometimes the page gets stuck when
// scrolling through different years'). Before, every day passed on the way started its own big download and five
// more besides, and the photo only changed once the newest of them had arrived, so a quick scroll across a year
// queued hundreds of photos and the picture froze. Now the photo keeps up with whatever has arrived, the day's words
// always change with their own photo, and the strip and slider move at once.
const pics = new Map();   // the last photos fetched, ready to show at once
function pic(url) {
  let im = pics.get(url);
  if (im) { pics.delete(url); pics.set(url, im); return im; }
  im = new Image(); im.decoding = 'async'; im.src = url;
  im.ready = (im.decode ? im.decode() : new Promise((ok, no) => { im.onload = ok; im.onerror = no; })).then(() => true, () => false);
  pics.set(url, im);
  if (pics.size > 90) pics.delete(pics.keys().next().value);
  return im;
}
let busy = false, want = null, settle = 0, introOn = false;
function show(i, fast, calm) {
  if (!list.length) return;
  idx = Math.max(0, Math.min(list.length - 1, i));
  const x = list[idx];
  if (!calm && introOn) hideIntro();
  want = { x, fast, calm };
  $('days').value = idx;
  markYear(x.y);
  clearTimeout(settle);
  paint();
  if (playing || !fast) for (const k of playing ? [1, 2, 3, 4] : [1, -1]) { const y = list[idx + k]; if (y) pic(photo(y)); }
  fill();
}
function paint() {
  if (busy || !want) return;
  const { x, fast, calm } = want; want = null; busy = true;
  const im = pic(photo(x)), my = ++token;
  im.ready.then(ok => {
    // playing, each day blends slowly into the next like a time lapse (Darpan, 26 Oct 2026: 'C smooth time lapse
    // blending while playing, YES DO IT'); scrolling by hand stays quick
    const fade = still.matches ? 0 : calm ? 500 : playing ? Math.max(90, Math.round(900 / +$('speed').value)) : fast ? 90 : 160;
    document.documentElement.style.setProperty('--fade', fade + 'ms');
    facts(x);
    back.classList.remove('on', 'rest');
    back.nat = ok ? [im.naturalWidth, im.naturalHeight] : null; back.day = x;
    back.style.visibility = ok ? '' : 'hidden';
    back.src = im.src;
    back.alt = `${era === 'psm' ? 'Pramukh Swami Maharaj' : 'Mahant Swami Maharaj'} on ${longDate(x.day)}`;
    place(back, x, calm);
    return (back.decode ? back.decode() : Promise.resolve()).catch(() => {}).then(() => {
      if (my !== token) return;
      // the new day fades in on top of the old one, which stays until it is covered, so the blend never dims
      const old = front;
      back.style.zIndex = 2; old.style.zIndex = 1;
      back.classList.add('on'); [front, back] = [back, front];
      setTimeout(() => { if (old !== front) old.classList.remove('on'); }, fade);
      if (calm) { front.classList.add('rest'); sharpen(front, x); }
    });
  }).finally(() => {
    busy = false;
    if (want) return paint();
    clearTimeout(settle);
    settle = setTimeout(() => {
      if (playing || want || front.day !== list[idx]) return;
      front.classList.add('rest'); place(front, list[idx], true); sharpen(front, list[idx]);
    }, 900);
  });
}
// resting on a day, a big screen gets R2's bigger copy (l/, up to 2560 px) when the web copy is too small for it
function sharpen(img, x) {
  if (!x.path || Math.max(x.w, x.h) < 1199 || !img.nat) return;
  const fr = $('frame'), k = Math.min(fr.clientWidth / x.w, fr.clientHeight / x.h);
  if (k * x.w * (devicePixelRatio || 1) <= img.nat[0] * 1.15) return;
  const big = pic(r2('l', x));
  big.ready.then(ok => {
    if (!ok || img.day !== x || !img.classList.contains('rest') || img !== front) return;
    img.nat = [big.naturalWidth, big.naturalHeight]; img.src = big.src; place(img, x, true);
  });
}
function facts(x) {
  $('age').textContent = `Bapa aged ${ageOn(x.day)}`;
  $('date').textContent = x.to ? rangeDate(x.day, x.to) : longDate(x.day);
  $('place').textContent = x.place;
  $('cap').textContent = x.cap;
  $('cal').innerHTML = x.tithi ? `<b>${esc(x.tithi)}</b>${x.fest ? ' · ' + esc(x.fest) : ''}` : '';
  $('more').textContent = x.photos > 1 ? `See all ${x.photos} photos from this day` : 'See this day in Search';
  $('more').href = `/search/#date=${x.day}`;
  $('count').textContent = `Day ${list.indexOf(x) + 1} of ${list.length} with a close darshan`;
}

// Each year opens on its clearest close up of him looking straight at the camera (the day scored best by the same
// rules that chose every day's photo), not on its first day, with a short card saying what the year holds
// (Darpan, 28 Oct 2026: 'I don't like the first picture that appears when I select a year').
function yearsOf(l) {
  const m = new Map();
  l.forEach((x, i) => { const b = m.get(x.y); if (b === undefined || x.rank > l[b].rank) m.set(x.y, i); });
  return m;
}
function goYear(y) {
  const i = years.get(y);
  if (i === undefined) return;
  stop();
  intro(y);
  show(i, false, true);
}
function stepYear(d) {
  const ys = [...years.keys()], at = ys.indexOf(list[idx].y);
  if (ys[at + d] !== undefined) goYear(ys[at + d]);
}
function intro(y) {
  const xs = list.filter(x => x.y === y), n = new Map();
  for (const x of xs) if (x.place) n.set(x.place, (n.get(x.place) || 0) + 1);
  const a0 = ageOn(xs[0].day), a1 = ageOn(xs[xs.length - 1].day);
  $('iy').textContent = y;
  $('ia').textContent = a0 === a1 ? `Bapa aged ${a0}` : `Bapa aged ${a0} to ${a1}`;
  $('in').textContent = `${xs.length} ${xs.length === 1 ? 'day' : 'days'} of close darshan`;
  $('ip').textContent = [...n].sort((a, b) => b[1] - a[1]).slice(0, 3).map(p => p[0]).join(' · ');
  $('intro').classList.add('on'); introOn = true;
  clearTimeout(intro.t); intro.t = setTimeout(hideIntro, 1900);
}
// the chosen year's bubble fills with saffron from the left as the days move through that year (Darpan, 28 Oct
// 2026): half way through the year, half the bubble. A year cut short by the change of guru (2016) or by today
// counts only its own days.
function fill() {
  const x = list[idx], b = $('years').querySelector(`[data-y="${x.y}"]`);
  if (!b) return;
  const a = Math.max(Date.UTC(x.y, 0, 1) / DAYMS, list[0].t), z = Math.min(Date.UTC(x.y + 1, 0, 1) / DAYMS - 1, list[list.length - 1].t);
  b.style.setProperty('--p', (z > a ? Math.max(.04, Math.min(1, (x.t - a + 1) / (z - a + 1))) * 100 : 100).toFixed(1) + '%');
}
function hideIntro() { clearTimeout(intro.t); $('intro').classList.remove('on'); introOn = false; }
function markYear(y) {
  if (y === shownYear) return;
  shownYear = y;
  for (const b of $('years').children) {
    const on = +b.dataset.y === y;
    b.setAttribute('aria-pressed', on);
    if (!on) b.style.removeProperty('--p');
    b.classList.toggle('past', +b.dataset.y < y);   // the years gone by stay full, so the row reads as one progress bar (Darpan, 28 Oct 2026)
  }
}
function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }

// the day's photo: R2's own copy (photos.bapas-diary.com m/, the size its eyes were measured on), or for the first
// days made, a copy next to this page
const R2 = 'https://photos.bapas-diary.com/';
const r2 = (tier, x) => R2 + tier + '/' + x.path.split('/').map(encodeURIComponent).join('/');
function photo(x) { return x.path ? r2('m', x) : `p/${x.day}.jpg`; }
function setEra(e) {
  stop(); era = e; list = eras[e];
  for (const b of document.querySelectorAll('.tab')) b.setAttribute('aria-selected', b.dataset.era === e);
  front.classList.remove('on'); back.classList.remove('on');
  $('days').max = Math.max(0, list.length - 1);
  years = yearsOf(list); shownYear = 0;
  $('years').replaceChildren(...[...years.keys()].map(y => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'yr'; b.dataset.y = y; b.setAttribute('aria-label', y); b.onclick = () => goYear(y);
    b.innerHTML = `<span class="f">${y}</span><span class="s"><span class="q">'</span>${String(y).slice(2)}</span>`;
    return b;
  }));
  if (list.length) goYear(list[0].y);
  try { history.replaceState(null, '', '#' + e); } catch (_) {}
}

document.addEventListener('keydown', e => {
  if (e.target.closest('button,select,input')) return;
  if (e.key === ' ') { e.preventDefault(); toggle(); }
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { stop(); show(idx + (e.key === 'ArrowRight' ? 1 : -1)); }
  if (e.key === 'PageUp' || e.key === 'PageDown') { e.preventDefault(); stepYear(e.key === 'PageDown' ? 1 : -1); }
});

// playing through the days like a flip book
function toggle() { playing ? stop() : start(); }
function start() {
  if (idx >= list.length - 1) show(0);
  const tick = () => { if (idx >= list.length - 1) return stop(); show(idx + 1, true); };
  playing = setInterval(tick, 1000 / +$('speed').value);
  $('play').setAttribute('aria-pressed', 'true');
  $('play').textContent = '❚❚ Pause';
}
function stop() {
  if (!playing) return;
  clearInterval(playing); playing = null; $('play').textContent = '▶ Play'; $('play').setAttribute('aria-pressed', 'false');
  clearTimeout(settle);
  settle = setTimeout(() => { if (!playing && !busy && front.day === list[idx]) { front.classList.add('rest'); place(front, list[idx], true); sharpen(front, list[idx]); } }, 900);
}
$('play').onclick = toggle;
$('speed').oninput = () => { $('speedVal').textContent = `${$('speed').value} a second`; if (playing) { stop(); start(); } };
$('days').oninput = () => { stop(); show(+$('days').value, true); };
let roll = 0;   // scrolling over the photo moves a day for every notch, as fast or slow as the wheel turns
$('frame').addEventListener('wheel', e => {
  e.preventDefault(); stop();
  roll += Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  const n = Math.trunc(roll / 40);
  if (n) { roll -= n * 40; show(idx + n, true); }
}, { passive: false });
// on a phone, sliding a finger across the photo moves through the days too
let swipe = null;
$('frame').addEventListener('pointerdown', e => { if (e.pointerType === 'mouse') return; stop(); swipe = { x: e.clientX, n: 0 }; $('frame').setPointerCapture(e.pointerId); });
$('frame').addEventListener('pointermove', e => {
  if (!swipe) return;
  const n = Math.trunc((swipe.x - e.clientX) / 24);
  if (n !== swipe.n) { show(idx + n - swipe.n, true); swipe.n = n; }
});
for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) $('frame').addEventListener(t, () => { swipe = null; });
for (const b of document.querySelectorAll('.tab')) b.onclick = () => setEra(b.dataset.era);
// the photo takes the largest square that fits the space left between the title row and the controls
function fit() {
  const sl = $('slot'), fw = Math.floor(Math.min(sl.clientWidth, sl.clientHeight));
  $('frame').style.width = fw + 'px'; $('frame').style.height = fw + 'px';
}
fit();
const ro = new ResizeObserver(() => { fit(); if (front.day) place(front, front.day, front.classList.contains('rest')); }); ro.observe($('slot'));
setEra(location.hash === '#msm' ? 'msm' : 'psm');
</script>
