<style>
/* Layout: the whole photo lit in the middle like a darshan in a dim mandir, the day's facts either side, the years running underneath */
:root {
  --bg: #15100d; --panel: #201814; --line: #3b2d25; --ink: #f4e9dc; --muted: #b8a28c; --saffron: #ec8a2d; --glow: rgba(236,138,45,.18);
  --display: 'Marcellus', 'Iowan Old Style', Georgia, serif;
  --body: 'Mukta', 'Segoe UI', system-ui, sans-serif;
  --fade: 160ms;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--ink); margin: 0; height: 100%; }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
body { font-family: var(--body); font-size: 16px; line-height: 1.5; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 52px 10px; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }   /* 46px kept free for the shared site menu */
/* one screen: title row, the photo filling whatever height is left, the controls always on the bottom edge (Darpan, 24 Oct 2026) */
.wrap { flex: 1; min-height: 0; width: 100%; max-width: 1560px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.top, .note, .scrub { flex: none; }
.top { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); grid-template-areas: "psm title msm"; align-items: center; gap: 12px 24px; }
header { grid-area: title; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
#tab-psm { grid-area: psm; } #tab-msm { grid-area: msm; text-align: right; align-items: flex-end; }
@media (max-width: 900px) { .top { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "title title" "psm msm"; } #tab-msm { text-align: left; align-items: flex-start; } }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(24px, 3.6vw, 40px); line-height: 1; margin: 0; letter-spacing: .01em; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: 14px; }
.tab { font: inherit; text-align: left; color: var(--ink); background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 8px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.tab .who { font-family: var(--display); font-size: clamp(16px, 2.2vw, 24px); line-height: 1.15; }
.tab .yrs { font-size: 13px; color: var(--muted); }
.tab:hover { border-color: var(--saffron); }
.tab[aria-selected="true"] { color: var(--bg); background: var(--saffron); border-color: var(--saffron); }
.tab[aria-selected="true"] .yrs { color: var(--bg); opacity: .8; }
.tab:focus-visible, button:focus-visible, canvas:focus-visible, select:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; }
.note { font-size: 12.5px; color: var(--muted); text-align: center; margin: 0; }
.stage { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2.2fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); grid-template-areas: "left slot right"; gap: 8px 28px; align-items: center; }
.slot { grid-area: slot; height: 100%; min-height: 0; min-width: 0; display: flex; align-items: center; justify-content: center; }
.frame { position: relative; flex: none; overflow: hidden; background: radial-gradient(closest-side, var(--glow), transparent); }
.frame img { position: absolute; left: 0; top: 0; max-width: none; transform-origin: 0 0; opacity: 0; transition: opacity var(--fade) linear; box-shadow: 0 12px 40px -10px rgba(0,0,0,.7); }
.frame img.on { opacity: 1; }
.frame img.rest { transition: opacity var(--fade) linear, transform 1.4s ease-in-out; }
.eyes { position: absolute; inset: 0; pointer-events: none; }
.eyes i { position: absolute; top: var(--eye-y); width: 24px; height: 24px; margin: -12px 0 0 -12px; border: 1.5px solid rgba(255,255,255,.8); border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
.eyes::after { content: ""; position: absolute; left: 0; right: 0; top: var(--eye-y); border-top: 1px dashed rgba(255,255,255,.35); }
.info { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.info.l { grid-area: left; text-align: right; align-items: flex-end; }
.info.r { grid-area: right; }
.age { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--saffron); }
.date { font-family: var(--display); font-size: clamp(26px, 3.4vw, 38px); line-height: 1.1; margin: 0; text-wrap: balance; }
.place { font-size: 18px; margin: 0; }
.cap { font-size: 18px; font-weight: 300; margin: 0; max-width: 34em; }
.cal { font-size: 14.5px; color: var(--muted); margin: 0; }
.cal b { color: var(--ink); font-weight: 600; }
.more { align-self: start; text-decoration: none; font: inherit; font-weight: 600; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 16px; cursor: pointer; }
.more:hover { border-color: var(--saffron); }
.count { font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.scrub { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.bar .days { flex: 1 1 240px; min-width: 0; }
.zoom { display: inline-flex; gap: 8px; }
.btn { font: inherit; font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.btn[aria-pressed="true"] { border-color: var(--saffron); color: var(--saffron); }
.btn.play { min-width: 84px; font-weight: 600; }
select.btn { padding-right: 8px; }
canvas { display: block; width: 100%; height: 68px; border-radius: 8px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); touch-action: none; cursor: grab; }
canvas.drag { cursor: grabbing; }
.days { -webkit-appearance: none; appearance: none; width: 100%; height: 50px; margin: 0; background: transparent; cursor: pointer; touch-action: none; }
.days::-webkit-slider-runnable-track { height: 22px; border-radius: 11px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.days::-moz-range-track { height: 22px; border-radius: 11px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.days::-moz-range-progress { height: 22px; border-radius: 11px; background: var(--saffron); opacity: .55; }
.days::-webkit-slider-thumb { -webkit-appearance: none; width: 46px; height: 46px; margin-top: -13px; border-radius: 50%; background: var(--saffron); border: 4px solid var(--ink); box-shadow: 0 4px 14px rgba(0,0,0,.5); }
.days::-moz-range-thumb { width: 46px; height: 46px; border-radius: 50%; background: var(--saffron); border: 4px solid var(--ink); box-shadow: 0 4px 14px rgba(0,0,0,.5); }
.days:focus-visible { outline: 2px solid var(--saffron); outline-offset: 4px; border-radius: 12px; }
.speed { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.speed input { width: 120px; accent-color: var(--saffron); }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
@media (max-width: 900px) {
  .stage { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "slot slot" "left right"; gap: 8px 16px; align-items: start; }
  .info { gap: 4px; }
  .info.l { text-align: left; align-items: flex-start; }
  .age { font-size: 11px; } .date { font-size: 20px; } .place, .cap { font-size: 15px; } .cal { font-size: 13px; }
  .more { font-size: 14px; padding: 5px 12px; } .count { display: none; }
  .speed span { display: none; }
}
@media (max-height: 640px) { .sub, .note { display: none; } }
@media (max-width: 600px) {
  .sub, .note, .zoom, .speed { display: none; }
  .bar .days { order: 3; flex-basis: 100%; }
  canvas { height: 56px; }
  .tab .yrs { font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) { :root { --fade: 0ms; } .frame img.rest { transition: none; } }
</style>

<div class="wrap">
  <div class="top" role="tablist" aria-label="Guru">
    <header role="presentation">
      <h1>Bapa through the years</h1>
      <p class="sub">One close darshan for every day, his eyes always in the same place</p>
    </header>
    <button class="tab" role="tab" id="tab-psm" data-era="psm" aria-selected="true"><span class="who">Pramukh Swami Maharaj</span><span class="yrs">1999 to 13 August 2016</span></button>
    <button class="tab" role="tab" id="tab-msm" data-era="msm" aria-selected="false"><span class="who">Mahant Swami Maharaj</span><span class="yrs">13 August 2016 to today</span></button>
  </div>
  <p class="note" id="mocknote">For now this shows 1999 for Pramukh Swami Maharaj and 13 August to 31 December 2016 for Mahant Swami Maharaj. More years are being added.</p>

  <section class="stage">
    <div class="slot" id="slot">
      <div class="frame" id="frame" aria-live="polite">
        <img id="imgA" alt=""><img id="imgB" alt="">
        <div class="eyes" id="eyes" hidden><i id="eyeR"></i><i id="eyeL"></i></div>
      </div>
    </div>

    <div class="info l">
      <span class="age" id="age"></span>
      <h2 class="date" id="date"></h2>
      <p class="place" id="place"></p>
    </div>
    <div class="info r">
      <p class="cap" id="cap"></p>
      <p class="cal" id="cal"></p>
      <a class="more" id="more" href="/search/"></a>
      <span class="count" id="count"></span>
    </div>
  </section>

  <div class="scrub">
      <div class="bar">
        <button class="btn play" id="play" type="button">▶ Play</button>
        <label class="speed" for="speed">Speed <input type="range" id="speed" min="1" max="30" value="8"> <span id="speedVal">8 a second</span></label>
        <input class="days" type="range" id="days" min="0" max="0" value="0" aria-label="Move through the days">
        <span class="zoom">
        <button class="btn" id="zAll" type="button">All years</button>
        <button class="btn" id="zYear" type="button">Year</button>
        <button class="btn" id="zMonth" type="button">Month</button>
        <button class="btn" id="zOut" type="button" aria-label="Zoom out">−</button>
        <button class="btn" id="zIn" type="button" aria-label="Zoom in">+</button>
        </span>
        <button class="btn" id="eyeBtn" type="button" aria-pressed="false">Eye line</button>
      </div>
      <canvas id="tl" tabindex="0" aria-label="Timeline: drag left or right to move through the days" title="Drag the strip, scroll over the photo, or use the arrow keys. Pinch or use + and − to zoom; tap a year or month to jump to it."></canvas>
  </div>
</div>

<script>
const DAYS = /*DAYS*/[];
const BORN = { psm: '1921-12-07', msm: '1933-09-13' };
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WEEK = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAYMS = 864e5;
const tOf = d => Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10)) / DAYMS;
const dOf = t => new Date(t * DAYMS);

const eras = { psm: [], msm: [] };
for (const r of DAYS) eras[r[5]].push({ day: r[0], to: r[1], place: r[2], cap: r[3], photos: r[4], tithi: r[6], fest: r[7], eyes: r.slice(8, 12), span: r[12], w: r[13], h: r[14], t: tOf(r[0]) });
const EYE_X = .5, EYE_Y = .4, GAP = .15;    // where his eyes sit in the frame, and how big his face is (eyes to mouth, share of the frame's width)

const $ = id => document.getElementById(id);
const cv = $('tl'), cx = cv.getContext('2d');
let era = 'psm', list = eras.psm, idx = 0, center = 0, ppd = 1, playing = null, front = $('imgA'), back = $('imgB'), token = 0;
const thumbs = new Map();
let settle = 0;

function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function longDate(d) { const x = dOf(tOf(d)); return `${WEEK[x.getUTCDay()]} ${x.getUTCDate()} ${MONTHS[x.getUTCMonth()]} ${x.getUTCFullYear()}`; }
function rangeDate(a, b) {
  const [ya, ma, da] = [+a.slice(0, 4), +a.slice(5, 7) - 1, +a.slice(8)], [yb, mb, db] = [+b.slice(0, 4), +b.slice(5, 7) - 1, +b.slice(8)];
  if (ya === yb && ma === mb) return `${da} to ${db} ${MONTHS[mb]} ${yb}`;
  if (ya === yb) return `${da} ${MONTHS[ma]} to ${db} ${MONTHS[mb]} ${yb}`;
  return `${da} ${MONTHS[ma]} ${ya} to ${db} ${MONTHS[mb]} ${yb}`;
}
function ageOn(d) { const b = BORN[era]; let a = +d.slice(0, 4) - +b.slice(0, 4); if (d.slice(5) < b.slice(5)) a--; return a; }

// a close up framed on his face: the photo turned and sized so his eyes sit at (EYE_X, EYE_Y) every day, with the
// empty space around him left outside the frame (Darpan, 24 Oct 2026: 'the closest face picture ... and cropped the
// deadspace'); once the days stop moving it eases to lying straight (Darpan, 23 Oct 2026)
function place(img, x, rest) {
  const fr = $('frame'), W = fr.clientWidth, H = fr.clientHeight, ex = EYE_X * W, ey = EYE_Y * H;
  img.style.width = x.w + 'px'; img.style.height = x.h + 'px';
  const [rx, ry, lx, ly] = x.eyes, mx = (rx + lx) / 2, my = (ry + ly) / 2;
  const a = rest ? 0 : Math.atan2(ly - ry, lx - rx), c = Math.cos(a), s = Math.sin(a);
  const k = GAP * W / x.span;
  const A = k * c, B = -k * s, C = k * s, D = k * c;
  img.style.transform = `matrix(${A},${B},${C},${D},${ex - (A * mx + C * my)},${ey - (B * mx + D * my)})`;
  fr.style.setProperty('--eye-y', EYE_Y * 100 + '%');
  const g = Math.hypot(lx - rx, ly - ry) * k / 2;
  $('eyeR').style.left = (ex - g) + 'px'; $('eyeL').style.left = (ex + g) + 'px';
}

function show(i, fast) {
  if (!list.length) return;
  idx = Math.max(0, Math.min(list.length - 1, i));
  const x = list[idx], my = ++token;
  document.documentElement.style.setProperty('--fade', matchMedia('(prefers-reduced-motion: reduce)').matches ? '0ms' : (fast ? '90ms' : '160ms'));
  back.classList.remove('on', 'rest');
  place(back, x);
  clearTimeout(settle);
  settle = setTimeout(() => { if (!playing && my === token) { front.classList.add('rest'); place(front, x, true); } }, 900);
  back.src = `p/${x.day}.jpg`;
  back.alt = `${era === 'psm' ? 'Pramukh Swami Maharaj' : 'Mahant Swami Maharaj'} on ${longDate(x.day)}`;
  (back.decode ? back.decode() : Promise.resolve()).catch(() => {}).then(() => {
    if (my !== token) return;
    back.classList.add('on'); front.classList.remove('on'); [front, back] = [back, front];
  });
  $('age').textContent = `Bapa aged ${ageOn(x.day)}`;
  $('date').textContent = x.to ? rangeDate(x.day, x.to) : longDate(x.day);
  $('place').textContent = x.place;
  $('cap').textContent = x.cap;
  $('cal').innerHTML = x.tithi ? `<b>${esc(x.tithi)}</b>${x.fest ? ' · ' + esc(x.fest) : ''}` : '';
  $('more').textContent = x.photos > 1 ? `See all ${x.photos} photos from this day` : 'See this day in Search';
  $('more').href = `/search/#date=${x.day}`;
  $('count').textContent = `Day ${idx + 1} of ${list.length} with a close darshan`;
  $('days').value = idx;
  for (const k of [1, 2, 3, -1, -2]) { const y = list[idx + k]; if (y) new Image().src = `p/${y.day}.jpg`; }
  draw();
}
function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }

function nearest(t) {
  let lo = 0, hi = list.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (list[m].t < t) lo = m + 1; else hi = m; }
  return lo > 0 && t - list[lo - 1].t < list[lo].t - t ? lo - 1 : lo;
}
function span() { return [list[0].t - 3, list[list.length - 1].t + 3]; }
function W() { return cv.clientWidth; }
function minPpd() { const [a, b] = span(); return W() / (b - a); }
function clampView() {
  ppd = Math.max(minPpd(), Math.min(140, ppd));
  const [a, b] = span(), half = W() / 2 / ppd;
  center = b - a <= 2 * half ? (a + b) / 2 : Math.max(a + half, Math.min(b - half, center));
}
function follow() { // keep the chosen day in view without jumping the strip about
  const t = list[idx].t, half = W() / 2 / ppd;
  if (t < center - half * .8 || t > center + half * .8) center = t;
  clampView();
}

function draw() {
  const w = W(), h = cv.clientHeight, dpr = devicePixelRatio || 1;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx.clearRect(0, 0, w, h);
  if (!list.length) return;
  const ink = css('--ink'), muted = css('--muted'), line = css('--line'), saf = css('--saffron');
  const X = t => w / 2 + (t + .5 - center) * ppd, t0 = center - w / 2 / ppd, t1 = center + w / 2 / ppd;
  const y0 = dOf(t0).getUTCFullYear(), y1 = dOf(t1).getUTCFullYear();
  cx.font = `600 12px ${css('--body')}`; cx.textBaseline = 'middle';
  // years
  for (let y = y0; y <= y1; y++) {
    const a = X(Date.UTC(y, 0, 1) / DAYMS - .5), b = X(Date.UTC(y + 1, 0, 1) / DAYMS - .5);
    cx.fillStyle = line; cx.fillRect(Math.round(a), 0, 1, h);
    cx.fillStyle = ink; const lx = Math.max(a + 6, 6);
    if (lx < b - 36) cx.fillText(String(y), lx, 10);
  }
  // months
  const mw = 30 * ppd;
  if (mw > 14) {
    cx.font = `400 11px ${css('--body')}`;
    for (let y = y0; y <= y1; y++) for (let m = 0; m < 12; m++) {
      const a = X(Date.UTC(y, m, 1) / DAYMS - .5), b = X(Date.UTC(y, m + 1, 1) / DAYMS - .5);
      if (b < 0 || a > w) continue;
      if (m) { cx.fillStyle = line; cx.fillRect(Math.round(a), 19, 1, h - 19); }
      const name = mw > 80 ? MONTHS[m] : mw > 32 ? MONTHS[m].slice(0, 3) : MONTHS[m][0];
      cx.fillStyle = muted; const lx = Math.max(a + 5, 5);
      if (lx + cx.measureText(name).width < b - 2) cx.fillText(name, lx, 26);
    }
  }
  // days: thumbnails when there is room, otherwise a tick for each day with a close darshan
  const top = 36, th = h - top - 6, tw = th * .8;
  const i0 = Math.max(0, nearest(t0) - 1), i1 = Math.min(list.length - 1, nearest(t1) + 1);
  const room = ppd >= tw * .55;
  for (let i = i0; i <= i1; i++) {
    const x = X(list[i].t);
    if (room && i !== idx) {
      const im = thumb(list[i].day), ww = Math.min(tw, ppd - 3);
      if (im.complete && im.naturalWidth) { cx.globalAlpha = .7; cx.drawImage(im, 0, 0, im.naturalWidth, im.naturalHeight, x - tw / 2 + (tw - ww) / 2, top, ww, th); cx.globalAlpha = 1; }
      else { cx.fillStyle = line; cx.fillRect(x - ww / 2, top, ww, th); }
    } else if (!room) {
      cx.fillStyle = muted; cx.globalAlpha = .75; cx.fillRect(x - .5, top + 10, Math.max(1, Math.min(2, ppd * .6)), th - 20); cx.globalAlpha = 1;
    }
  }
  // the chosen day
  const sx = X(list[idx].t);
  if (room) { const im = thumb(list[idx].day); if (im.complete && im.naturalWidth) cx.drawImage(im, sx - tw / 2, top, tw, th); }
  cx.fillStyle = saf; cx.fillRect(Math.round(sx) - 1, top - 6, 3, th + 12);
  cx.beginPath(); cx.moveTo(sx - 6, top - 8); cx.lineTo(sx + 7, top - 8); cx.lineTo(sx + .5, top - 1); cx.fill();
}
function thumb(day) {
  let im = thumbs.get(day);
  if (!im) { im = new Image(); im.onload = () => requestAnimationFrame(draw); im.src = `f/${day}.jpg`; thumbs.set(day, im); }
  return im;
}

function setEra(e) {
  stop(); era = e; list = eras[e];
  for (const b of document.querySelectorAll('.tab')) b.setAttribute('aria-selected', b.dataset.era === e);
  ppd = 0; clampView(); center = list.length ? list[0].t : 0; clampView();
  front.classList.remove('on'); back.classList.remove('on');
  $('days').max = Math.max(0, list.length - 1);
  show(0);
  try { history.replaceState(null, '', '#' + e); } catch (_) {}
}

function zoomTo(days, t) { ppd = W() / days; if (t !== undefined) center = t; clampView(); draw(); }
function zoomBy(k, at) {
  const t = at === undefined ? center : center + (at - W() / 2) / ppd;
  ppd *= k; clampView();
  if (at !== undefined) { center = t - (at - W() / 2) / ppd; clampView(); }
  draw();
}

// dragging, scrolling and pinching the strip
const ptrs = new Map(); let dragged = 0, pinch = 0, downX = 0;
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, e.clientX); dragged = 0; downX = e.clientX;
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = Math.abs(a - b); }
  stop(); cv.classList.add('drag');
});
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const last = ptrs.get(e.pointerId); ptrs.set(e.pointerId, e.clientX);
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], d = Math.abs(a - b);
    if (pinch) zoomBy(d / pinch, (a + b) / 2 - cv.getBoundingClientRect().left);
    pinch = d; dragged = 99; return;
  }
  const dx = e.clientX - last; dragged += Math.abs(dx);
  center -= dx / ppd; clampView();
  const i = nearest(center); if (i !== idx) show(i, true); else draw();
});
function up(e) {
  ptrs.delete(e.pointerId); cv.classList.remove('drag'); if (ptrs.size < 2) pinch = 0;
  if (dragged < 5 && Math.abs(e.clientX - downX) < 5 && e.type === 'pointerup') tap(e);
}
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', e => {
  e.preventDefault(); stop();
  const r = cv.getBoundingClientRect();
  if (e.ctrlKey) { zoomBy(Math.exp(-e.deltaY * .01), e.clientX - r.left); return; }
  center += (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) / ppd; clampView();
  const i = nearest(center); if (i !== idx) show(i, true); else draw();
}, { passive: false });
function tap(e) {
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  const t = center + (x - W() / 2) / ppd, d = dOf(t), Y = d.getUTCFullYear(), M = d.getUTCMonth();
  if (y < 18) { const a = Date.UTC(Y, 0, 1) / DAYMS; zoomTo(368, a + 182); show(nearest(Math.max(a, list[0].t))); return; }
  if (y < 33 && 30 * ppd > 14) { const a = Date.UTC(Y, M, 1) / DAYMS; zoomTo(33, a + 15); show(nearest(a + .5)); return; }
  show(nearest(t)); follow(); draw();
}
cv.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); stop(); show(idx + (e.key === 'ArrowRight' ? 1 : -1)); follow(); draw(); }
  if (e.key === ' ') { e.preventDefault(); toggle(); }
});
document.addEventListener('keydown', e => {
  if (e.target === cv || e.target.closest('button,select')) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { stop(); show(idx + (e.key === 'ArrowRight' ? 1 : -1)); follow(); draw(); }
});

// playing through the days like a flip book
function toggle() { playing ? stop() : start(); }
function start() {
  if (idx >= list.length - 1) show(0);
  const tick = () => { if (idx >= list.length - 1) return stop(); show(idx + 1, true); follow(); draw(); };
  playing = setInterval(tick, 1000 / +$('speed').value);
  $('play').setAttribute('aria-pressed', 'true');
  $('play').textContent = '❚❚ Pause';
}
function stop() {
  if (!playing) return;
  clearInterval(playing); playing = null; $('play').textContent = '▶ Play';
  clearTimeout(settle);
  settle = setTimeout(() => { if (!playing && list[idx]) { front.classList.add('rest'); place(front, list[idx], true); } }, 900);
}
$('play').onclick = toggle;
$('speed').oninput = () => { $('speedVal').textContent = `${$('speed').value} a second`; if (playing) { stop(); start(); } };
$('days').oninput = () => { stop(); show(+$('days').value, true); follow(); draw(); };
let roll = 0;   // scrolling over the photo moves a day for every notch, as fast or slow as the wheel turns
$('frame').addEventListener('wheel', e => {
  e.preventDefault(); stop();
  roll += Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  const n = Math.trunc(roll / 40);
  if (n) { roll -= n * 40; show(idx + n, true); follow(); draw(); }
}, { passive: false });
$('zAll').onclick = () => { ppd = 0; clampView(); draw(); };
$('zYear').onclick = () => zoomTo(368, list[idx].t);
$('zMonth').onclick = () => zoomTo(33, list[idx].t);
$('zIn').onclick = () => zoomBy(1.8);
$('zOut').onclick = () => zoomBy(1 / 1.8);
$('eyeBtn').onclick = () => { const on = $('eyes').hidden; $('eyes').hidden = !on; $('eyeBtn').setAttribute('aria-pressed', on); };
for (const b of document.querySelectorAll('.tab')) b.onclick = () => setEra(b.dataset.era);
// the photo takes the largest 4:5 frame that fits the space left between the title row and the controls
function fit() {
  const sl = $('slot'), fw = Math.floor(Math.min(sl.clientWidth, sl.clientHeight * .8));
  $('frame').style.width = fw + 'px'; $('frame').style.height = Math.floor(fw / .8) + 'px';
}
fit();
const ro = new ResizeObserver(() => { fit(); clampView(); draw(); if (list[idx]) place(front, list[idx], front.classList.contains('rest')); }); ro.observe($('slot')); ro.observe($('tl'));
setEra(location.hash === '#msm' ? 'msm' : 'psm');
</script>
