<title>Bapa's Calendar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Arimo:wght@400;600&display=swap">
<style>
/* Layout: one endless ribbon of five week rows, months laid side by side from 1999 (left) to 2026 (right) */
:root{
  --maroon:#42101c; --maroon-deep:#160509; --gold-hi:#ffe296; --gold-lo:#ce9840;
  --ivory:#f8f2e4; --ivory-2:#eadfc8; --ink:#3a1a12; --muted:#c9a98a;
  --serif:"EB Garamond", Garamond, "Times New Roman", serif;
  --caps:Arimo, "Helvetica Neue", Arial, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:radial-gradient(120% 90% at 50% 0%, var(--maroon) 0%, var(--maroon-deep) 78%);background-color:var(--maroon-deep);color:var(--ivory);font-family:var(--serif);overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
header{padding-block:18px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-align:center;position:relative}
.kicker{font-family:var(--caps);font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
.mtitle{position:relative;height:clamp(44px,7.2vh,68px);margin-top:2px}
.mtitle span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(34px,6.2vh,58px);font-weight:500;line-height:1;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent;transition:opacity .7s ease, transform .7s ease;white-space:nowrap}
.mtitle span.out{opacity:0;transform:translateY(8px)}
.where{display:none;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px 0;min-height:44px;margin-top:4px;transition:opacity .5s;font-size:clamp(19px,2.9vh,27px)}
.where .lead{font-style:italic;color:var(--ivory-2);margin-right:12px}
.stay{display:inline-flex;align-items:baseline;gap:9px;padding:5px 16px 6px;border-radius:24px;border:1.5px solid var(--gold-lo);background:rgba(206,152,64,.12);color:var(--gold-hi);font-weight:600;transition:background .25s,color .25s,border-color .25s}
.stay small{font-family:var(--caps);font-size:clamp(10px,1.4vh,12px);font-weight:400;letter-spacing:.12em;color:var(--ivory-2);text-transform:uppercase}
.stay.on{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:var(--maroon-deep);border-color:transparent}
.stay.on small{color:var(--maroon)}
.hop{width:34px;height:1px;background:rgba(206,152,64,.6);position:relative;margin:0 2px}
.hop:after{content:'';position:absolute;right:-1px;top:-3px;border:3.5px solid transparent;border-left-color:rgba(206,152,64,.8);border-right:0}
.track{flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;cursor:grab;position:relative;outline:none}
.track::-webkit-scrollbar{display:none}
.track.drag{cursor:grabbing}
.ribbon{height:100%;display:flex;align-items:stretch;gap:clamp(28px,4vw,64px);padding-inline:max(16px,30vw);padding-block:4px 10px;width:max-content}
.month{--g:clamp(5px,.9vh,10px);height:100%;width:calc(7 * var(--cw) + 6 * var(--g));display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:var(--jh) 26px repeat(5,minmax(0,1fr));gap:var(--g);transition:opacity .25s linear,grid-template-columns .45s cubic-bezier(.3,.7,.2,1),grid-template-rows .45s cubic-bezier(.3,.7,.2,1)}
.wkd{font-family:var(--caps);font-size:clamp(12px,1.7vh,15px);font-weight:600;letter-spacing:.22em;color:var(--muted);text-align:center;align-self:end;text-transform:uppercase}
.empty{min-width:0;border:1px dashed rgba(234,223,200,.13);border-radius:3px}
.card{position:relative;min-height:0;min-width:0;text-decoration:none;background:linear-gradient(170deg,var(--ivory),var(--ivory-2));border-radius:3px;padding:4px 4px 0;display:flex;flex-direction:column;color:var(--ink);
  box-shadow:0 6px 16px rgba(0,0,0,.42),0 1px 0 rgba(255,255,255,.4) inset;cursor:pointer;will-change:transform;border:0;text-align:center;font:inherit}
.card:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
.card:hover,.card:focus-visible{z-index:2;box-shadow:0 0 0 2px var(--gold-hi),0 0 18px 4px rgba(255,214,120,.55),0 0 42px 10px rgba(206,152,64,.35),0 6px 16px rgba(0,0,0,.42)}
.card{transition:box-shadow .3s ease}
.win{position:relative;flex:1;min-height:0;overflow:hidden;background:transparent}
.win img{position:absolute;top:-1px;left:-5%;width:110%;max-width:none;height:calc(100% + 2px);object-fit:cover;will-change:transform;transition:filter .3s}
.card:hover .win img{filter:brightness(1.06)}
.num{position:absolute;left:4px;top:2px;font-size:clamp(14px,2.5vh,22px);font-weight:600;color:var(--ivory);text-shadow:0 1px 4px rgba(0,0,0,.75);line-height:1}
.wrapmark{position:absolute;right:4px;top:4px;font-family:var(--caps);font-size:8px;letter-spacing:.12em;background:rgba(22,5,9,.7);color:var(--gold-hi);padding:2px 4px;border-radius:2px}
.fest{position:absolute;left:0;right:0;bottom:0;padding:12px 5px 4px;text-align:center;font-family:var(--caps);font-size:clamp(7.5px,1.15vh,10px);font-weight:600;letter-spacing:.06em;color:var(--gold-hi);
  background:linear-gradient(0deg,rgba(22,5,9,.92),rgba(22,5,9,0));line-height:1.2;text-wrap:balance}
.tithi{font-family:var(--caps);font-size:clamp(7px,1.05vh,9.5px);letter-spacing:.1em;text-transform:uppercase;color:#7a4e36;padding:3px 1px 4px;white-space:nowrap;overflow:hidden;text-align:center}
.pin{position:absolute;left:50%;top:calc(clamp(14px,2.5vh,22px) + 8px);transform:translateX(-50%);max-width:84%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--caps);font-size:clamp(7.5px,1.1vh,10px);font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:var(--maroon);color:var(--gold-hi);padding:2px 6px 2px 5px;border-radius:9px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin:before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--gold-hi);margin-right:4px;vertical-align:1px}
.card.blank .win{background:radial-gradient(circle at 50% 40%,#fbf6ea,#e9dcc0);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px;gap:2px;container-type:size}
.card.blank .tithi{visibility:hidden}
.bnum{font-size:min(46cqh,40cqw);font-weight:600;line-height:.9;color:var(--maroon)}
.bwd{font-family:var(--caps);font-size:min(9cqh,7.5cqw);letter-spacing:.2em;text-transform:uppercase;color:#9a6a40}
.bind{font-size:min(15cqh,11.5cqw);font-weight:500;line-height:1.05;color:var(--ink);text-wrap:balance}
.gap{align-self:center;width:clamp(150px,18vw,220px);text-align:center;color:var(--ivory-2);font-size:16px;line-height:1.35;text-wrap:balance;padding:18px;border-top:1px solid rgba(206,152,64,.5);border-bottom:1px solid rgba(206,152,64,.5)}
.gap b{display:block;font-family:var(--caps);font-size:10px;letter-spacing:.3em;color:var(--gold-lo);margin-bottom:8px;font-weight:600}
footer{padding-block:6px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rail{position:relative;max-width:980px;margin:0 auto;height:34px}
.rail .line{position:absolute;left:0;right:0;top:12px;height:1px;background:linear-gradient(90deg,transparent,rgba(206,152,64,.55) 6%,rgba(206,152,64,.55) 94%,transparent)}
.yr{position:absolute;top:0;transform:translateX(-50%);background:none;border:0;padding:0;font-family:var(--caps);font-size:9px;color:rgba(201,169,138,.45);display:flex;flex-direction:column;align-items:center;gap:5px;cursor:default}
.yr i{width:5px;height:5px;border-radius:50%;background:rgba(201,169,138,.35);margin-top:10px}
.yr.has{color:var(--ivory-2);cursor:pointer}
.yr.has i{background:var(--gold-lo);width:7px;height:7px;margin-top:9px}
.yr.on i{background:var(--gold-hi);box-shadow:0 0 0 4px rgba(255,226,150,.18)}
.yr.on{color:var(--gold-hi)}
.yr span{display:none}
.yr.label span,.yr.has span{display:block}
.month{--jh:clamp(46px,6.8vh,64px)}
/* journey band: where Bapa was, as a timeline running along the top of each month */
.journey{grid-area:1/1/2/-1;display:flex;min-width:0}
.seg{position:relative;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 6px 14px;text-align:center}
.seg:before{content:'';position:absolute;left:0;right:0;bottom:6px;height:2px;background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi),var(--gold-lo));border-radius:2px;transition:height .25s,bottom .25s,box-shadow .25s}
.seg:after{content:'';position:absolute;left:-6px;bottom:1px;width:12px;height:12px;border-radius:50%;background:var(--gold-hi);box-shadow:0 0 0 3px var(--maroon-deep),0 0 10px rgba(255,214,120,.6)}
.seg .lab{position:sticky;left:20px;right:20px;align-self:center;display:flex;flex-direction:column;align-items:center;max-width:100%;min-width:0}
.seg .pn{max-width:100%;font-size:clamp(17px,2.7vh,25px);font-weight:600;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent;transition:filter .25s}
.seg .pd{font-family:var(--caps);font-size:clamp(8.5px,1.2vh,11px);letter-spacing:.14em;text-transform:uppercase;color:var(--ivory-2);white-space:nowrap;overflow:hidden;max-width:100%;margin-top:2px}
.seg.unk:before{background:repeating-linear-gradient(90deg,rgba(206,152,64,.45) 0 5px,transparent 5px 10px);height:1px;bottom:7px}
.seg.unk:after{display:none}
.seg.on:before{height:4px;bottom:5px;box-shadow:0 0 12px rgba(255,214,120,.7)}
.seg.on .pn{filter:drop-shadow(0 0 8px rgba(255,214,120,.55))}
.ctrl{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:2px}
.play{display:inline-flex;align-items:center;gap:9px;border:0;cursor:pointer;padding:7px 16px 7px 8px;border-radius:22px;background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:var(--maroon-deep);font-family:var(--caps);font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;box-shadow:0 3px 12px rgba(0,0,0,.4)}
.play:focus-visible,.spd button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
.play i{width:24px;height:24px;border-radius:50%;background:var(--maroon-deep);display:grid;place-items:center}
.play svg{width:10px;height:10px;fill:var(--gold-hi)}
.play.on{box-shadow:0 0 0 3px rgba(255,226,150,.25),0 0 18px rgba(255,214,120,.45)}
.spd{display:inline-flex;border:1px solid rgba(206,152,64,.5);border-radius:18px;overflow:hidden}
.spd button{border:0;background:none;color:var(--ivory-2);font-family:var(--caps);font-size:10px;letter-spacing:.16em;text-transform:uppercase;padding:7px 11px;cursor:pointer}
.spd button[aria-pressed="true"]{background:rgba(206,152,64,.28);color:var(--gold-hi)}
.hint{text-align:center;font-family:var(--caps);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:4px}
@media (prefers-reduced-motion:reduce){.mtitle span,.month{transition:none}}
</style>

<div class="app">
  <header>
    <div class="kicker">Darshan through the years</div>
    <div class="mtitle" aria-live="polite"><span id="t0"></span><span id="t1" class="out"></span></div>
    <div class="where" id="where"></div>
  </header>
  <div class="track" id="track" tabindex="0" aria-label="Calendar of days, scroll sideways">
    <div class="ribbon" id="ribbon"></div>
  </div>
  <footer>
    <div class="rail" id="rail"><div class="line"></div></div>
    <div class="ctrl"><button class="play" id="play" aria-pressed="false"></button><div class="spd" role="group" aria-label="Speed"><button data-s="22" aria-pressed="false">Slow</button><button data-s="40" aria-pressed="true">Gentle</button><button data-s="85" aria-pressed="false">Faster</button></div></div>
    <div class="hint">Scroll or swipe sideways · tap a day to open its gallery · space bar plays</div>
  </footer>
</div>

<script>
__DATA__
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const ribbon=document.getElementById('ribbon'), track=document.getElementById('track');
const keys=Object.keys(DATA);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const monthEls=[], cards=[];

function sizeCols(){
  const h=track.clientHeight-14, g=Math.max(5,Math.min(10,innerHeight*.009));
  const jh=Math.max(46,Math.min(64,innerHeight*.068)); const rh=(h-26-jh-6*g)/5; const cw=Math.round(rh*1.08);
  document.documentElement.style.setProperty('--cw',cw+'px');
}

function stays(days){
  const pl=days.map(d=>d.place||null);
  for(let i=0;i<pl.length;i++) if(!pl[i]){let a=i-1,b=i;while(b<pl.length&&!pl[b])b++; if(a>=0&&b<pl.length&&pl[a]===pl[b]) for(let j=i;j<b;j++)pl[j]=pl[a]; i=b}
  const out=[]; pl.forEach((p,i)=>{if(!p)return; const l=out[out.length-1]; if(l&&l.p===p&&l.to===i) l.to=i+1; else out.push({p,from:i+1,to:i+1})});
  return {pl,out};
}
keys.forEach((k,mi)=>{
  if(mi>0){
    const gap=el('div','gap','<b>TWO YEARS ON</b>In the full page every month from 1999 to 2026 sits here, side by side, so you can scroll straight through.');
    ribbon.appendChild(gap);
  }
  const [y,m]=k.split('-').map(Number), M=DATA[k];
  const first=new Date(y,m-1,1).getDay();
  const st=stays(M.days); M.stays=st.out;
  const mo=el('div','month'); mo.dataset.k=k;
  const jr=el('div','journey'), mn=MONTHS[m-1].slice(0,3), segs=[];
  st.pl.forEach((p,i)=>{const l=segs[segs.length-1]; if(l&&l.p===p) l.n++; else segs.push({p,from:i+1,n:1})});
  segs.forEach(s=>{const to=s.from+s.n-1, x=el('div','seg'+(s.p?'':' unk'));
    x.style.flex=`${s.n} 1 0`; x.dataset.p=s.p||'';
    if(s.p){x.title=`Bapa was in ${s.p}, ${s.from}${s.n>1?' to '+to:''} ${MONTHS[m-1]}`;
      x.innerHTML=`<span class="lab"><span class="pn">${esc(s.p)}</span><span class="pd">${s.n>1?s.from+' to '+to:s.from} ${mn}</span></span>`}
    jr.appendChild(x)});
  mo.appendChild(jr);
  WD.forEach((w,c)=>{const x=el('div','wkd',w);x.style.gridArea=`2/${c+1}`;mo.appendChild(x)});

  const grid=[...Array(35)].map(()=>null);
  M.days.forEach((d,i)=>{let p=first+d.d-1, wrapped=false; if(p>=35){p-=35;wrapped=true}
    grid[p]={...d,wrapped,pl:st.pl[i],newpl:M.stays.length>1&&st.pl[i]&&st.pl[i]!==(i?st.pl[i-1]:null)}});
  for(let r=0;r<5;r++) for(let c=0;c<7;c++){
    const d=grid[r*7+c]; let b;
    if(!d){b=el('div','empty')}
    else{
      b=el('a','card'+(d.ph.length?'':' blank'));
      b.href=`https://bapas-diary.com/search/#date=${d.date}`; b.target='_blank'; b.rel='noopener'; b.draggable=false;
      b.setAttribute('aria-label',`${d.wd} ${d.d} ${MONTHS[m-1]} ${y}, ${d.ind}. Open this day's gallery`);
      const win=el('div','win');
      if(d.ph.length){
        const im=new Image(); im.src=d.ph[0].src; im.alt=d.ph[0].cap; im.loading='lazy'; im._ph=d.ph[0]; im.style.objectPosition=d.ph[0].pos; im.draggable=false; win.appendChild(im);
        win.appendChild(el('div','num',d.d));
      } else {
        win.appendChild(el('div','bnum',d.d)); win.appendChild(el('div','bwd',esc(d.wd)));
        win.appendChild(el('div','bind',esc(d.ind)));
      }
      if(d.wrapped) win.appendChild(el('div','wrapmark','31ST'));
      const f=[...d.fest,...d.notes.filter(n=>!/^(Fast|Sud|Vad) ?\w*$/.test(n))];
      if(f.length) win.appendChild(el('div','fest',esc(f.join(' · '))));
      b.appendChild(win);
      b.appendChild(el('div','tithi',esc(d.ind)));
      b.addEventListener('click',e=>{if(dragMoved)e.preventDefault()});
      b.addEventListener('mouseenter',()=>grow(mo,r,c,d.pl));
      b.addEventListener('focus',()=>grow(mo,r,c,d.pl));
      b._row=r; cards.push(b);
    }
    b.style.gridArea=`${r+3}/${c+1}`; mo.appendChild(b);
  }
  mo.addEventListener('mouseleave',()=>grow(mo,-1,-1,null));
  ribbon.appendChild(mo); monthEls.push(mo);
});

/* hover: the day under the mouse glows gold (CSS) and its stay lights up */
function grow(mo,r,c,pl){
  mo.querySelectorAll('.seg').forEach(s=>s.classList.toggle('on',pl!=null&&s.dataset.p===pl));
}

/* year rail 1999 to 2026 */
const rail=document.getElementById('rail'); const have=new Set(keys.map(k=>+k.slice(0,4)));
for(let y=1999;y<=2026;y++){
  const b=el('button','yr'+(have.has(y)?' has':'')+((y-1999)%3===0||y===2026?' label':''),`<i></i><span>${y}</span>`);
  b.style.left=((y-1999)/27*100)+'%'; b.dataset.y=y; b.tabIndex=have.has(y)?0:-1;
  b.title=have.has(y)?`Go to ${y}`:`${y} comes in the full page`;
  if(have.has(y)) b.onclick=()=>{const mo=monthEls.find(e=>e.dataset.k.startsWith(y));track.scrollTo({left:mo.offsetLeft-(track.clientWidth-mo.offsetWidth)/2,behavior:reduce?'auto':'smooth'})};
  rail.appendChild(b);
}

/* month title cross fade */
let cur=null, flip=0;
const t=[document.getElementById('t0'),document.getElementById('t1')], where=document.getElementById('where');
function setMonth(k){
  if(k===cur)return; cur=k; const [y,m]=k.split('-').map(Number);
  const nxt=t[1-flip], old=t[flip]; nxt.textContent=`${MONTHS[m-1]} ${y}`; nxt.classList.remove('out'); old.classList.add('out'); flip=1-flip;
  where.style.opacity=0; setTimeout(()=>{const S=DATA[k].stays, mn=MONTHS[m-1].slice(0,3);
    where.innerHTML='<span class="lead">Bapa was in</span>'+S.map((s,i)=>(i?'<span class="hop"></span>':'')+`<span class="stay" data-p="${esc(s.p)}">${esc(s.p)} <small>${s.from===s.to?s.from+' '+mn:s.from+' to '+s.to+' '+mn}</small></span>`).join('');
    where.style.opacity=1},250);
  rail.querySelectorAll('.yr').forEach(b=>b.classList.toggle('on',+b.dataset.y===y));
}
const listJoin=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];

/* scroll motion: months fade by distance, frames lag behind the scroll, photos drift inside frames */
let last=track.scrollLeft, vel=0, ticking=false;
function frame(){
  const W=track.clientWidth, mid=track.scrollLeft+W/2;
  vel+= (track.scrollLeft-last-vel)*.25; last=track.scrollLeft;
  let best=null,bd=1e9;
  monthEls.forEach(mo=>{
    const c=mo.offsetLeft+mo.offsetWidth/2, dist=Math.abs(c-mid);
    if(dist<bd){bd=dist;best=mo}
    const edge=Math.max(0,dist-mo.offsetWidth/2);
    mo.style.opacity=Math.max(.28,1-edge/(W*.55)).toFixed(3);
  });
  if(best)setMonth(best.dataset.k);
  if(!reduce){
    const lag=Math.max(-22,Math.min(22,-vel*.9));
    for(const c of cards){
      const r=c.getBoundingClientRect(); if(r.right<-50||r.left>W+50)continue;
      const off=(r.left+r.width/2-W/2)/W;
      c.style.transform=`translateX(${(lag*(1+c._row*.18)).toFixed(1)}px) rotate(${(lag*.04).toFixed(2)}deg)`;
      const im=c.querySelector('img'); if(im) im.style.transform=`translateX(${(-off*4).toFixed(2)}%)`;
    }
  }
  if(Math.abs(vel)>.05||ticking){ticking=false;requestAnimationFrame(frame)} else vel=0;
}
const kick=()=>{if(!ticking){ticking=true;requestAnimationFrame(frame)}};
track.addEventListener('scroll',kick,{passive:true});
track.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){track.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
track.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){track.scrollBy({left:200,behavior:'smooth'})}if(e.key==='ArrowLeft'){track.scrollBy({left:-200,behavior:'smooth'})}});
let down=null, dragMoved=false;
track.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;down={x:e.clientX,s:track.scrollLeft};dragMoved=false});
addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-down.x;if(Math.abs(dx)>4){dragMoved=true;track.classList.add('drag')}track.scrollLeft=down.s-dx});
addEventListener('pointerup',()=>{down=null;track.classList.remove('drag');setTimeout(()=>dragMoved=false,0)});

/* place each photo so Bapa's whole head and shoulders stay inside the frame */
function fitAll(){
  document.querySelectorAll('.win img').forEach(im=>{
    const ph=im._ph; if(!ph||!ph.f||!ph.ar)return;
    const w=im.parentNode.clientWidth*1.10, h=im.parentNode.clientHeight+2; if(!w||!h)return;
    const s=Math.max(w/ph.ar,h), dw=ph.ar*s, dh=s, [fx,fy,fw,fh]=ph.f;
    const top=Math.max(0,fy-.6*fh)*dh, bot=Math.min(1,fy+fh*1.3)*dh;
    let oy=bot-top>h? top-4 : (top+bot)/2-h/2; oy=Math.max(0,Math.min(dh-h,oy));
    let ox=(fx+fw/2)*dw-w/2; ox=Math.max(0,Math.min(dw-w,ox));
    im.style.objectPosition=`${dw-w>1?(ox/(dw-w)*100).toFixed(1):50}% ${dh-h>1?(oy/(dh-h)*100).toFixed(1):50}%`;
  });
}
/* play: glide slowly through the days; any touch, wheel or drag pauses it */
const playBtn=document.getElementById('play'), PLAY_ICON='<svg viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z"/></svg>', PAUSE_ICON='<svg viewBox="0 0 10 10"><path d="M1.5 1h2.5v8H1.5zM6 1h2.5v8H6z"/></svg>';
let playing=false, speed=40, pos=0, lastT=0;
function setPlay(on){
  playing=on; playBtn.classList.toggle('on',on);
  playBtn.innerHTML=`<i>${on?PAUSE_ICON:PLAY_ICON}</i>${on?'Pause':'Play'}`;
  playBtn.setAttribute('aria-pressed',on);
  if(on){ if(track.scrollLeft>=track.scrollWidth-track.clientWidth-2) track.scrollLeft=0; pos=track.scrollLeft; lastT=0; requestAnimationFrame(step)}
}
function step(t){
  if(!playing)return;
  if(lastT){pos+=speed*Math.min(.1,(t-lastT)/1000); track.scrollLeft=pos;
    if(pos>=track.scrollWidth-track.clientWidth-1){setPlay(false);return}}
  lastT=t; requestAnimationFrame(step);
}
playBtn.onclick=()=>setPlay(!playing);
document.querySelectorAll('.spd button').forEach(b=>b.onclick=()=>{
  speed=+b.dataset.s; document.querySelectorAll('.spd button').forEach(x=>x.setAttribute('aria-pressed',x===b)); if(!playing)setPlay(true)});
['wheel','pointerdown','touchstart'].forEach(ev=>track.addEventListener(ev,()=>{if(playing)setPlay(false)},{passive:true}));
addEventListener('keydown',e=>{if(e.code==='Space'&&!e.target.closest('button,a')){e.preventDefault();setPlay(!playing)}});
setPlay(false);

sizeCols(); fitAll(); addEventListener('resize',()=>{sizeCols();fitAll();kick()});
requestAnimationFrame(()=>{track.scrollLeft=0;kick();});
</script>
