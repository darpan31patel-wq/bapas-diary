<!doctype html>
<html lang="en">
<!-- One tap yes for the family group (Darpan, 22 Nov 2026: "when I see the picture in the preview window at 10, then I need an
     easier way for me to approve it for the family group. Right now, the dashboard just really isn't doing it for me").
     23 Nov 2026: with no yes by 2pm the special picture "doesnt go out to family"; the daily picture goes as always.
     Made for his phone. Shows the day's daily picture and special picture from the Studio packs, the words under them, and
     one big Approve. The yes is kept by functions/darpan/api/approve.js; the 2pm send reads /approved.json.
     Behind the /darpan/ password like the rest of the Studio. ?date=YYYY-MM-DD looks at another day. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1b0a0e">
<title>Today's 2pm · Bapa's Diary Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600;700&family=Arimo:wght@400;700&display=swap">
<style>
:root { --bg:#1b0a0e; --panel:#26111a; --panel-2:#321722; --line:#4a2532; --fg:#f4ead6; --muted:#b99e8a; --gold:#e9be6e; --serif:"EB Garamond",Georgia,serif; --sans:"Arimo",Arial,sans-serif; color-scheme: dark }
* { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 var(--sans); padding-bottom: env(safe-area-inset-bottom, 0px) }
.wrap { max-width: 560px; margin: 0 auto }
.top { padding: max(16px, env(safe-area-inset-top, 0px)) 16px 10px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:baseline; gap:10px }
.brand { font:700 19px var(--serif); color:var(--gold) } .when { color:var(--muted); font-size:13px; margin-top:2px }
.top a { color:var(--gold); font-size:13px; font-weight:700; text-decoration:none; white-space:nowrap }
h1 { font:700 28px/1.15 var(--serif); margin:16px 16px 4px } .sub { margin:0 16px 12px; color:var(--muted); font-size:14px }
.card { margin:12px 16px; background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden }
.card img { display:block; width:100%; height:auto; background:var(--panel-2); min-height:120px }
.card.off img { opacity:.35; filter: grayscale(.7) }
.row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px }
.row b { font:700 15px var(--sans) } .row small { display:block; color:var(--muted); font-size:12.5px }
.tog { flex:none; font:700 13px var(--sans); border-radius:999px; padding:9px 13px; border:1px solid var(--gold); background:var(--gold); color:#2a0d14; cursor:pointer }
.tog.off { background:transparent; color:var(--muted); border-color:var(--line) }
.always { flex:none; font-size:12.5px; color:var(--muted) }
.wa { margin:10px 16px; background:#0b3b2c; color:#e9f5ee; border-radius:12px 12px 12px 2px; padding:10px 12px; font-size:14px; white-space:pre-wrap; overflow-wrap:anywhere }
.walabel { margin:16px 16px 0; color:var(--muted); font-size:12.5px; text-transform:uppercase; letter-spacing:.12em; font-weight:700 }
.hint { margin:4px 16px 0; color:var(--muted); font-size:12.5px }
.go { position:sticky; bottom:0; background:linear-gradient(transparent, var(--bg) 22%); padding:22px 16px calc(18px + env(safe-area-inset-bottom, 0px)) }
.big { width:100%; border:0; border-radius:14px; padding:17px; font:700 18px var(--sans); background:linear-gradient(#f3d08a,#d9a650); color:#2a0d14; box-shadow:0 6px 20px rgba(0,0,0,.4); cursor:pointer }
.big:disabled { opacity:.6 }
.link { display:block; width:100%; background:none; border:0; text-align:center; color:var(--gold); margin-top:12px; font:700 14px var(--sans); text-decoration:none; cursor:pointer }
.done { margin:16px; padding:18px; border-radius:14px; background:rgba(233,190,110,.1); border:1px solid var(--gold); text-align:center }
.done .tick { font-size:40px } .done p { margin:6px 0 0; color:var(--muted) } .done b { font:700 22px var(--serif); color:var(--gold) }
.warn { margin:12px 16px; padding:12px 14px; border-radius:12px; background:rgba(224,138,122,.12); border:1px solid #7a3b33; color:#f2c2b8; font-size:14px }
.msg { margin:40px 16px; color:var(--muted); text-align:center }
</style>
<div class="wrap" id="app"><p class="msg">Getting today’s pictures…</p></div>
<script>
const PACKS = 'https://photos.bapas-diary.com/studio/packs/';
const LATE = '13:50';   // after this a yes no longer changes today's 2pm send
const londonDay = () => new Date().toLocaleDateString('en-CA', { timeZone: 'Europe/London' });
const londonTime = () => new Date().toLocaleTimeString('en-GB', { timeZone: 'Europe/London', hour: '2-digit', minute: '2-digit' });
const q = new URLSearchParams(location.search), DATE = /^\d{4}-\d\d-\d\d$/.test(q.get('date') || '') ? q.get('date') : londonDay();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const nice = d => new Date(d + 'T12:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
const at = iso => iso ? new Date(iso).toLocaleTimeString('en-GB', { timeZone: 'Europe/London', hour: '2-digit', minute: '2-digit' }) : '';
const app = document.getElementById('app');
let day = null, sp = null, ok = { approved: false, special: false }, keep = true, busy = false, err = '';

async function json(u, o) { const r = await fetch(u, Object.assign({ cache: 'no-store' }, o)); if (!r.ok) throw new Error(r.status); return r.json() }
async function load() {
  const idx = await json(PACKS + 'index.json').catch(() => ({ days: [], specials: [] }));
  [day, sp] = await Promise.all([
    (idx.days || []).includes(DATE) ? json(`${PACKS}day/${DATE}/pack.json`).catch(() => null) : null,
    (idx.specials || []).includes(DATE) ? json(`${PACKS}special/${DATE}/pack.json`).catch(() => null) : null]);
  ok = await json('../api/approve?date=' + DATE).catch(() => ({ approved: false, special: false, store: false }));
  keep = ok.approved ? ok.special : true;
  draw();
}
async function save(approved) {
  busy = true; err = ''; draw();
  try { ok = await json('../api/approve', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ date: DATE, approved, special: keep }) }) }
  catch (e) { err = 'That did not save, so nothing has changed. Check the signal and press again.' }
  busy = false; draw(); scrollTo({ top: 0, behavior: 'smooth' });
}
function draw() {
  const today = DATE === londonDay(), late = today && londonTime() >= LATE, past = DATE < londonDay();
  const img = (kind, p) => `${PACKS}${kind}/${DATE}/${p.real || 'real.jpg'}?v=${encodeURIComponent(p.made || '')}`;
  const words = [day && day.whatsapp, sp && keep && sp.whatsapp].filter(Boolean).join('\n\n');
  const head = ok.approved
    ? `<div class="done"><div class="tick">✅</div><b>Approved for the family group</b><p>At ${esc(at(ok.at))}. ${ok.special ? (sp ? 'The daily picture and the special picture go at 2pm, as below.' : 'The daily picture goes at 2pm.') : 'The daily picture goes at 2pm. The special picture stays out today.'}${today && !late ? ' You can still change this until 1:50pm.' : ''}</p></div>`
    : `<h1>${today ? 'Today’s 2pm' : nice(DATE)}</h1><p class="sub">${sp ? 'This is what the family group gets. The special picture only goes if you approve it.' : 'There is no special picture for this day, so only the daily picture goes, as always.'}</p>`;
  app.innerHTML = `<div class="top"><div><div class="brand">Bapa’s Diary Studio</div><div class="when">${esc(nice(DATE))} · ${past ? 'already sent' : 'goes to the family group at 2pm'}</div></div><a href="../">Studio ›</a></div>
    ${err ? `<div class="warn">${esc(err)}</div>` : ''}
    ${ok.store === false ? '<div class="warn">The approval store is not set up on the website yet, so a yes cannot be kept.</div>' : ''}
    ${late && !ok.approved && sp ? '<div class="warn">It is after 1:50pm, so today’s special picture stays out. The daily picture goes as always.</div>' : ''}
    ${head}
    ${day ? `<div class="card"><img src="${img('day', day)}" alt="The daily picture for ${esc(nice(DATE))}"><div class="row"><div><b>Daily picture</b><small>${esc(day.title || '')}</small></div><span class="always">Goes as always</span></div></div>` : '<p class="hint">The daily picture for this day is not in the Studio yet.</p>'}
    ${sp ? `<div class="card${keep ? '' : ' off'}"><img src="${img('special', sp)}" alt="The special picture: ${esc(sp.headline || '')}"><div class="row"><div><b>Special picture</b><small>${esc(sp.headline ? sp.headline.slice(0, 90) + (sp.headline.length > 90 ? '…' : '') : sp.title || '')}</small></div>${ok.approved ? `<span class="always">${ok.special ? 'Sending ✓' : 'Left out'}</span>` : `<button type="button" class="tog${keep ? '' : ' off'}" id="keep" aria-pressed="${keep}">${keep ? 'Sending ✓' : 'Left out'}</button>`}</div></div>` : ''}
    ${words ? `<div class="walabel">The words under them</div><div class="wa">${esc(words)}</div><p class="hint">At 2pm the send adds its usual greeting line on top.</p>` : ''}
    ${past || !sp ? '' : ok.approved ? `<div class="go"><button type="button" class="link" id="undo"${busy ? ' disabled' : ''}>Undo the approval</button><a class="link" href="../?special=${DATE}">Change something in the Studio</a></div>`
      : `<div class="go"><button type="button" class="big" id="yes"${busy || (late && today) ? ' disabled' : ''}>${busy ? 'Saving…' : keep ? 'Approve for the family group 🙏🏽' : 'Approve without the special'}</button><a class="link" href="../?special=${DATE}">Change something in the Studio</a></div>`}`;
  const on = (id, f) => { const b = document.getElementById(id); if (b) b.onclick = f };
  on('keep', () => { keep = !keep; draw() }); on('yes', () => save(true)); on('undo', () => save(false));
}
load();
</script>
