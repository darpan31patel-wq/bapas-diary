<!doctype html>
<!-- Visitors to bapas-diary.com, inside Darpan's private Studio (Darpan, 4 Nov 2026: "a dashboard showing analytics from
     cloudfare, showing how many visitors, where from and what tab was most used"). Behind the /darpan/ password
     (functions/darpan/_middleware.js); the numbers come from functions/darpan/api/visitors.js. No menu link, never in
     the site map. Website only: nothing here touches the daily 2pm picture. -->
<html lang="en">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<title>Visitors · Bapa's Diary Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600;700&family=Arimo:wght@400;700&display=swap">
<style>
:root {
  --bg: #1b0a0e; --panel: #26111a; --panel-2: #321722; --line: #4a2532;
  --fg: #f4ead6; --muted: #b99e8a; --gold: #e9be6e; --gold-deep: #c9973f; --ok: #8fc49a;
  --serif: "EB Garamond", "Iowan Old Style", Georgia, serif;
  --sans: "Arimo", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans) }
[hidden] { display: none !important }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px }
button, a { font: inherit; color: inherit }
.top { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line) }
.top h1 { font: 700 22px/1 var(--serif); color: var(--gold); margin: 0 6px 0 0; white-space: nowrap }
.top .spacer { flex: 1 }
.modes { display: flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px }
.modes button { border: 0; background: none; padding: 6px 14px; border-radius: 999px; cursor: pointer; color: var(--muted) }
.modes button[aria-pressed="true"] { background: var(--gold); color: #2a0d14; font-weight: 700 }
.btn { color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; text-decoration: none }
.btn:hover { border-color: var(--gold-deep) }
main { padding: 16px; display: grid; gap: 16px; max-width: 1800px; margin: 0 auto }
.note { background: var(--panel); border: 1px solid var(--gold-deep); border-radius: 12px; padding: 14px 18px; color: var(--fg) }
.note b { color: var(--gold) }
.note p { margin: 0 0 6px } .note p:last-child { margin: 0 }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px }
.tile .k { color: var(--muted); font-size: 13px }
.tile .v { font: 700 34px/1.1 var(--serif); color: var(--gold); margin-top: 4px; font-variant-numeric: tabular-nums }
.tile .s { color: var(--muted); font-size: 12.5px; margin-top: 2px }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 16px; min-width: 0 }
.card h2 { font: 600 20px/1.2 var(--serif); color: var(--gold); margin: 0 0 2px }
.card .sub { color: var(--muted); font-size: 12.5px; margin: 0 0 12px }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; align-items: start }
@media (min-width: 1300px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)) } .grid .wide { grid-column: span 2 } }
.chart svg { display: block; width: 100%; height: 220px }
.chart .axis { fill: var(--muted); font-size: 11px }
.chart .bar { fill: var(--gold-deep) } .chart .bar:hover { fill: var(--gold) }
.chart .grid-l { stroke: var(--line); stroke-width: 1 }
.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px }
.rows li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline }
.rows .n { color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.rows .c { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px }
.rows .c b { color: var(--fg); font-weight: 700 }
.rows .t { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden }
.rows .t i { display: block; height: 100%; background: var(--gold-deep); border-radius: 3px }
.rows li:first-child .t i { background: var(--gold) }
.empty { color: var(--muted); font-style: italic; margin: 0 }
.foot { color: var(--muted); font-size: 12.5px; text-align: center; margin: 4px 0 20px }
#tip { position: fixed; pointer-events: none; background: #0d0406; border: 1px solid var(--gold-deep); color: var(--fg);
  padding: 5px 9px; border-radius: 6px; font-size: 12.5px; white-space: nowrap; z-index: 9 }
</style>

<header class="top">
  <h1>Visitors</h1>
  <div class="modes" role="group" aria-label="How far back">
    <button data-days="7" aria-pressed="false">Last 7 days</button>
    <button data-days="30" aria-pressed="true">Last 30 days</button>
    <button data-days="90" aria-pressed="false">Last 90 days</button>
  </div>
  <span class="spacer"></span>
  <a class="btn" href="/darpan/">Back to the Studio</a>
</header>
<main>
  <div class="note" id="note" hidden></div>
  <section class="tiles" id="tiles" aria-label="Totals"></section>
  <section class="card wide chart" aria-labelledby="days-h">
    <h2 id="days-h">Visitors each day</h2>
    <p class="sub" id="days-sub"></p>
    <div id="days"></div>
  </section>
  <div class="grid">
    <section class="card" aria-labelledby="tabs-h"><h2 id="tabs-h">Most used tabs</h2><p class="sub">Pages opened, most first</p><ul class="rows" id="tabs"></ul></section>
    <section class="card" aria-labelledby="where-h"><h2 id="where-h">Where visitors are</h2><p class="sub" id="where-sub"></p><ul class="rows" id="where"></ul></section>
    <section class="card" aria-labelledby="refs-h"><h2 id="refs-h">How they found the site</h2><p class="sub">The site they came from</p><ul class="rows" id="refs"></ul></section>
    <section class="card" aria-labelledby="dev-h"><h2 id="dev-h">Phone or computer</h2><p class="sub">Visits on each kind of device</p><ul class="rows" id="dev"></ul></section>
  </div>
  <p class="foot" id="foot"></p>
</main>
<div id="tip" hidden></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const num = (n) => Number(n || 0).toLocaleString('en-GB');
const when = (d, o) => new Date(d + 'T12:00:00Z').toLocaleDateString('en-GB', { timeZone: 'UTC', ...o });

// every page of the site under the name of its tab
const TABS = [
  [/^\/$|^\/index\.html$/, 'Today'], [/^\/calendar\//, 'Calendar'], [/^\/search\//, 'Search'], [/^\/travels\//, 'Travels'],
  [/^\/through-the-years\//, 'Through the years'], [/^\/then-and-now\//, 'Legacy'], [/^\/darshan\//, 'Darshan'],
  [/^\/about\//, 'About'], [/^\/year\//, 'Year in review'], [/^\/screensaver\//, 'Screensaver'], [/^\/player\//, 'TV slideshow'],
  [/^\/day\//, 'Shared days'], [/^\/weekly\//, 'Darshan emails'], [/^\/(missed|interactions)\//, 'Interactions (you)'], [/^\/darpan\//, 'Studio (you)'],
];
const tabOf = (p) => (TABS.find(([re]) => re.test(p)) || [, 'Other pages'])[1];

let names;
try { names = new Intl.DisplayNames(['en-GB'], { type: 'region' }); } catch (e) { names = null; }
const flag = (c) => /^[A-Z]{2}$/.test(c) ? String.fromCodePoint(...[...c].map((x) => 0x1f1a5 + x.charCodeAt(0))) : '🌐';
const country = (c) => { if (!c || c === 'XX' || c === 'T1') return '🌐 Not known'; let n = c; try { n = names ? names.of(c) : c; } catch (e) {} return `${flag(c)} ${n}`; };
const DEVICES = { mobile: '📱 Phone', desktop: '💻 Computer', tablet: '📱 Tablet', smarttv: '📺 TV', other: 'Other' };
const site = (h) => !h ? 'Direct link or an app (often WhatsApp)'
  : /whatsapp|wa\.me/.test(h) ? 'WhatsApp' : /google\./.test(h) ? 'Google' : /facebook|fb\.|instagram/.test(h) ? h.replace(/^(www|m|l|lm)\./, '')
  : /baps\.org$/.test(h) ? 'baps.org' : h.replace(/^www\./, '');

function rows(el, items, total, label, value = (x) => x.visits, extra = () => '') {
  if (!items.length) { el.innerHTML = '<p class="empty">Nothing yet.</p>'; return; }
  const top = value(items[0]) || 1;
  el.innerHTML = items.slice(0, 12).map((x) => {
    const v = value(x);
    const pc = total ? Math.round((v / total) * 100) : 0;
    return `<li><span class="n" title="${esc(label(x))}">${esc(label(x))}</span><span class="c"><b>${num(v)}</b>${pc ? ` · ${pc}%` : ''}${extra(x)}</span><span class="t"><i style="width:${Math.max(2, (v / top) * 100)}%"></i></span></li>`;
  }).join('');
}

function chart(days, key) {
  const W = Math.max(320, Math.round($('#days').clientWidth || 1000)), H = 220, L = 44, B = 26, T = 8;
  const max = Math.max(1, ...days.map((d) => d[key]));
  const step = Math.pow(10, Math.floor(Math.log10(max)));
  const tick = [1, 2, 5, 10].map((m) => m * step).find((t) => max / t <= 4);
  const top = Math.ceil(max / tick) * tick;
  const bw = (W - L) / Math.max(1, days.length);
  const y = (v) => T + (H - T - B) * (1 - v / top);
  let g = '';
  for (let v = 0; v <= top; v += tick) g += `<line class="grid-l" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${num(v)}</text>`;
  const every = Math.ceil(days.length / Math.max(3, Math.floor(W / 90)));
  const bars = days.map((d, i) => {
    const x = L + i * bw + bw * 0.15, h = H - B - y(d[key]);
    const lab = i % every === 0 ? `<text class="axis" x="${L + i * bw + bw / 2}" y="${H - 8}" text-anchor="middle">${when(d.date, { day: 'numeric', month: 'short' })}</text>` : '';
    return `<rect class="bar" x="${x}" y="${y(d[key])}" width="${bw * 0.7}" height="${Math.max(0, h)}" rx="2" data-tip="${esc(when(d.date, { weekday: 'short', day: 'numeric', month: 'short' }))}: ${num(d[key])} visitors${d.views != null ? `, ${num(d.views)} pages` : ''}"/>${lab}`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Visitors each day">${g}${bars}</svg>`;
}

let last = null;
function show(d) {
  last = d;
  const note = [];
  if (!d.ready) {
    note.push('<p><b>Almost there.</b> The dashboard needs its Cloudflare reading key. Once the key is added to GitHub and the site is next published, the numbers appear here.</p>');
  } else {
    if (d.siteError) note.push(`<p><b>Daily visitors could not be read.</b> Cloudflare said: ${esc(d.siteError)}</p>`);
    if (d.webError || !d.web || !d.web.paths.length) note.push(`<p><b>Tabs, devices and how people found the site</b> come from Cloudflare Web Analytics. ${d.webError ? `Cloudflare said: ${esc(d.webError)}` : 'Nothing has been counted yet: once Web Analytics is switched on for the site, these fill in from that day.'}</p>`);
  }
  $('#note').innerHTML = note.join(''); $('#note').hidden = !note.length;
  const s = d.site || { days: [], countries: [] };
  const w = d.web || { paths: [], countries: [], devices: [], refs: [], days: [] };

  // the daily numbers: Cloudflare's site traffic when it can, else Web Analytics visits
  const days = s.days.length ? s.days : w.days.map((x) => ({ date: x.date, visitors: x.visits, views: x.views }));
  const visitors = days.reduce((a, x) => a + x.visitors, 0);
  const views = w.paths.length ? w.paths.reduce((a, x) => a + x.views, 0) : days.reduce((a, x) => a + (x.views || 0), 0);
  const best = days.reduce((a, x) => (!a || x.visitors > a.visitors ? x : a), null);
  const places = (w.countries.length ? w.countries : s.countries).filter((c) => c.code && c.code !== 'XX' && c.code !== 'T1');
  const tabs = new Map();
  for (const p of w.paths) { const t = tabOf(p.path); const o = tabs.get(t) || { name: t, visits: 0, views: 0 }; o.visits += p.visits; o.views += p.views; tabs.set(t, o); }
  const tabList = [...tabs.values()].sort((a, b) => b.views - a.views);

  $('#tiles').innerHTML = [
    ['Visitors', num(visitors), 'people each day, added up'],
    ['Pages opened', num(views), days.length ? `about ${num(Math.round(views / days.length))} a day` : ''],
    ['Countries', num(places.length), places[0] ? `most from ${country(places[0].code).replace(/^\S+ /, '')}` : ''],
    ['Busiest day', best ? when(best.date, { day: 'numeric', month: 'short' }) : '–', best ? `${num(best.visitors)} visitors` : ''],
    ['Most used tab', tabList[0] ? tabList[0].name : '–', tabList[0] ? `${num(tabList[0].views)} pages opened` : 'needs Web Analytics'],
  ].map(([k, v, sub]) => `<div class="tile"><div class="k">${k}</div><div class="v">${esc(v)}</div><div class="s">${esc(sub)}</div></div>`).join('');

  $('#days-sub').textContent = d.since ? `${when(d.since, { day: 'numeric', month: 'long' })} to ${when(d.until, { day: 'numeric', month: 'long', year: 'numeric' })}. Point at a bar for that day.` : '';
  $('#days').innerHTML = days.length ? chart(days, 'visitors') : '<p class="empty">Nothing yet.</p>';

  rows($('#tabs'), tabList, tabList.reduce((a, x) => a + x.views, 0), (x) => x.name, (x) => x.views);
  if (w.countries.length) {
    $('#where-sub').textContent = 'Visits from each country';
    rows($('#where'), w.countries, w.countries.reduce((a, x) => a + x.visits, 0), (x) => country(x.code));
  } else {
    $('#where-sub').textContent = 'Share of all the site’s traffic from each country';
    const all = s.countries.reduce((a, x) => a + x.requests, 0);
    rows($('#where'), s.countries.map((x) => ({ ...x, visits: x.requests })), all, (x) => country(x.code), (x) => x.visits);
    $('#where').querySelectorAll('.c b').forEach((b) => b.remove());   // a count of requests means little; the share is kept
  }
  rows($('#refs'), w.refs, w.refs.reduce((a, x) => a + x.visits, 0), (x) => site(x.host));
  rows($('#dev'), w.devices, w.devices.reduce((a, x) => a + x.visits, 0), (x) => DEVICES[String(x.type).toLowerCase()] || x.type);
  $('#foot').textContent = 'Counted by Cloudflare, without cookies. Visitors on the same phone on two days count twice. Your own visits are counted too.';
}

let days = 30;
try { days = Number(localStorage.getItem('bd-visitors-days')) || 30; } catch (e) {}
async function load() {
  document.querySelectorAll('.modes button').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.days) === days)));
  $('#tiles').innerHTML = '<div class="tile"><div class="k">Loading…</div></div>';
  try {
    const r = await fetch(`/darpan/api/visitors?days=${days}`, { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    show(await r.json());
  } catch (e) {
    $('#note').hidden = false;
    $('#note').innerHTML = '<p><b>The numbers could not be loaded just now.</b> Please refresh in a minute.</p>';
    $('#tiles').innerHTML = '';
  }
}
document.querySelectorAll('.modes button').forEach((b) => b.addEventListener('click', () => {
  days = Number(b.dataset.days); try { localStorage.setItem('bd-visitors-days', days); } catch (e) {} load();
}));
const tip = $('#tip');
document.addEventListener('pointermove', (e) => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t) { tip.hidden = true; return; }
  tip.textContent = t.dataset.tip; tip.hidden = false;
  tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + 'px'; tip.style.top = (e.clientY - 34) + 'px';
});
load();
let rs; addEventListener('resize', () => { clearTimeout(rs); rs = setTimeout(() => last && show(last), 200); });
</script>
