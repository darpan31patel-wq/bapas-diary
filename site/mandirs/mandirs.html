<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--MENULINK-->
<style>/*MENUCSS*/
/* the timeline */
.years { display: flex; gap: 6px; overflow-x: auto; margin: 12px -2px 4px; padding: 2px 2px 8px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.years button { flex: none; border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 4px 11px; border-radius: 999px; font-size: 14px; cursor: pointer; font-variant-numeric: tabular-nums; }
.years button:hover, .years button.on { border-color: var(--gold); color: var(--gold); }
.yr { display: flex; justify-content: space-between; align-items: baseline; position: sticky; top: -20px; z-index: 1; background: linear-gradient(var(--card) 70%, transparent); padding: 6px 0 4px; }
.yr small { font: 400 13px var(--body); color: var(--mist); }
.ev { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.ev:hover .vt, .ev.on .vt { color: var(--gold); }
.ev.on { background: linear-gradient(90deg, rgba(242,181,68,.10), transparent); }
.ev img { flex: none; width: 72px; height: 72px; border-radius: 10px; object-fit: cover; background: var(--sea); box-shadow: 0 0 0 1.5px rgba(242,181,68,.6); }
.vt { font: 400 19px/1.2 var(--display); }
.vfor { color: var(--saffron); font-size: 14px; font-weight: 600; margin-top: 1px; }
.guru .how b { font-size: 18px; }
.line { position: relative; }
.vv:not(:empty) { margin-left: 14px; }
.vl.vgo { display: inline-flex; align-items: center; gap: 6px; }
.vl.vgo i { display: grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: var(--gold); }
.vl.vgo i::before { content: ""; margin-left: 2px; border-left: 5px solid var(--night, #0d1330); border-top: 3.5px solid transparent; border-bottom: 3.5px solid transparent; }
</style>
</head>
<body>
<nav class="site-menu stay" aria-label="Website tabs"><a href="/">Today</a><a href="/calendar/">Calendar</a><a href="/search/">Search</a><a class="on" href="/travels/" aria-current="page">Travels</a><a href="/through-the-years/">Through the years</a><a href="/about/">About</a></nav>
<canvas id="globe" aria-label="Globe with every town where Bapa performed a murti pratishtha"></canvas>
<nav class="views" aria-label="Travels views"><a href="/travels/">Journey</a><a href="/travels/places/">Places</a><a class="on" href="/travels/mandirs/" aria-current="page">Mandirs</a></nav>
<!--MOCK-->

<aside class="panel" id="panel">
  <button class="grab" id="grab" type="button" aria-label="Make the panel bigger or smaller"></button>
  <div class="scroll" id="scroll">
    <section id="home">
      <button class="back" id="back" type="button" hidden>‹ Every mandir</button>
      <h1 id="title">Mandirs Bapa opened</h1>
      <p class="lead" id="lead"></p>
      <div class="gurus" id="gurus"></div>
      <div class="years" id="years" aria-label="Go to a year"></div>
      <div class="vh"><h2 id="sub">Every murti pratishtha</h2><button id="order" type="button">Show newest first</button></div>
      <div class="line" id="list"></div>
    </section>
  </div>
</aside>

<div class="zoom"><button id="zin" type="button" aria-label="Zoom in">+</button><button id="zout" type="button" aria-label="Zoom out">−</button></div>
<div class="hint" id="hint">Drag to turn the globe, pinch or scroll to zoom.<br>Tap a gold dot to see that town’s mandirs.</div>

<!--LAND-->
<!--MANDIRS-->
<!--LIBS-->
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('mandirs').textContent);
  const LAND = (t => topojson.feature(t, t.objects.land))(JSON.parse(document.getElementById('land').textContent));
  const SEARCH = '/search/';
  const PHOTOS = window.BAPA_PHOTOS || 'https://photos.bapas-diary.com/';
  const PSM_UNTIL = '2016-08-13';   // before this Pramukh Swami Maharaj, from it Mahant Swami Maharaj
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const day = s => new Date(s + 'T00:00:00Z');
  const fmt = d => { const x = day(d); return x.getUTCDate() + ' ' + MONTHS[x.getUTCMonth()]; };
  const fmtRange = (a, b) => a === b ? fmt(a) : (a.slice(5, 7) === b.slice(5, 7) ? day(a).getUTCDate() + ' to ' + fmt(b) : fmt(a) + ' to ' + fmt(b));
  const plural = (n, w) => n.toLocaleString() + ' ' + w + (n === 1 ? '' : 's');
  const list3 = l => l.length < 2 ? l.join('') : l.slice(0, -1).join(', ') + ' and ' + l.at(-1);

  // every town with its pratishthas, every pratishtha with its town
  const places = {};
  for (const [k, p] of Object.entries(DATA.places)) places[k] = { key: k, ...p, evs: [] };
  const EVS = DATA.events.map((e, i) => ({ ...e, i, year: +e.a.slice(0, 4), psm: e.a < PSM_UNTIL }));
  EVS.forEach(e => places[e.p].evs.push(e));
  const ALL = Object.values(places).filter(p => p.evs.length);
  const countries = new Set(ALL.map(p => p.country));
  const named = EVS.reduce((t, e) => t + e.m.length, 0);
  const first = EVS[0], last = EVS.at(-1);
  $('lead').textContent = `${plural(EVS.length, 'murti pratishtha')} in ${ALL.length} towns and ${countries.size} countries, from ${first.p} in ${first.year} to ${last.p} on ${fmt(last.a)} ${last.year}. ` +
    `${named.toLocaleString()} more mandirs are named in the captions, where Bapa consecrated their murtis to send to them.`;
  const ps = EVS.filter(e => e.psm), ms = EVS.filter(e => !e.psm);
  const yrs = l => l.length ? (l[0].year === l.at(-1).year ? l[0].year : l[0].year + ' to ' + l.at(-1).year) : '';
  const guru = (img, who, l) => `<div class="guru"><img src="${img}" alt="${who}"><div class="who">${who}</div>
    <div class="how">${l.length ? `<b>${l.length}</b> ${l.length === 1 ? 'pratishtha' : 'pratishthas'}<br>${yrs(l)}` : 'None in the diary here yet'}</div></div>`;
  const gurus = l => guru('/*PSM*/', 'Pramukh Swami Maharaj', l.filter(e => e.psm)) + guru('/*MSM*/', 'Mahant Swami Maharaj', l.filter(e => !e.psm));

  const IN_SEARCH = { 'Mount Abu': 'Mt. Abu' };   // the few places Search spells differently
  const searchLink = e => SEARCH + '#' + new URLSearchParams({ place: IN_SEARCH[e.p] || e.p, from: e.a, to: e.b }).toString();

  let town = null, cur = null, newestFirst = false;
  function render() {
    const evs = town ? town.evs : EVS;
    $('back').hidden = !town;
    $('title').textContent = town ? town.name : 'Mandirs Bapa opened';
    $('lead').hidden = !!town;
    $('gurus').innerHTML = gurus(evs);
    $('sub').textContent = town ? `${plural(evs.length, 'murti pratishtha')} in ${town.name}` : 'Every murti pratishtha';
    const ys = [...new Set(evs.map(e => e.year))];
    $('years').hidden = ys.length < 4;
    $('years').innerHTML = ys.map(y => `<button type="button" data-y="${y}">${y}</button>`).join('');
    const vs = newestFirst ? [...evs].reverse() : evs;
    let lastY = null, rows = '';
    for (const e of vs) {
      if (e.year !== lastY) { const n = evs.filter(x => x.year === e.year).length; rows += `<div class="yr" id="y${e.year}">${e.year}<small>${plural(n, 'pratishtha')}</small></div>`; lastY = e.year; }
      const p = places[e.p];
      rows += `<div class="ev${cur === e ? ' on' : ''}" data-i="${e.i}"><img src="${PHOTOS}s/${esc(e.k)}" loading="lazy" decoding="async" alt="" style="object-position:${e.fx * 100}% ${e.fy * 100}%">
        <div class="vb"><div class="vt">${esc(p.name)}<small class="pcountry" style="font:400 13px var(--body);margin-left:6px">${esc(p.country)}</small></div>
        <div class="vm">${fmtRange(e.a, e.b)} · ${e.psm ? 'Pramukh Swami Maharaj' : 'Mahant Swami Maharaj'}</div>
        ${e.m.length ? `<div class="vfor">Murtis for ${esc(list3(e.m))}</div>` : ''}
        <div class="vc">${esc(e.cap)}</div>
        <a class="vl" href="${searchLink(e)}">See more ›</a><span class="vv" data-a="${e.a}" data-b="${e.b}"></span></div></div>`;
    }
    $('list').innerHTML = rows;
    $('order').textContent = newestFirst ? 'Show oldest first' : 'Show newest first';
    videos(evs);
  }
  // Video Darshan on each pratishtha, as on every Places visit: the first BAPS video on YouTube from those days,
  // from /data/videos/YYYY.json (tools/web_videos.py; Darpan, 31 Oct 2026: Video Darshan across the site)
  const VIDS = {};
  const vidYear = y => VIDS[y] = VIDS[y] || fetch(`/data/videos/${y}.json`).then(r => r.ok ? r.json() : {}).catch(() => ({}));
  async function videos(evs) {
    const want = town;
    const ys = [...new Set(evs.flatMap(e => { const o = []; for (let y = +e.a.slice(0, 4); y <= +e.b.slice(0, 4); y++) o.push(y); return o; }))];
    const all = Object.assign({}, ...await Promise.all(ys.map(vidYear))), days = Object.keys(all).sort();
    if (town !== want) return;
    $('list').querySelectorAll('.vv').forEach(el => {
      const d = days.find(k => k >= el.dataset.a && k <= el.dataset.b); if (!d) return;
      el.innerHTML = `<a class="vl vgo" href="https://www.youtube.com/watch?v=${encodeURIComponent(all[d][0])}" target="_blank" rel="noopener" title="${esc(all[d][1])}"><i aria-hidden="true"></i>Video Darshan</a>`;
    });
  }
  $('order').onclick = () => { newestFirst = !newestFirst; render(); };
  $('back').onclick = () => { town = null; cur = null; render(); $('scroll').scrollTop = 0; flyTo([72, 22.5], 2.2); try { history.replaceState(null, '', location.pathname); } catch (e) {} };
  $('years').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const h = $('y' + b.dataset.y); if (h) $('scroll').scrollTop = h.offsetTop - 4; });
  $('list').addEventListener('click', e => {
    if (e.target.closest('a')) return;
    const r = e.target.closest('.ev'); if (!r) return;
    cur = EVS[+r.dataset.i];
    $('list').querySelectorAll('.ev.on').forEach(x => x.classList.remove('on')); r.classList.add('on');
    const p = places[cur.p]; flyTo(p.ll, p.country === 'India' ? Math.max(k, 14) : 4);
  });
  function pickTown(key) {
    town = key ? places[key] : null; cur = null; render(); $('scroll').scrollTop = 0; draw();
    if (town) try { history.replaceState(null, '', '#' + new URLSearchParams({ place: town.name })); } catch (e) {}
  }
  $('grab').addEventListener('click', () => $('panel').classList.toggle('tall'));
  render();

  // Globe
  const canvas = $('globe'), ctx = canvas.getContext('2d');
  const proj = d3.geoOrthographic().clipAngle(90).precision(0.3);
  const path = d3.geoPath(proj, ctx);
  const grat = d3.geoGraticule10();
  let W, H, DPR, base, cx, cy, wide;
  let rot = [-60, -20], k = 2.2;   // opens on India, Africa and the Gulf; most pratishthas were in Gujarat
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    wide = W > 760;
    base = Math.min(W, H) * (wide ? .4 : .34);
    cx = wide ? W * .64 : W / 2; cy = wide ? H * .54 : H * .32;
    draw();
  }
  function visible(ll) { return d3.geoDistance(ll, [-rot[0], -rot[1]]) < Math.PI / 2 - .01; }
  const dotR = p => Math.min(4 + Math.sqrt(p.evs.length) * 2.2, 18) * (k > 12 ? 1.15 : 1);

  let shown = [];
  function draw() {
    if (!W) return;
    const R = base * k;
    proj.translate([cx, cy]).scale(R).rotate([rot[0], rot[1], 0]);
    ctx.clearRect(0, 0, W, H);
    const g = ctx.createRadialGradient(cx - R * .3, cy - R * .3, R * .1, cx, cy, R * 1.05);
    g.addColorStop(0, '#16224d'); g.addColorStop(1, '#0e1636');
    ctx.beginPath(); path({ type: 'Sphere' }); ctx.fillStyle = g; ctx.fill();
    ctx.beginPath(); path(grat); ctx.strokeStyle = 'rgba(169,177,214,.08)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.beginPath(); path(LAND); ctx.fillStyle = '#3a4c86'; ctx.fill(); ctx.strokeStyle = 'rgba(169,177,214,.25)'; ctx.lineWidth = .6; ctx.stroke();
    shown = [];
    const hot = cur ? places[cur.p] : town;
    const order = [...ALL].sort((a, b) => b.evs.length - a.evs.length);
    for (const p of order) {
      if (!visible(p.ll)) continue;
      const [x, y] = proj(p.ll); if (x < -20 || y < -20 || x > W + 20 || y > H + 20) continue;
      const r = dotR(p), on = hot === p;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI);
      ctx.fillStyle = on ? '#e8772e' : 'rgba(242,181,68,.82)'; ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = '#0d1330'; ctx.stroke();
      if (on) { ctx.beginPath(); ctx.arc(x, y, r + 6, 0, 2 * Math.PI); ctx.strokeStyle = 'rgba(232,119,46,.6)'; ctx.lineWidth = 2.5; ctx.stroke(); }
      shown.push({ p, x, y, r });
    }
    const boxes = [];
    const lab = (s, strong) => {
      const text = s.p.name;
      ctx.font = (strong ? '600 16px ' : '400 13px ') + 'Mukta, system-ui, sans-serif';
      const w = ctx.measureText(text).width, x = s.x + s.r + 5, y = s.y + 4;
      const b = [x - 2, y - 13, x + w + 2, y + 4];
      if (!strong && boxes.some(o => b[0] < o[2] && b[2] > o[0] && b[1] < o[3] && b[3] > o[1])) return;
      boxes.push(b);
      ctx.lineWidth = 4; ctx.strokeStyle = '#0d1330'; ctx.lineJoin = 'round'; ctx.strokeText(text, x, y);
      ctx.fillStyle = strong ? '#f4efe4' : '#a9b1d6'; ctx.fillText(text, x, y);
    };
    const selS = shown.find(s => s.p === hot); if (selS) lab(selS, true);
    for (const s of [...shown].reverse()) if (s !== selS) lab(s, false);
  }

  const KMIN = .8, KMAX = 90;
  let zx = 0, zy = 0, busy = false;
  const zoom = d3.zoom().scaleExtent([KMIN, KMAX]).clickDistance(6)
    .on('start', e => { if (e.sourceEvent) { canvas.classList.add('drag'); stopFly(); hideHint(); } zx = e.transform.x; zy = e.transform.y; })
    .on('zoom', e => {
      const t = e.transform;
      if (!busy) {
        const dx = t.x - zx, dy = t.y - zy, R = base * t.k, deg = 180 / Math.PI / R;
        if (e.sourceEvent && e.sourceEvent.type !== 'wheel') rot = [rot[0] + dx * deg, Math.max(-85, Math.min(85, rot[1] - dy * deg))];
        k = t.k;
      }
      zx = t.x; zy = t.y; draw();
    })
    .on('end', () => canvas.classList.remove('drag'));
  const sel3 = d3.select(canvas).call(zoom).on('dblclick.zoom', null);
  const setK = v => { busy = true; sel3.call(zoom.transform, d3.zoomIdentity.translate(zx, zy).scale(v)); busy = false; k = v; };

  let down = null;
  canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: Date.now() }; }, true);
  canvas.addEventListener('pointerup', e => {
    if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 10 || Date.now() - down.t > 600) { down = null; return; }
    down = null;
    const r = canvas.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    let best = null, bd = 1e9;
    for (const s of shown) { const d = Math.hypot(s.x - x, s.y - y) - s.r; if (d < bd) { bd = d; best = s; } }
    if (best && bd < (e.pointerType === 'mouse' ? 14 : 24)) pickTown(best.p.key);
  });

  let fly = null;
  function stopFly() { if (fly) { fly.stop(); fly = null; } }
  function flyTo(ll, kt) {
    stopFly();
    const r0 = rot.slice(), k0v = k, r1 = [-ll[0], -ll[1]];
    if (r1[0] - r0[0] > 180) r1[0] -= 360; if (r0[0] - r1[0] > 180) r1[0] += 360;
    const d = d3.geoDistance([-r0[0], -r0[1]], ll), out = d > .3 ? Math.min(k0v, kt, 1.4) : Math.min(k0v, kt);
    const dur = 700 + 900 * Math.min(1, d);
    fly = d3.timer(t => {
      const u = Math.min(1, t / dur), e = d3.easeCubicInOut(u);
      rot = [r0[0] + (r1[0] - r0[0]) * e, r0[1] + (r1[1] - r0[1]) * e];
      const lk = (1 - e) * (1 - e) * Math.log(k0v) + 2 * e * (1 - e) * Math.log(out) + e * e * Math.log(kt);
      setK(Math.exp(lk)); draw();
      if (u >= 1) stopFly();
    });
  }
  $('zin').onclick = () => { stopFly(); setK(Math.min(KMAX, k * 1.8)); draw(); };
  $('zout').onclick = () => { stopFly(); setK(Math.max(KMIN, k / 1.8)); draw(); };
  let hinted = false; function hideHint() { if (!hinted) { hinted = true; $('hint').style.opacity = 0; } }

  addEventListener('resize', resize);
  resize(); setK(k);
  document.fonts && document.fonts.ready.then(draw);
  // #place=Sarangpur opens on that town's pratishthas
  const want = new URLSearchParams(location.hash.slice(1)).get('place');
  const hit = want && ALL.find(p => p.name.toLowerCase() === want.toLowerCase());
  if (hit) { pickTown(hit.key); flyTo(hit.ll, hit.country === 'India' ? 14 : 4); }
})();
</script>
</body>
</html>
