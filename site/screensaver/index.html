    ["187", "Sangash-chāritrya-hīnāyāh\nkaraṇīyo na hi striyāhā;\nStrībhih sva-dharma-rakshārtham\npālyāsh-cha niyamā draḍham.", "To protect one’s dharma, female devotees should not associate with immoral women and should firmly abide by the niyams."],
    ["188", "Na tādruk-chhruṇuyād vācham\ngītam grantham paṭhenna cha;\nPashyen-na tādrusham drashyam\nyasmāt kāma-vivardhanam.", "One should not listen to talks or songs, read books or view scenes that increase one’s lustful desires."],
    ["189", "Dhana-dravya-dharādīnām\nsadā’dāna-pradānayoho;\nNiyamā lekha-sākshyādeh\npālanīyā avashyataha.", "Transactions of wealth, possessions, land and other assets should always be conducted in writing, in the presence of a witness and by definitely following other such niyams."],
    ["190", "Prasange vyavahārasya\nsambandhibhir api svakaihi;\nLekhādi-niyamāh pālyāh\nsakalair āshritair janaihi.", "All devotees should conduct their social dealings with even their relatives in writing and by following other such niyams."],
    ["191", "Na kāryo vyavahārash-cha\ndushṭair janaih saha kvachit;\nDīna-janeshu bhāvyam cha\nsatsangibhir dayā’nvitaihi.", "Satsangis should never engage in dealings with immoral persons and should be compassionate towards those who are meek and disadvantaged."],
    ["192", "Laukikam tvavichāryaiva\nsahasā karma nā’charet;\nFalādikam vichāryaiva\nvivekena tad ācharet.", "Worldly deeds should never be performed in haste without due deliberation. They should, however, be performed with due judgment, after reflecting on their consequences and other such considerations."],
    ["193", "Lunchā kadāpi na grāhyā\nkaishchid api janair iha;\nNaiva kāryo vyayo vyarthah\nkāryah svā’yā’nusārataha.", "No one should ever accept bribes. Wealth should not be spent wastefully. One should spend according to one’s income."],
    ["194", "Kartavyam lekhanam samyak\nsvasyā’yasya vyayasya cha;\nNiyamān anusrutyaiva\nprashāsana-krutān sadā.", "One should always accurately keep accounts of one’s income and expenditure in accordance with government laws."],
    ["195", "Svā’yāddhi dashamo bhāgo\nvinsho’thavā sva-shaktitaha;\nArpyah sevā-prasādārtham\nSwāminārāyaṇa-Prabhoho.", "According to one’s means, one should give one-tenth or one-twentieth of one’s income in Swaminarayan Bhagwan’s service and to attain his blessings."],
    ["196", "Svopayogā’nusāreṇa\nprakuryāt sangraham gruhī;\nAnna-dravya-dhanādīnām\nkāla-shaktyanusārataha.", "Householders should save provisions, money and other possessions according to their needs, circumstances and means."],
    ["197", "Anna-falādibhish-chaiva\nyathā-shakti jalādibhihi;\nPālitāh pashu-pakshyādyāh\nsambhāvyā hi yathochitam.", "According to one’s means, one should provide suitable food, fruits, water and other sustenance for one’s domesticated animals and birds."],
    ["198", "Dhana-dravya-dharādīnām\npradānā’dānayoh punaha;\nVishvāsa-hananam naiva\nkāryam na kapaṭam tathā.", "One should not betray the trust of or deceive others in transactions involving wealth, objects, land or other commodities."],
    ["199", "Pradātum karma-kāribhyah\npratignātam dhanādikam;\nYathā-vācham pradeyam tad\nnonam deyam kadāchana.", "One should pay employees the amount of money or other forms of remuneration agreed upon, but should never give less."],
    ["200", "Naiva vishvāsa-ghātam hi\nkuryāt satsangam āshritaha;\nPālayed vachanam dattam\npratignātam na langhayet.", "A satsangi should not commit betrayal. One should uphold one’s promise. A pledge should not be broken."],
    ["201–202", "Prashāstā pālayed dharmān-niyatā ye sushāsane;\nLokānām bharaṇam pushṭim\nkuryāt sanskāra-rakshaṇam.\nSvāsthya-shikshaṇa-samrakshā-vidyud-anna-jalādikaihi;\nSu-vyavasthā vidhātavyā\nsarvā’bhyudaya-hetunā.", "Rulers should follow dharma that is necessary to govern well. They should provide for the people, foster their growth and safeguard sanskārs. They should suitably arrange services for health, education, defence, electricity, food, water and other resources for the benefit of all."],
    ["203", "Guṇa-sāmarthya-ruchyādi\nviditvaiva janasya tu;\nTad-uchiteshu kāryeshu\nyojanīyo vichārya saha.", "A person should be assigned suitable tasks after knowing and considering their qualities, abilities, inclinations and other such factors."],
    ["204", "Shakyā Bhagavato yatra\nbhaktih sva-dharma-pālanam;\nTasmin deshe nivāso hi\nkaraṇīyah sukhena cha.", "One should happily reside in a country where one can worship Bhagwan and observe one’s dharma."],
    ["205", "Vidyā-dhanādikam prāptum\ndeshāntaram gate’pi cha;\nSatsangam ādarāt tatra\nkuryān-niyama-pālanam.", "A person who migrates elsewhere for educational, economic or other gains should continue to reverently practise satsang and observe niyams."],
    ["206", "Yad-deshe hi sva-vāsah syāt\ntad-desha-niyamāsh-cha ye;\nSarvathā pālanīyāste\ntat-prashāsana-sammatāha.", "In the country one resides, one should observe the prescribed laws of that country in every way."],
    ["207", "Sanjāte desha-kālāder\nvaiparītye tu dhairyataha;\nAntar-bhajeta sānandam\nAkshara-Purushottamam.", "During adverse times, one should keep patience and joyously worship Akshar-Purushottam Maharaj within."],
    ["208", "Āpat-kāle tu samprāpte\nsvīya-vāsa-sthale tadā;\nTam desham hi pari-tyajya\nstheyam deshāntare sukham.", "If unfavourable circumstances arise where one lives, one should leave that place and live happily elsewhere."],
    ["209", "Kāryam bālaish-cha bālābhir\nbālyād vidyā’bhi-prāpaṇam;\nDurāchārah kusangash-cha\ntyājyāni vyasanāni cha.", "Young boys and girls should acquire education from childhood. They should avoid inappropriate behaviour, bad company and addictions."],
    ["210", "Utsāhād ādarāt kuryāt\nsvā’bhyāsam sthira-chetasā;\nVyarthatām na nayet kālam\nvidyārthī vyartha-karmasu.", "Students should study with concentration, enthusiasm and respect. They should not waste their time in useless activities."],
    ["211", "Bālyād eva draḍhī-kuryāt\nsevā-vinamratādikam;\nNirbalatām bhayam chā’pi\nnaiva gachchhet kadāchana.", "From childhood, one should strengthen the virtues of sevā, humility and other virtues. One should never lose courage or be fearful."],
    ["212", "Bālyād eva hi satsangam\nkuryād bhaktim cha prārthanām;\nKāryā prati-dinam pūjā\npitroh panchānga-vandanā.", "From childhood, one should practise satsang, offer devotion and pray. One should daily perform puja and offer panchāng pranāms to one’s mother and father."],
    ["213", "Vishesha-sayamah pālyah\nkaumārye yauvane tathā;\nAyogya-sparsha-drashyādyās-tyājyāh shakti-vināshakāhā.", "During adolescence and early adulthood, one should exercise greater self-control and refrain from improper physical contact, sights and other activities that destroy one’s energies [physical, mental and spiritual]."],
    ["214", "Sat-falonnāyakam kuryād\nuchitam eva sāhasam;\nNa kuryāt kevalam yaddhi\nsva-mano-loka-ranjakam.", "One should only undertake ventures that are appropriate and lead to good outcomes and development. However, one should not engage in ventures that merely entertain one’s mind or gratify others."],
    ["215", "Niyatodyama-kartavye\nnā’lasyam āpnuyāt kvachit;\nShraddhām prītim Harau kuryāt\npūjām satsangam anvaham.", "One should never be lazy in undertaking one’s important tasks. One should have faith in and love towards Bhagwan. One should daily perform puja and do satsang."],
    ["216", "Sango’tra balavāl-loke\nyathā-sangam hi jīvanam;\nSatām sangam atah kuryāt\nkusangam sarvathā tyajet.", "In this world, the company one keeps has great influence. The type of association moulds one’s life accordingly. Therefore, one should always keep the company of virtuous people and totally shun bad company."],
    ["217", "Kāmā’sakto bhaved yo hi\nkrutaghno loka-vanchakaha;\nPākhaṇḍī kapaṭī yash-cha\ntasya sangam pari-tyajet.", "One should renounce the company of those who are lustful, ungrateful, dishonest, hypocritical or deceitful."],
    ["218–219", "Hares-tad-avatārāṇām\nkhaṇḍanam vidadhāti yaha;\nUpāsteh khaṇḍanam yash-cha\nkurute Paramātmanaha.\nSākrutikam Parabrahma\nmanute yo nirākruti;\nTasya sango na kartavyas-tādrug-granthān paṭhen-na hi.", "One should not associate with those who deny Bhagwan and his incarnations, disapprove of upāsanā to Paramatma or believe Bhagwan, who eternally possesses a form, to be formless. Do not read such texts."],
    ["220", "Khaṇḍanam mandirāṇām yo\nmūrtīnām kurute Harehe;\nSatyā’hinsādi-dharmāṇām\ntasya sangam pari-tyajet.", "One should renounce the company of those who decry mandirs and Bhagwan’s murtis or denounce truth, non-violence and other such righteous conduct."],
    ["221", "Gurvāshraya-virodhī yo\nvaidika-shāstra-khaṇḍakaha;\nBhakti-mārga-virodhī syāt\ntasya sangam na chā’charet.", "One should not associate with those who oppose taking refuge in a guru, Vedic texts or the path of bhakti."],
    ["222", "Buddhimān api loke syād\nvyāvahārika-karmasu;\nNa sevyo bhakti-hīnash-chech-chhāstra-pārangato’pi vā.", "One should avoid the company of a person who is devoid of devotion, even if such a person is intelligent in worldly activities or learned in the shastras."],
    ["223", "Shraddhām eva tiras-krutya\nhyādhyātmikeshu kevalam;\nPuras-karoti yas-tarkam\ntat-sangam ācharen-na hi.", "One should not associate with those who ridicule faith in spiritual matters and promote logic alone."],
    ["224", "Satsange’pi kusango yo\ngneyah so’pi mumukshubhihi;\nTat-sangash-cha na kartavyo\nharibhaktaih kadāchana.", "Mumukshu devotees should also recognize kusang within satsang and should never associate with it."],
    ["225", "Harau gurau cha pratyakshe\nmanushya-bhāva-darshanaha;\nShithilo niyame yash-cha\nna tasya sangam ācharet.", "One should avoid the company of those who are lax in observing niyams or see human traits in the manifest form of Bhagwan or the guru."],
    ["226", "Bhakteshu dosha-drashṭih syād\navaguṇaika-bhāshakaha;\nManasvī yo guru-drohī na\ncha tat-sangam ācharet.", "One should avoid the company of those who perceive drawbacks in devotees, speak only ill of others, are wilful or disobey the guru."],
    ["227", "Sat-kārya-nindako yash-cha\nsach-chhāstra-nindako janaha;\nSatsanga-nindako yash-cha\ntat-sangam ācharen-na hi.", "One should not associate with those who defame noble works, sacred texts or satsang."],
    ["228", "Vachanānām shruter yasya\nnishṭhāyā bhanjanam bhavet;\nGurau Harau cha satsange\ntasya sangam pari-tyajet.", "One should shun the company of those whose words weaken one’s conviction in Bhagwan, the guru or satsang."],
    ["229", "Bhaved yo draḍha-nishṭhāvān\nAkshara-Purushottame;\nDraḍha-bhaktir vivekī cha\nkuryāt tat-sangam ādarāt.", "One should respectfully associate with a person who has firm devotion and conviction in Akshar-Purushottam and who is discerning."],
    ["230", "Harer gurosh-cha vākyeshu\nshankā yasya na vidyate;\nVishvāsur buddhimān yash-cha\nkuryāt tat-sangam ādarāt.", "One should respectfully associate with those who do not doubt the words of Bhagwan or the guru, and are trustworthy and wise."],
    ["231", "Āgnāyāh pālane nityam\nsotsāham tat-paro draḍhaha;\nNirmānaha saralo yash-cha\nkuryāt tat-sangam ādarāt.", "One should respectfully associate with those who always eagerly follow commands with enthusiasm and determination, and are humble and cooperative."],
    ["232", "Harer gurosh-charitreshu\ndivyeshu mānusheshu yaha;\nSa-sneham divyatā-darshī\nkuryāt tat-sangam ādarāt.", "One should respectfully associate with those who lovingly see divinity in both the divine and human-like actions of Bhagwan and the guru."],
    ["233", "Tat-paro’nya-guṇa-grāhe\nvimukho dur-guṇoktitaha;\nSuhrad-bhāvī cha satsange\nkuryāt tat-sangam ādarāt.", "One should respectfully associate with those in satsang who eagerly imbibe the virtues of others, never speak about others’ flaws and keep suhradbhāv."],
    ["234", "Lakshyam yasyaika-mātram syād\nGuruhari-prasannatā;\nĀchāre’pi vichāre’pi\nkuryāt tat-sangam ādarāt.", "One should respectfully associate with a person whose conduct and thoughts aim solely to please the guru."],
    ["235", "Sva-sampradāya-granthānām\nyathā-shakti yathā-ruchi;\nSanskrute prākrute vā’pi\nkuryāt paṭhana-pāṭhane.", "One should study and teach the Sanskrit or vernacular texts of one’s Sampradaya according to one’s abilities and preferences."],
    ["236", "Swāmi-vārtāh paṭhen-nityam\ntathaiva Vachanāmrutam;\nGuṇātīta-gurūṇām cha\ncharitam bhāvatah paṭhet.", "One should daily read the Vachanamrut, Swamini Vato and the jivan charitras of the Gunatit gurus with adoration."],
    ["237–238", "Upadeshāsh-charitrāṇi\nSwāminārāyaṇa-Prabhoho;\nGuṇātīta-gurūṇām cha\nsatsanginām hi jīvanam.\nAtas-tach-chhravaṇam kuryād\nmananam nidi-dhyāsanam;\nMahimnā shraddhayā bhaktyā\npratyaham shānta-chetasā.", "The teachings and actions of Swaminarayan Bhagwan and the Gunatit gurus are the very life of satsangis. Therefore, satsangis should, with a calm mind, listen to, contemplate on and repeatedly recall them daily with mahimā, faith and devotion."],
    ["239", "Sāmpradāyika-siddhānta-bādhakaram hi yad vachaha;\nPaṭhyam shravyam na mantavyam\nsanshayotpādakam cha yat.", "One should not read, listen to or believe words that go against the Sampradaya’s principles or raise doubts."],
    ["240", "Swāminārāyaṇe bhaktim\nparām draḍhayitum hradi;\nGuruhareh samādeshāch\nchāturmāsye vratam charet.", "To reinforce profound devotion towards Swaminarayan Bhagwan in one’s heart, one should observe vows during chāturmās according to the guru’s instructions."],
    ["241–242", "Chāndrāyaṇopavāsādir\nmantra-japah pradakshiṇāhā;\nKathā-shrutir daṇḍavach-cha\npraṇāmā adhikās-tadā.\nItyevam ādirūpeṇa\nshraddhayā prīti-pūrvakam;\nHari-prasannatām prāptum\nvisheshām bhaktim ācharet.", "This includes observing chāndrāyan and other fasts, as well as chanting the [Swaminarayan] mantra, performing pradakshinās, listening to spiritual discourses, offering extra dandvat pranāms, and additional devotion with faith, love and the wish to please Bhagwan."],
    ["243", "Sampradāyasya shāstrāṇām\npaṭhanam pāṭhanam tadā;\nYathā-ruchi yathā-shakti\nkuryād niyama-pūrvakam.", "During this time, one should also regularly read and teach the Sampradaya’s shastras according to one’s preference and ability."],
    ["244", "Sarvaih satsangibhih kāryāh\nprītim vardhayitum arau;\nUtsavā bhakti-bhāvena\nharsheṇollāsatas-tathā.", "To increase their love for Bhagwan, all satsangis should celebrate festivals with great joy and devotion."],
    ["245", "Janma-mahotsavā nityam\nSwāminārāyaṇa-Prabhoho;\nBrahmā’kshara-gurūṇām cha\nkartavyā bhakti-bhāvataha.", "The birth festivals of Bhagwan Swaminarayan and the Aksharbrahma gurus should always be celebrated with devotion."],
    ["246", "Harer guror vishishṭānām\nprasangānām dineshu cha;\nSatsangibhir yathā-shakti\nkāryāh parvotsavā janaihi.", "According to their means, satsangis should celebrate festivals to commemorate the special days related to Shri Hari and the gurus."],
    ["247", "Sa-vādyam kīrtanam kāryam\nparvotsaveshu bhaktitaha;\nMahimnash-cha kathā-vārtā\nkaraṇīyā visheshataha.", "During festivals, satsangis should devoutly sing kirtans to the accompaniment of instruments and especially discourse on the glory [of Bhagwan and guru]."],
    ["248", "Chaitra-shukla-navamyām hi\nkāryam Shrī-Rāma-pūjanam;\nKrishṇā’shṭamyām tu kartavyam\nShrāvaṇe Krishṇa-pūjanam.", "On the day of Chaitra sud 9, one should offer pujan to Ramchandra Bhagwan. On the day of Shravan vad 8, one should offer pujan to Krishna Bhagwan."],
    ["249", "Shiva-rātrau hi kartavyam\npūjanam Shankarasya cha;\nGaṇesham Bhādra-shuklāyām\nchaturthyām pūjayet tathā.", "On Shivratri, one should offer pujan to Shankar Bhagwan. On Bhadarva sud 4, one should offer pujan to Ganpati."],
    ["250", "Mārutim Āshvine krushṇa-chaturdashyām hi pūjayet;\nMārge mandira-samprāptau\ntad-devam praṇamed hradā.", "On Aso vad 14, one should offer pujan to Hanumanji. One should devoutly bow to the deities of any mandir that one comes across."],
    ["251", "Vishṇush-cha Shankarash-chaiva\nPārvatī cha Gajānanaha;\nDina-karash-cha panchaitā\nmānyāh pūjyā hi devatāhā.", "Vishnu, Shankar, Parvati, Ganpati and Surya – these five deities should be revered."],
    ["252", "Pari-rakshed draḍhām nishṭhām\nAkshara-Purushottame;\nTathā’pi naiva kartavyam\ndevatā’ntara-nindanam.", "One should have firm conviction in Akshar-Purushottam Maharaj. However, one should not disrespect any other deity."],
    ["253", "Dharmā vā sampradāyā vā\nye’nye tad-anuyāyinaha;\nNa te dveshyā na te nindyā\nādartavyāsh-cha sarvadā.", "One should not have contempt for other religions, sampradāyas or their followers. One should never criticize them and should always treat them with respect."],
    ["254", "Mandirāṇi cha shāstrāṇi\nsantas-tathā kadāchana;\nNa nindyāste hi satkāryā\nyathā-shakti yathochitam.", "One should never disrespect mandirs, shastras or sadhus. One should honour them appropriately according to one’s capacity."],
    ["255", "Sanyam-anopavāsādi\nyad-yat-tapah samācharet;\nPrasādāya Hares-tat tu\nbhaktyartham eva kevalam.", "Whichever acts of self-control, fasts and other austerities are undertaken, they should be performed only as bhakti and with the intent to solely please Bhagwan."],
    ["256", "Ekādashyā vratam nityam\nkartavyam param-ādarāt;\nTad-dine naiva bhoktavyam\nnishiddham vastu karhichit.", "One should always observe the ekādashi fast with utmost reverence. On this day, prohibited items should never be consumed."],
    ["257", "Upavāse divā-nidrām\nprayatnatah pari-tyajet;\nDivasa-nidrayā nashyed\nupavāsātmakam tapaha.", "While fasting, one should endeavour to give up sleep during daytime. Sleeping during daytime destroys the merits earned by the austerity of fasting."],
    ["258–259", "Swāminārāyaṇeneha\nsvayam yaddhi prasāditam;\nGurubhish-chā’kshara-Brahmaswarūpair yat prasāditam.\nTeshām sthāna-visheshāṇām\nyātrām kartum ya ichchhati;\nTad yātrām sa janah kuryād\nyathā-shakti yathā-ruchi.", "If one desires to go on a pilgrimage to the places sanctified by Bhagwan Swami­ narayan or the Aksharbrahma gurus, one should do so according to one’s means and preferences."],
    ["260", "Ayodhyām Mathurām Kāshīm\nKedāram Badarīm vrajet;\nRāmeshvarādi tīrtham cha\nyathā-shakti yathā-ruchi.", "One may go on a pilgrimage to Ayodhya, Mathura, Kashi, Kedarnath, Badrinath, Rameshwar and other sacred places according to one’s means and preferences."],
    ["261", "Maryādā pālanīyaiva\nsarvair mandiram āgataihi;\nNāryo naiva naraih sprushyā\nnārībhish-cha narās-tathā.", "After arriving at the mandir, all should certainly follow its disciplines. Males should not touch females and females should not touch males."],
    ["262", "Niyamam anusrutyaiva\nsatsangasya tu mandire;\nVastrāṇi pari-dheyāni\nstrībhih pumbhish-cha sarvadā.", "At the mandir, males and females should always dress according to the norms of satsang."],
    ["263", "Gachchhed yadā darshanārtham\nbhakta-jano Harer guroho;\nRiktena pāṇinā naiva\ngachchhet tadā kadāchana.", "A devotee should never go empty-handed for the darshan of Bhagwan or the guru."],
    ["264–265", "Āditya-chandrayor grāha-kāle satsangibhih samaihi;\nPari-tyajya kriyāh sarvāh\nkartavyam bhajanam Harehe.\nNidrām cha bhojanam tyaktvā\ntadaikatropavishya cha;\nKartavyam grāha-muktyantam\nBhagavat-kīrtanādikam.", "During a solar or lunar eclipse, all satsangis should discontinue all activities and engage in Bhagwan’s bhajan. During that time, one should not sleep or eat, but sit in one place to sing kirtans dedicated to Bhagwan and undertake other forms of devotion until the eclipse is over."],
    ["266", "Grāha-muktau sa-vastram hi\nkāryam snānam samair janaihi;\nTyāgibhish-cha Harih pūjyo\ndeyam dānam gruhasthitaihi.", "When the eclipse is over, all should bathe and soak the clothes they are wearing. Thereafter, renunciants should perform puja and householder devotees should give donations."],
    ["267", "Janmano maraṇasyā’pi\nvidhayah sūtakādayaha;\nSatsanga-rītim āshritya\npālyāh shrāddhā-dayas-tathā.", "One should perform rituals related to birth, death and shrāddh according to the Satsang tradition."],
    ["268", "Prāyash-chittam anushṭheyam\njāte tvayogya-vartane;\nParamātma-prasādārtham\nshuddhena bhāvatas-tadā.", "If one has acted immorally, one should piously atone to please Bhagwan."],
    ["269", "Āpat-kāle tu satyeva\nhyāpado dharmam ācharet;\nAlpāpattim mahāpattim\nmatvā dharmam na san-tyajet.", "One should follow the rules described for emergencies only in times of crisis. Do not give up one’s dharma by considering minor difficulties to be major."],
    ["270", "Āpattau kashṭa-dāyām tu\nrakshā svasya parasya cha;\nYathaiva syāt tathā kāryam\nrakshatā Bhagavad-balam.", "When agonizing calamities arise, one should derive strength from Bhagwan and act to protect oneself and others."],
    ["271", "Āpattau prāṇa-nāshinyām\nprāptāyām tu vivekinā;\nGurvādeshā’nusāreṇa\nprāṇān rakshet sukham vaset.", "When faced with circumstances that may result in death, one who is wise should act according to the guru’s teachings to protect one’s life and live contentedly."],
    ["272–273", "Satsanga-rītim āshritya\ngurvādeshā’nusārataha;\nPari-shuddhena bhāvena\nsarvaih satsangibhir janaihi.\nDesham kālam avasthām cha\nsva-shaktim anusrutya cha;\nĀchāro vyavahārash-cha\nprāyash-chittam vidhīyatām.", "As per their prevailing location, time, age and abilities, all satsangis should genuinely act, atone and engage in dealings according to the traditions of the Satsang and the guru’s instructions."],
    ["274", "Jīvanam unnatim yāti\ndharma-niyama-pālanāt;\nAnyashchā’pi sadāchāra-pālane prerito bhavet.", "Observing dharma and niyams elevates the quality of one’s life and also inspires others to live righteously."],
    ["275", "Bhūta-preta-pishāchāder\nbhayam kadāpi nā’pnuyāt;\nĪdruk shankāh pari-tyajya\nharibhaktah sukham vaset.", "Devotees of Bhagwan should never fear evil spirits, such as bhuts, prets or pishāchas. They should give up such apprehensions and live happily."],
    ["276", "Shubhā’shubha-prasangeshu\nmahima-sahitam janaha;\nPavitrām Sahajānanda-Nāmāvalim paṭhet tathā.", "On auspicious and inauspicious occasions, one should recite the sacred ‘Sahajanand Namavali’ while understanding its glory."],
    ["277", "Kālo vā karma vā māyā\nprabhaven-naiva karhichit;\nAnishṭa-karaṇe nūnam\nsatsangā’shraya-shālinām.", "Kāl, karma and māyā can never harm those who have taken refuge in satsang."],
    ["278", "Ayogya-vishayāsh-chaivam\nayogya-vyasanāni cha;\nĀshankāh sampari-tyājyāh\nsatsangam āshritaih sadā.", "Satsangis should always renounce inappropriate indulgence in the sense pleasures, addictions and superstitions."],
    ["279", "Naiva manyeta kartrutvam\nkāla-karmādikasya tu;\nManyeta sarva-kartāram\nAkshara-Purushottamam.", "Do not believe kāl, karma and other factors to be the doers. One should realize Akshar-Purushottam Maharaj as the all-doer."],
    ["280", "Vipattishu dhared dhairyam\nprārthanam yatnam ācharet;\nBhajeta draḍha-vishvāsam\nAkshara-Purushottame.", "In difficult times, one should remain patient, offer prayers, persevere and keep firm faith in Akshar-Purushottam Maharaj."],
    ["281", "Tyāgā’shramechchhunā dīkshā\ngrāhyā Brahmā’ksharād guroho;\nBrahma-charyam sadā sarvaih\npālyam tyāgibhir ashṭadhā.", "Those who wish to join the sadhu āshram should receive initiation from the Aksharbrahma guru. All sadhus should always observe eight-fold brahmacharya."],
    ["282", "Dhanam tu tyāgibhis-tyājyam\nrakshyam svīyatayā na cha;\nSprushyam naivā’pi vittam cha\ntyāgibhis-tu kadāchana.", "Renunciants should renounce money and should not keep it as their own. They should not even touch money."],
    ["283–284", "Tyāgibhih prīti-vruddhyartham\nAkshara-Purushottame;\nNishkāmatvam sadā dhāryam\nnirlobhatvam sadaiva cha.\nNihsvādatvam sadā dhāryam\nnihsnehatvam tathaiva cha;\nNirmānatvam sadā dhāryam\nanye cha tyāgino guṇāhā.", "To increase their love for Akshar-Purushottam Maharaj, renunciants should always imbibe the virtues of nishkām, nirlobh, nihsvād, nihsneh, nirmān, and the other ascetic qualities."],
    ["285", "Svā’tma-brahmaikatām prāpya\nSwāminārāyaṇo Harihi;\nSarvadā bhajanīyo hi\ntyāgibhir divyabhāvataha.", "Renunciants should identify their ātmā with Brahma and always offer devotion to Swaminarayan Bhagwan with divyabhāv."],
    ["286", "Tyāgo na kevalam tyāgas-tyāgo bhakti-mayas-tvayam;\nPari-tyāgo hyayam prāptum\nAkshara-Purushottamam.", "Renunciation is not merely self-denial; it is also endowed with devotion. Such renunciation is for attaining Akshar-Purushottam Maharaj."],
    ["287", "Āgnopāsana-siddhāntāh\nsarva-jīva-hitāvahāhā;\nDukha-vināshakā ete\nparama-sukha-dāyakāhā.", "These principles of āgnā and upāsanā are beneficial to all; they destroy misery and bestow utmost bliss."],
    ["288–290", "Etachchhāstrānusāreṇa\nyah prītyā shraddhayā janaha;\nĀgnopāsanayor dārḍhyam\nprakuryāt svasya jīvane.\nHareh prasannatām prāpya\ntat-krupā-bhājano bhavet;\nJīvan-neva sthitim brāhmīm\nshāstroktām āpnuyāt sa cha.\nDharmaikāntika sansiddhim\nāpnute divyam Aksharam;\nShāshvatam Bhagavad-dhāma\nmuktim ātyantikīm sukham.", "Those who faithfully and lovingly strengthen āgnā and upāsanā in their life according to this shastra earn the pleasure of Bhagwan and become a recipient of his grace. While living, they attain the brāhmic state described in the shastras. They master ekāntik dharma. They attain the eternal and divine Akshardham of Bhagwan, ultimate moksha and bliss."],
    ["291", "Aksharabrahma-sādharmyam\nsamprāpya dāsa-bhāvataha;\nPurushottama-bhaktir hi\nmuktir ātyantikī matā.", "Attaining oneness with Aksharbrahma and offering humble devotion to Purushottam is considered to be mukti."],
    ["292", "Sankshipyā’tra krutam hyevam\nāgnopāsana-varṇanam;\nTad vistaram vijānīyāt\nsāmpradāyika-shāstrataha.", "Here, in this way, āgnā and upāsanā have been concisely described. One should obtain further details from the Sampradaya’s shastras."],
    ["293–294", "Etat-Satsanga-Dīksheti\nshāstrasya prati-vāsaram;\nKāryah satsangibhih pāṭha\nekāgra-chetasā janaihi.\nPaṭhane chā’samarthais-tu\nshravyam tat prīti-pūrvakam;\nĀcharitum cha kartavyah\nprayatnah shraddhayā tathā.", "Satsangis should daily read this ‘Satsang Diksha’ shastra with concentration. Those who are unable to read should lovingly listen to it. Moreover, all should faithfully endeavour to practise it."],
    ["295–296", "Paramātmā Param Brahma\nSwāminārāyaṇo Harihi;\nSiddhāntam sthāpayāmāsa\nhyakshara-Purushottamam.\nGuravash-cha Guṇātītāsh-cha-krustasya pravartanam;\nVirachitam idam shāstram\ntat-siddhāntā’nusārataha.", "The Akshar-Purushottam siddhānt was established by Paramatma Parabrahma Swaminarayan Bhagwan and spread by the Gunatit gurus. This shastra is written based on this siddhānt."],
    ["297–298", "Krupayaivā’vatīrṇo’tra\nmumukshu-moksha-hetunā;\nParabrahma dayālur hi\nSwāminārāyaṇo bhuvi.\nSakalā’shrita-bhaktānām\nyoga-kshemau tathā’vahat;\nVyadhāt sa dvi-vidham shreya\nāmushmikam tathaihikam.", "To grant moksha to the mumukshus, the compassionate Parabrahma Swaminarayan Bhagwan manifested on this earth out of sheer grace. For all devotees who sought refuge he provided for their well-being and prosperity. He benefited them both in this world and beyond."],
    ["299", "Sarvatraivā’bhivarshantu\nsadā divyāh krupā’shishaha;\nParamātma-Parabrahma-Swāminārāyaṇa-Prabhoho.", "May the divine, compassionate blessings of Paramatma Parabrahma Swaminarayan Bhagwan always shower everywhere."],
    ["300", "Sarveshām sarva-dukhāni\ntāpa-trayam upadravāhā;\nKleshās-tathā vinashyeyur\nagnānam sanshayā bhayam.", "May all the grief, three types of miseries, calamities, distresses, ignorance, doubts and fears of all be destroyed."],
    ["301", "Bhagavat-krupayā sarve\nsvāsthyam nirāmayam sukham;\nPrāpnuvantu parām shāntim\nkalyāṇam paramam tathā.", "Through Bhagwan’s grace, may all attain good health, happiness, utmost peace and ultimate moksha."],
    ["302", "Na kashchit kasyachit kuryād\ndroham dvesham tathā janaha;\nSevantām ādaram sarve\nsarvadaiva parasparam.", "May no one harm or hate others. May everyone always respect each other."],
    ["303", "Sarveshām jāyatām prītir\ndraḍhā nishṭhā cha nishchayaha;\nVishvāso vardhatām nityam\nAkshara-Purushottame.", "May everyone develop firm love, conviction and unwavering belief in Akshar-Purushottam, and may everyone’s faith forever flourish."],
    ["304", "Bhavantu balinah sarve\nbhaktāsh-cha dharma-pālane;\nĀpnuyuh Sahajānanda-Parātmanah prasannatām.", "May all devotees become resolute in following dharma and attain the pleasure of Sahajanand Paramatma."],
    ["305", "Prashāntair jāyatām yukto\nmanushyair dharma-shālibhihi;\nSansārah sādhanā-shīlair\nadhyātma-mārga-sansthitaihi.", "May the world be filled with people who are peaceful, righteous and engrossed in spiritual endeavours, and who tread the path of spirituality."],
    ["306", "Aikyam mithah suhrad-bhāvo\nmaitrī kāruṇyam eva cha;\nSahana-shīlatā snehah\nsarva-janeshu vardhatām.", "May mutual unity, suhradbhāv, friendship, compassion, tolerance and love flourish among all people."],
    ["307", "Satsange divya-sambandhād\nBrahmaṇah Parabrahmaṇaha;\nSarveshām jāyatām dārḍhyam\nnirdosha-divya-bhāvayoho.", "Through the divine association of Brahma and Parabrahma, may all strengthen nirdoshbhāv and divyabhāv towards the Satsang."],
    ["308", "Akshara-rūpatām sarve\nsamprāpya svātmani janāhā;\nPrāpnuyuh Sahajānande\nbhaktim hi Purushottame.", "May all identify their ātmā as aksharrup and offer devotion to Purushottam Sahajanand."],
    ["309–310", "Māghasya shukla-panchamyām\nārabdham asya lekhanam;\nPavitre vikramābde hi\nrasarshi-kha-dvi-sanmite.\nChaitra-shukla-navamyām cha\nSwāminārāyaṇa-Prabhoho;\nTach-cha sampūrṇatām prāptam\ndivya-janma-mahotsave.", "The writing of this shastra began on Magha (Maha) sud 5 [30 January 2020 CE] of Vikram Samvat 2076 and was completed on Chaitra sud 9 [2 April 2020 CE], on the divine birthday celebration of Swaminarayan Bhagwan."],
    ["311–314", "Upāsya-Sahajānanda-Haraye Parabrahmaṇe;\nMūlā’kshara-Guṇātītā\nnandāya Swāmine tathā.\nBhagatajī-Mahārāja-sākshād-vignāna-mūrtaye;\nYagnapurushadāsāya\nsatya-siddhānta-rakshiṇe.\nVātsalyā’rdrā’tmane nityam\nānanda-brahma-yogine;\nVishva-vandya-vinamrāya\ngurave Pramukhāya cha.\nAnjalih shāstra-rūpo’yam\nsānandam bhakti-bhāvataha;\nArpyate Pramukha-Swāmi-janma-shatābdi-parvaṇi.", "On the occasion of Pramukh Swami Maharaj’s birth centenary celebrations, this shastra is being offered with joy and devotion as a tribute to: (1) Parabrahma Sahajanand Shri Hari – the focus of upāsanā, (2) Mul Akshar Gunatitanand Swami, (3) Bhagatji Maharaj – the embodiment of wisdom, (4) Yagnapurushdasji (Shastriji Maharaj) – the protector of the true siddhānt, (5) the forever affectionate and blissful embodiment of Aksharbrahma, Yogiji Maharaj and (6) Guru Pramukh Swami Maharaj, who is humble and revered throughout the world."],
    ["315", "Tanotu sakale vishve\nparamānanda-mangalam;\nSwāminārāyaṇah sākshād\nAkshara-Purushottamaha.", "May Swaminarayan Bhagwan, who is Akshar-Purushottam Maharaj himself, spread supreme bliss and auspiciousness throughout the entire world."]
  ];

    sunPath.querySelector('.now .sun').textContent = m < rise ? 'Sunrise ' + clock12(rise) : m < set ? 'Sunset ' + clock12(set)
      : 'Sunrise ' + clock12(sunTimes(new Date(Date.now() + 864e5)).rise);
    sunPath.querySelector('.cloud .puff').setAttribute('fill', mixHex(bottom, '#ffffff', day ? .75 : .35));   // clouds take the sky's light
    sunPath.querySelector('.plane .trail').setAttribute('stroke', dark ? 'transparent' : 'rgba(255, 255, 255, .55)');
    sunPath.querySelector('.plane .body').setAttribute('fill', dark ? '#0b0d22' : '#f4f1ea');
    sunPath.querySelector('.plane .blink').style.display = dark ? '' : 'none';
    skyNow = { dark, day, dusk: Math.abs(m - set) < 60, dawn: Math.abs(m - rise) < 60 };
    // fireworks on the hour, at night (in the first two minutes, once the sky is clear)
    const hourKey = new Date().getHours();
    if (dark && new Date().getMinutes() < 2 && drawSun.fired !== hourKey && skyFree('fireworks')) { drawSun.fired = hourKey; play(sunPath.querySelector('.fireworks'), 'fireworks'); }
  }

  /* Arti diya */
  const diya = add(`<span class="x-diya" hidden aria-hidden="true"><span class="glow"></span><svg viewBox="0 0 100 140"><defs>
    <radialGradient id="xFl" cx="50%" cy="75%" r="70%"><stop offset="0" stop-color="#fffbe6"/><stop offset=".35" stop-color="#ffd35c"/><stop offset=".75" stop-color="#ff8a1f"/><stop offset="1" stop-color="#e2461a" stop-opacity="0"/></radialGradient>
    <linearGradient id="xBr" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset=".5" stop-color="#d49a32"/><stop offset="1" stop-color="#7a4d12"/></linearGradient></defs>
    <path d="M50 6 C60 26 70 40 64 54 C60 63 40 63 36 54 C30 40 42 24 50 6Z" fill="url(#xFl)"/>
    <path d="M50 30 C55 40 58 47 55 54 C53 58 47 58 45 54 C42 47 46 40 50 30Z" fill="#fffbe6" opacity=".9"/>
    <path d="M8 70 Q50 64 92 70 Q86 104 50 108 Q14 104 8 70Z" fill="url(#xBr)"/>
    <path d="M8 70 Q50 76 92 70" fill="none" stroke="#fff0c0" stroke-width="2" opacity=".7"/>
    <path d="M38 108 L62 108 L68 122 L32 122Z" fill="#a8721f"/><ellipse cx="50" cy="123" rx="24" ry="4" fill="#d9a441"/></svg></span>`);
  const clockEl = document.getElementById('saverClock');
  clockEl.parentNode.insertBefore(diya, clockEl);
  const tag = document.getElementById('saverTag'), tagHTML = tag.innerHTML;

  /* Shloks in a shuffled order: every shlok once, then a fresh shuffle */
  // Satsang Diksha, Vachanamrut and Swamini Vato share one shuffled deck.
  const BOOKS = [['Satsang Diksha', 'Shlok ', SHLOKS], ['Vachanamrut', '', VACHANAMRUT], ['Swamini Vato', 'Vat ', SWAMINI_VATO]];
  const ALL = BOOKS.flatMap(([book, pre, list]) => list.map(q => [book, pre + q[0], q[1], q[2]]));
  let deck = [];

  // Fit every passage using rendered dimensions, including loaded fonts and wrapping.
  // Gently: one try each frame, for a new passage while the words are faded away, so the screen never waits for it
  // (each try lays out the long Sanskrit afresh, which is slow on the tablet: 18 Oct 2026, stuck frames)
  let fitRun = 0;
  async function fitShlok(gently) {
    const run = ++fitRun;
    const next = () => gently ? new Promise(go => requestAnimationFrame(() => go(run === fitRun))) : run === fitRun;
    if (shlokBox.hidden) return;
    const content = shlokBox.querySelector('.x-shlok-content');
    const text = Array.from(content.querySelectorAll('.num, .sa, .en'));   // the Satsang Diksha title keeps its size (19 Oct 2026)
    text.forEach(el => { el.style.fontSize = ''; });
    const sizes = text.map(el => parseFloat(getComputedStyle(el).fontSize));
    const apply = scale => text.forEach((el, i) => { el.style.fontSize = (sizes[i] * scale) + 'px'; });
    const used = () => Array.from(content.children).reduce((sum, el) => {
      const css = getComputedStyle(el);
      return css.display === 'none' ? sum : sum + el.getBoundingClientRect().height +
        parseFloat(css.marginTop) + parseFloat(css.marginBottom);
    }, 0);
    const room = () => { const css = getComputedStyle(content); return content.clientHeight - parseFloat(css.paddingTop) - parseFloat(css.paddingBottom) - 2; };
    const fits = () => used() <= room() && text.every(el => !el.getClientRects().length || el.scrollWidth <= el.clientWidth + 1);
    if (!(await next())) return;
    if (!fits()) {
      // a close first guess (text needs room roughly as the square of its size), then a few steps to settle
      const guess = Math.min(1, Math.sqrt(Math.max(0, room()) / Math.max(1, used())));
      let low = Math.max(0.01, guess * 0.8), high = Math.min(1, guess * 1.15), steps = 6;
      apply(low);
      if (!(await next())) return;
      if (!fits()) { high = low; low = 0.01; steps = 9; }   // the guess was too hopeful: look further down
      for (let i = 0; i < steps; i++) {
        const mid = (low + high) / 2;
        apply(mid);
        if (!(await next())) return;
        if (fits()) low = mid; else high = mid;
      }
      apply(low);
    }
  }
  let fitShlokFrame = 0;
  function scheduleShlokFit() {
    cancelAnimationFrame(fitShlokFrame);
    fitShlokFrame = requestAnimationFrame(() => fitShlok());
  }
  window.addEventListener('resize', scheduleShlokFit);
  if (window.ResizeObserver) {
    new ResizeObserver(scheduleShlokFit).observe(shlokBox.querySelector('.x-shlok-content'));
  }
  if (document.fonts) {
    document.fonts.ready.then(scheduleShlokFit);
    document.fonts.addEventListener('loadingdone', scheduleShlokFit);
  }

  function nextShlok(gently) {
    if (!deck.length) {
      deck = ALL.map((_, i) => i);
      for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
    }
    const [book, n, sa, en] = ALL[deck.pop()];
    shlokBox.querySelector('.lbl').textContent = book;
    shlokBox.querySelector('.num').textContent = n;
    shlokBox.querySelector('.sa').textContent = sa;
    shlokBox.classList.toggle('prose', !sa);
    const lines = sa.split('\n').length;
    shlokBox.classList.toggle('xl', lines >= 12 || en.length > 450);
    shlokBox.classList.toggle('long', !shlokBox.classList.contains('xl') && (lines > 8 || en.length > 300));
    shlokBox.querySelector('.en').textContent = en;
    shlokBox.hidden = false;
    saverEl.classList.add('book');
    fitShlok(gently);
    fitCaption(document.getElementById('saverCaption'));
  }
  // A new shlok comes with every second photo, in the same slow relay as the words along the bottom:
  // the old text fades away, changes while the new photo is halfway in, and fades back slowly.
  // If the photos stop changing (offline), it still moves on every 50 seconds or so.
  let shlokAt = 0, photosSince = 0;
  function relayShlok() {
    shlokAt = performance.now(); photosSince = 0;
    const content = shlokBox.querySelector('.x-shlok-content');
    content.classList.add('swap');
    setTimeout(() => { nextShlok(true); content.classList.remove('swap'); }, WORDS_FADE_SECONDS * 1000);
  }
  if (EXTRAS.shlok && ALL.length) {
    nextShlok(); shlokAt = performance.now();
    slideShownHooks.push(() => { if (++photosSince >= EXTRAS.shlokPhotos && performance.now() - shlokAt > 20000) relayShlok(); });
    setInterval(() => { if (performance.now() - shlokAt > (SECONDS_PER_PHOTO * EXTRAS.shlokPhotos + 15) * 1000) relayShlok(); }, 5000);
  }

  /* Every half minute: arti, time of day, night dim */
  let aartiNow = '';
  const soon = add('<div class="x-soon" hidden></div>');
  saverEl.appendChild(soon);
  function tick() {
    const m = nowMins();
    if (EXTRAS.sunPath) drawSun(m);
    if (EXTRAS.timeOfDay) {
      const tint = todTint(m);
      saverEl.classList.add('tod-on'); saverEl.style.setProperty('--tod-tint', tint);
    }
    if (EXTRAS.aarti) {
      const a = ARTIS.find(([t]) => m >= mins(t) && m < mins(t) + EXTRAS.aartiMinutes);
      const name = a ? a[1] : '';
      if (name !== aartiNow) {
        aartiNow = name;
        diya.hidden = !name; saverEl.classList.toggle('aarti-on', !!name);
        saverEl.dataset.arti = name;   // the arti's name inside the mandir at the top of the page
        sunPath.classList.toggle('arti', !!name);   // diya lights along the mandir during arti
        tag.innerHTML = name ? '<i></i>' + name + ' Arti is happening now at Neasden' : tagHTML; tag.hidden = !name;
      }
    }
    if (EXTRAS.artiSoonMinutes) {
      const next = ARTIS.map(([t, n]) => [(mins(t) - m + 1440) % 1440, n]).filter(([d]) => d > 0 && d <= EXTRAS.artiSoonMinutes).sort((a, b) => a[0] - b[0])[0];
      const text = next ? next[1] + ' Arti at Neasden in ' + next[0] + ' min' : '';
      if (soon.textContent !== text) { soon.textContent = text; soon.hidden = !text; saverEl.classList.toggle('soon-on', !!text); }
    }
    const nd = EXTRAS.nightDim;
    if (nd) {
      const f = mins(nd.from), t = mins(nd.to);
      const on = f > t ? (m >= f || m < t) : (m >= f && m < t);
      saverEl.style.setProperty('--x-dim', 1 - nd.level); saverEl.classList.toggle('dim-on', on);
    }
  }
  tick(); setInterval(tick, 30 * 1000);

  /* Bapa's time (Swamishri): where he is today from memories/schedule.json (copied from the BAPS
     upcoming vicharan page): stays (place, tz, from, to; dates inclusive) and days (YYYY-MM-DD: events
     with from, to, what, in local time). A date not on the schedule falls back to the newest Latest
     Vicharan photo's place and tz. A second small line says what he is doing now, or next today. */
  const away = add('<div class="x-away" hidden></div>');
  saverEl.appendChild(away);
  // Preserve the plain-mode clock; only move it into the page when the page is active.
  if (saverEl.classList.contains('book')) {
    const footer = add('<div class="x-clock-footer"><div class="x-clock-group"></div></div>');
    saverEl.appendChild(footer);
    footer.querySelector('.x-clock-group').append(document.getElementById('saverTag'), document.getElementById('saverClock'), away, soon);   // the tag sits just above the clock (13 Oct 2026)
  }

  let schedule = null, scheduleTried = 0;
  async function refreshSchedule() {
    if (!MEMORIES_URL || Date.now() - scheduleTried < 60 * 60000) return;
    scheduleTried = Date.now();
    try { const res = await fetch(MEMORIES_URL + 'schedule.json', { cache: 'no-cache' }); if (res.ok) schedule = await res.json(); } catch (e) {}
  }
  const dayIn = tz => new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
  const hmIn = tz => new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date());
  function hm12(t) {   // "17:30" -> "5:30 pm" (or kept as is for a 24 hour clock)
    if (CLOCK_24_HOUR) return t;
    const [h, m] = t.split(':').map(Number);
    return (h % 12 || 12) + ':' + String(m).padStart(2, '0') + (h < 12 ? ' am' : ' pm');
  }
  function swamishriWhere() {
    const stays = schedule && Array.isArray(schedule.stays) ? schedule.stays : [];
    const days = (schedule && schedule.days) || {};
    const on = [];
    for (const s of stays) { try { const d = dayIn(s.tz); if (s.from <= d && d <= s.to) on.push({ ...s, day: d }); } catch (e) {} }
    if (on.length) {
      // A day two stays share: the new place once that day has events there, else a travel day.
      let here = on[0], travel = '';
      if (on.length > 1) {
        const next = on[on.length - 1];
        if (days[next.day]) here = next; else if (here.day === here.to) travel = String(next.place || '').split(',')[0];
      }
      const events = Array.isArray(days[here.day]) ? days[here.day] : [];
      const now = hmIn(here.tz);
      const cur = events.filter(e => e.from <= now && now < e.to).map(e => e.what);
      const later = events.filter(e => e.from > now).sort((x, y) => x.from.localeCompare(y.from))[0];
      const doing = cur.length ? 'Now: ' + cur.join(' · ')
        : travel ? 'Travelling to ' + travel
        : later ? 'Later: ' + later.what + ' at ' + hm12(later.from) : '';
      return { place: here.place, tz: here.tz, doing };
    }
    const withTz = latest.filter(l => l && l.tz).sort((a, b) => String(b.iso || '').localeCompare(String(a.iso || '')));
    return withTz[0] || null;
  }
  function renderAway() {
    const w = EXTRAS.swamishriClock && saverEl.classList.contains('book') ? swamishriWhere() : null;
    let text = '';
    if (w) {
      try {
        const t = new Intl.DateTimeFormat('en-GB', { timeZone: w.tz, hour: 'numeric', minute: '2-digit', hour12: !CLOCK_24_HOUR }).format(new Date());
        const place = esc(String(w.place || '').split(',')[0]);
        const sameTime = hmIn(w.tz) === hmIn(Intl.DateTimeFormat().resolvedOptions().timeZone);   // his clock would only repeat the big one
        text = (sameTime ? 'Bapa is in ' + place : 'Bapa’s time in ' + place + ' · <b>' + esc(t.replace(/\s?([ap]m)$/i, ' $1')) + '</b>')
          + (w.doing ? '<span class="x-away-now">' + esc(w.doing) + '</span>' : '');
      } catch (e) {}   // an unknown time zone: show nothing
    }
    if (away.dataset.t !== text) { away.dataset.t = text; away.innerHTML = text; away.hidden = !text; saverEl.classList.toggle('away-on', !!text); }
  }
  refreshSchedule().then(renderAway); setInterval(() => refreshSchedule().then(renderAway), 15 * 60 * 1000);
  renderAway(); setInterval(renderAway, 10 * 1000);

  /* Shangar colour: read the main colour of each darshan photo once and remember it.
     Needs the mandir to allow it (CORS); if not, the usual gold colours stay. */
  const VAGHA_KEY = 'darshan-vagha-colours';
  let vaghaMemo = {};
  try { vaghaMemo = JSON.parse(localStorage.getItem(VAGHA_KEY) || '{}'); } catch (e) {}
  function colourOf(src) {
    return new Promise(resolve => {
      if (vaghaMemo[src]) return resolve(vaghaMemo[src]);
      const im = new Image(); im.crossOrigin = 'anonymous'; im.referrerPolicy = 'no-referrer';
      // shrunk to 40 by 40 away from the screen's own work, so a big photo doesn't hold the screen up (18 Oct 2026)
      im.onload = () => (window.createImageBitmap ? createImageBitmap(im, { resizeWidth: 40, resizeHeight: 40, resizeQuality: 'low' }) : Promise.resolve(im)).catch(() => im).then(pic => {
        try {
          const c = document.createElement('canvas'); c.width = c.height = 40;
          const x = c.getContext('2d'); x.drawImage(pic, 0, 0, 40, 40);
          const d = x.getImageData(0, 0, 40, 40).data; let r = 0, g = 0, b = 0, w = 0;
          for (let i = 0; i < d.length; i += 4) {
            const mx = Math.max(d[i], d[i + 1], d[i + 2]), mn = Math.min(d[i], d[i + 1], d[i + 2]);
            const s = mx ? (mx - mn) / mx : 0, k = s * s * (mx > 60 && mx < 250 ? 1 : 0);
            r += d[i] * k; g += d[i + 1] * k; b += d[i + 2] * k; w += k;
          }
          if (!w) return resolve(null);
          const col = `rgb(${r / w | 0}, ${g / w | 0}, ${b / w | 0})`;
          vaghaMemo[src] = col;
          const keep = Object.keys(vaghaMemo).slice(-60); const small = {}; keep.forEach(k => small[k] = vaghaMemo[k]);
          vaghaMemo = small; try { localStorage.setItem(VAGHA_KEY, JSON.stringify(small)); } catch (e) {}
          resolve(col);
        } catch (e) { resolve(null); }   // the mandir didn't allow it: keep the usual colours
      });
      im.onerror = () => resolve(null);
      im.src = src + (src.includes('?') ? '&' : '?') + 'colour';   // separate request, so the saved photo is untouched
    });
  }

  /* After each photo change: shangar colour */
  let colourAsk = 0;
  function afterShow(item) {
    if (EXTRAS.vaghaColour && item && item.kind === 'darshan' && item.img) {
      const want = ++colourAsk;
      colourOf(item.img).then(col => {
        if (want !== colourAsk) return;   // a newer photo is already showing
        saverEl.classList.toggle('vagha-on', !!col);
        if (col) saverEl.style.setProperty('--vagha', col);
      });
    } else colourAsk++;   // On This Day and Latest Vicharan keep the colours of the last darshan, so everything matches
  }
  slideShownHooks.push(afterShow);
  if (front && front.item) afterShow(front.item);
  /* ===== Extra touches added 19 Oct 2026 ===== */
  // Today's date under the page's clock ("19 October", no year)
  const dayMonth = () => new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long' });
  const pageDate = document.createElement('div');
  pageDate.className = 'x-date';
  document.getElementById('saverClock').after(pageDate);
  const showDate = () => { if (pageDate.textContent !== dayMonth()) pageDate.textContent = dayMonth(); };
  showDate(); setInterval(showDate, 30000);
  // The diya and the arti's name inside the mandir at the top of the page, while each arti is on
  if (EXTRAS.sunPath) {
    const artiBox = document.createElement('div');
    artiBox.className = 'x-sun-arti'; artiBox.innerHTML = '<span class="a-line"></span>';
    artiBox.prepend(diya); sunPath.appendChild(artiBox);
    const artiLine = () => {
      const name = saverEl.dataset.arti || '';
      artiBox.lastChild.textContent = name ? name + ' Arti is happening now at Neasden' : '';
      artiBox.classList.toggle('on', !!name);
    };
    artiLine(); new MutationObserver(artiLine).observe(saverEl, { attributes: true, attributeFilter: ['data-arti'] });
  }
  // Festival and Ekadashi reminder in a small box by the photo's words. The chosen days for the rest of 2026
  // (from baps.org's 2026 calendars; Vijaya Dashmi and Vagh Baras left out on purpose). Add 2027 when ready.
  const FEST_EKADASHIS = [
    ['2026-10-22', 'Aso Sud Ekadashi'], ['2026-11-05', 'Aso Vad Ekadashi'],   // 22 Oct shows as plain "Ekadashi"
    ['2026-11-21', 'Kartak Sud Ekadashi/Baras', 'Prabodhini Ekadashi'], ['2026-12-04', 'Kartak Vad Ekadashi'],
    ['2026-12-20', 'Magshar Sud Ekadashi'],
  ];
  const FEST_DAYS = [
    ['2026-10-25', 'Gunatitanand Swami’s Birthday'], ['2026-11-06', 'Dhan Teras / Lakshmi Pujan'], ['2026-11-07', 'Kali Chaudash'],
    ['2026-11-08', 'Diwali'], ['2026-11-10', 'Annakut and Bestu Varash'], ['2026-11-11', 'Bhai Beej'],
    ['2026-11-21', 'Prabodhini Ekadashi'], ['2026-11-24', 'Dev Diwali'], ['2026-12-17', 'Pramukh Swami Maharaj’s Jayanti'],
  ];
  const FEST_REMIND_FROM_HOUR = 6;   // "Tomorrow" shows from 6am the day before
  const festKey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  function festivalFor(d) {
    const key = festKey(d), names = FEST_DAYS.filter(f => f[0] === key).map(f => f[1]);
    const ek = FEST_EKADASHIS.find(e => e[0] === key);
    if (ek && !names.some(n => /ekadashi/i.test(n))) names.push(ek[2] || 'Ekadashi');
    return names.join(' · ');
  }
  function festNow() {
    const now = new Date();
    let name = festivalFor(now), when = 'Today', next = '';
    if (now.getHours() >= FEST_REMIND_FROM_HOUR) { const t = new Date(now); t.setDate(t.getDate() + 1); next = festivalFor(t); }
    if (!name && next) { name = next; when = 'Tomorrow'; next = ''; }
    return name ? { when, name, next } : null;
  }
  let fest = null, festShown = '';
  const festBox = document.createElement('div'), bar = document.querySelector('.saver-bar'), words = document.querySelector('.saver-words');
  festBox.className = 'x-fest-box';
  bar.appendChild(festBox);
  const festHTML = () => !fest ? '' : fest.next
    ? '<span class="row"><b>' + esc(fest.when) + '</b>' + esc(fest.name) + '</span><span class="row"><b>Tomorrow</b>' + esc(fest.next) + '</span>'
    : '<b>' + esc(fest.when) + '</b><span>' + esc(fest.name) + '</span>';
  function renderFest() {
    const html = festHTML();
    if (html === festShown) return;
    festShown = html; festBox.innerHTML = html; festBox.classList.toggle('on', !!html);
    placeFest();
  }
  // Level with the title and date. The words move left a little only if a long line would reach the box, and if that
  // isn't enough, the date and caption get a little narrower too
  const cap = document.getElementById('saverCaption');
  function placeFest() {
    if (words.style.translate) words.style.translate = '';
    if (words.classList.contains('fest-tight')) { words.classList.remove('fest-tight'); fitCaption(cap); }
    if (!festBox.classList.contains('on') || !saverEl.classList.contains('book')) return;
    const b = bar.getBoundingClientRect(), t = document.querySelector('.saver-head').getBoundingClientRect(), d = document.getElementById('saverDate').getBoundingClientRect();
    const mid = (t.top + (d.height ? d.bottom : t.bottom)) / 2 - b.top;
    festBox.style.top = Math.round(mid - festBox.offsetHeight / 2) + 'px';
    const f = festBox.getBoundingClientRect(), gap = b.width * .025, L0 = b.left + gap, R0 = f.left - gap;
    const measure = () => {   // how far the lines beside the box reach into it, and how far the words could move left
      let right = 0, left = b.right;
      for (const el of words.children) {
        if (el.hidden || !el.offsetHeight) continue;
        const r = el.getBoundingClientRect();
        left = Math.min(left, r.left);
        if (r.bottom > f.top - gap / 2 && r.top < f.bottom + gap / 2) right = Math.max(right, r.right);
      }
      return [right - R0, left - L0];
    };
    let [over, room] = measure();
    if (over > room) {
      words.style.setProperty('--fest-max', Math.floor(R0 - L0) + 'px'); words.classList.add('fest-tight'); fitCaption(cap);
      [over, room] = measure();
    }
    if (over > 0) words.style.translate = -Math.round(Math.min(over, room)) + 'px 0';
  }
  new MutationObserver(placeFest).observe(words, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['hidden'] });   // not its style, which placeFest sets itself
  window.addEventListener('resize', placeFest);
  if (document.fonts) document.fonts.ready.then(placeFest);
  fest = festNow(); renderFest();
  setInterval(() => { fest = festNow(); renderFest(); }, 60 * 1000);
})();
</script>

.x-leave { position: absolute; z-index: 9; top: max(14px, env(safe-area-inset-top, 0px)); left: max(14px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 12px; opacity: 0; transition: opacity 1.2s ease; pointer-events: none; }
.x-leave.on { opacity: 1; pointer-events: auto; }
.x-leave button { width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(255, 207, 107, .6); background: rgba(18, 4, 8, .6);
  color: #ffcf6b; font: 400 22px/1 var(--font); cursor: pointer; display: grid; place-items: center; padding: 0; }
.x-leave span { font: 600 clamp(11px, 1.5vh, 15px)/1.3 var(--font); letter-spacing: .12em; text-transform: uppercase; color: #ffe7b8; text-shadow: 0 1px 6px rgba(0, 0, 0, .8); }
body.awake, body.awake .saver { cursor: default; }
@media (pointer: coarse) { .x-leave, .x-leave.on { opacity: 1; pointer-events: auto; } }
/* a phone: the photo alone, no book page (Darpan, 29 Oct 2026: "for a phone, maybe get rid of the text 25% side") */
@media (max-width: 700px) { .saver.book { --page-w: 0px; } .saver.book .x-shlok, .saver.book .x-clock-footer, .saver.book .x-diya { display: none !important; } .saver.book .saver-caption { max-width: 80vw; } }
</style>
<script>
/* Leaving (Darpan, 29 Oct 2026: "to exit, please press escape, or please press the X button on a touchscreen device").
   The website opens this page full screen in a frame (screensaver/launch.js on the Today page); the ✕ or Escape asks the
   website to close it. Opened on its own in a tab, it goes back to the page before. Add ?stay for a TV, which closes it itself. */
(function leaving() {
  if (/[?&]stay\b/.test(location.search)) return;
  const box = document.createElement('div');
  box.className = 'x-leave on';
  const touch = matchMedia('(pointer: coarse)').matches;   // a touch screen has no Escape: just the ✕
  box.innerHTML = '<button type="button" aria-label="Leave the screensaver">✕</button><span>' + (touch ? 'Tap ✕ to leave' : 'To leave, press Escape or tap ✕') + '</span>';
  document.body.appendChild(box);
  const leave = () => {
    if (window.parent !== window) window.parent.postMessage({ type: 'screensaver-exit' }, '*');
    else if (history.length > 1) history.back();
    else location.href = '/';
  };
  box.querySelector('button').addEventListener('click', leave);
  let hide = 0;
  const rest = () => { box.classList.remove('on'); document.body.classList.remove('awake'); };
  const show = () => { box.classList.add('on'); document.body.classList.add('awake'); clearTimeout(hide); hide = setTimeout(rest, 5000); };
  hide = setTimeout(rest, 12000);
  let last = null;
  addEventListener('mousemove', e => { if (last && Math.abs(e.screenX - last.x) + Math.abs(e.screenY - last.y) > 6) show(); last = { x: e.screenX, y: e.screenY }; });
  addEventListener('touchstart', show, { passive: true });
  addEventListener('keydown', e => { if (e.key === 'Escape') leave(); else show(); });
})();
</script>
