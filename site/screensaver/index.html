<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Screensaver · Bapa's Diary</title>
<style>
/* Fonts are kept on the website itself, so they still work if the wifi is slow:
   IM Fell DW Pica for the titles, Arimo for everything else, Baloo Bhai 2 for the Gujarati */
@font-face { font-family: "IM Fell DW Pica"; src: url("fonts/im-fell-dw-pica-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Arimo"; src: url("fonts/arimo-latin-400-normal.woff2") format("woff2"); font-weight: 400 500; font-display: swap; }
@font-face { font-family: "Arimo"; src: url("fonts/arimo-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-display: swap; }
@font-face { font-family: "Arimo"; src: url("fonts/arimo-latin-700-normal.woff2") format("woff2"); font-weight: 700 900; font-display: swap; }
@font-face { font-family: "Baloo Bhai 2"; src: url("fonts/baloo-bhai-2-latin-700-normal.woff2") format("woff2"); font-weight: 700 800; font-display: swap; }
@font-face { font-family: "Baloo Bhai 2"; src: url("fonts/baloo-bhai-2-gujarati-700-normal.woff2") format("woff2"); font-weight: 700 800; font-display: swap; unicode-range: U+0951-0952, U+0964-0965, U+0A80-0AFF, U+200C-200D, U+20B9, U+25CC, U+A830-A839; }
:root {
  --ink: #fff3e2;
  --muted: #e0bfae;
  --saffron: #f59b2b;
  --marigold: #ffc23d;
  --kumkum: #ef7a6a;
  --peacock: #34aaa0;
  --font: "Arimo", "Helvetica Neue", Arial, sans-serif;
  --title-font: "IM Fell DW Pica", Georgia, serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: #120408; }
body { color: var(--ink); font-family: var(--font); cursor: none; -webkit-user-select: none; user-select: none; }

/* ---------- Darshan screensaver ---------- */
.saver {
  position: fixed; inset: 0;
  background: radial-gradient(70% 80% at 50% 45%, #4a1520, #120408);
  overflow: hidden; cursor: none;
}
#slides { position: absolute; inset: 0; z-index: 0; overflow: hidden; }   /* photos stay in their own layer, always under the text */
.saver-shade { z-index: 2; }
.photo-dim { position: absolute; inset: 0; z-index: 1; background: #000; opacity: var(--photo-dim, .1); pointer-events: none; }
.saver-bar { z-index: 3; }
.slide {
  position: absolute; inset: 0;
  opacity: 0; transition: opacity var(--fade-s, 4s) ease-in-out;
}
.slide.show { opacity: 1; }
/* The soft background is the photo drawn tiny (48 by 30 dots) and stretched to fill the
   screen, which blurs it for free. A CSS blur on a full screen layer is one of the heaviest
   things a Mac can be asked to draw, so the screensaver doesn't use one. */
.slide .bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
/* The photo sits in a frame of fixed size (full width, 110% of the screen height) and the frame
   is what moves. The frame's size never depends on the photo, so a photo that is still downloading
   when its slow move starts can't end up pushed off to one side (Safari works out the move once,
   at the start, while the photo is still 0px wide). */
.slide .pic {
  position: absolute; left: 0; right: 0; top: 0; height: 100%;   /* the whole height of the photo fits the screen */
  display: flex; justify-content: center; align-items: center;
  will-change: transform;
  transition: opacity var(--fade-s, 4s) ease-in;
}
/* Soft focus: as the new photo melts in, the old one gives way to its own soft blurred
   background (the tiny canvas behind it), so the two photos never sit sharply on top of each other.
   Only opacity changes, so it costs no more than the fade itself. */
.slide.soft .pic { opacity: 0; }
.slide img {
  flex: none; display: block;
  height: 100%; width: auto; max-width: none;
  /* feathered edges: the photo melts softly into the blurred background on every side */
  -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 var(--side, 3%), #000 calc(100% - var(--side, 3%)), transparent 100%), linear-gradient(to bottom, transparent 0%, #000 4%, #000 95%, transparent 100%);
  -webkit-mask-composite: source-in;
  mask-image: linear-gradient(to right, transparent 0%, #000 var(--side, 3%), #000 calc(100% - var(--side, 3%)), transparent 100%), linear-gradient(to bottom, transparent 0%, #000 4%, #000 95%, transparent 100%);
  mask-composite: intersect;
}
/* A photo narrower than the screen (portrait, or squarer than the screen) melts into its own
   blurred colours at the sides */
.slide.narrow img { --side: 14%; }
.saver-shade { position: absolute; inset: 0; pointer-events: none; }

/* Sample slides shown until the daily photos are connected */
.slide .art {
  position: absolute; inset: 0;
  display: grid; place-items: center; align-content: center; gap: 14px;
  background: radial-gradient(60% 75% at 50% 45%, color-mix(in srgb, var(--c) 55%, #120408), #120408 75%);
  text-align: center; color: var(--ink);
}
.slide .art svg { width: min(30vh, 160px); height: auto; }
.slide .art p { margin: 0; font-size: clamp(14px, 4vh, 19px); font-weight: 600; color: var(--muted); max-width: 30ch; line-height: 1.3; }
.slide .art b { display: block; font-size: clamp(11px, 2.8vh, 13px); letter-spacing: .14em; text-transform: uppercase; color: var(--marigold); margin-bottom: 4px; }

/* Option B: everything on one slim strip along the bottom */
.saver-bar {
  position: absolute; left: 0; right: 0; bottom: 0;
  display: flex; align-items: flex-end; gap: 14px;
  padding: 60px max(20px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  background: linear-gradient(transparent, color-mix(in srgb, var(--strip-tint) 60%, transparent) 40%, var(--strip-tint));
  color: var(--ink);
  text-shadow: 0 1px 8px rgba(0, 0, 0, .6);
  pointer-events: none;
}
/* Gentle relay (Oct 2026): the words fade away slowly, change while the new photo is halfway in,
   then fade back in slowly, so nothing on screen changes all at once */
.saver-words { position: relative; display: flex; flex-direction: column; gap: 2px; min-width: 0; padding-bottom: 6px; transition: opacity 4s ease-in-out; }   /* 4s away, 4s back (13 Oct 2026) */
/* A soft dark pool behind the words, so a gold title still stands out on bright gold shangar */
.saver-words::before { content: ""; position: absolute; z-index: -1; left: -6vw; right: -8vw; top: -6vh; bottom: -5vh; pointer-events: none;
  background: radial-gradient(closest-side, rgba(10, 2, 5, .62), rgba(10, 2, 5, .34) 60%, transparent); }
.saver-words.swap { opacity: 0; }
.saver-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
.saver-ago {
  flex: none; padding: 3px 10px 2px; border-radius: 99px;
  font-size: clamp(11px, 3.4vh, 14px); font-weight: 700; letter-spacing: .04em; white-space: nowrap;
  color: var(--badge-c); background: var(--badge-bg);
}
.saver-caption {
  max-width: min(46vw, 440px); font-size: clamp(13px, 4.2vh, 17px); font-style: italic; font-weight: 500; line-height: 1.25;
  color: var(--cap-c); opacity: .92;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
/* Each kind of photo has its own colours along the bottom:
   Daily Murti Darshan = marigold on maroon, On This Day = antique ivory on sepia,
   Latest Vicharan = peacock teal on deep teal */
@property --thread-c { syntax: '<color>'; inherits: true; initial-value: rgba(255, 207, 107, .45); }
@property --strip-tint { syntax: '<color>'; inherits: true; initial-value: rgba(12, 2, 6, .85); }
.saver { --strip-tint: rgba(26, 4, 10, .86); --title-c: #ffcf6b; --badge-bg: #ffc23d; --badge-c: #2a0a10; --date-c: #ffe7b8; --cap-c: #fff1d6; --thread-c: rgba(255, 207, 107, .45); }
/* The colours glide only on the parts that use them (18 Oct 2026: the tablet stuck for a frame now and then):
   gliding them on the whole screensaver made every part of it, the sky and the shlok page too, be worked out again
   on every frame for 3 to 4 seconds at each photo change */
.saver-bar { transition: --strip-tint 4s ease; }
.saver-thread { transition: --thread-c 3s ease; }
/* Maroon and gold stay the master colours; each kind of photo has its own accent (title, badge, tag dot, gold line) */
/* The words are classic gold on every kind of photo (13 Oct 2026); only the gold line keeps a hint of each kind's accent */
.saver[data-kind="memory"] { --thread-c: rgba(215, 222, 232, .55); }   /* On This Day: soft silver */
.saver[data-kind="latest"] { --thread-c: rgba(95, 160, 120, .6); }   /* Latest Vicharan: deep sage green */
.saver-title, .saver-date, .saver-caption, .saver-ago { transition: color 3s ease, background-color 3s ease; }
.saver-title { font-family: var(--title-font); font-size: clamp(19px, 6.4vh, 27px); white-space: nowrap; font-weight: 400; color: var(--title-c); letter-spacing: .02em; line-height: 1.1;
  text-shadow: 0 1px 2px rgba(0, 0, 0, .9), 0 2px 16px rgba(0, 0, 0, .75); }
.saver-date { font-size: clamp(14px, 4.4vh, 18px); font-weight: 600; color: #ffe7b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.saver-bar .saver-clock { margin-left: auto; }
/* Clock */
.saver-clock {
  font-size: clamp(74px, 34vh, 132px); font-weight: 800; line-height: .8; white-space: nowrap; letter-spacing: -.01em;
  color: #fff3dc; font-variant-numeric: tabular-nums; letter-spacing: .01em;
  text-shadow: 0 2px 14px rgba(0, 0, 0, .7);
}
.saver-clock small { font-size: .24em; font-weight: 700; margin-left: .18em; color: #ffd98c; letter-spacing: .04em; }

/* The breathing clock */
/* The clock's colon breathes slowly */
.saver-clock .colon { animation: breathe 4s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .saver-clock .colon { animation: none; } }

/* ================= Big screen (MacBook) layout: Golden Thread ================= */
.saver-tag {
  display: inline-flex; align-items: center; gap: .8em; margin-bottom: .5vh;
  font-size: clamp(11px, 1.55vh, 19px); font-weight: 600; letter-spacing: .26em; text-transform: uppercase; white-space: nowrap;
  color: var(--date-c); opacity: .78;
}
.saver-tag i { width: .62em; height: .62em; border-radius: 50%; background: var(--badge-bg); box-shadow: 0 0 .9em var(--badge-bg); animation: breathe 4s ease-in-out infinite; }
.saver-bar { padding: 16vh 4.5vw 4.4vh; gap: 3vw; }
.saver-words { gap: .5vh; padding-bottom: 1.4vh; }
.saver-title { font-size: clamp(19px, 4.9vh, 64px); }
.saver-date { font-size: clamp(14px, 2.6vh, 32px); }
.saver-ago { font-size: clamp(11px, 1.9vh, 22px); padding: .3em .9em .2em; }
.saver-caption { font-size: clamp(13px, 2.3vh, 28px); max-width: min(46vw, 900px); }
/* A caption always stays on one line, so the strip never grows up into the gold line:
   it may use the strip's width, and a long one gets a smaller font (fitCaption) */
.saver-caption { display: block; white-space: nowrap; text-overflow: ellipsis; max-width: 80vw; }
.saver.book .saver-caption { max-width: 62vw; }
.saver-clock { font-size: clamp(74px, 17vh, 220px); font-weight: 700; }
.saver-clock small { font-size: .22em; }
/* A fine golden thread above the strip, with a glint of light gliding along it */
.saver-thread {
  position: absolute; z-index: 2; left: 4.5vw; right: 4.5vw; bottom: calc(4.4vh + 17vh * .8 + 4.6vh - 2px); height: 5px;
  background: linear-gradient(90deg, transparent, var(--thread-c) 12%, var(--thread-c) 88%, transparent) center / 100% 1px no-repeat;
  pointer-events: none; overflow: visible;
}
.saver-thread::after {
  content: ""; position: absolute; top: 0; left: 0; width: 22vw; height: 5px; border-radius: 3px;
  background: radial-gradient(50% 50% at 50% 50%, rgba(255, 246, 214, .95), rgba(255, 194, 61, .5) 45%, transparent 75%);
  filter: blur(1px);
  animation: glide 16s ease-in-out infinite; will-change: transform;
}
@keyframes glide { 0% { transform: translateX(-24vw); } 100% { transform: translateX(95vw); } }
@media (prefers-reduced-motion: reduce) { .saver-thread::after, .saver-tag i { animation: none; } }
/* The words sit in the middle of the box under the line, across and up and down */
.saver-bar { top: auto; height: calc(4.4vh + 17vh * .8 + 4.6vh); padding-top: 0; padding-bottom: 0; align-items: center; justify-content: center; }
.saver-words { align-items: center; text-align: center; padding-bottom: 0; gap: 1.3vh; margin-top: 2vh; }   /* a little more room between the lines, sitting a touch lower */
.saver-head { justify-content: center; }
.saver-caption { padding: 0 .3em; }   /* room for the italic last letter, so it is never clipped */
/* A small gold symbol before the title says which kind of photo this is (13 Oct 2026) */
.saver-icon { flex: none; display: inline-flex; color: var(--title-c); filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .9)) drop-shadow(0 2px 10px rgba(0, 0, 0, .6)); }
.saver-icon svg { width: clamp(16px, 3.6vh, 46px); height: clamp(16px, 3.6vh, 46px); fill: currentColor; }
.saver-icon:empty { display: none; }
.saver.book .x-diya { position: absolute; right: 2vw; bottom: 2vh; margin: 0; }

</style>
</head>
<body>
<div class="saver" id="saver">
  <div id="slides"></div>
  <div class="photo-dim"></div>
  <div class="saver-shade"></div>
  <div class="saver-thread" aria-hidden="true"></div>
  <div class="saver-bar">
    <span class="saver-words"><span class="saver-tag" id="saverTag" hidden><i></i></span><span class="saver-head"><span class="saver-icon" id="saverIcon" aria-hidden="true"></span><span class="saver-title" id="saverTitle">Daily Murti Darshan</span><span class="saver-ago" id="saverAgo" hidden></span></span>
    <span class="saver-date" id="saverDate"></span><span class="saver-caption" id="saverCaption" hidden></span></span>
    <span class="saver-clock" id="saverClock"></span>
  </div>
</div>

<script>
/* =========================================================
   Darshan Screensaver: settings
   ========================================================= */
/* Clock on the screensaver */
const CLOCK_24_HOUR = false;

/* On This Day: photos of Swamishri from today's date in past years (BAPS vicharan archive, 2016 onwards),
   shown in turn with the darshan photos. memories/MM-DD.json lists the photos for each day of the year
   (gathered from baps.org once, Oct 2026, keeping only photos whose caption shows Swamishri on his own);
   the photos themselves load straight from baps.org. Set MEMORIES_URL to "" to switch it off. */
// Add ?plain to the address to switch On This Day (and the extras) off.
const MEMORIES_URL = /[?&]plain\b/.test(location.search) ? "" : "data/";   // latest.json and schedule.json, made by tools/web_screensaver.py
// Bapa's Diary (29 Oct 2026): everything comes from the website's own copies, never live from another site.
//   darshan    the mandir's daily photos, copied each morning to photos.bapas-diary.com/darshan/ (.github/workflows/screensaver-darshan.yml)
//   day        the Today page's own data for the day (photos with Bapa in person only, as the Today page shows)
//   copy       the website's photo copy at full screen size (l/, 2560 px)
const SS = Object.assign({ darshan: "https://photos.bapas-diary.com/darshan/", day: "/data/day/", copy: "https://photos.bapas-diary.com/l/" }, window.SS_MOCK || {});
const MEMORIES_PER_DAY = 400;          // every photo for the day: they load one at a time, so a long list costs nothing
const SECONDS_PER_PHOTO = 40;          // how long each photo stays (16 Oct 2026: another 5 seconds)
const PHOTO_FADE_SECONDS = 11;         // how slowly one photo melts into the next (5 seconds longer)
const WORDS_FADE_SECONDS = 4;          // the words fade away over 4s, then the new ones fade in over 4s: 8s in all
const PHOTO_DIM = 0.10;                // every photo 10% darker (0 = full brightness)
// The mandir posts photos each morning at:
//   .../daily-murti/20261007/ddm_07.jpg   (date folder, photo code, day of month)
// PHOTO_CODES: exactly the photos chosen (Oct 2026), in this order. Nothing else is shown.
// Any photo not posted that day is simply skipped.
const PHOTO_CODES = ["ddm", "ddm_c", "gm", "gm_c", "hkm_c", "varni", "bm", "sm", "ym", "psm"];
// Two photos that stay the same every day, shown after the daily ones.
const DARSHAN_BASE = SS.darshan;
const FIXED_PHOTOS = [DARSHAN_BASE + "others/msm-static.jpg", DARSHAN_BASE + "others/ss-static.jpg"];
function darshanPhotosFor(date) {
  const ymd = dayKey(date), dd = ymd.slice(6);
  return PHOTO_CODES.map(code => `${DARSHAN_BASE}${ymd}/${code}_${dd}.jpg`);
}
// Only photos from the chosen list are ever shown (so an old saved list can't bring others back)
function isChosenPhoto(u) {
  if (FIXED_PHOTOS.includes(u)) return true;
  const m = u.match(/darshan\/(\d{8})\//);
  return !!m && darshanPhotosFor(new Date(+m[1].slice(0, 4), +m[1].slice(4, 6) - 1, +m[1].slice(6, 8))).includes(u);
}
/* ========================================================= */

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// The photo keeper (sw.js) saves each darshan photo on the Mac after its first download
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
}

// Self update: the Mac can keep this page open for days, so every 10 minutes it quietly
// fetches a fresh copy of itself and reloads when a new version has gone live.
// Saved photos come straight back from the photo keeper, so the reload is near instant.
(function selfUpdate() {
  if (location.protocol !== 'https:') return;
  const hash = t => { let h = 0; for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) | 0; return h; };
  const latest = () => fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' })
    .then(r => r.ok ? r.text() : null).then(t => t && hash(t)).catch(() => null);
  // Each deploy writes its own name into this page and into version.txt. A page whose name differs from
  // version.txt is an old copy the Mac kept (22 Oct 2026: a fixed bug came back two days
  // after its fix went live, because the Mac was still showing an older copy of the page).
  const BUILD = 'DARSHAN_BUILD_ID';
  const old = () => BUILD.startsWith('DARSHAN_') ? Promise.resolve(false)
    : fetch('version.txt?v=' + Date.now(), { cache: 'no-store' })
      .then(r => r.ok ? r.text() : null).then(t => !!t && /^\w{7,40}$/.test(t.trim()) && t.trim() !== BUILD).catch(() => false);
  const refresh = () => {
    // at most once an hour, in case the page ever differs from one fetch to the next
    let last = 0; try { last = +localStorage.getItem('darshan-self-update') || 0; } catch (e) {}
    if (Date.now() - last < 60 * 60 * 1000) return;
    try { localStorage.setItem('darshan-self-update', String(Date.now())); } catch (e) {}
    document.body.style.transition = 'opacity 1.5s ease';   // a soft fade, not a flash
    document.body.style.opacity = '0';
    setTimeout(() => location.reload(), 1600);
    // if the reload doesn't happen (the screensaver app may refuse it), the screen comes back rather than staying dark
    setTimeout(() => { document.body.style.opacity = ''; }, 10000);
  };
  setTimeout(async () => { if (await old()) refresh(); }, 30 * 1000);
  let mine = null;
  latest().then(h => { mine = h; });
  setInterval(async () => {
    if (await old()) return refresh();
    const h = await latest();
    if (h === null) return;
    if (mine === null) { mine = h; return; }
    if (h !== mine) refresh();
  }, 10 * 60 * 1000);
})();


// Only one copy at a time (19 Oct 2026: Activity Monitor showed 14 copies of this page).
// A macOS bug keeps old screensaver copies running, hidden, after the screensaver is dismissed, and each
// new start adds another. Every copy says when it started; when an older copy hears that a newer one has
// started (more than 20 seconds later, so one copy per screen is fine), it switches itself off and empties
// to a blank page, giving its memory back. The start time survives the self update's reload.
(function oneCopy() {
  let born = 0;
  try { born = +sessionStorage.getItem('darshan-born') || 0; } catch (e) {}
  if (!born) { born = Date.now(); try { sessionStorage.setItem('darshan-born', String(born)); } catch (e) {} }
  const sleep = () => {
    try { const top = setTimeout(() => {}, 0); for (let i = 0; i <= top; i++) { clearTimeout(i); clearInterval(i); } } catch (e) {}
    try { document.documentElement.style.background = '#000'; document.body.innerHTML = ''; } catch (e) {}
    location.replace('about:blank');
  };
  const heard = b => { if (+b > born + 20000) sleep(); };
  let ch = null;
  try { ch = new BroadcastChannel('darshan-copies'); ch.onmessage = e => heard(e.data && e.data.born); } catch (e) {}
  window.addEventListener('storage', e => { if (e.key === 'darshan-newest') heard(String(e.newValue).split(':')[0]); });
  const say = () => {
    try { ch && ch.postMessage({ born }); } catch (e) {}
    try { localStorage.setItem('darshan-newest', born + ':' + Date.now()); } catch (e) {}   // the time part makes every write a change
  };
  say(); setInterval(say, 60000);
})();

/* ---------- Clock ---------- */
function renderClock() {
  const d = new Date();
  let h = d.getHours();
  const mm = String(d.getMinutes()).padStart(2, '0');
  const el = document.getElementById('saverClock');
  const colon = '<span class="colon">:</span>';
  let html;
  if (CLOCK_24_HOUR) html = String(h).padStart(2, '0') + colon + mm;
  else { const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; html = h + colon + mm + '<small>' + ap + '</small>'; }
  if (el.dataset.t !== html) { el.dataset.t = html; el.innerHTML = html; }   // only when the minute changes, so the colon breathes smoothly
}
renderClock();
setInterval(renderClock, 10000);

/* ---------- The slideshow ---------- */
const saver = document.getElementById('saver');
const slidesEl = document.getElementById('slides');
saver.style.setProperty('--photo-dim', PHOTO_DIM);
let saverOn = false;
let slideTimer = null, slideIndex = 0;
let photosDay = '';     // which day's photos are loaded
let photos = [];        // working photo addresses for that day
let memories = [], memoriesDay = '', memoriesTried = 0;   // On This Day photos
let latest = [], latestTried = 0;                          // Latest Vicharan photos
let sarangpur = null, sarangpurTried = 0;                  // one Sarangpur mandir darshan photo a day
let slideItems = [];    // what each slide is (darshan, memory or latest)
let slideOrder = [], orderStart = 0, blockQueues = {};   // the order slides show in, and where it began
let darshanTitle = 'Daily Murti Darshan', darshanDateText = '';

const dayKey = d => d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
const prettyDate = d => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });   // same style as On This Day and Latest Vicharan

// Keep only the photos that actually load (the mandir uploads them around 7 to 8am)
function checkPhotos(urls, onEach) {
  return Promise.all(urls.map(u => new Promise(res => {
    const im = new Image();
    im.referrerPolicy = 'no-referrer';
    im.onload = () => { if (onEach) onEach(u); res(u); }; im.onerror = () => res(null);
    im.src = u;
  }))).then(list => list.filter(Boolean));
}

// while it checks for newer ones in the background.

}

      const kept = r.photos.filter(isChosenPhoto);
      r.trimmed = kept.length !== r.photos.length;   // saved before the photo list changed: look again
      r.photos = kept;

}

// screen down), and tidy away photos more than three days old.

  if (!('caches' in window)) return;
  keeping = keeping.then(async () => {
    try {

      const oldest = new Date(); oldest.setDate(oldest.getDate() - 3);
      for (const req of await cache.keys()) {
        const m = req.url.match(/darshan\/(\d{8})\//);
        if (m && m[1] < dayKey(oldest) && !list.includes(req.url)) await cache.delete(req);
      }

        if (await cache.match(u)) continue;

      }
    } catch (e) {}

}

  darshanDateText = prettyDate(shown);
}
const fromKey = k => new Date(+k.slice(0, 4), +k.slice(4, 6) - 1, +k.slice(6, 8));

// Straight away: show the photos from last time (instant, they're already on the Mac)
(function showRemembered() {
  const r = rememberedPhotos();
  if (!r) return;
  const today = new Date();
  photos = r.photos;
  setDarshanDay(fromKey(r.day), today);
  if (r.day === dayKey(today) && !r.trimmed) photosDay = r.day;   // already have today's: nothing to look for
})();

let refreshing = null;   // one look at a time

  return refreshing;
}
async function lookForPhotos() {

  const before = photos.join('|');
  // Nothing on screen yet: show the first photo the moment it arrives, rather than waiting for them all
  const showFirst = shown => u => {
    if (photos.length) return;
    photos = [u];
    setDarshanDay(shown, today);
    buildSlides(); if (saverOn) showSlide(slideIndex = 0);
  };
  let found = await checkPhotos(darshanPhotosFor(today), showFirst(today));
  let shown = today;
  if (!found.length) {   // today's not up yet: show yesterday's
    const y = new Date(today); y.setDate(y.getDate() - 1);
    const r = rememberedPhotos();
    if (r && r.day === dayKey(y)) found = r.photos.filter(u => !FIXED_PHOTOS.includes(u));   // already have yesterday's
    else found = await checkPhotos(darshanPhotosFor(y), showFirst(y));
    shown = y;
  }
  if (found.length) found = found.concat(await checkPhotos(FIXED_PHOTOS));

// On This Day: read today's list (memories/MM-DD.json), then take a few from each past year

// The Today page's day data: years[{y, place, p: [[album, file, caption, bapa, face, website caption], ...]}]. Only the
// day's own photos (not the trip around it), from the website's own copy, with the caption the Today page shows.

async function refreshMemories() {

  memoriesTried = Date.now();
  const mmdd = String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
  let list = null;   // the Today page's data for the day, turned into the kit's list (Bapa's Diary, 29 Oct 2026)
  try { const res = await fetch(SS.day + mmdd + '.json', { cache: 'no-cache' }); if (res.ok) list = dayToMemories(await res.json(), mmdd); else if (res.status === 404) list = []; } catch (e) {}

  list.filter(p => p.y < today.getFullYear()).forEach(p => (byYear[p.y] = byYear[p.y] || []).push(p));
  const years = Object.keys(byYear).sort((a, b) => b - a).map(y => byYear[y]);

  for (let k = 0; picked.length < MEMORIES_PER_DAY; k++) {
    let any = false;
    for (const y of years) {
      if (!y[k]) continue;

      const [yy, mm, dd] = y[k].d.split('-').map(Number);
      picked.push({ img: y[k].i, year: y[k].y, place: y[k].p, caption: y[k].c,
        when: new Date(yy, mm - 1, dd).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) });
      if (picked.length >= MEMORIES_PER_DAY) break;

  memoriesDay = key;

}

// Latest Vicharan: memories/latest.json, newest first (img, iso, when, place, caption, tz).
// Missing or empty file: nothing shows, quietly. Its place and tz also give Bapa's time.

  latestTried = Date.now();

  try { const res = await fetch(MEMORIES_URL + 'latest.json', { cache: 'no-cache' }); if (res.ok) list = await res.json(); else if (res.status === 404) list = []; } catch (e) {}

function daysAgo(iso) {
  if (!iso) return 'Latest';
  const [y, m, d] = iso.split('-').map(Number);
  const now = new Date();
  const n = Math.round((Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - Date.UTC(y, m - 1, d)) / 86400000);
  return n <= 0 ? 'Today' : n === 1 ? 'Yesterday' : n + ' days ago';
}

function updateStrip(item, now) {   // now: the words have already faded away, put the new ones straight in
  const title = document.getElementById('saverTitle'), date = document.getElementById('saverDate');
  const cap = document.getElementById('saverCaption'), ago = document.getElementById('saverAgo');
  let t, d, c = '', a = '';

  if (item && item.kind === 'latest') {
    t = 'Latest Vicharan';
    a = daysAgo(item.iso);
    d = item.when + (item.place ? ' · ' + item.place : '');
    c = item.caption || '';
  } else if (item && item.kind === 'memory') {
    const n = new Date().getFullYear() - item.year;
    t = 'On This Day';

    d = item.when + (item.place ? ' · ' + item.place : '');

  } else if (item && item.mandir) {   // Sarangpur: its own date, and a gold tag naming the mandir
    const [y, m, dd] = item.iso.split('-').map(Number);

    d = prettyDate(new Date(y, m - 1, dd));

function fitCaption(cap) {

.x-sun .x-sun-arti .x-diya .glow { width: calc(var(--page-w) * .34); height: calc(var(--page-w) * .34); margin: calc(var(--page-w) * -.17) 0 0 calc(var(--page-w) * -.17); }

<script>
(() => {
  /* ---------- Settings for the extras ---------- */
  const EXTRAS = {
    vaghaColour: true,           // strip words and gold line take on the colour of the day's shangar
    timeOfDay: true,             // strip background follows the sun
    sunPath: true,               // top of the page: the sun's path today and the time of day
    aarti: true,
    aartiMinutes: 20,            // how long the diya shows after each arti starts
    artiSoonMinutes: 60,         // on the page: "Shayan Arti at Neasden in 20 min" for the hour before each arti
    nightDim: { from: '22:00', to: '06:00', level: 0.5 },   // 0.5 = half brightness; set to null to switch off
    shlok: true,
    shlokPhotos: 2,              // a different shlok, picked at random, with every second photo (about every 50 seconds)
    swamishriClock: true,        // under the clock: the time where Swamishri is now (from the Latest Vicharan place)
  };
  // Neasden arti times (londonmandir.baps.org, Worship, Arti)
  const ARTIS = [['06:00', 'Mangala'], ['07:30', 'Shangar'], ['11:45', 'Rajbhog'], ['19:00', 'Sandhya'], ['20:00', 'Shayan']];
  // Strip background through the day: [from, colour]
  // Strip background through the day, following the real sunrise and sunset at Neasden:
  // dawn from half an hour before sunrise, day from 3 hours after, golden evening from
  // 90 minutes before sunset, night from an hour after it.
  const TOD_COLOURS = { dawn: 'rgba(74, 46, 6, .88)', day: 'rgba(26, 4, 10, .86)', evening: 'rgba(92, 30, 4, .88)', night: 'rgba(10, 12, 46, .9)' };
  // The sky and the weather follow the device's own place once it allows it (Darpan, 29 Oct 2026: "the weather ... dependent
  // on the local location"); until then, and when it doesn't, Neasden. The place is remembered, so the next start has it at once.
  const NEASDEN = { lat: 51.5487, lon: -0.2614, name: 'Neasden' };
  let WHERE = NEASDEN;
  try { const w = JSON.parse(localStorage.getItem('darshan-where') || 'null'); if (w && isFinite(w.lat) && isFinite(w.lon)) WHERE = { lat: w.lat, lon: w.lon, name: '' }; } catch (e) {}
  // Sunrise and sunset in minutes after local midnight (the NOAA sunrise equation)
  function sunTimes(d) {
    const rad = Math.PI / 180, day = Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(2000, 0, 1, 12)) / 864e5) + 1;
    const n = day - WHERE.lon / 360, M = (357.5291 + 0.98560028 * n) % 360;
    const C = 1.9148 * Math.sin(M * rad) + 0.02 * Math.sin(2 * M * rad) + 0.0003 * Math.sin(3 * M * rad);
    const L = (M + C + 180 + 102.9372) % 360;
    const noon = 2451545 + n + 0.0053 * Math.sin(M * rad) - 0.0069 * Math.sin(2 * L * rad);
    const dec = Math.asin(Math.sin(L * rad) * Math.sin(23.44 * rad));
    const w = Math.acos((Math.sin(-0.833 * rad) - Math.sin(WHERE.lat * rad) * Math.sin(dec)) / (Math.cos(WHERE.lat * rad) * Math.cos(dec))) / rad;
    const local = jd => { const t = new Date((jd - 2440587.5) * 864e5); return t.getHours() * 60 + t.getMinutes(); };
    return { rise: local(noon - w / 360), set: local(noon + w / 360) };
  }
  function todTint(m) {
    const { rise, set } = sunTimes(new Date());
    if (m >= set + 60 || m < rise - 30) return TOD_COLOURS.night;
    if (m < rise + 180) return TOD_COLOURS.dawn;
    if (m < set - 90) return TOD_COLOURS.day;
    return TOD_COLOURS.evening;
  }
  // Satsang Diksha shloks, word for word from the BAPS book "Satsang Diksha (Gujarati-Sanskrit-English)", 2020.
  // Each line: shlok number, the Sanskrit shlok, the English translation. Shown in a shuffled order.
  // Where the book gives one meaning for a few shloks together (4–5 and so on), they are one entry.
  // Vachanamrut and Swamini Vato, mixed in with the shloks (empty for now). Word for word from a printed copy only.
  // Each line: reference, the original words (or "" if only English), the English. e.g.
  // ["Gadhada I-1", "", "English words…"]   or   ["1.25", "Gujarati in English letters…", "English words…"]
  const VACHANAMRUT = [];
  const SWAMINI_VATO = [];
  const SHLOKS = [
    ["1", "Swāminārāyaṇah sākshād\nAkshara-Purushottamaha;\nSarvebhyah paramām shāntim\nānandam sukham arpayet.", "May Swaminarayan Bhagwan, who is Akshar-Purushottam Maharaj himself, bestow ultimate peace, bliss and happiness on all."],
    ["2", "Deho’yam sādhanam mukter\nna bhoga-mātra-sādhanam;\nDurlabho nashvarash-chā’yam\nvāram-vāram na labhyate.", "This body is a means for moksha, not merely a means for indulgence [in sense pleasures]. Rare and perishable, this body is not repeatedly attained."],
    ["3", "Laukiko vyavahāras-tu\ndeha-nirvāha-hetukaha;\nNaiva sa paramam lakshyam\nasya manushya-janmanaha.", "Personal and family activities are [only] for the sustenance of the body. They are not the ultimate objective of this human birth."],
    ["4–5", "Nāshāya sarva-doshāṇām\nbrahma-sthiter avāptaye;\nKartum Bhagavato bhaktim\nasya dehasya lambhanam.\nSarvam idam hi satsangāllabhyate nishchitam janaihi;\nAtah sadaiva satsangah\nkaraṇīyo mumukshubhihi.", "This body has been received to eradicate all flaws, attain the brāhmic state and offer devotion to Bhagwan. All this is certainly attained by practising satsang. Therefore, mumukshus should always practise satsang."],
    ["6", "Satsangah sthāpitas-tasmād\ndivyo’yam Parabrahmaṇā;\nSwāminārāyaṇeneha\nsākshād evā’vatīrya cha.", "For this reason, Parabrahma Swaminarayan himself manifested in this world and established this divine Satsang."],
    ["7", "Satsangasyā’sya vignānam\nmumukshūṇām bhaved iti;\nShāstram Satsanga-Dīksheti\nshubhā’shayād virachyate.", "The shastra titled ‘Satsang Diksha’ has been composed with the pure intent that mumukshus acquire the knowledge of this satsang."],
    ["8–9", "Satyasya svātmanah sangah\nsatyasya Paramātmanaha;\nSatyasya cha guroh sangah\nsach-chhāstrāṇām tathaiva cha.\nVignātavyam idam satyam\nsatsangasya hi lakshaṇam;\nKurvan-nevam vidham divyam\nsatsangam syāt sukhī janaha.", "One should know that the true meaning of satsang is to associate with the ātmā, which is true; to associate with Paramatma, who is true; to associate with the guru, who is true; and to associate with true shastras. One who practises this divine satsang becomes blissful."],
    ["10", "Dīksheti draḍha-sankalpah\nsa-shraddham nishchayo’chalaha;\nSamyak samarpaṇam prītyā\nnishṭhā vratam draḍhāshrayaha.", "‘Diksha’ means firm resolve, unwavering conviction coupled with faith, absolute dedication, loving faith, observances and firm refuge."],
    ["11", "Shāstre’smin gnāpitā spashṭam\nāgnopāsana-paddhatihi;\nParamātma-Parabrahma-Sahajānanda-darshitā.", "The methods of āgnā and upāsanā revealed by Parabrahma Sahajanand Paramatma are clearly expressed in this shastra."],
    ["12", "Satsangā’dhikrutah sarve\nsarve sukhā’dhi-kāriṇaha;\nSarve’rhā brahmavidyāyām\nnāryash-chaiva narās-tathā.", "All males and females are entitled to satsang, all are entitled to happiness and all are entitled to brahmavidyā."],
    ["13", "Naiva nyūnādhikatvam syāt\nsatsange linga-bhedataha;\nSva-sva-maryādayā sarve\nbhaktyā muktim samāpnuyuhu.", "In Satsang, superiority or inferiority should never be understood to be based on gender. All can attain moksha through devotion while observing the dharma prescribed for them."],
    ["14–16", "Sarva-varṇa-gatāh sarvā\nnāryah sarve narās-tathā;\nSatsange brahmavidyāyām\nmokshe sadā’dhikāriṇaha.\nNa nyūnā’dhikatā kāryā\nvarṇā’dhāreṇa karhichit;\nTyaktvā sva-varṇa-mānam cha\nsevā kāryā mithah samaihi.\nJātyā naiva mahān ko’pi\nnaiva nyūnas-tathā yataha;\nJātyā klesho na kartavyah\nsukham satsangam ācharet.", "All men and women of all castes are forever entitled to satsang, brahmavidyā and moksha. Do not attribute notions of superiority and inferiority based on varna. All persons should shun their ego based on their caste and serve one another. No one is superior and no one is inferior by birth. Therefore, one should not quarrel based on caste or class and should joyfully practise satsang."],
    ["17", "Sarve’dhikāriṇo mokshe\ngruhiṇas-tyāgino’pi cha;\nNa nyūnā’dhikatā tatra\nsarve bhaktā yatah Prabhoho.", "Householders and renunciants are all entitled to moksha. Between them neither is inferior nor superior, because householders and renunciants are all devotees of Bhagwan."],
    ["18", "Swāminārāyaṇe’nanya-draḍha-parama-bhaktaye;\nGruhītvā’shraya-dīkshāyā\nmantram satsangam āpnuyāt.", "To offer singular, resolute and supreme devotion to Bhagwan Swaminarayan, one should receive the Ashray Diksha Mantra and affiliate with the Satsang."],
    ["19", "Āshraya-dīkshā-mantrash-chaivam vidhaha:\nDhanyo’smi pūrṇakāmo’smi\nnishpāpo nirbhayah sukhī;\nAkshara-guru-yogena\nSwāminārāyaṇā’shrayāt.", "The Ashray Diksha Mantra is as follows: Dhanyo’smi purna-kāmo’smi nishpāpo nirbhayah sukhi; Akshara-guru-yogena Swāminārāyan-āshrayāt."],
    ["20", "Āshrayet Sahajānandam\nHarim Brahmā’ksharam tathā;\nGuṇātītam gurum prītyā\nmumukshuh svātma-muktaye.", "For the moksha of one’s ātmā, a mumukshu should lovingly take refuge of Sahajanand Shri Hari and the Aksharbrahma Gunatit guru."],
    ["21", "Kāshṭha-jām dvi-guṇām mālām\nkaṇṭhe sadaiva dhārayet;\nSatsangam hi samāshritya\nsatsanga-niyamāns-tathā.", "Upon taking the refuge of satsang, one should always wear a double-stranded wooden kanthi around the neck and accept the niyams of satsang."],
    ["22", "Gurum Brahmaswarūpam tu\nvinā na sambhaved bhave;\nTattvato brahmavidyāyāh\nsākshātkāro hi jīvane.", "In this world, brahmavidyā cannot be fully realized in life without the Brahmaswarup guru."],
    ["23", "Nottamo nirvikalpash-cha\nnishchayah Paramātmanaha;\nNa svātma-brahma-bhāvo’pi\nBrahmā’ksharam gurum vinā.", "Without the Aksharbrahma guru, supreme, unwavering conviction (nishchay) in Paramatma cannot be attained and one’s ātmā also cannot acquire brahmabhāv."],
    ["24", "Naivā’pi tattvato bhaktih\nparamānanda-prāpaṇam;\nNā’pi trividha-tāpānām\nnāsho Brahma-gurum vinā.", "Without the Brahmaswarup guru, perfect devotion also cannot be offered, ultimate bliss cannot be attained and the three types of miseries also cannot be eradicated."],
    ["25", "Atah samāshrayen-nityam\npratyaksham Aksharam gurum;\nSarva-siddhi-karam divyam\nParamātmā’nubhāvakam.", "Therefore, one should always take the refuge of the manifest Aksharbrahma guru, who enables one to attain all objectives and experience Paramatma."],
    ["26", "Sarvam dur-vyasanam tyājyam\nsarvaih satsangibhih sadā;\nAneka-roga-dukhānām\nkāraṇam vyasanam yataha.", "All satsangis should always renounce all harmful addictions, as addictions cause numerous illnesses and miseries."],
    ["27", "Surā-bhangā-tamālādi\nyad yad bhaveddhi mādakam;\nTad bhakshayet piben-naiva\ndhūmra-pānam api tyajet.", "One should never consume intoxicating substances, such as alcohol, bhang and tobacco. One should also refrain from smoking."],
    ["28", "Pari-tyājyam sadā dyūtam\nsarvaih sarva-prakārakam;\nTyaktavyo vyabhichārash-cha\nnārībhih purushais-tathā.", "All women and men should never engage in any form of gambling or adultery."],
    ["29", "Mānsam matsyam tathā’ṇḍāni\nbhakshayeyur na karhichit;\nPalāṇḍum lashunam hingu\nna cha satsangino janāhā.", "Satsangis should never eat meat, fish, eggs, onions, garlic or hing."],
    ["30", "Pātavyam gālitam peyam\njalam dugdhādikam tathā;\nKhādyam pānam ashuddham yad\ngrahṇīyād vastu tan-nahi.", "One should consume water, milk and other drinkable items [only] after they have been filtered. Food items and beverages that are forbidden should never be consumed."],
    ["31", "Chauryam na karhichit kāryam\nsatsangam āshritair janaihi;\nDharmārtham api no kāryam\nchora-kāryam tu karhichit.", "Satsangis should never steal. Even for the sake of dharma, one should never commit theft."],
    ["32", "Naivā’nya-svāmikam grāhyam\ntad-anugnām vinā svayam;\nPushpa-falādyapi vastu\nsūkshma-chauryam tad uchyate.", "One should never take even objects such as flowers or fruits without the consent of their owners. Taking without consent is a subtle form of theft."],
    ["33–34", "Manushyāṇām pashūnām vā\nmatkuṇādesh-cha pakshiṇām;\nKeshānchij-jīva-jantūnām\nhinsā kāryā na karhichit.\nAhinsā paramo dharmo\nhinsā tvadharma-rūpiṇī;\nShruti-smrutyādi-shāstreshu\nsfuṭam evam prakīrtitam.", "One should never kill humans, animals, birds and bugs or other insects and creatures. The Shrutis, Smrutis and other sacred texts clearly describe non-violence as the highest dharma and violence as adharma."],
    ["35", "Yāgārtham apyajādīnām\nnirdoshāṇām hi prāṇinām;\nHinsanam naiva kartavyam\nsatsangibhih kadāchana.", "Even for a yagna, satsangis should never harm goats or any other innocent animals."],
    ["36", "Yāgādike cha kartavye\nsiddhāntam sāmpradāyikam;\nAnusrutya hi kartavyam\nhinsā-rahitam eva tat.", "When yagnas are held, they should only be conducted without harming any beings and according to the Sampradaya’s principles."],
    ["37", "Matvā’pi yagna-shesham cha\nvā’pi deva-niveditam;\nMānsam kadāpi bhakshyam na\nsatsangam āshritair janaihi.", "Satsangis should never eat meat, even if it is considered to be the remnant of a yagna or sanctified by the deities."],
    ["38", "Kasyā’pi tāḍanam naiva\nkaraṇīyam kadāchana;\nApa-shabdā’pamānādi\nsūkshma-hinsā’pi naiva cha.", "One should never strike another person. One should not swear, insult or commit other forms of subtle harm or injury."],
    ["39", "Sattā-kīrti-dhana-dravya-strī-purushādikā’ptaye;\nMānershyā-krodhatash-chā’pi\nhinsām naiva samācharet.", "One should not commit violence to attain wealth, power, prestige or [to fulfil one’s desire] for a man or woman or anything else. Also, one should not commit violence out of ego, jealousy or anger."],
    ["40", "Manasā vachasā vā’pi\nkarmaṇā hinsane krute;\nTat-sthito dukhyate nūnam\nSwāminārāyaṇo Harihi.", "Inflicting mental, verbal or physical violence pains Swaminarayan Bhagwan, who resides within that person."],
    ["41", "Ātma-ghāto’pi hinsaiva\nna kāryo’tah kadāchana;\nPatana-gala-bandhādyair\nvisha-bhakshādibhis-tathā.", "Suicide is also a form of violence. Therefore, never commit suicide by falling from heights, hanging oneself, consuming poison or any other means."],
    ["42", "Dukha-lajjā-bhaya-krodha-rogādyāpatti kāraṇāt;\nDharmā’rtham api kashchiddhi\nhanyān-na svam na vā param.", "No one should kill oneself or others out of grief, shame, fear, anger or due to illness and other adversities, not even for the sake of dharma."],
    ["43", "Tīrthe’pi naiva kartavya\nātma-ghāto mumukshubhihi;\nNaivā’pi moksha-puṇyāpti\nbhāvāt kāryah sa tatra cha.", "A mumukshu should never commit suicide even at a place of pilgrimage. One should never commit suicide at pilgrimage places even with the hope of attaining moksha or merits."],
    ["44", "Bhagavān sarva-kartā’sti\ndayāluh sarva-rakshakaha;\nSa eva nāshakah sarva-sankaṭānām sadā mama.", "Bhagwan is the all-doer, compassionate and the protector of all; at all times, he alone is the resolver of all my adversities."],
    ["45", "Bhagavān kurute yaddhi\nhitārtham eva tat sadā;\nPrārabdham me tad ichchhaiva\nsa eva tārako mama.", "Whatever Bhagwan does is always beneficial. His wish alone is my prārabdha. He alone is my liberator."],
    ["46", "Nūnam nankshyanti me vighnāh\npāpa-doshāsh-cha dur-guṇāhā;\nNūnam prāpsyāmyaham shāntim\nānandam paramam sukham.", "My hindrances, sins, flaws and bad qualities will certainly be destroyed. I will surely attain peace, supreme bliss and happiness."],
    ["47", "Yato mām militah sākshād\nAkshara-Purushottamaha;\nNishchayena tarishyāmi\ndukha-jātam hi tad balāt.", "This is because I have attained the manifest form of Akshar-Purushottam Maharaj. With his strength, I will surely overcome misery."],
    ["48", "Vichāryaivam balam rakshed\nnā’shrito nirbalo bhavet;\nĀnandito bhaven-nityam\nBhagavad bala vaibhavāt.", "With the strength of such thoughts, a devotee who has taken refuge never loses courage and remains joyous due to the strength of Bhagwan."],
    ["49", "Shṭhīvanam mala-mūtrādi-visarjanam sthaleshu cha;\nShāstra-loka-nishiddheshu\nna kartavyam kadāchana.", "One should never spit, urinate or defaecate in places prohibited by the shastras and society."],
    ["50", "Shuddhih sarvavidhā pālyā\nbāhyā chā’bhyantarā sadā;\nShuddhi-priyah prasīdech-cha\nshuddhi-mati jane Harihi.", "One should observe all forms of external and internal purity. Shri Hari loves purity and is pleased with those who are pure."],
    ["51", "Satsangibhih praboddhavyam\npūrvam sūryodayāt sadā;\nTatah snānādikam krutvā\ndhartavyam shuddha vastrakam.", "Satsangis should always wake up before sunrise. After bathing and other morning routines, they should put on clean clothes."],
    ["52", "Pūrvasyām uttarasyām vā\ndishi krutvā mukham tataha;\nShuddhā’sanopavishṭah san-nitya-pūjām samācharet.", "Thereafter, one should sit on a clean āsan and perform personal daily puja facing east or north."],
    ["53–54", "Prabhu-pūjopa-yuktena\nchandanenordhva puṇḍrakam;\nBhāle hi tilakam kuryāt\nkumkumena cha chandrakam.\nUrasi hastayosh-chandram\ntilakam chandanena cha;\nSwāminārāyaṇam mantram\njapan kuryād gurum smaran.", "While chanting the Swaminarayan mantra and remembering the guru, apply a U-shaped tilak made from chandan that has been sanctified by having been offered to Bhagwan and a kumkum chāndlo to the forehead. One should also apply a tilak-chāndlo of chandan to the chest and both arms."],
    ["55", "Kevalam chandrakah strībhih\nkartavyas-tilakam na hi;\nKumkuma dravyato bhāle\nsmarantībhir Harim gurum.", "While remembering Bhagwan and the guru, women should imprint only a kumkum chāndlo to their foreheads. They should not apply a tilak."],
    ["56–58", "Tatah pūjā’dhikārāya\nbhaktah satsangam āshritaha;\nKuryād ātma-vichāram cha\npratāpam chintayan Harehe.\nAksharam-aham ityevam\nbhaktyā prasanna chetasā;\nPurushottama dāso’smi\nmantram etam vadech-chhuchim.\nAksharabrahma rūpatvam\nsvasyā’tmani vibhāvayet;\nKuryāch-cha mānasīm pūjām\nshānta ekāgra chetasā.", "Thereafter, to gain the privilege to perform puja, a devotee who has taken the refuge of satsang should meditate on their ātmā while contemplating upon the glory of Bhagwan. The sacred mantra ‘Aksharam-aham Purushottam-dāso’smi’ should be recited with joy and devotion. One should identify one’s ātmā with Aksharbrahma and perform mānsi puja with a calm and focused mind."],
    ["59", "Harir Brahma-gurush-chaiva\nbhavato moksha-dāyakau;\nTayor eva hi kartavyam\ndhyānam mānasa-pūjanam.", "Only Bhagwan and the Brahmaswarup guru can bestow moksha. Therefore, one should only meditate upon them and perform their mānsi puja."],
    ["60", "Sthāpayech-chitra-mūrtīsh-cha\nshuchi vastropari tataha;\nDarshanam syād yathā samyak\ntathā hi bhakti-bhāvataha.", "Thereafter, devoutly place the pictorial murtis on a clean cloth in a way that one can easily do their darshan."],
    ["61", "Madhye tu sthāpayet tatra\nhyakshara-Purushottamau;\nSwāminam hi Guṇātītam\nMahārājam cha tat param.", "In the centre, one should arrange the murtis of Akshar and Purushottam, that is, Gunatitanand Swami and the one who transcends him, [Shriji] Maharaj."],
    ["62", "Pramukha-Swāmi paryantam\npratyeka guru-mūrtayaha;\nPrasthāpyāh sevitānām cha\npratyaksham mūrtayah svayam.", "One should then place the murtis of each guru up to Pramukh Swami Maharaj and the murtis of the gurus whom one has personally served."],
    ["63", "Āhvāna-shlokam uchchārya\nHarim cha gurum āhvayet;\nHastau baddhvā namaskāram\nkuryāddhi dāsa-bhāvataha.", "Thereafter, one should invite [Shriji] Maharaj and the gurus by reciting the Ahvan Mantra. One should bow with folded hands and with dāsbhāv."],
    ["64–65", "Āhvāna-mantrash-chaivam vidhaha:\nUttishṭha Sahajānanda\nShrī-Hare Purushottama;\nGuṇātītā’kshara Brahmann-uttishṭha krupayā guro.\nĀgamyatām hi pūjārtham\nāgamyatām mad-ātmataha;\nSānnidhyād darshanād divyāt\nsaubhāgyam vardhate mama.", "The Ahvan Mantra is as follows: Uttishtha Sahajānanda Shri-Hare Purushottama; Gunātitā’kshara brahmann-uttishtha krupayā guro. Āgamyatām hi pujārtham āgamyatām mad-ātmataha; Sānnidhyād darshanād divyāt saubhāgyam vardhate mama."],
    ["66–67", "Mālām āvartayed mantram\nSwāminārāyaṇam japan;\nMahimnā darshanam kurvan\nmūrtīnām sthira-chetasā.\nEka-pādotthito bhūtvā\nmālām āvartayet tataha;\nTapasa ūrdhva-hastah san\nkurvāṇo mūrti-darshanam.", "Thereafter, with mahimā and a steady mind, one should perform mālā while chanting the Swaminarayan mantra and having darshan of the murtis. Afterwards, while continuing to do darshan of the murtis, one should stand on one leg with arms raised and perform tapni mālā."],
    ["68", "Tatah sanchintayan kuryād\nAkshara-Purushottamam;\nVyāpakam sarva kendram cha\npratimānām pradakshiṇāhā.", "One should then perform pradakshinās of the murtis while contemplating upon Akshar-Purushottam Maharaj, who is pervasive and the focus of all."],
    ["69", "Sāshṭāngā daṇḍavat kāryāh\npraṇāmāh purushais-tataha;\nNārībhis-tūpavishyaiva\npanchāngā dāsa-bhāvataha.", "Thereafter, with dāsbhāv, males should perform sāshtāng dandvat pranāms and females should sit and offer panchāng pranāms."],
    ["70", "Praṇāmo daṇḍavach-chaikah\nkshamā-yāchana-pūrvakam;\nBhakta-droha-nivārārtham\nkāryo’dhiko hi pratyaham.", "One should perform an additional dandvat pranām every day to seek forgiveness for hurting or harbouring ill-will towards another devotee."],
    ["71", "Divya-bhāvena bhaktyā cha\ntad-anu prārthayej-japan;\nSwāminārāyaṇam mantram\nshubha-sankalpa-pūrtaye.", "Then, to fulfil one’s noble wishes, one should pray with divyabhāv and devotion while chanting the Swaminarayan mantra (dhun)."],
    ["72", "Bhaktitah pūjayitvaivam\nAkshara-Purushottamam;\nPunar-āgama-mantreṇa\nprasthāpayen-nijātmani.", "After devoutly performing puja in this way, one should re-install Akshar-Purushottam Maharaj within one’s ātmā by reciting the Punaragaman Mantra."],
    ["73", "Punar-āgamana-mantrash-chaivam vidhaha:\nBhaktyaiva divya-bhāvena\npūjā te samanushṭhitā;\nGachchhā’tha tvam mad-ātmānam\nAkshara-Purushottama.", "The Punaragaman Mantra is as follows: Bhaktyaiva divya-bhāvena pujā te sam-anushthitā, Gachchhā’tha tvam mad-ātmānam Akshara-Purushottama."],
    ["74", "Tatah satsanga-dārḍhyāya\nshāstram paṭhyam cha pratyaham;\nĀdeshāsh-chopadeshāsh-cha\nyatra santi Harer guroho.", "To strengthen one’s satsang, one should then daily read shastras that encompass the teachings and instructions of Shri Hari and the gurus."],
    ["75", "Tad-anu praṇamed bhaktān\nādarān-namra-bhāvataha;\nEvam pūjām samāpyaiva\nkuryāt sva-vyāvahārikam.", "Thereafter, one should bow to devotees with reverence and humility. Only after performing puja in this way should one engage in one’s daily activities."],
    ["76", "Bhojyam naiva na peyam vā\nvinā pūjām jalādikam;\nPravāsa-gamane chā’pi\npūjām naiva pari-tyajet.", "One should not eat food or even drink water or other liquids without performing puja. One should not give up one’s puja even during outings."],
    ["77", "Vārdhakyena cha rogādyair\nanyā’paddhetunā tathā;\nPūjārtham asamarthash-chet\ntadā’nyaih kārayet sa tām.", "If one is incapable of doing puja because of old age, illness or other difficulties, one should have one’s puja performed by another."],
    ["78", "Svīyapūjā svatantrā tu\nsarvai rakshyā gruhe pruthak;\nJanmano divasād eva\npūjā grāhyā sva-santatehe.", "Every satsangi in a household should keep their own separate puja. Moreover, one should acquire a puja for a child on the same day that he or she is born."],
    ["79–80", "Bhakti-prārthana-satsanga-hetunā prati-vāsaram;\nSundaram mandiram sthāpyam\nsarvaih satsangibhir gruhe.\nPrasthāpyau vidhivat tasminn-Akshara-Purushottamau;\nGuravash-cha Guṇātītā\nbhaktyā paramparā-gatāhā.", "All satsangis should place a beautiful mandir within their homes where they can daily offer devotion, pray and practise satsang. Within the mandir, one should devoutly and ceremonially consecrate the murtis of Akshar-Purushottam and the Gunatit gurus of the tradition."],
    ["81", "Prātah prati-dinam sāyam\nsarvaih satsangibhir janaihi;\nĀrārtikyam vidhātavyam\nsa-stuti gruha-mandire.", "Every morning and evening, all satsangis should perform the ārti and sing the stuti before the ghar mandir."],
    ["82", "Uchchaih svarair Jaya Swāminārāyaṇeti bhaktitaha;\nSa-tāli-vādanam geyam\nsthireṇa chetasā tadā.", "While performing the ārti, one should devoutly sing aloud the ārti ‘Jay Swaminarayan, Jay Akshar-Purushottam…’ with a steady mind and while clapping."],
    ["83", "Yaiva rasavatī pakvā\nmandire tām nivedayet;\nUchchārya prārthanam bhaktyā\ntatah prasāditam jamet.", "Offer whatever food has been prepared [to the murtis] in the ghar mandir and after devoutly reciting prayers, eat the sanctified meal."],
    ["84", "Haraye’narpya na grāhyam\nanna-fala-jalādikam;\nShuddhau shankitam annādi\nnā’dyānneshe nivedayet.", "One should not consume foods, fruits, water and other items without first offering them to Bhagwan. Foods and other items that may be impure should not be offered to Bhagwan nor should they be eaten."],
    ["85", "Kīrtanam vā japam kuryāt\nsmrutyādi vā yathā-ruchi;\nGruha-mandiram āsthāya\nbhāvatah sthira-chetasā.", "While sitting in front of the ghar mandir, one should, with devout feelings and concentration, sing kirtans, chant and engage in smruti or other acts of devotion according to one’s preferences."],
    ["86", "Sambhūya pratyaham kāryā\ngruha-sabhā gruhasthitaihi;\nKartavyam bhajanam goshṭhih\nshāstra-pāṭhādi tatra cha.", "Family members should gather daily for ghar sabhā and engage in bhajan, discussions, scriptural reading and other devotional activities."],
    ["87–88", "Shuddhopāsana-bhaktim hi\nposhayitum cha rakshitum;\nBhaktim mandira-nirmāṇa-rūpām prāvartayaddharihi.\nTathaivā’gnāpayām āsa\nsevārtham Hariṇā saha;\nTasya chottama-bhaktasya\ntasyevaivā’ksharasya cha.", "Shri Hari inspired the creation of mandirs as a form of devotion to foster and protect pure upāsanā and bhakti. He instructed that, along with Bhagwan, one should also serve his supreme devotee, Aksharbrahma, in the very same manner that one serves Bhagwan."],
    ["89", "Vartata uttamo bhakto\nBrahma Bhagavato’ksharam;\nNityam māyā-param nityam\nHari-sevāratam yataha.", "Aksharbrahma is Bhagwan’s supreme devotee because he eternally transcends māyā and is forever engrossed in Bhagwan’s service."],
    ["90–91", "Mandirāṇām hi nirmāṇam\ntad-āgnām-anusrutya cha;\nDivyānām kriyate bhaktyā\nsarva-kalyāṇa-hetunā.\nPurushottama-mūrtyā tad-madhya-khaṇḍe yathā-vidhi;\nSahitam sthāpyate mūrtir\nAksharasyā’pi Brahmaṇaha.", "To fulfil this ordinance and to grant moksha to all, divine mandirs are devoutly constructed and the murti of Aksharbrahma is also ceremoniously consecrated with Purushottam Bhagwan in the central shrines [of these mandirs]."],
    ["92", "Evam eva gruhādyeshu\nkruteshu mandireshvapi;\nMadhye prasthāpyate nityam\nsā’ksharah Purushottamaha.", "Similarly, Aksharbrahma and Purushottam Bhagwan are also always consecrated in the central shrines of mandirs in homes and other places."],
    ["93", "Prātah sāyam yathā-kālam\nsarva-satsangibhir janaihi;\nNikaṭam mandiram gamyam\nbhaktyā darshāya pratyaham.", "Daily, in the morning, evening or at another convenient time, all satsangis should devoutly go to a nearby mandir for darshan."],
    ["94", "Yathā sva-dharma-rakshā syāt\ntathaiva vastra-dhāraṇam;\nSatsangi-nara-nārībhih\nkaraṇīyam hi sarvadā.", "All satsangi men and women should always dress in a manner that safeguards their dharma."],
    ["95", "Satsanga-draḍhatārtham hi\nsabhārtham antike sthitam;\nGantavyam prati-saptāham\nmandiram vā’pi maṇḍalam.", "To strengthen one’s satsang, one should attend the weekly assemblies held at a nearby mandir or centre."],
    ["96", "Swāminārāyaṇah sākshād-Aksharādhipatir-Harihi;\nParamātmā Parabrahma\nBhagavān Purushottamaha.", "Swaminarayan Bhagwan, the sovereign of Akshar, is the manifest form of Paramatma Parabrahma Purushottam Hari."],
    ["97", "Sa ekah paramopāsya\nishṭa-devo hi nah sadā;\nTasyaiva sarvadā bhaktih\nkartavyā’nanya-bhāvataha.", "He alone is forever our ishtadev worthy of supreme upāsanā. One should always offer singular devotion to him only."],
    ["98", "Sākshād Brahmā’ksharam Swāmī\nGuṇātītah sanātanam;\nTasya paramparā’dyā’pi\nBrahmā’ksharasya rājate.", "Gunatitanand Swami is the manifest form of the eternal Aksharbrahma. This Aksharbrahma paramparā is manifest even today."],
    ["99", "Guṇātīta-samārabdha-paramparā-pratishṭhitaha;\nPrakaṭā’kshara-brahmaikah\nsampradāye’sti no guruhu.", "In the Sampradaya’s tradition of gurus that began with Gunatitanand Swami, only the present form of Aksharbrahma is our guru."],
    ["100", "Eka eveshṭa-devo nah\neka eva gurus-tathā;\nEkash-chaivā’pi siddhānta\nevam nah ekatā sadā.", "Our ishtadev is the same, our guru is the same and our siddhānt is also the same – thus, we are always united."],
    ["101", "Siddhāntam suvijānīyād\nAkshara-Purushottamam;\nBrahmavidyātmakam divyam\nvaidikam cha sanātanam.", "One should know [and realize] the divine Akshar-Purushottam siddhānt, which is Vedic, eternal and the form of brahmavidyā."],
    ["102–103", "Jīvas-tatheshvarash-chaiva\nmāyā brahmā’ksharam tathā;\nParabrahmeti tattvāni\nbhinnāni pancha sarvadā.\nNityān yatha cha satyāni\nvigneyāni mumukshubhihi;\nSwāminārāyaṇenaivam\nsiddhāntitam svayam sfuṭam.", "Mumukshus should realize that the five entities – jiva, ishwar, māyā, Aksharbrahma and Parabrahma – are forever distinct, eternal and true Swaminarayan Bhagwan himself established this clear siddhānt."],
    ["104", "Teshu māyā-parau nityam\nAkshara-Purushottamau;\nJīvānām-īshvarāṇām cha\nmuktis-tad-yogato bhavet.", "Among these entities, Akshar and Purushottam are the two who are eternally beyond māyā. Jivas and ishwars attain moksha by associating with them."],
    ["105", "Paramātmā Parabrahma\nparam Brahmā’ksharāt sadā;\nBrahmā’pi sevate tam cha\ndāsa-bhāvena sarvadā.", "Paramatma Parabrahma is forever superior to Aksharbrahma. Furthermore, even Aksharbrahma eternally serves Paramatma with dāsbhāv."],
    ["106", "Sarva-kartā cha sākārah\nsarvopari sadā Harihi;\nMumukshūṇām vimokshāya\nprakaṭo vartate sadā.", "Bhagwan is eternally the all-doer, with form, and supreme; he always remains manifest for the moksha of mumukshus."],
    ["107", "Brahmā’kshara-guru-dvārā\nBhagavān prakaṭah sadā;\nSahitah sakalaishvaryaih\nparamā’nandam arpayan.", "Through the Aksharbrahma guru, Bhagwan always remains present with all of his divinity and bestows utmost bliss."],
    ["108", "Prītih kāryā’tma-buddhish-cha\nBrahmā’kshare gurau draḍhā;\nPratyaksha-Bhagavad-bhāvāt\nsevyo dhyeyah sa bhaktitaha.", "One should foster intense love and ātmabuddhi for the Aksharbrahma guru. Believing the guru as the manifest form of Bhagwan, one should serve him and meditate upon him with devotion."],
    ["109–110", "Swāminārāyaṇo mantro\ndivyash-chā’laukikah shubhaha;\nJapyo’yam sakalair bhaktair\ndatto’yam Hariṇā svayam.\nAksharam Brahma vigneyam\nmantre Swāmīti shabdataha;\nNārāyaṇeti shabdena\ntat-parah Purushottamaha.", "The ‘Swaminarayan’ mantra is divine, beyond this world and auspicious. Shri Hari himself bestowed this mantra. All devotees should chant it. In this mantra, understand that ‘Swami’ refers to Aksharbrahma, and ‘Narayan’ refers to Purushottam, who is superior to Aksharbrahma."],
    ["111–114", "Swāminārāyaṇeneha\nsiddhānto’yam prabodhitaha;\nGurubhish-cha Guṇātītair\ndigante’yam pravartitaha.\nYagnapurushadāsena\nsthāpito mūrti-mattayā;\nGuru-charitra-grantheshu\npunar ayam draḍhāyitaha.\nPramukha-guruṇā yo’yam\nsvīyā’ksharaih sthirī-krutaha;\nSākshād guroh prasangena\nlabhyate’yam hi jīvane.\nAyam eva sa siddhānto\nmukti-pradah sanātanaha;\nUchyate darshanam divyam\nAkshara-Purushottamam.", "Bhagwan Swaminarayan revealed this siddhānt in this world. The Gunatit gurus spread it throughout the world. Shastriji Maharaj enshrined it in the form of murtis. It was reaffirmed in the jivan charitra texts of the gurus. This siddhānt was securely established by guruhari Pramukh Swami Maharaj in his own handwriting. This siddhānt may be imbibed in one’s life through the association of the manifest guruhari. It is this eternal and moksha-bestowing siddhānt that is known as the divine ‘Akshar-Purushottam Darshan’."],
    ["115", "Siddhāntam paramam divyam\netādrusham vichintayan;\nSatsangam nishṭhayā kuryād\nānandotsāha-pūrvakam.", "While reflecting on such a supremely divine siddhānt, one should engage in satsang with conviction, joy and enthusiasm."],
    ["116", "Nijā’tmānam brahmarūpam\ndeha-traya-vilakshaṇam;\nVibhāvyopāsanam kāryam\nsadaiva Parabrahmaṇaha.", "Identify one’s ātmā, which is distinct from the three bodies, as brahmarup and always offer upāsanā to Parabrahma."],
    ["117", "Aksharādhipater bhaktim\nsa-dharmām ācharet sadā;\nDharmeṇa rahitām naiva\nbhaktim kuryāt kadāchana.", "One should offer devotion to Paramatma, the sovereign of Akshar, while always upholding dharma. One should never perform bhakti without dharma."],
    ["118", "Bhaktim vā gnānam ālambya\nnaivā’dharmam charej-janaha;\nApi parva-vishesham vā’-\nlambya nā’dharmam ācharet.", "One should not behave immorally even under the pretext of devotion, wisdom or festivals."],
    ["119", "Bhangā-surādi-pānam vā\ndyūtādi-krīḍanam tathā;\nGāli-dānādikam naiva\nparvasvapi samācharet.", "Even during festivities, one should abstain from bhang, alcohol and other such substances, as well as gambling, swearing and other such activities."],
    ["120", "Parasmād Brahmaṇo’nyasmin-naksharād Brahmaṇas-tathā;\nPrītyabhāvo hi vairāgyam\nangam bhakteh sahāyakam.", "Vairāgya is to not have love for anything or anyone other than Parabrahma and Aksharbrahma. It serves to support bhakti."],
    ["121", "Nindā-lajjā-bhayā’padbhyah\nsatsangam na pari-tyajet;\nSwāminārāyaṇam Devam\ntad-bhaktim karhichid gurum.", "When faced with criticism, shame, fear or difficulty, one should never abandon satsang, Swaminarayan Bhagwan, devotion towards him, or the guru."],
    ["122", "Sevā Haresh-cha bhaktānām\nkartavyā shuddha-bhāvataha;\nMahad-bhāgyam mamāstīti\nmatvā sva-moksha-hetunā.", "One should serve Bhagwan and his devotees with pure intentions, believing it to be one’s great fortune and with the goal of attaining one’s moksha."],
    ["123", "Neyo na vyarthatām kālah\nsatsangam bhajanam vinā;\nĀlasyam cha pramādādi\npari-tyājyam hi sarvadā.", "One should not let time pass wastefully without satsang or devotion. One should always give up laziness and negligence."],
    ["124", "Kuryāddhi bhajanam kurvan\nkriyā āgnā’nusārataha;\nKriyā-bandhah kriyā-bhārah\nkriyāmānas-tato nahi.", "One should perform tasks while engaging in devotion and according to āgnā. By doing so, one will not become attached to one’s actions, be burdened by them or develop ego because of them."],
    ["125", "Sevayā kathayā smrutyā\ndhyānena paṭhanādibhihi;\nSufalam samayam kuryād\nBhagavat-kīrtanādibhihi.", "One should fruitfully use time by performing sevā, listening to discourses, doing smruti, meditating, studying, singing kirtans of Bhagwan and engaging in other such activities."],
    ["126", "Sva-dur-guṇān apā-kartum\nsam-prāptum sad-guṇāns-tathā;\nSatsangā’shrayaṇam kāryam\nsvasya parama-muktaye.", "One should take the refuge of satsang to rid oneself of flaws, acquire virtues and attain ultimate moksha."],
    ["127", "Prasannatām samāvāptum\nSwāminārāyaṇa-Prabhoho;\nGuṇātīta-gurūṇām cha\nsatsangam āshrayet sadā.", "One should forever take the refuge of satsang to attain the pleasure of Swaminarayan Bhagwan and the Gunatit gurus."],
    ["128", "Aho ihaiva nah prāptāv-Akshara-Purushottamau;\nTat-prāpti-gauravān-nityam\nsatsang-ānandam āpnuyāt.", "O! We have attained both Akshar and Purushottam here [in this life]. With the joy of having attained them, one should always relish the bliss of satsang."],
    ["129–130", "Sevā-bhakti-kathā-dhyāna-tapo-yātrādi sādhanam;\nMānato dambhato naiva\nkāryam naivershyayā tathā.\nSpardhayā dveshato naiva\nna laukika-falechchhayā;\nShraddhayā shuddha-bhāvena\nkāryam prasannatā-dhiyā.", "One should never perform sevā, devotion, discourses, meditation, austerities, pilgrimages and other endeavours out of vanity, pretence, jealousy, competition, enmity or for the attainment of worldly fruits. However, they should be performed with faith, pure intentions and the wish to please Bhagwan."],
    ["131", "Drashyo na mānusho bhāvo\nBhagavati tathā gurau;\nMāyā-parau yato divyāv-Akshara-Purushottamau.", "One should not perceive human traits in Bhagwan or the guru, since both Akshar and Purushottam are beyond māyā and divine."],
    ["132", "Vishvāsah su-draḍhī-kāryo\nBhagavati tathā gurau;\nNirbalatvam pari-tyājyam\ndhāryam dhairyam arer balam.", "One should develop firm faith in Bhagwan and the guru, renounce feebleness, have patience and derive strength from Bhagwan."],
    ["133", "Kāryam līlā-charitrāṇām\nSwāminārāyaṇa-Prabhoho;\nShravaṇam kathanam pāṭho\nmananam nidi-dhyāsanam.", "One should listen to, recite, read, reflect upon and repeatedly recall the incidents of Swaminarayan Bhagwan."],
    ["134", "Prasangah parayā prītyā\nBrahmā’kshara-guroh sadā;\nKartavyo divya-bhāvena\npratyakshasya mumukshubhihi.", "Mumukshus should always associate with the manifest Aksharbrahma guru with supreme love and divyabhāv."],
    ["135", "Brahmā’kshare gurau prītir\ndraḍhaivā’sti hi sādhanam;\nBrahma-sthiteh pari-prāpteh\nsākshāt-kārasya cha Prabhoho.", "Intense affection for the Aksharbrahma guru is the only means to attaining the brāhmic state and realizing Bhagwan."],
    ["136", "Brahma-guṇa-samāvāptyai\nParabrahmā’nubhūtaye;\nBrahma-guroh prasangānām\nkartavyam mananam sadā.", "To imbibe the virtues of the Aksharbrahma guru and to experience Parabrahma, one should always reflect on the incidents of the Aksharbrahma guru."],
    ["137", "Manasā karmaṇā vāchā\nsevyo Guruharih sadā;\nKartavyā tatra pratyaksha-Nārāyaṇa-svarūpa-dhīhi.", "One should associate with one’s guruhari through thought, word and deed and should realize him as ‘Narayanswarup’ – the manifest form of Narayan [Parabrahma]."],
    ["138", "Shruṇuyān-na vaden-nā’pi\nvārtām hīnām balena cha;\nBala-pūrṇām sadā kuryād\nvārtām satsangam āsthitaha.", "A satsangi should never listen to or speak discouraging words. One should always speak encouraging words."],
    ["139", "Vārtā kāryā mahimno hi\nBrahma-Parama-brahmaṇoho;\nTat-sambandha-vatām chā’pi\nsa-sneham ādarāt sadā.", "With affection and reverence, one should continuously speak of the glory of Brahma and Parabrahma and the greatness of those who are associated with them."],
    ["140", "Satsangishu suhrad-bhāvo\ndivya-bhāvas-tathaiva cha;\nAksharabrahma-bhāvash-cha\nvidhātavyo mumukshuṇā.", "Mumukshus should keep suhradbhāv, divyabhāv and brahmabhāv towards satsangis."],
    ["141–142", "Paramātma-Parabrahma-Swāminārāyaṇa-Prabhoho;\nBrahmā’kshara-svarūpasya\nGuṇātīta-guros-tathā.\nTad-arpitasya divyasya\nsiddhāntasya cha sarvadā;\nBhaktānām tach-chhritānām cha\npaksho grāhyo vivekataha.", "With discretion, one should always keep the paksha of Paramatma Parabrahma Swaminarayan Bhagwan, the Aksharbrahma Gunatit guru, the divine siddhānt they have imparted and the devotees who have sought their refuge."],
    ["143–144", "Āgnām Bhagavato nityam\nBrahma-gurosh-cha pālayet;\nGnātvā tad-anuvruttim cha\ntām evā’nusared draḍham.\nTad-āgnām pālayet sadya\nālasyādi vihāya cha;\nSānandotsāha-māhātmyam\ntat-prasāda-dhiyā sadā.", "One should always obey the commands of Bhagwan and the Brahmaswarup guru. One should realize their inner wishes and firmly abide by them. Their instructions should be followed without laziness, immediately, and always with joy, enthusiasm, mahimā and an eagerness to please them."],
    ["145", "Antar-drashṭish-cha kartavyā\npratyaham sthira-chetasā;\nKim kartum āgato’smīha\nkim kurve’ham iheti cha.", "With a composed mind, one should introspect every day: “What have I come to accomplish in this world and what am I doing?”"],
    ["146", "Samprāpyā’kshara-rūpatvam\nbhajeyam Purushottamam;\nPratyaham chintayed evam\nsvīya-lakshyam atandritaha.", "“Having attained oneness with Akshar, I offer devotion to Purushottam.” In this manner, one should reflect on one’s goal each day without laziness."],
    ["147–148", "Kartā’yam sarva-hartā’yam\nsarvopari niyāmakaha;\nPratyaksham iha labdho me\nSwāminārāyaṇo Harihi.\nAta evā’smi dhanyo’ham\nparama-bhāgyavān aham;\nKrutārthash-chaiva nihshanko\nnishchinto’smi sadā sukhī.", "Swaminarayan Bhagwan is the all-doer, supreme entity and controller. I have his association here in person. For this very reason, I am joyous, greatly fortunate, fulfilled, without doubts and worries, and forever blissful."],
    ["149", "Evam prāpter mahimnash-cha\npratyaham pari-chintanam;\nPrabhoh prasannatāyāsh-cha\nkāryam sthireṇa chetasā.", "In this way, with a composed mind, one should reflect daily on one’s divine attainment of Paramatma, his greatness and [attaining] his pleasure."],
    ["150", "Deha-traya-tryavasthāto\ngnātvā bhedam guṇa-trayāt;\nSvātmano Brahmaṇaikatvam\nprati-dinam vibhāvayet.", "Realizing one’s ātmā to be distinct from the three bodies, the three states, and the three qualities, every day one should believe oneself as being one with Aksharbrahma."],
    ["151", "Pratyaham anusandheyā\njagato nāsha-shīlatā;\nSvātmano nityatā chintyā\nsach-chid-ānanda-rūpatā.", "Daily, one should reflect on the impermanent nature of the world and on one’s ātmā as eternal and sachchidānand."],
    ["152", "Bhūtam yach-cha bhavad yach-cha\nyad-evā’gre bhavishyati;\nSarvam tan me hitāyaiva\nSwāminārāyaṇechchhayā.", "One should understand that all which has happened, which is happening, and which will happen is solely due to Swaminarayan Bhagwan’s will and only for my benefit."],
    ["153", "Prārthanam pratyaham kuryād\nvishvāsa-bhakti-bhāvataha;\nGuror Brahmaswarūpasya\nSwāminārāyaṇa-Prabhoho.", "One should daily pray to Swaminarayan Bhagwan and the Brahmaswarup guru with faith and devotion."],
    ["154", "Mānershyā-kāma-krodhādi-doshā’vego bhavet tadā;\nAksharam-aham ityādi\nshānta-manā vichintayet.", "When one experiences impulses of egotism, jealousy, lust, anger, and other base instincts, one should calmly reflect: ‘I am akshar; I am a servant of Purushottam.’"],
    ["155", "Mayā saha sadaivā’sti\nsarva-dosha-nivārakaha;\nSwāminārāyaṇah sākshād\nevam balam cha dhārayet.", "Also, one should remain strong in the belief that Swaminarayan Bhagwan himself, who is the destroyer of all base instincts, is always with me."],
    ["156–157", "Sva-dharmam pālayen-nityam\npara-dharmam pari-tyajet;\nSva-dharmo Bhagavad-gurvor\nāgnāyāh pari-pālanam.\nTad-āgnām yat pari-tyajya\nkriyate sva-mano-dhrutam;\nPara-dharmah sa vigneyo\nvivekibhir mumukshubhihi.", "One should always observe swadharma and renounce pardharma. Swadharma means to observe the commands of Bhagwan and the guru. The wise mumukshu should realize that pardharma is disregarding their instructions and acting wilfully."],
    ["158", "Satsanga-niyamād yaddhi\nviruddham dharma-lopakam;\nFala-dam api nā’charyam\nbhaved yad bhakti-bādhakam.", "One should avoid even [apparently] beneficial actions that impede devotion, transgress the niyams of satsang or cause one to lapse from dharma."],
    ["159", "Ādareṇa praṇāmaish-cha\nmadhura-vachanādibhihi;\nYatho-chitam hi sanmānyā\nvruddhā gnāna-vayo-guṇaihi.", "One should offer appropriate respect to those who are senior in age, possess greater wisdom or are more virtuous by bowing reverently, using polite speech and expressing other forms of regard."],
    ["160", "Sadaivā’daraṇīyā hi\nvidvad-varishṭha-shikshakāhā;\nYathā-shakti cha sat-kāryāh\nsādhu-vādādi-karmaṇā.", "One should always respect the learned, seniors and teachers. According to one’s capacity, one should honour them with good words and other such deeds."],
    ["161", "Jana-sambodhanam kuryād\nyathā-kārya-guṇādikam;\nSamvardhayet tad-utsāham\nyathā-shakti su-karmasu.", "One should address each individual according to their virtues, achievements and other merits. One should encourage them in noble works according to their abilities."],
    ["162", "Satyām vaded hitām chaiva\nvaded vāṇīm priyām tathā;\nMithyā’ropyo’pavādo na\nkasminsh-chit karhichij-jane.", "One should speak words which are true, beneficial and loving. One should never falsely accuse any individual."],
    ["163", "Na vadet kutsitām vācham\napa-shabda-kalankitām;\nShrotru-dukha-karīm nindyām\nkaṭhorām dvesha-garbhiṇīm.", "One should never utter unpleasant speech that is offensive, hurts its listener and is defamatory, harsh or hateful."],
    ["164", "Asatyam na vadet kvāpi\nvadet satyam hitā’vaham;\nSatyam api vaden-naiva\nyat syād anyā’hitā’vaham.", "One should never speak untruth. One should express truth that is beneficial, but not utter even truth that may harm others."],
    ["165", "Anyā’vaguṇa-doshādi-vārtām kadā’pi nochcharet;\nTathā krute tvashāntih syād\naprītish-cha arer guroho.", "One should never speak of another’s drawbacks or flaws. Doing so causes unrest and results in the displeasure of Bhagwan and the guru."],
    ["166", "Atyantā’vashyake nūnam\npari-shuddhena bhāvataha;\nSatya-proktau na doshah syād\nadhikāra-vatām puraha.", "If extremely necessary, it is acceptable to convey the truth with pure intent to an authorized person."],
    ["167", "Āchāro vā vichāro vā\ntādruk kāryo na karhichit;\nAnyeshām ahitam dukham\nyena syāt klesha-vardhanam.", "One should never act or think in a way that is hurtful or damaging to others or that increases conflict."],
    ["168", "Suhrad-bhāvena bhaktānām\nshubha-guṇa-gaṇān smaret;\nNa grāhyo’vaguṇas-teshām\ndrohah kāryo na sarvathā.", "With suhradaybhāv, recollect the virtues of devotees. One should never view their flaws or offend them in any way."],
    ["169", "Sukhe noch-chhrunkhalo bhūyād\ndukhe nodvegam āpnuyāt;\nSwāminārāyaṇechchhātah\nsarvam pravartate yataha.", "In happy times do not get carried away and in unhappy times do not become discouraged, since everything occurs by Swaminarayan Bhagwan’s wish."],
    ["170", "Vivādah kalaho vā’pi\nnaiva kāryah kadāchana;\nVartitavyam vivekena\nrakshyā shāntish-cha sarvadā.", "One should never argue or quarrel with anyone. One should always be well-mannered and remain calm."],
    ["171", "Vachane vartane kvāpi\nvichāre lekhane tathā;\nKaṭhoratām bhajen-naiva\njanah ko’pi kadāchana.", "One should never be harsh in speech, action, thought or writing."],
    ["172", "Sevām mātuh pituh kuryād\ngruhī satsangam āshritaha;\nPrati-dinam namaskāram\ntat-pādeshu nivedayet.", "Householder satsangis should serve their mother and father. They should bow to their feet every day."],
    ["173", "Shvashurah pitruvat sevyo\nvadhvā shvashrūsh-cha mātruvat;\nSva-putrīvat snushā pālyā\nshvashrvā’pi shvashureṇa cha.", "A wife should serve her father-in-law as her own father and mother-in-law as her own mother. A father- and mother-in-law should care for their daughter-in-law as they would for their own daughter."],
    ["174", "Sampālyāh putra-putryash-cha\nsatsanga-shikshaṇādinā;\nAnye sambandhinah sevyā\nyathā-shakti cha bhāvataha.", "Householders should diligently nurture their sons and daughters through satsang, education and other activities. They should affectionately care for their other relatives according to their means."],
    ["175", "Gruhe hi madhurām vāṇīm\nvaded vācham tyajet kaṭum;\nKam api pīḍitam naiva\nprakuryād malinā’shayāt.", "One should speak pleasantly at home. One should renounce bitter speech and not harm others with malicious intent."],
    ["176", "Militvā bhojanam kāryam\ngruhasthaih sva-gruhe mudā;\nAtithir hi yathā-shakti\nsambhāvya āgato gruham.", "Householders should joyously eat meals together at home and provide hospitality to guests according to their means."],
    ["177", "Maraṇādi-prasangeshu\nkathā-bhajana-kīrtanam;\nKāryam visheshatah smāryo\nhyakshara-Purushottamaha.", "In the event of a death or other sad occasions, one should perform additional acts of devotion, sing kirtans, engage in discourses and remember Akshar-Purushottam Maharaj."],
    ["178", "Putrī-putrātmikā svasya\nsanskāryā santatih sadā;\nSatsanga-divya-siddhāntaih\nsad-āchāraish-cha sadguṇaihi.", "One should always impart sanskārs to one’s sons and daughters by teaching them the divine principles of satsang, good conduct and virtues."],
    ["179", "Satsanga-shāstra-pāṭhādyair\ngarbha-sthām eva santatim;\nSanskuryāt pūrayen-nishṭhām\nAkshara-Purushottame.", "From when a child is in the womb, one should instil sanskārs and conviction in Akshar-Purushottam Maharaj by reading the sacred texts of satsang and through other [noble] acts."],
    ["180", "Kudrashṭyā purushair naiva\nstriyo drashyāh kadāchana;\nEvam eva kudrashṭyā cha\nstrībhir drashyā na pūrushāhā.", "Men should never look at women with a wrong intent. In the same manner, women should also never look at men with a wrong intent."],
    ["181", "Svīya-patnītarābhis-tu\nrahasi vasanam saha;\nĀpat-kālam vinā kvāpi\nna kuryur gruhiṇo narāhā.", "Except in emergency situations, married men should never remain alone anywhere with women other than their wife."],
    ["182", "Tathaiva na hi nāryo’pi\ntishṭheyuh sva-patītaraihi;\nPurushaih sākam-ekānte\nhyāpatti-samayam vinā.", "Similarly, [married] women should never remain alone with men other than their husband, except in emergency situations."],
    ["183", "Narah samīpa-sambandha-hīnām striyam sprushen-na hi;\nNaiva sprushet tathā nārī\ntādrusham purushāntaram.", "A male should not touch a female who is not closely related; however, he may respectfully touch one who is closely related. Similarly, a female should not touch a male who is not closely related; however, she may respectfully touch one who is closely related."],
    ["184", "Āpat-kāle’nya-rakshārtham\nsparshe dosho na vidyate;\nAnyathā niyamāh pālyā\nanāpattau tu sarvadā.", "In emergency situations, it is not a fault to touch others to protect or save them. However, if there is no emergency, then always obey the niyams."],
    ["185", "Ashlīlam yatra drashyam syād\ndharma-sanskāra-nāshakam;\nNāṭaka-chala-chitrādi\ntan-na pashyet kadāchana.", "One should never view dramas, films or other media that contain obscene scenes which destroy one’s dharma and sanskārs."],
    ["186", "Manushyo vyasanī yah syād\nnirlajjo vyabhichāravān;\nTasya sango na kartavyah\nsatsangam-āshritair-janaihi.", "Satsangis should not associate with people who have addictions, are shameless or are adulterous."],
