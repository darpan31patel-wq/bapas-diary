<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--MENULINK-->
<style>/*MENUCSS*/</style>
<title>Bapa's Places</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mukta:wght@300;400;600&display=swap">
<style>
/* Travels, Places view: the globe shows every place Bapa visited as a gold dot (bigger = more visits).
   Tap a dot, or find a place by name, and the panel lists every visit there with a link to its photos in Search.
   Same look as the Journey view: night sky, gold route colour, Marcellus and Mukta. */
:root {
  --night: #0d1330; --sea: #0e1636; --land: #3a4c86; --gold: #f2b544; --saffron: #e8772e;
  --ink: #f4efe4; --mist: #a9b1d6; --card: rgba(13,19,48,.86); --line: rgba(169,177,214,.22);
  --display: "Marcellus", "Palatino Linotype", Georgia, serif;
  --body: "Mukta", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--night); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
button { font: inherit; color: inherit; }
#globe { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#globe.drag { cursor: grabbing; }

/* Journey | Places switch, just under the site menu */
.views { position: fixed; z-index: 6; top: calc(56px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
  display: flex; padding: 4px; gap: 4px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); }
.views a { padding: 7px 20px; border-radius: 999px; color: var(--mist); text-decoration: none; font-size: 15px; }
.views a.on { background: var(--gold); color: var(--night); font-weight: 600; }

.panel { position: fixed; z-index: 4; left: max(24px, env(safe-area-inset-left, 0px)); top: calc(110px + env(safe-area-inset-top, 0px)); bottom: 24px;
  width: min(410px, 38vw); display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); overflow: hidden; }
.scroll { flex: 1; overflow-y: auto; padding: 20px 22px 22px; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.grab { display: none; }
h1 { font: 400 30px/1.15 var(--display); margin: 0; text-wrap: balance; }
.lead { color: var(--mist); margin: 6px 0 14px; font-size: 15px; text-wrap: balance; }
.find { width: 100%; padding: 11px 14px; font: 400 17px var(--body); color: var(--ink); background: rgba(255,255,255,.06);
  border: 1.5px solid var(--line); border-radius: 10px; }
.find:focus { outline: none; border-color: var(--gold); }
.find::placeholder { color: var(--mist); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 6px; }
.chips button { border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 5px 12px; border-radius: 999px; font-size: 14px; cursor: pointer; }
.chips button:hover, .chips button.on { border-color: var(--gold); color: var(--gold); }
.list { list-style: none; margin: 8px 0 0; padding: 0; }
.list li button { width: 100%; display: flex; align-items: baseline; gap: 10px; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line);
  padding: 10px 2px; cursor: pointer; }
.list li button:hover .nm { color: var(--gold); }
.nm { font: 400 19px var(--display); flex: 1; min-width: 0; }
.nm small { font: 400 13px var(--body); color: var(--mist); margin-left: 6px; }
.cnt { color: var(--mist); font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.cnt b { color: var(--gold); font-weight: 600; }

/* one place */
.back { background: none; border: 0; color: var(--mist); padding: 0; font-size: 14px; cursor: pointer; margin-bottom: 8px; }
.back:hover { color: var(--gold); }
.pname { font: 400 38px/1.1 var(--display); margin: 0; text-wrap: balance; }
.pcountry { color: var(--saffron); font-weight: 600; }
.gurus { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0 4px; }
.guru { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 12px 8px 10px; border-radius: 12px; background: rgba(255,255,255,.04); border: 1px solid var(--line); }
.guru img { width: 68px; height: 68px; border-radius: 50%; object-fit: cover; object-position: 50% 18%; box-shadow: 0 0 0 2px var(--gold); }
.guru .who { font-size: 13px; line-height: 1.25; margin-top: 8px; color: var(--ink); text-wrap: balance; }
.guru .how { font-size: 13px; color: var(--mist); margin-top: 3px; }
.guru .how b { color: var(--gold); font-weight: 600; font-size: 16px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: center; }
.stats b { display: block; font-weight: 600; font-size: 24px; font-variant-numeric: tabular-nums; }
.stats small { color: var(--mist); font-size: 12px; }
.all { display: block; width: 100%; margin: 16px 0 6px; padding: 13px 16px; border: 0; border-radius: 12px; background: var(--gold); color: var(--night);
  font-weight: 600; font-size: 16px; text-align: center; text-decoration: none; cursor: pointer; }
.all:hover { filter: brightness(1.08); }
.tn { display: block; text-align: center; padding: 10px; border: 1.5px solid var(--gold); border-radius: 12px; color: var(--gold); text-decoration: none; font-weight: 600; }
.tn:hover { background: rgba(242,181,68,.12); }
.vh { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 0 4px; }
.vh h2 { font: 400 20px var(--display); margin: 0; }
.vh button { background: none; border: 0; color: var(--mist); font-size: 14px; cursor: pointer; padding: 0; }
.vh button:hover { color: var(--gold); }
.yr { font: 400 22px var(--display); color: var(--gold); margin: 14px 0 2px; }
.visit { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.tile { flex: none; width: 64px; height: 64px; border-radius: 10px; overflow: hidden; background: var(--sea) center/cover no-repeat; box-shadow: 0 0 0 1.5px rgba(242,181,68,.6); }
.vb { flex: 1; min-width: 0; }
.vd { font-weight: 600; font-size: 16px; }
.vm { color: var(--mist); font-size: 13px; }
.vc { font-size: 14px; font-weight: 300; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.vl { display: inline-block; margin-top: 4px; color: var(--gold); font-size: 14px; text-decoration: none; }
.vl:hover { text-decoration: underline; }

.zoom { position: fixed; z-index: 4; right: max(20px, env(safe-area-inset-right, 0px)); bottom: 24px; display: flex; flex-direction: column; gap: 8px; }
.zoom button { width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid var(--gold); background: var(--card); color: var(--gold); font-size: 24px; line-height: 1; cursor: pointer; display: grid; place-items: center; }
.zoom button:hover { background: rgba(242,181,68,.15); }
.hint { position: fixed; z-index: 3; right: 88px; bottom: 30px; color: var(--mist); font-size: 14px; text-align: right; pointer-events: none; transition: opacity .6s; }
.mock { position: fixed; z-index: 4; right: max(20px, env(safe-area-inset-right, 0px)); top: calc(62px + env(safe-area-inset-top, 0px)); font-size: 12px; color: var(--mist); background: var(--card); border: 1px solid var(--line); padding: 4px 10px; border-radius: 999px; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

@media (max-width: 760px) {
  .views { top: calc(52px + env(safe-area-inset-top, 0px)); }
  .views a { padding: 6px 16px; font-size: 14px; }
  .panel { left: 0; right: 0; width: auto; top: auto; bottom: 0; height: 46%; border-radius: 18px 18px 0 0; border-bottom: 0; transition: height .3s ease; }
  .panel.tall { height: calc(100% - 100px - env(safe-area-inset-top, 0px)); }
  .grab { display: block; flex: none; width: 100%; height: 26px; background: none; border: 0; cursor: pointer; position: relative; }
  .grab::after { content: ""; position: absolute; left: 50%; top: 10px; width: 44px; height: 5px; margin-left: -22px; border-radius: 3px; background: var(--line); }
  .scroll { padding: 0 16px calc(18px + env(safe-area-inset-bottom, 0px)); }
  h1 { font-size: 24px; }
  .pname { font-size: 30px; }
  .zoom { bottom: calc(46% + 12px); right: 12px; }
  .zoom button { width: 42px; height: 42px; font-size: 21px; }
  .hint, .mock { display: none; }
  .panel.tall ~ .zoom { display: none; }
  /* with the phone tab bar at the bottom (site/phone), the panel sits on top of it */
  html.ph-travels .panel { bottom: var(--ph-bar, 0px); height: calc(46% - var(--ph-bar, 0px)); }
  html.ph-travels .panel.tall { height: calc(100% - 100px - env(safe-area-inset-top, 0px) - var(--ph-bar, 0px)); }
  html.ph-travels .zoom { bottom: calc(46% + 12px); }
}
</style>
</head>
<body>
<nav class="site-menu stay" aria-label="Website tabs"><a href="/">Today</a><a href="/calendar/">Calendar</a><a href="/search/">Search</a><a class="on" href="/travels/" aria-current="page">Travels</a><a href="/through-the-years/">Through the years</a><a href="/about/">About</a></nav>
<canvas id="globe" aria-label="Globe with every place Bapa visited"></canvas>
<nav class="views" aria-label="Travels views"><a href="/travels/">Journey</a><a class="on" href="/travels/places/" aria-current="page">Places</a></nav>
<!--MOCK-->

<aside class="panel" id="panel">
  <button class="grab" id="grab" type="button" aria-label="Make the panel bigger or smaller"></button>
  <div class="scroll" id="scroll">
    <section id="home">
      <h1>Every place Bapa visited</h1>
      <p class="lead" id="lead"></p>
      <input class="find" id="find" type="search" placeholder="Find a place, e.g. London" autocomplete="off" aria-label="Find a place">
      <div class="chips" id="chips"></div>
      <ul class="list" id="list"></ul>
    </section>
    <section id="one" hidden></section>
  </div>
</aside>

<div class="zoom"><button id="zin" type="button" aria-label="Zoom in">+</button><button id="zout" type="button" aria-label="Zoom out">−</button></div>
<div class="hint" id="hint">Drag to turn the globe, pinch or scroll to zoom.<br>Tap a gold dot to see every visit.</div>

<!--LAND-->
<!--TRIPS-->
<!--LIBS-->
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('trips').textContent);
  const LAND = (t => topojson.feature(t, t.objects.land))(JSON.parse(document.getElementById('land').textContent));
  const PICS = DATA.pics || {};
  const SEARCH = '/search/';
  const PHOTOS = '/*PHOTOS*/';   // the close up sheets of the Journey view, one per year
  // places with a Then and now page (both Bapas at the same mandir, years apart); that thread keeps this list
  const TN = { Bharuch: 'bharuch', Bochasan: 'bochasan', Nairobi: 'nairobi', Surat: 'surat' };
  const PSM_UNTIL = '2016-08-13';   // visits before this are Pramukh Swami Maharaj's, from it Mahant Swami Maharaj's
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const day = s => new Date(s + 'T00:00:00Z');
  const fmt = d => { const x = day(d); return x.getUTCDate() + ' ' + MONTHS[x.getUTCMonth()]; };
  const fmtRange = (a, b) => a === b ? fmt(a) : (a.slice(5, 7) === b.slice(5, 7) ? day(a).getUTCDate() + ' to ' + fmt(b) : fmt(a) + ' to ' + fmt(b));
  const plural = (n, w) => n.toLocaleString() + ' ' + w + (n === 1 ? '' : 's');

  // Every place with all its visits
  const places = {};
  for (const [k, p] of Object.entries(DATA.places)) places[k] = { key: k, ...p, visits: [] };
  for (const [y, list] of Object.entries(DATA.years)) list.forEach((s, n) => places[s.p].visits.push({ ...s, key: y + '-' + n, year: +y,
    days: Math.round((day(s.b) - day(s.a)) / 864e5) + 1, psm: s.a < PSM_UNTIL }));
  const ALL = Object.values(places).filter(p => p.visits.length);
  ALL.forEach(p => {
    p.visits.sort((a, b) => a.a < b.a ? -1 : 1);
    p.photos = p.visits.reduce((t, v) => t + v.n, 0);
    p.days = p.visits.reduce((t, v) => t + v.days, 0);
    p.first = p.visits[0].year; p.last = p.visits.at(-1).year;
  });
  ALL.sort((a, b) => b.visits.length - a.visits.length || b.photos - a.photos);
  const countries = new Set(ALL.map(p => p.country));
  const years = Object.keys(DATA.years).sort();
  $('lead').textContent = `${ALL.length} places in ${countries.size} countries, ${years[0]} to ${years.at(-1)}. Tap a gold dot on the globe, or find a place by name.`;

  // Regions: a quick way to fly somewhere
  const REGIONS = [
    ['Gujarat', [71.8, 22.4], 26], ['India', [78.5, 21.5], 5.5], ['Africa', [30, -6], 2.6], ['UK and Europe', [-2, 48], 3.4],
    ['America', [-88, 38], 2.6], ['Middle East', [52, 25], 4.5], ['Australia', [148, -30], 2.6], ['Whole world', [60, 15], 1]];
  $('chips').innerHTML = REGIONS.map((r, i) => `<button type="button" data-r="${i}">${esc(r[0])}</button>`).join('');
  $('chips').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const r = REGIONS[+b.dataset.r]; flyTo(r[1], r[2]); });

  function renderList(q) {
    q = (q || '').trim().toLowerCase();
    const hits = q ? ALL.filter(p => p.name.toLowerCase().includes(q) || p.country.toLowerCase().includes(q)) : ALL;
    $('list').innerHTML = hits.length ? hits.map(p => `<li><button type="button" data-k="${esc(p.key)}">
      <span class="nm">${esc(p.name)}<small>${esc(p.country)}</small></span>
      <span class="cnt"><b>${plural(p.visits.length, 'visit')}</b> · ${p.first === p.last ? p.first : p.first + ' to ' + p.last}</span></button></li>`).join('')
      : `<li class="cnt" style="padding:12px 2px">No place called “${esc(q)}” yet.</li>`;
  }
  $('find').addEventListener('input', e => renderList(e.target.value));
  $('find').addEventListener('keydown', e => { if (e.key === 'Enter') { const b = $('list').querySelector('button'); if (b) b.click(); } });
  $('list').addEventListener('click', e => { const b = e.target.closest('button'); if (b) select(b.dataset.k); });
  renderList('');

  // A link into Search for this place, optionally for just one visit
  const IN_SEARCH = { 'Mount Abu': 'Mt. Abu' };   // the few places Search spells differently
  const searchLink = (p, v) => { const place = IN_SEARCH[p.name] || p.name;
    return SEARCH + '#' + new URLSearchParams(v ? { place, from: v.a, to: v.b } : { place }).toString(); };
  const tileStyle = (v, p) => {
    if (!PICS[v.key]) v = p.visits.find(x => PICS[x.key]) || v;   // no close up from this visit: one from another visit here
    const pc = PICS[v.key]; if (!pc) return '';
    const [c, r, rows] = pc;
    return `background-image:url(${PHOTOS}${v.year}.jpg);background-size:800% ${rows * 100}%;background-position:${c / 7 * 100}% ${rows > 1 ? r / (rows - 1) * 100 : 0}%`;
  };

  let sel = null, newestFirst = false;
  function renderOne() {
    const p = sel;
    const ps = p.visits.filter(v => v.psm), ms = p.visits.filter(v => !v.psm);
    const yrs = l => l.length ? (l[0].year === l.at(-1).year ? l[0].year : l[0].year + ' to ' + l.at(-1).year) : '';
    const guru = (img, who, l) => `<div class="guru"><img src="${img}" alt="${who}"><div class="who">${who}</div>
      <div class="how">${l.length ? `<b>${l.length}</b> ${l.length === 1 ? 'visit' : 'visits'}<br>${yrs(l)}` : 'No visits in the diary yet'}</div></div>`;
    const vs = newestFirst ? [...p.visits].reverse() : p.visits;
    let lastY = null, rows = '';
    for (const v of vs) {
      if (v.year !== lastY) { rows += `<div class="yr">${v.year}</div>`; lastY = v.year; }
      rows += `<div class="visit"><div class="tile" style="${tileStyle(v, p)}"></div><div class="vb">
        <div class="vd">${fmtRange(v.a, v.b)}</div>
        <div class="vm">${plural(v.days, 'day')} · ${plural(v.n, 'photo')} · ${v.psm ? 'Pramukh Swami Maharaj' : 'Mahant Swami Maharaj'}</div>
        <div class="vc">${esc(v.cap || '')}</div>
        <a class="vl" href="${searchLink(p, v)}">See these photos ›</a></div></div>`;
    }
    $('one').innerHTML = `<button class="back" id="back" type="button">‹ All places</button>
      <h2 class="pname">${esc(p.name)}</h2><div class="pcountry">${esc(p.country)}</div>
      <div class="gurus">${guru('/*PSM*/', 'Pramukh Swami Maharaj', ps)}${guru('/*MSM*/', 'Mahant Swami Maharaj', ms)}</div>
      <div class="stats"><div><b>${p.visits.length}</b><small>${p.visits.length === 1 ? 'visit' : 'visits'}</small></div>
        <div><b>${p.days.toLocaleString()}</b><small>days</small></div><div><b>${p.photos.toLocaleString()}</b><small>photos</small></div></div>
      <a class="all" href="${searchLink(p)}">See all ${p.photos.toLocaleString()} photos from ${esc(p.name)}</a>
      ${TN[p.name] ? `<a class="tn" href="/then-and-now/#${TN[p.name]}">Then and now ›</a>` : ''}
      <div class="vh"><h2>Every visit</h2><button id="order" type="button">${newestFirst ? 'Show oldest first' : 'Show newest first'}</button></div>${rows}`;
    $('back').onclick = () => select(null);
    $('order').onclick = () => { newestFirst = !newestFirst; renderOne(); };
  }
  function select(key, fly = true) {
    sel = key ? places[key] : null;
    $('home').hidden = !!sel; $('one').hidden = !sel;
    $('scroll').scrollTop = 0;
    if (sel) {
      renderOne();
      if (fly) flyTo(sel.ll, sel.country === 'India' ? Math.max(k, 14) : 4);
      try { history.replaceState(null, '', '#' + new URLSearchParams({ place: sel.name })); } catch (e) {}
    } else {
      $('panel').classList.remove('tall');
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    }
    draw();
  }
  $('grab').addEventListener('click', () => $('panel').classList.toggle('tall'));

  // Globe
  const canvas = $('globe'), ctx = canvas.getContext('2d');
  const proj = d3.geoOrthographic().clipAngle(90).precision(0.3);
  const path = d3.geoPath(proj, ctx);
  const grat = d3.geoGraticule10();
  let W, H, DPR, base, cx, cy, wide;
  let rot = [-71.8, -22.4], k = 8;   // starts over Gujarat, where most visits were
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    wide = W > 760;
    base = Math.min(W, H) * (wide ? .4 : .34);
    cx = wide ? W * .64 : W / 2; cy = wide ? H * .54 : H * .32;
    draw();
  }
  function visible(ll) { return d3.geoDistance(ll, [-rot[0], -rot[1]]) < Math.PI / 2 - .01; }
  const dotR = p => Math.min(4 + Math.sqrt(p.visits.length) * 1.7, 16) * (k > 12 ? 1.15 : 1);

  let shown = [];   // dots on screen this frame, for tapping
  function draw() {
    if (!W) return;
    const R = base * k;
    proj.translate([cx, cy]).scale(R).rotate([rot[0], rot[1], 0]);
    ctx.clearRect(0, 0, W, H);
    const g = ctx.createRadialGradient(cx - R * .3, cy - R * .3, R * .1, cx, cy, R * 1.05);
    g.addColorStop(0, '#16224d'); g.addColorStop(1, '#0e1636');
    ctx.beginPath(); path({ type: 'Sphere' }); ctx.fillStyle = g; ctx.fill();
    ctx.beginPath(); path(grat); ctx.strokeStyle = 'rgba(169,177,214,.08)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.beginPath(); path(LAND); ctx.fillStyle = '#3a4c86'; ctx.fill(); ctx.strokeStyle = 'rgba(169,177,214,.25)'; ctx.lineWidth = .6; ctx.stroke();

    // the selected place: faint lines from where Bapa came from on each visit
    if (sel) {
      ctx.strokeStyle = 'rgba(242,181,68,.28)'; ctx.lineWidth = 1;
      for (const v of sel.visits) if (v.from && v.from !== sel.key) { ctx.beginPath(); path({ type: 'LineString', coordinates: [places[v.from].ll, sel.ll] }); ctx.stroke(); }
    }
    shown = [];
    const order = [...ALL].sort((a, b) => b.visits.length - a.visits.length);   // big dots underneath small ones
    for (const p of order) {
      if (!visible(p.ll)) continue;
      const [x, y] = proj(p.ll); if (x < -20 || y < -20 || x > W + 20 || y > H + 20) continue;
      const r = dotR(p), on = sel === p;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI);
      ctx.fillStyle = on ? '#e8772e' : 'rgba(242,181,68,.82)'; ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = '#0d1330'; ctx.stroke();
      if (on) { ctx.beginPath(); ctx.arc(x, y, r + 6, 0, 2 * Math.PI); ctx.strokeStyle = 'rgba(232,119,46,.6)'; ctx.lineWidth = 2.5; ctx.stroke(); }
      shown.push({ p, x, y, r });
    }
    // names, biggest first, never on top of each other
    const boxes = [];
    const lab = (s, strong) => {
      const text = s.p.name;
      ctx.font = (strong ? '600 16px ' : '400 13px ') + 'Mukta, system-ui, sans-serif';
      const w = ctx.measureText(text).width, x = s.x + s.r + 5, y = s.y + 4;
      const b = [x - 2, y - 13, x + w + 2, y + 4];
      if (!strong && boxes.some(o => b[0] < o[2] && b[2] > o[0] && b[1] < o[3] && b[3] > o[1])) return;
      boxes.push(b);
      ctx.lineWidth = 4; ctx.strokeStyle = '#0d1330'; ctx.lineJoin = 'round'; ctx.strokeText(text, x, y);
      ctx.fillStyle = strong ? '#f4efe4' : '#a9b1d6'; ctx.fillText(text, x, y);
    };
    const selS = shown.find(s => s.p === sel); if (selS) lab(selS, true);
    for (const s of [...shown].reverse()) if (s !== selS) lab(s, false);
  }
  // where Bapa came from before each visit (for the faint lines)
  { const flat = []; years.forEach(y => DATA.years[y].forEach((s, n) => flat.push({ p: s.p, key: y + '-' + n })));
    const byKey = {}; ALL.forEach(p => p.visits.forEach(v => byKey[v.key] = v));
    flat.forEach((s, i) => { if (i) byKey[s.key].from = flat[i - 1].p; }); }

  // Drag turns the globe, pinch or wheel zooms it
  const KMIN = .8, KMAX = 90;
  let zx = 0, zy = 0, busy = false;
  const zoom = d3.zoom().scaleExtent([KMIN, KMAX]).clickDistance(6)
    .on('start', e => { if (e.sourceEvent) { canvas.classList.add('drag'); stopFly(); hideHint(); } zx = e.transform.x; zy = e.transform.y; })
    .on('zoom', e => {
      const t = e.transform;
      if (!busy) {
        const dx = t.x - zx, dy = t.y - zy, R = base * t.k, deg = 180 / Math.PI / R;
        if (e.sourceEvent && e.sourceEvent.type !== 'wheel') rot = [rot[0] + dx * deg, Math.max(-85, Math.min(85, rot[1] - dy * deg))];
        k = t.k;
      }
      zx = t.x; zy = t.y; draw();
    })
    .on('end', () => canvas.classList.remove('drag'));
  const sel3 = d3.select(canvas).call(zoom).on('dblclick.zoom', null);
  const setK = v => { busy = true; sel3.call(zoom.transform, d3.zoomIdentity.translate(zx, zy).scale(v)); busy = false; k = v; };

  // a tap is a press and lift that hardly moved (pointer events, so it works with fingers as well as a mouse)
  let down = null;
  canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: Date.now() }; }, true);
  canvas.addEventListener('pointerup', e => {
    if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 10 || Date.now() - down.t > 600) { down = null; return; }
    down = null;
    const r = canvas.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    let best = null, bd = 1e9;
    for (const s of shown) { const d = Math.hypot(s.x - x, s.y - y) - s.r; if (d < bd) { bd = d; best = s; } }
    if (best && bd < (e.pointerType === 'mouse' ? 14 : 24)) select(best.p.key, false);
  });

  // Smooth flight to a place
  let fly = null;
  function stopFly() { if (fly) { fly.stop(); fly = null; } }
  function flyTo(ll, kt) {
    stopFly();
    const r0 = rot.slice(), k0v = k, r1 = [-ll[0], -ll[1]];
    if (r1[0] - r0[0] > 180) r1[0] -= 360; if (r0[0] - r1[0] > 180) r1[0] += 360;
    const d = d3.geoDistance([-r0[0], -r0[1]], ll), out = d > .3 ? Math.min(k0v, kt, 1.4) : Math.min(k0v, kt);
    const dur = 700 + 900 * Math.min(1, d);
    fly = d3.timer(t => {
      const u = Math.min(1, t / dur), e = d3.easeCubicInOut(u);
      rot = [r0[0] + (r1[0] - r0[0]) * e, r0[1] + (r1[1] - r0[1]) * e];
      const lk = (1 - e) * (1 - e) * Math.log(k0v) + 2 * e * (1 - e) * Math.log(out) + e * e * Math.log(kt);
      setK(Math.exp(lk)); draw();
      if (u >= 1) stopFly();
    });
  }
  $('zin').onclick = () => { stopFly(); setK(Math.min(KMAX, k * 1.8)); draw(); };
  $('zout').onclick = () => { stopFly(); setK(Math.max(KMIN, k / 1.8)); draw(); };
  let hinted = false; function hideHint() { if (!hinted) { hinted = true; $('hint').style.opacity = 0; } }

  addEventListener('resize', resize);
  resize(); setK(k);
  document.fonts && document.fonts.ready.then(draw);
  // #place=London opens straight onto that place (Search can link here with "Show on the map")
  const want = new URLSearchParams(location.hash.slice(1)).get('place');
  const hit = want && ALL.find(p => p.name.toLowerCase() === want.toLowerCase());
  if (hit) select(hit.key);
})();
</script>
</body>
</html>
