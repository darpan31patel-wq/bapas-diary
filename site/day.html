<meta charset="utf-8">
<link rel="stylesheet" href="{{MENU_CSS}}">
<title>Bapa's Diary</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:"Diary Garamond";font-weight:500;src:url({{FONT_G5}}) format("woff2")}
@font-face{font-family:"Diary Garamond";font-weight:600;src:url({{FONT_G6}}) format("woff2")}
@font-face{font-family:"Diary Garamond";font-weight:700;src:url({{FONT_G7}}) format("woff2")}
@font-face{font-family:"Diary Arimo";font-weight:700;src:url({{FONT_A7}}) format("woff2")}
/* Layout: the 2pm On this day picture as a living page. Maroon ground, gold title, a board of ivory polaroids
   hanging straight on cords (one cord per row), each card fading through its year; under it every photo of the day. */
:root{
  --maroon-in:#42101c; --maroon-out:#160509; --maroon-ink:#6e1424; --maroon-deep:#2a0a12;
  --gold-hi:#ffe296; --gold:#ce9840; --gold-soft:#d9a441;
  --ivory-top:#f8f2e4; --ivory-bot:#eadfc8; --ivory-edge:#c4b292; --cream:#faf1de;
  --cord:#c9a46a; --mist:rgba(250,241,222,.62);
  --serif:"Diary Garamond","EB Garamond",Garamond,"Times New Roman",serif;
  --sans:"Diary Arimo",Arimo,Arial,Helvetica,sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--maroon-out);color:var(--cream);font-family:var(--serif)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
.page{min-height:100vh;overflow-x:clip;background:
  radial-gradient(ellipse 60% 30% at 50% 0%,rgba(255,196,110,.16),transparent 70%),
  radial-gradient(ellipse 90% 70% at 50% 30%,var(--maroon-in),var(--maroon-out)) no-repeat;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(46px + 14px) 48px}
.wrap{max-width:1500px;margin:0 auto}
.caps{font:700 11px/1.2 var(--sans);letter-spacing:.2em;text-transform:uppercase}

.pill{font:700 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;background:rgba(0,0,0,.22);color:var(--gold-hi);border:1px solid rgba(217,164,65,.45);border-radius:999px;padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.pill:hover{background:rgba(217,164,65,.14)}
.pill.solid{background:var(--gold-soft);color:var(--maroon-out);border-color:var(--gold-soft)}
.pill[hidden]{display:none}

header{text-align:center;margin:clamp(22px,3vw,40px) 0 clamp(4px,1.5vw,18px)}   /* a little more room between the lines on wider screens (Darpan, 26 Oct 2026: "spread this out a bit") */
h1{font:700 clamp(46px,9vw,100px)/1 var(--serif);margin:0;background:linear-gradient(var(--gold-hi),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45));text-wrap:balance}
.sub{display:flex;align-items:center;justify-content:center;gap:clamp(14px,1.6vw,24px);margin-top:clamp(12px,2vw,26px);font:700 clamp(11px,1.4vw,14px)/1 var(--sans);letter-spacing:.42em;color:var(--gold-soft);padding-left:.42em}
.sub::before,.sub::after{content:"";width:clamp(48px,7vw,120px);height:1px;background:linear-gradient(90deg,transparent,var(--gold-soft))}
.sub::after{transform:scaleX(-1)}
.tithi{margin:clamp(16px,2.4vw,32px) auto 0;font:500 clamp(17px,2vw,21px)/1.4 var(--serif);color:var(--cream);text-wrap:balance;max-width:44ch}
.tithi b{font-weight:700;color:var(--gold-hi)}
.count{margin:clamp(10px,1.4vw,18px) auto 0;font:500 19px/1.45 var(--serif);color:var(--cream);max-width:60ch;text-wrap:balance}
@media (min-width:1000px){.count{max-width:none}}   /* one line across on computers, brighter (Darpan, 26 Oct 2026: too faint) */

/* Computers and iPads on their side (from 1000px): a calmer top (Darpan, 30 Oct 2026: "Too much going on in a small
   space", he picked "matching cards"). The day buttons, the big date and its subtitle in the middle; either side of them
   two matching cards the same height: Screensaver and the email sign up on the left, Where Bapa is now on the right.
   The tithi under the date, between the cards; the count under them. The page's own order is kept, so phones and upright tablets are
   unchanged: the header's lines join the page's grid here (display:contents). With the text made bigger (Aa, the page is
   zoomed) the cards would not fit beside the date, so the page keeps the one tall column phones have (Darpan, 30 Oct
   2026: the cards ran off the screen and the tithi was off centre). */
@media (min-width:1000px){
  /* One band, no gaps: the two cards fill their whole columns right up to the date, and run the full height of the date
     block (date, subtitle, tithi, count), whose lines sit in the middle of that height; the three buttons share the left
     card's height equally, the map fills the right one (Darpan, 30 Oct 2026: "i dont like all this deadspace, rethink"). */
  html:not([style^="zoom"]):not([style*=" zoom"]) .wrap{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-rows:1fr auto auto auto auto 1fr;column-gap:clamp(20px,2.4vw,36px);align-items:start}
  html:not([style^="zoom"]):not([style*=" zoom"]) .wrap>*{grid-column:1/-1}
  html:not([style^="zoom"]):not([style*=" zoom"]) header{display:contents}
  html:not([style^="zoom"]):not([style*=" zoom"]) header>*{grid-column:2}
  html:not([style^="zoom"]):not([style*=" zoom"]) h1{grid-row:2;margin-top:0;font-size:clamp(58px,5.6vw,80px)}
  html:not([style^="zoom"]):not([style*=" zoom"]) .sub{grid-row:3;margin-top:12px}
  html:not([style^="zoom"]):not([style*=" zoom"]) .yir,html:not([style^="zoom"]):not([style*=" zoom"]) #mocknote{grid-column:1/-1;justify-self:center}
  html:not([style^="zoom"]):not([style*=" zoom"]) .tithi{grid-row:4;margin:10px auto 0}
  html:not([style^="zoom"]):not([style*=" zoom"]) .count{grid-row:5;margin:12px auto 0;font-size:19px;white-space:nowrap}
  html:not([style^="zoom"]):not([style*=" zoom"]) .yir{grid-row:7}
  html:not([style^="zoom"]):not([style*=" zoom"]) #mocknote{grid-row:8}
  html:not([style^="zoom"]):not([style*=" zoom"]) header .bapa-now{grid-area:1/3/7/4;justify-self:stretch;align-self:stretch;width:auto;margin:0;max-width:none;min-width:0;padding:14px 22px 14px 16px;gap:clamp(16px,2vw,28px)}
  html:not([style^="zoom"]):not([style*=" zoom"]) header .bapa-now svg{width:clamp(120px,11vw,164px);height:clamp(120px,11vw,164px)}
  html:not([style^="zoom"]):not([style*=" zoom"]) header .side{grid-area:1/1/7/2;justify-self:end;align-self:stretch;width:100%;max-width:400px;min-width:0;display:flex;flex-direction:column;
    justify-content:stretch;align-items:stretch;gap:10px;padding:14px 18px;background:rgba(0,0,0,.22);border:1px solid rgba(217,164,65,.38);
    border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,.25);position:relative}
  html:not([style^="zoom"]):not([style*=" zoom"]) header .ss-launch{order:1;margin:0;flex:2 1 0;display:flex;flex-direction:column;align-items:stretch;gap:10px;align-self:stretch}
  html:not([style^="zoom"]):not([style*=" zoom"]) header .ss-big{flex:1 1 0;display:flex;padding:10px 26px;font-size:13px;justify-content:center;align-items:center}
  html:not([style^="zoom"]):not([style*=" zoom"]) header .ss-big svg{width:18px;height:18px}
  html:not([style^="zoom"]):not([style*=" zoom"]) header .remind{order:2;margin:0;flex:1 1 0;max-width:none;padding:0;align-self:stretch;display:flex;flex-direction:column}
  html:not([style^="zoom"]):not([style*=" zoom"]) header .remind .rm-open{flex:1 1 0;display:flex;justify-content:center;align-items:center;padding:10px 26px;font-size:13px}
  html:not([style^="zoom"]):not([style*=" zoom"]) header .remind .rm-open svg{width:18px;height:18px}
  html:not([style^="zoom"]):not([style*=" zoom"]) header .remind form{position:absolute;left:0;top:calc(100% + 10px);z-index:5;width:420px;margin:0;padding:14px;background:#2a0a12;
    border:1px solid rgba(217,164,65,.38);border-radius:14px;box-shadow:0 10px 24px rgba(0,0,0,.45)}
  html:not([style^="zoom"]):not([style*=" zoom"]) .board{margin-top:18px}
}
@media (min-width:1000px) and (max-width:1359px){
  html:not([style^="zoom"]):not([style*=" zoom"]) header .ss-big,html:not([style^="zoom"]):not([style*=" zoom"]) header .remind .rm-open{padding:12px 16px;font-size:12px;letter-spacing:.1em}}
/* iPads on their side: tighter buttons, so the date between the cards has room */
@media (min-width:1000px) and (max-width:1179px){
  html:not([style^="zoom"]):not([style*=" zoom"]) header .ss-big,html:not([style^="zoom"]):not([style*=" zoom"]) header .remind .rm-open{padding:11px 12px;font-size:11.5px;letter-spacing:.06em}
  html:not([style^="zoom"]):not([style*=" zoom"]) header .bapa-now .bn-town small{display:none}
  html:not([style^="zoom"]):not([style*=" zoom"]) header .bapa-now svg{width:96px;height:96px}
  html:not([style^="zoom"]):not([style*=" zoom"]) header .bapa-now{padding:12px 14px 12px 12px;gap:14px}
  html:not([style^="zoom"]):not([style*=" zoom"]) header .bapa-now .bn-words{overflow:hidden}
  html:not([style^="zoom"]):not([style*=" zoom"]) header .bapa-now .bn-live{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
/* phones and upright tablets: the email and Screensaver buttons stay just where they were */
.side{display:contents}

/* The three buttons' own look, a copy of site/screensaver/launch.css lines 3 to 24, here in the page itself: the page is never
   kept by a browser, launch.css is (4 hours), so after the colours changed on 30 Oct 2026 Darpan's browser still painted both
   top buttons gold with the old thin email line ("why is there no colors on the buttons? why is there an underline?").
   Keep the two copies the same. */
.ss-launch { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 14px; margin: clamp(14px, 2vw, 26px) 0 0; }
.ss-big {
  display: inline-flex; align-items: center; gap: 12px; padding: 16px 34px; border-radius: 999px; cursor: pointer;
  font: 700 14px/1 var(--sans); letter-spacing: .2em; text-transform: uppercase;
  color: var(--maroon-out); background: linear-gradient(180deg, #f3cf7a, var(--gold-soft)); border: 1px solid #f3cf7a;
  box-shadow: 0 6px 24px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .45);
  transition: transform .2s ease, box-shadow .2s ease;
}
.ss-big:hover { transform: translateY(-1px); box-shadow: 0 10px 28px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .45); }
.ss-big svg { width: 22px; height: 22px; fill: currentColor; flex: none; }
a.ss-big { text-decoration: none; }
/* Three distinct buttons, one above the other (Darpan, 30 Oct 2026: "three distinct buttons"): Screensaver in gold,
   Latest vicharan in deep maroon with gold letters, Daily darshan emails in ivory, all the same size and shape */
.ss-latest { color: #ffe296; background: linear-gradient(180deg, #8a2236, #4d0f1c); border-color: rgba(255, 226, 150, .75); }
.ss-latest:hover { color: #fff3cf; }
.remind button.rm-open { box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; gap: 12px; padding: 16px 34px; border-radius: 999px; cursor: pointer;
  font: 700 14px/1 var(--sans); letter-spacing: .2em; text-transform: uppercase;
  color: var(--maroon-out); background: linear-gradient(180deg, #fffaf0, #e9d8b4); border: 1px solid #fffaf0;
  box-shadow: 0 6px 24px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .6); transition: transform .2s ease, box-shadow .2s ease; }
.remind button.rm-open:hover { color: var(--maroon-out); border-color: #fffaf0; transform: translateY(-1px); box-shadow: 0 10px 28px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .6); }
.remind button.rm-open svg { width: 22px; height: 22px; fill: currentColor; flex: none; margin: 0; vertical-align: 0; }
@media (max-width: 600px) { .remind button.rm-open { padding: 15px 26px; font-size: 13px; width: min(100%, 300px); } }

/* board */
.board{position:relative;margin-top:30px}
.cords{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.cards{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));column-gap:clamp(12px,1.6vw,26px);row-gap:clamp(30px,3.4vw,46px);padding-top:16px}
@media (max-width:520px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.slot{display:flex;flex-direction:column;align-items:center;min-width:0}
.card{position:relative;display:block;width:100%;background:linear-gradient(var(--ivory-top),var(--ivory-bot));border:1px solid var(--ivory-edge);padding:3.5% 3.5% 0;box-shadow:0 10px 18px rgba(0,0,0,.42),0 2px 4px rgba(0,0,0,.3);cursor:pointer;text-align:center;text-decoration:none;transform-origin:50% -12px;will-change:transform}
.peg{position:absolute;left:50%;top:-17px;width:12px;height:30px;margin-left:-6px;border-radius:6px 6px 3px 3px;background:linear-gradient(90deg,#6b4022,#b07a4a 30%,#9a6538 55%,#5d361c);box-shadow:1px 3px 4px rgba(0,0,0,.45);z-index:2}
.peg::after{content:"";position:absolute;left:1px;right:1px;top:12px;height:3px;background:#3a2210;opacity:.7}
.photo{position:relative;aspect-ratio:3/4;max-width:100%;overflow:hidden;background:var(--maroon-deep)}
/* each photo sits on its own layer with its softened fill; the next photo's layer fades in on top of the one showing,
   which stays fully there until it is covered, so the change is a clean dissolve with no dark dip in the middle; 5.5 s and the caption fades with it (Darpan, 31 Oct 2026: "make the fades 2-3 seconds longer so it's cleaner")
   (Darpan, 28 Oct 2026: some pictures weren't fading or changing as expected) */
.photo .layer{position:absolute;inset:0;opacity:0;z-index:0}
.photo .layer.on{opacity:1}
.photo .layer.top{z-index:1;transition:opacity 5.5s ease-in-out}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* and it never sits still: each photo drifts slowly closer to Bapa's face and back, out of step with the others, so the
   board feels alive between the changes (Darpan, 28 Oct 2026) */
.photo .layer img:not(.bg){transform-origin:var(--fx,50%) var(--fy,30%);animation:breathe 20s ease-in-out infinite alternate;animation-delay:var(--wait,0s)}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(var(--zoom,1.03))}}
.paused .photo .layer img{animation-play-state:paused}
/* Darpan, 25 Oct 2026 (the On this day picture's rules): Bapa's whole head stays in the frame; any space left when it
   has to zoom out is filled with the photo's own colours, softened (make.fill) */
.photo img.placed{inset:auto;max-width:none;object-fit:fill}
.photo img.bg{inset:-8%;width:116%;height:116%;object-fit:cover;filter:blur(12px) brightness(.72)}
.photo .words{position:absolute;inset:0;z-index:2;display:grid;place-items:center;padding:12%;background:radial-gradient(circle at 50% 40%,#5a1626,var(--maroon-deep));transition:opacity 5.5s ease-in-out}
.photo .words p{margin:0;font:500 clamp(14px,1.3vw,16px)/1.35 var(--serif);font-style:italic;color:var(--gold-hi);text-align:center;text-wrap:balance;overflow-wrap:anywhere;transition:opacity 2.75s ease-in-out}
.photo .words.off{opacity:0}
.photo.story{display:grid;place-items:center;padding:12%;background:radial-gradient(circle at 50% 40%,#5a1626,var(--maroon-deep))}
.photo.story p{margin:0;font:500 clamp(14px,1.3vw,16px)/1.35 var(--serif);font-style:italic;color:var(--gold-hi);text-wrap:balance}
.label{padding:9px 2px 10px;color:var(--maroon-ink)}
.yr{font:700 clamp(24px,2.3vw,30px)/1 var(--serif)}
.pl{margin-top:6px;font:800 clamp(12.5px,1.1vw,15px)/1.2 var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--maroon-ink);text-wrap:balance;overflow-wrap:anywhere}   /* year and place are the biggest words on a card (Darpan, 26 Oct 2026) */
.ti{margin-top:4px;font:500 12.5px/1.25 var(--serif);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev{margin-top:4px;font:500 12.5px/1.25 var(--serif);text-wrap:balance;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.fest{display:inline-block;margin-top:5px;max-width:100%;font:700 8.5px/1.25 var(--sans);letter-spacing:.14em;text-transform:uppercase;background:var(--maroon-ink);color:var(--gold-hi);padding:3px 7px;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.of{margin-top:5px;font:700 8.5px/1 var(--sans);letter-spacing:.16em;color:rgba(110,20,36,.6);font-variant-numeric:tabular-nums}
.cap{margin-top:11px;min-height:2.8em;width:100%;text-align:center;font:500 15px/1.35 var(--serif);color:var(--cream);transition:opacity 2.75s ease-in-out;text-wrap:balance;max-width:100%;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.slot .vid{display:inline-flex;align-items:center;gap:8px;margin-top:2px;padding:6px 13px 6px 7px;border:1px solid rgba(217,164,65,.6);border-radius:999px;background:rgba(0,0,0,.22);color:#ffe296;font:600 12.5px/1 Poppins,Arimo,sans-serif;letter-spacing:.04em;text-decoration:none;white-space:nowrap;transition:background .2s,border-color .2s}
.slot .vid:hover,.slot .vid:focus-visible{background:rgba(217,164,65,.22);border-color:#ffe296}
.slot .vid i{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#d9a441}
.slot .vid i::before{content:"";margin-left:2px;border-left:7px solid #2a0d12;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
.cap.fade{opacity:0}
/* The travelling star (Darpan, 31 Oct 2026: "like a dot, like a star, like a glowing star that goes through the year ...
   one rope at a time behind the images ... in the middle of the images ... the glow of the frames gets adjusted
   accordingly"). A bright golden star crosses the board along each rope in turn, left to right, at the height of the
   middle of the photos and behind the frames. Each frame's golden glow is lit by the star: it brightens as the star comes
   up behind it, leans towards the side the star is on, is brightest with the star right behind its middle, and fades as
   the star moves on. The frame under the mouse glows fully too. --g (0 to 1) and --gx (-1 left to 1 right) are set by
   star() below. The stars layer is as wide as the window and cut at its edges, so it never makes the page scroll sideways.
   Darpan, 31 Oct 2026 13:21: "the glow a little less big, star smaller, want to see the star move in between images,
   want the star to hit the frame and then the frame to slowly move as though it's been touched, the frames
   exponentially slow down in movement left to right": a smaller star and a tighter glow, the star drifts slowly through
   the gaps between frames, and each frame it reaches swings gently on its peg, each swing a little smaller and slower.
   (tstar, not star: .star is the festival night sky's little stars.) */
.tstars{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden}
.tstar{position:absolute;left:0;top:0;width:0;height:0;opacity:0;transition:opacity 1.2s ease;will-change:transform}
.tstar.on{opacity:1}
.tstar::before{content:"";position:absolute;left:-60px;top:-60px;width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,248,222,.8) 0,rgba(255,226,140,.45) 12%,rgba(244,190,80,.14) 30%,rgba(226,160,56,.03) 48%,transparent 62%)}
.tstar::after{content:"";position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;
  background:radial-gradient(circle,#fff 0,#fffbe8 40%,#ffe08a 75%,#f5c057 100%);
  box-shadow:0 0 3px 1px rgba(255,250,225,1),0 0 8px 3px rgba(255,214,110,.8),0 0 14px 5px rgba(240,176,60,.35)}
.tstar i{position:absolute;left:-15px;top:-15px;width:30px;height:30px;animation:tstwinkle 3.4s ease-in-out infinite;
  background:linear-gradient(90deg,transparent,rgba(255,246,214,.95) 50%,transparent) center/100% 1.5px no-repeat,
    linear-gradient(0deg,transparent,rgba(255,246,214,.95) 50%,transparent) center/1.5px 100% no-repeat}
@keyframes tstwinkle{0%,100%{transform:scale(.75) rotate(0deg);opacity:.65}50%{transform:scale(1.15) rotate(18deg);opacity:1}}
.paused .tstar i{animation-play-state:paused}
/* Diwali sparkle (Darpan, 31 Oct 2026: "for those five days the travelling star becomes gentle diya lights along the
   ropes, with a soft firework glow on New Year"). From Dhanteras to Bhai Bij the star is a little diya flame, and a clay
   diya sits on each rope in every gap between the frames, burning low; as the flame drifts past, each one brightens and
   then settles back. On the New Year's day soft blooms of firework light open and fade behind the board. Only on those
   days by this year's BAPS calendar; the star comes back by itself the day after. With reduced motion nothing flickers
   and no blooms open. */
.board.dipa .tstar::before{left:-80px;top:-80px;width:160px;height:160px;
  background:radial-gradient(circle,rgba(255,236,190,.7) 0,rgba(255,180,80,.42) 11%,rgba(240,120,40,.16) 30%,rgba(200,80,30,.05) 50%,transparent 70%)}
.board.dipa .tstar::after{left:-4.5px;top:-13px;width:9px;height:15px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;
  background:radial-gradient(ellipse at 50% 72%,#fff 0,#fff3c4 32%,#ffc04a 62%,#ff7a1a 100%);
  box-shadow:0 0 5px 2px rgba(255,236,170,.95),0 0 14px 5px rgba(255,160,60,.6),0 0 26px 9px rgba(240,110,30,.28);
  transform-origin:50% 90%;animation:flicker 1.2s ease-in-out infinite alternate}
.board.dipa .tstar i{display:none}
.dipas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:2}
.dipas .diya{position:absolute;width:40px;height:40px;margin:-35px 0 0 -20px;overflow:visible;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.dipas .diya .glow{opacity:.45;transform-origin:20px 15px;transition:opacity 1.6s ease,transform 1.6s ease;animation:none}

.festhead{display:none}

  radial-gradient(ellipse 70% 40% at 50% 100%,rgba(255,150,50,.16),transparent 70%),

  (function () {
    var box = document.currentScript.parentNode, open = box.querySelector('.rm-open'), form = box.querySelector('form'), err = box.querySelector('.rm-err');
    open.addEventListener('click', function () { open.hidden = true; form.hidden = false; open.setAttribute('aria-expanded', 'true'); form.email.focus(); });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var lists = [];
      if (form.daily.checked) lists.push('daily');
      if (form.weekly.checked) lists.push('weekly');
      if (!lists.length) { err.textContent = 'Please tick at least one.'; return; }
      var btn = form.querySelector('button'), email = form.email.value.trim();
      btn.disabled = true; err.textContent = '';
      fetch('/api/weekly', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, lists: lists, website: form.website.value }) })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          if (!res.ok) throw new Error(res.j.error || 'Sorry, something went wrong. Please try again.');
          var p = document.createElement('p'); p.className = 'rm-done';
          p.textContent = 'Thank you 🙏🏽 Please open the email we just sent to ' + email + ' and tap the button in it.';
          form.replaceWith(p);
        })
        .catch(function (x) { err.textContent = x.message || 'Sorry, something went wrong. Please try again.'; btn.disabled = false; });
    });
  })();
  </script>

const nice = m => `${+m.slice(3)} ${MONTHS[+m.slice(0, 2) - 1]}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
// Today only tags these 12 festivals, matched across the calendar's spellings (Darpan, 26 Oct 2026: "just these 12")
const KEEP = [['Diwali', /^diwali\b/i], ['Annakut', /annakut/i], ['New Year', /bestu|nutan varsh|^new year$/i],
  ['Janmashtami', /janmashtami/i], ['Guru Purnima', /guru purnima/i], ['Swaminarayan Jayanti', /hari-?nom|swaminarayan jayanti|swaminarayan's birthday/i],
  ['Vasant Panchami', /vasant panch/i], ['Holi', /^holi\b/i], ['Rathyatra', /rath ?yatra/i], ['Raksha Bandhan', /raksha ?bandhan/i],

const festsOf = c => {
  if (!c) return [];
  const parts = [c[1], c[2]].filter(Boolean).join(';').split(/[;,\/]/).map(x => x.trim()).filter(Boolean);

const festOf = c => festsOf(c).join(' · ');

const MARIGOLD = ['#ff9a1a', '#ff9a1a', '#ffc233'], ROSES = ['#e0245e', '#ff8fab'], JASMINE = ['#fffdf5', '#efe6cc'];
const FESTIVE = {

// What each On this day post says beyond its one line (Darpan, 29 Oct 2026: "lots more information ... incorporate more"):
// s = [year, place, line, {ti: Indian date, h: title, w: [paragraphs, or the UK diary's lines], l: 1 for a diary day}],

let DAY = null, cards = [], everyPhoto = [], timers = [], paused = false, showing = null;

// On this day means the years gone by: today, and the days still to come this year, never show this year's own card or

// Worked out in the browser from its own clock, so it turns over by itself at New Year.

async function open(mmdd, push) {

  $('title').textContent = nice(mmdd);
  $('subtitle').textContent = mmdd === TODAY ? "TODAY IN BAPA'S DIARY" : "IN BAPA'S DIARY";
  $('loading').hidden = false; $('board').hidden = $('controls').hidden = $('all').hidden = true;
  $('tithi').hidden = true; $('count').textContent = ''; $('mocknote').innerHTML = '';
  document.title = mmdd === TODAY ? "Bapa's Diary" : `${nice(mmdd)} in Bapa's Diary`;
  let data;
  try { data = await SRC.day(mmdd); } catch (e) { $('loading').textContent = 'This day could not be opened. Please try again in a moment.'; return; }
  if (showing !== mmdd) return;
  DAY = pastOnly(data);
  const key = festKey(data.cal && data.cal[now.getFullYear()]);
  if (key) try {   // a festival day: every year's festival, each on its own Indian date, never this year's own

  } catch (e) {}   // its festival page could not be opened: the date as on any other day

}

function render() {

// Each card hangs a little crooked on its peg, the way real photos do on a cord (Darpan liked the uneven hang, 24 Oct 2026).
// Brushed by the mouse (or a finger), it swings like a pendulum: out one way, back past straight the other way, and
// slowly settles, the way a photo really would. Never more than about four degrees from where it hangs.
const swinging = new Set();

// Swiped sideways on a phone, the cards swing on their cord as the row moves under the finger, a little behind it the
// way a hanging photo would, and settle back by themselves (Darpan, 28 Oct 2026). Only the cards on the screen move.
let lastLeft = null;
$('cards').addEventListener('scroll', () => {
  const box = $('cards'), left = box.scrollLeft, dx = lastLeft == null ? 0 : left - lastLeft;

    if (r.right < 0 || r.left > w) return;
    // the row slides left (dx > 0), so the card's bottom trails to the right: an anticlockwise turn
    c.v = Math.max(-.12, Math.min(.12, (c.v || 0) - Math.max(-1, Math.min(1, dx / 40)) * .018));

  });

// the caption under a card leans with it, from the same peg, so it always sits centred under the card (Darpan, 26 Oct 2026)
function lean(c, deg) {   // the card and its caption turn together on the peg, so the caption can never drift off centre
  c.slot.style.transformOrigin = '50% -12px';
  c.slot.style.transform = `rotate(${deg}deg)`;
}
addEventListener('resize', () => cards.forEach(c => lean(c, c.rest + (c.a || 0))));
// The swing runs in steps of a sixtieth of a second whatever the screen's refresh rate, so it moves the same on a 120 Hz
// Mac or iPad as on a 60 Hz screen (Darpan, 31 Oct 2026: "the movement of the frames is a little off").
let swingAt = 0, swingLeft = 0;
function swing(t) {

    if (c.push) { const d = Math.sign(c.push) * Math.min(Math.abs(c.push), .0025); c.v += d; c.push -= d; if (Math.abs(c.push) < 1e-4) c.push = 0; }   // the star's touch, eased in
    c.v += -c.a * (c.spring || .0033);   // the peg pulls it back towards hanging (one swing there and back takes about two seconds; after the star's touch, about three and a half)
    c.v *= c.damp || .992;   // and each swing is a little smaller than the last (slower to settle after the star's touch)
    c.a = Math.max(-4, Math.min(4, c.a + c.v));

    lean(c, (c.rest + c.a).toFixed(3));

  });

}

// The frame under the mouse glows fully straight away, and goes back to the star's light when the mouse leaves
// (Darpan, 30 Oct 2026: "glow needs to follow the mouse")

// make.crop_to, the On this day picture's framing (Darpan, 25 Oct 2026): the photo fills the card around Bapa, his face

// card it zooms out just enough, and the space left shows the photo's own colours, softened. p[4] is where his face is
// [centre x, centre y, x, y, w, h, width / height, close darshan], as parts of the photo. Returns true when there is space left.

// how many cards on each rope: the top ropes full, then only the bottom ropes step down one card at a time, never
// more than the rope above, never more than one fewer, never below half a full rope (Darpan, 29 Oct 2026: "want top
// rows to be full, just the bottom ones"). Most full ropes wins, then the fullest top rope, then the most steps, then the fewest ropes
// (today's 30 cards: 8, 8, 7, 7; 26: 8, 7, 6, 5; 21: 8, 7, 6; 13: 7, 6; 5: 5)
function steps(total, fit) {

// one cord per row of cards, drawn through the pegs
function cords() {
  // the cords run the full width of the window, edge to edge (Darpan, 24 Oct 2026). On computers the cards fill that
  // width too, as many to a row as fit, and each row hangs in a real curve: the rope sags in the middle and the cards
  // ride on it, the side ones a little higher (Darpan, 26 Oct 2026)
  const svg = $('cords'), board = $('board'), vw = document.documentElement.clientWidth, wide = vw > 760, rows = {};
  if (wide) {
    const w = board.parentElement.getBoundingClientRect(), g = Math.max(40, vw * .035);   // a safe gap from the window edge (Darpan, 26 Oct 2026: "a tiny bit more breathing space")
    board.style.marginLeft = Math.round(g - w.left) + 'px'; board.style.marginRight = Math.round(g - (vw - w.right)) + 'px';
  } else board.style.marginLeft = board.style.marginRight = '';

  // centred (Darpan, 29 Oct 2026: "8 and then 7, 6, 5. So it's spread out across and everything should be centered").

        `<ellipse cx="${x}" cy="${y + 46}" rx="9" ry="12" fill="#2e8b57"/><ellipse cx="${x}" cy="${y + 47}" rx="6" ry="8" fill="#e6b450"/>` +
        `<ellipse cx="${x}" cy="${y + 48}" rx="4" ry="5.4" fill="#1565c0"/><ellipse cx="${x}" cy="${y + 49}" rx="2" ry="2.8" fill="#0b2545"/></g>`;
    }
  }
  return out;
}

// the sky behind the board: Diwali's fireworks burst now and then at the sides and the top, where the cards leave it
// showing; petals drift down at Annakut, Swaminarayan Jayanti, Vasant Panchami, the Jayantis; embers rise at Holi,
// clouds of colour at Fuldol; the stars of Krishna's midnight; the full moon of Guru Purnima and Sharad Punam.
// Still while the board is paused, and never with reduced motion.
let skyTimer = null;
function sky(k) {
  const s = $('sky');
  clearTimeout(skyTimer); s.innerHTML = '';
  const [kind, C] = k && FESTIVE[k].sky || [];
  if (!kind) return;
  const r = (a, b) => a + Math.random() * (b - a), pick = L => L[Math.floor(Math.random() * L.length)];
  const add = (cls, css, vars) => { const e = document.createElement('i'); e.className = cls; Object.assign(e.style, css);
    Object.entries(vars || {}).forEach(([n, v]) => e.style.setProperty(n, v)); s.append(e); return e; };
  if (kind === 'moon' || kind === 'stars') {   // still, so even with reduced motion
    if (kind === 'moon') add('moon', {});
    for (let i = 0; i < (kind === 'stars' ? 70 : 30); i++) add('star', {left: r(0, 100).toFixed(1) + '%', top: r(0, 70).toFixed(1) + '%', opacity: r(.3, .9).toFixed(2)}, {'--d': -r(0, 3).toFixed(1) + 's'});
    return;
  }
  if (reduce) return;
  if (kind === 'fall') {
    for (let i = 0; i < 18; i++) add('petal', {left: r(0, 100).toFixed(1) + '%', scale: r(.6, 1.2).toFixed(2)},
      {'--c': pick(C), '--t': r(14, 26).toFixed(1) + 's', '--d': -r(0, 26).toFixed(1) + 's', '--s': r(-60, 60).toFixed(0) + 'px'});
    return;
  }
  if (kind === 'embers') {
    for (let i = 0; i < 26; i++) add('ember', {left: r(0, 100).toFixed(1) + '%'}, {'--t': r(7, 14).toFixed(1) + 's', '--d': -r(0, 14).toFixed(1) + 's', '--s': r(-40, 40).toFixed(0) + 'px'});
    return;
  }
  if (kind === 'puffs') {
    for (let i = 0; i < 12; i++) add('puff', {left: r(-5, 95).toFixed(1) + '%'}, {'--c': pick(C), '--w': r(110, 220).toFixed(0) + 'px', '--t': r(24, 40).toFixed(1) + 's', '--d': -r(0, 40).toFixed(1) + 's', '--s': r(-60, 60).toFixed(0) + 'px'});
    return;
  }
  const FW = ['#ffd36b', '#ff7a45', '#ff5f9e', '#8fd8ff', '#b8ff7a', '#fff3cf', '#c99bff'];
  const pop = () => {
    if (!document.hidden && !paused) {
      const b = document.createElement('div'), side = Math.random() < .7, c = pick(FW), n = 22, R = r(50, 120);
      b.className = 'fw';
      b.style.left = (side ? (Math.random() < .5 ? r(.02, .16) : r(.84, .98)) : r(.2, .8)) * innerWidth + 'px';
      b.style.top = (side ? r(.1, .7) : r(.04, .2)) * innerHeight + 'px';
      for (let i = 0; i < n; i++) {
        const e = document.createElement('i');
        e.style.setProperty('--a', (i * 360 / n + r(-4, 4)).toFixed(1) + 'deg'); e.style.setProperty('--r', (R * r(.75, 1.1)).toFixed(0) + 'px');
        e.style.setProperty('--c', c); e.style.setProperty('--len', r(14, 26).toFixed(0) + 'px');
        b.append(e);
      }
      s.append(b); setTimeout(() => b.remove(), 2200);
    }
    skyTimer = setTimeout(pop, r(600, 1800));
  };
  skyTimer = setTimeout(pop, 400);
}
addEventListener('resize', () => requestAnimationFrame(cords));
new ResizeObserver(() => requestAnimationFrame(cords)).observe($('cards'));
document.fonts && document.fonts.ready.then(cords);

// a BAPS video of that day on YouTube (tools/web_videos.py), under the card, in the year's heading and in the wide view
// (Darpan, 30 Oct 2026: "add video link to everywhere relevant on the page, for the specific dates")
function watchVideo(v, cls) {
  return `<a class="${cls}" href="https://www.youtube.com/watch?v=${encodeURIComponent(v[0][0])}" target="_blank" rel="noopener" title="${esc(v[0][1])}"><i aria-hidden="true"></i>Video Darshan</a>`;
}

// The Diwali days (Darpan, 31 Oct 2026, see .dipas above): Dhanteras, the New Year (Annakut and Bestu Varash) and Bhai
// Bij of each year, by the BAPS calendar in the diary (calendar/baps-calendar.csv, which runs to 2027), as month-day.
// From the first to the last of them the star is a diya flame and the ropes carry diyas; the New Year's day has its
// soft firework glow; and the three Diwali sections open under the board.
const DIWALI_DAYS = {2026: ['11-06', '11-10', '11-11'], 2027: ['10-27', '10-30', '10-31']};
let DIPA = false, DIYAS = [];
function diwaliDays() {
  const d = DIWALI_DAYS[now.getFullYear()];
  if (showing !== TODAY || !d || TODAY < d[0] || TODAY > d[2]) return null;
  return {newYear: TODAY === d[1], after: TODAY >= d[1]};
}
function sparkle() {
  const S = diwaliDays(), page = document.querySelector('.page');
  DIPA = !!S;
  $('board').classList.toggle('dipa', DIPA);
  page.classList.toggle('newyear', !!(S && S.newYear));
  newYearGlow(S && S.newYear);
  $('dw').hidden = true; $('dw').innerHTML = '';
  if (!S) return;
  const mmdd = showing;
  SRC.season().then(J => { if (showing === mmdd) seasonSections(J, S); }).catch(() => {});
}
// the rope's height across the board at x, as cords() draws it
function ropeAt(k, x, vw) {
  const y = k - 5, a = y - ropeSag / 2, q = y + 1.5 * ropeSag, u = x / vw;
  return (1 - u) * (1 - u) * a + 2 * (1 - u) * u * q + u * u * a;
}
// a diya on each rope in every gap between the frames, and one at each end where the rope has room
function dipas(vw, D) {
  const box = $('dipas');
  box.style.left = $('stars').style.left; box.style.width = vw + 'px';
  DIYAS = [];
  if (!DIPA || !cards.length) { box.innerHTML = ''; return; }
  const rows = {};
  cards.forEach(c => (rows[c.slot.offsetTop] = rows[c.slot.offsetTop] || []).push(c.slot.getBoundingClientRect()));
  Object.keys(rows).forEach(t => {
    const r = rows[t].sort((p, q) => p.left - q.left), xs = [];
    if (r[0].left > 60) xs.push(r[0].left / 2);
    for (let i = 1; i < r.length; i++) xs.push((r[i - 1].right + r[i].left) / 2);
    if (vw - r[r.length - 1].right > 60) xs.push((r[r.length - 1].right + vw) / 2);
    xs.forEach(x => DIYAS.push({k: +t, x, y: ropeAt(+t, x, vw), till: 0}));
  });
  box.innerHTML = DIYAS.map(d => DIYA('').replace('<svg ', `<svg style="left:${d.x.toFixed(1)}px;top:${d.y.toFixed(1)}px" `)).join('');
  [...box.children].forEach((e, i) => DIYAS[i].el = e);
}
// the flame brightens each diya it passes, which then settles back to burning low after a few seconds
function lightDiyas(k, x, t) {
  DIYAS.forEach(d => {
    if (d.k === k && Math.abs(d.x - x) < 26) d.till = t + 3400;
    const on = d.till > t;
    if (on !== !!d.on) { d.on = on; d.el.classList.toggle('on', on); }
  });
}
// New Year's day: soft blooms of firework light open now and then at the sides and the top, where the cards leave the
// sky showing, and fade; held still by Pause, and none with reduced motion
let glowTimer = null;
function newYearGlow(on) {
  clearTimeout(glowTimer);
  let g = document.querySelector('.nyglow');
  if (!on || reduce) { if (g) g.remove(); return; }
  if (!g) { g = document.createElement('div'); g.className = 'nyglow'; g.setAttribute('aria-hidden', 'true'); document.querySelector('.page').prepend(g); }
  const C = ['rgba(255,214,120,.75)', 'rgba(255,170,90,.7)', 'rgba(255,140,170,.6)', 'rgba(205,175,255,.55)', 'rgba(255,238,175,.75)'];
  const r = (a, z) => a + Math.random() * (z - a);
  const bloom = () => {
    if (!document.hidden && !paused) {
      const b = document.createElement('b'), side = Math.random() < .75;
      b.style.left = (side ? (Math.random() < .5 ? r(2, 17) : r(83, 98)) : r(22, 78)).toFixed(1) + '%';
      b.style.top = (side ? r(12, 78) : r(4, 20)).toFixed(1) + '%';
      b.style.setProperty('--w', Math.round(r(240, 480)) + 'px');
      b.style.setProperty('--c', C[Math.floor(Math.random() * C.length)]);
      b.style.setProperty('--t', r(4.8, 6.8).toFixed(1) + 's');
      g.append(b); setTimeout(() => b.remove(), 7200);
    }
    glowTimer = setTimeout(bloom, r(1100, 2600));
  };
  glowTimer = setTimeout(bloom, 600);
}
// The three Diwali sections under the board (Darpan, 31 Oct 2026: "Bapa's Diwali every year 1999 to 2025, Chopda pujan
// and where he was, as one scroll with the festival video for each year", "his New Year blessings from each year in one
// place, playing inside the page", "the annakut spreads from every mandir and year, with Bapa's annakut darshan, grouped
// by place"). Each video opens in the page's own video frame. From the New Year on, the ashirwad comes first.
const guruOn = d => d && d < '2016-08-13' ? 'Pramukh Swami Maharaj' : 'Mahant Swami Maharaj';   // Swamishri, by the date
function seasonSections(J, S) {
  const y0 = now.getFullYear();
  const at = p => p[4] && p[4].length > 1 ? `${Math.round(p[4][0] * 100)}% ${Math.round(p[4][1] * 100)}%` : '50% 45%';
  const frame = (p, cls) => `<span class="frame${cls ? ' ' + cls : ''}"><span class="im"><img loading="lazy" decoding="async" src="${esc(SRC.photo(p))}" alt="${esc(p[2] || '')}" style="object-position:${at(p)}"></span><small>${esc(p[2] || '')}</small></span>`;
  const full = d => d ? `${+d.slice(8)} ${MONTHS[+d.slice(5, 7) - 1]} ${d.slice(0, 4)}` : '';
  const more = d => d ? `<a class="go" href="${esc(SRC.search(d))}">See more &rsaquo;</a>` : '';
  const diwali = (J.diwali || []).filter(r => r.y < y0 && r.p.length);
  const ashi = (J.ashirwad || []).filter(r => r.y < y0);
  const ann = (J.annakut || []).map(P => Object.assign({}, P, {years: P.years.filter(Y => Y.y < y0 || Y.d < now.toISOString().slice(0, 10))})).filter(P => P.years.length);
  const out = {};
  if (diwali.length) out.diwali = `<section id="dw-diwali"><h2>Bapa's Diwali, every year</h2>` +
    `<p class="lede">Where Bapa was each Diwali from ${diwali[0].y} to ${diwali[diwali.length - 1].y}, the Chopda Pujan and the darshan of the day. Happy Diwali 🪔</p><div class="dwyears">` +
    diwali.map(r => `<article class="dwrow" id="dw-${r.y}"><div class="when">${DIYA('')}<div class="yr">${r.y}</div>` +
      `<div class="where">${esc(r.place || '')}</div><div class="it">${full(r.d)}</div><div class="g">${esc(guruOn(r.d))}</div>` +
      `${r.chopda ? '<span class="chop">Chopda Pujan</span>' : ''}<div class="links">${r.v ? watchVideo([r.v], 'go vgo') : ''}${more(r.d)}</div></div>` +
      `<div class="ph n${Math.min(2, r.p.length)}">${r.p.slice(0, 2).map(p => frame(p)).join('')}</div></article>`).join('') + '</div></section>';
  if (ashi.length) out.ashi = `<section id="dw-ashirwad"><h2>Bapa's New Year ashirwad</h2>` +
    `<p class="lede">The New Year blessings of Pramukh Swami Maharaj and Mahant Swami Maharaj, year by year. Tap a year to watch it here. Nutan Varshabhinandan 🙏🏽</p><div class="ashis">` +
    ashi.map(r => `<a class="ashi" href="https://www.youtube.com/watch?v=${encodeURIComponent(r.v[0])}" target="_blank" rel="noopener" title="${esc(r.v[1])}">` +
      `<span class="frame"><span class="im${r.p.length ? '' : ' none'}">${r.p.length ? `<img loading="lazy" decoding="async" src="${esc(SRC.photo(r.p[0]))}" alt="${esc(r.p[0][2] || '')}" style="object-position:${at(r.p[0])}">` : DIYA('')}</span>` +
      `<span class="t"><b>${r.y}</b><span>${esc(r.place || 'New Year')}</span><em>${esc(guruOn(r.d || r.y + '-11-01'))}</em></span></span><span class="play" aria-hidden="true"></span></a>`).join('') + '</div></section>';
  if (ann.length) {
    const big = ann.filter(P => P.years.length > 1), rest = ann.filter(P => P.years.length === 1);
    const year = (Y, label) => `<div class="anyear"><div class="head"><b>${label}</b>${more(Y.d)}</div><div class="ps">` +
      Y.b.map(p => frame(p, 'bapa')).join('') + Y.s.map(p => frame(p)).join('') + '</div></div>';
    const band = (name, items, n) => `<div class="anplace"><h3>${esc(name)} <span>${n}</span></h3><div class="anyears">${items}</div></div>`;
    out.ann = `<section id="dw-annakut"><h2>Annakut gallery</h2>` +
      `<p class="lede">The annakut offered at every mandir, year by year, place by place. The gold frames are Bapa's own darshan of the annakut.</p><div class="anplaces">` +
      big.map(P => band(P.place, P.years.slice().reverse().map(Y => year(Y, Y.y)).join(''), `${P.years.length} years`)).join('') +
      (rest.length ? band('More mandirs', rest.map(P => year(P.years[0], `${esc(P.place)} ${P.years[0].y}`)).join(''), `${rest.length} places`) : '') +
      '</div></section>';
  }
  const order = S.after ? ['ashi', 'ann', 'diwali'] : ['diwali', 'ashi', 'ann'];
  $('dw').innerHTML = order.map(k => out[k] || '').join('');
  $('dw').hidden = !$('dw').innerHTML;
}

// every photo of the day, year by year
function group(y, Y, where, cal, stories) {
  if (!Y && !stories.length) return;
  const g = document.createElement('section'); g.className = 'yeargroup'; g.id = 'y' + y;
  const fest = festOf(cal), ti = Y && Y.d ? longDate(Y.d) : tithiOf(cal) || dayTi(Y, stories), day = Y && Y.d || y + '-' + DAY.date;
  g.innerHTML = `<div class="yhead"><h3>${y}</h3><span class="caps">${esc(where || '')}</span>` +
    (ti ? `<span class="it">${esc(ti)}</span>` : '') + (fest ? `<span class="fest">${esc(fest)}</span>` : '') +
    `<a class="go" href="${esc(SRC.search(day))}">See more &rsaquo;</a>${Y && Y.v ? watchVideo(Y.v, 'go vgo') : ''}</div>` +
    told(Y, stories).map(t => storyHTML(...t)).join('');
  const add = (list, note) => {
    if (!list || !list.length) return;
    if (note) g.insertAdjacentHTML('beforeend', `<p class="tripnote">${note}</p>`);
    const grid = document.createElement('div'); grid.className = 'thumbs';
    list.forEach(p => {
      const i = everyPhoto.length;
      everyPhoto.push({p, y, d: Y && Y.d, where, cal, trip: note ? Y.trip : null, v: !note && Y && Y.v, ti: !cal && dayTi(Y, stories), more: storyShort(Y, stories, p[2])});
      const b = document.createElement('button'); b.className = 'thumb'; b.type = 'button';
      const url = SRC.photo(p);
      b.innerHTML = `<span class="im">${url ? `<img loading="lazy" decoding="async" alt="${esc(p[2])}" src="${esc(url)}" style="object-position:${focus(p)}">` : ''}</span><small>${esc(p[2] || 'Darshan')}</small>`;
      const im = b.querySelector('.im'), words = () => { im.classList.add('words'); im.textContent = p[2] || 'Darshan'; };
      if (!url) words(); else b.querySelector('img').onerror = words;
      b.onclick = () => view(i);
      grid.append(b);
    });
    g.append(grid);
  };
  if (Y) add(Y.p);
  if (Y && Y.trip) add(Y.t, `${Y.p.length ? 'From the same trip' : 'From these days'}, ${tripText(Y.trip)}`);
  $('groups').append(g);
}
function tripText([a, b]) {
  const d = s => `${+s.slice(8)} ${MONTHS[+s.slice(5, 7) - 1]}`;
  return a === b ? d(a) : `${d(a)} to ${d(b)}`;
}

// the wide view, which is also the slideshow
let vi = 0, vtimer = null, lastFocus = null;
function view(i, play) {
  if (!everyPhoto.length) return;
  if ($('viewer').hidden) { lastFocus = document.activeElement; $('viewer').hidden = false; document.body.style.overflow = 'hidden'; $('vclose').focus(); }
  vi = (i + everyPhoto.length) % everyPhoto.length;
  const {p, y, d, where, cal, trip, ti, more, v} = everyPhoto[vi];
  const url = SRC.big(p) || SRC.photo(p);
  const when = trip ? tripText(trip) + ' ' + y : d ? `${longDate(d)} ${y}` : `${DAY.title} ${y}`;
  const none = `<div class="none">${esc(p[2] || 'Darshan')}</div>`;
  $('vstage').innerHTML = `<figure class="vframe" style="margin:0">${url ? `<img alt="${esc(p[2])}" src="${esc(url)}">` : none}` +
    `<figcaption class="vcap"><p>${esc(p[2] || 'Darshan')}</p><div>${esc([when, where, (cal && cal[0]) || ti, festOf(cal)].filter(Boolean).join(' · '))}</div>` +
    (more ? `<p class="vday">${esc(more)}</p>` : '') +
    `<a class="go" href="${esc(trip && trip[0] !== trip[1] ? `{{SEARCH}}#place=${encodeURIComponent(String(where || '').split(',')[0])}&from=${trip[0]}&to=${trip[1]}` : SRC.search(trip ? trip[0] : d || y + '-' + DAY.date))}">See more &rsaquo;</a>${v ? ' ' + watchVideo(v, 'go vgo') : ''}</figcaption></figure>`;
  const img = $('vstage').querySelector('img');
  if (img) img.onerror = () => img.outerHTML = none;
  $('vpos').textContent = `${vi + 1} of ${everyPhoto.length}`;
  if (play !== undefined) setPlay(play);
  const n = everyPhoto[(vi + 1) % everyPhoto.length].p, pre = SRC.big(n) || SRC.photo(n);
  if (pre) new Image().src = pre;   // the next photo is ready before it is needed
}
function setPlay(on) {
  clearInterval(vtimer); vtimer = null;
  $('viewer').classList.toggle('play', on);
  $('vplay').textContent = on ? 'Pause' : 'Play';
  if (on) vtimer = setInterval(() => view(vi + 1), reduce ? 9000 : 6000);
}
function shut() {
  setPlay(false); $('viewer').hidden = true; document.body.style.overflow = '';
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  lastFocus && lastFocus.focus();
}
$('vclose').onclick = shut;
// a click on the dark around the photo closes it, back to the page underneath (Darpan, 26 Oct)
$('viewer').addEventListener('click', e => { if (!e.target.closest('.vframe, button, a')) shut(); });
$('vprev').onclick = () => view(vi - 1);
$('vnext').onclick = () => view(vi + 1);
$('vplay').onclick = () => setPlay(!vtimer);
$('slideshow').onclick = () => {
  view(0, true);
  const fs = $('viewer').requestFullscreen; if (fs) fs.call($('viewer')).catch(() => {});
};
let sx = null;
$('vstage').addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive: true});
$('vstage').addEventListener('touchend', e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) view(vi + (dx < 0 ? 1 : -1)); sx = null; });

addEventListener('keydown', e => {
  if ($('viewer').hidden) return;
  if (e.key === 'Escape') shut();
  else if (e.key === 'ArrowRight') view(vi + 1);
  else if (e.key === 'ArrowLeft') view(vi - 1);
});
// today only: a date in the address (an old shared link, #10-24) is dropped and today opens
addEventListener('hashchange', () => { if (/^#\d\d-\d\d$/.test(location.hash)) open(TODAY, true); });

open(TODAY, true);
// left open overnight (a tablet on a stand), today's page moves on to the new day at midnight, like the TV player
// (whole website review, 28 Oct 2026)
setInterval(() => {
  const d = new Date(), t = pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  if (t === TODAY) return;
  now = d; TODAY = t;
  open(TODAY, true);
}, 60000);
