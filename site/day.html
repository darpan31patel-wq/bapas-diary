<meta charset="utf-8">
<link rel="stylesheet" href="{{MENU_CSS}}">
<title>Bapa's Diary</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:"Diary Garamond";font-weight:500;src:url({{FONT_G5}}) format("woff2")}
@font-face{font-family:"Diary Garamond";font-weight:600;src:url({{FONT_G6}}) format("woff2")}
@font-face{font-family:"Diary Garamond";font-weight:700;src:url({{FONT_G7}}) format("woff2")}
@font-face{font-family:"Diary Arimo";font-weight:700;src:url({{FONT_A7}}) format("woff2")}
/* Layout: the 2pm On this day picture as a living page. Maroon ground, gold title, a board of ivory polaroids
   hanging straight on cords (one cord per row), each card fading through its year; under it every photo of the day. */
:root{
  --maroon-in:#42101c; --maroon-out:#160509; --maroon-ink:#6e1424; --maroon-deep:#2a0a12;
  --gold-hi:#ffe296; --gold:#ce9840; --gold-soft:#d9a441;
  --ivory-top:#f8f2e4; --ivory-bot:#eadfc8; --ivory-edge:#c4b292; --cream:#faf1de;
  --cord:#c9a46a; --mist:rgba(250,241,222,.62);
  --serif:"Diary Garamond","EB Garamond",Garamond,"Times New Roman",serif;
  --sans:"Diary Arimo",Arimo,Arial,Helvetica,sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--maroon-out);color:var(--cream);font-family:var(--serif)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
.page{min-height:100vh;overflow-x:clip;background:
  radial-gradient(ellipse 60% 30% at 50% 0%,rgba(255,196,110,.16),transparent 70%),
  radial-gradient(ellipse 90% 70% at 50% 30%,var(--maroon-in),var(--maroon-out)) no-repeat;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(46px + 14px) 48px}
.wrap{max-width:1500px;margin:0 auto}
.caps{font:700 11px/1.2 var(--sans);letter-spacing:.2em;text-transform:uppercase}

/* date bar */
.datebar{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px}
.pill{font:700 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;background:rgba(0,0,0,.22);color:var(--gold-hi);border:1px solid rgba(217,164,65,.45);border-radius:999px;padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.pill:hover{background:rgba(217,164,65,.14)}
.pill.solid{background:var(--gold-soft);color:var(--maroon-out);border-color:var(--gold-soft)}
.pill[hidden]{display:none}

header{text-align:center;margin:clamp(22px,3vw,40px) 0 clamp(4px,1.5vw,18px)}   /* a little more room between the lines on wider screens (Darpan, 26 Oct 2026: "spread this out a bit") */
h1{font:700 clamp(46px,9vw,100px)/1 var(--serif);margin:0;background:linear-gradient(var(--gold-hi),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45));text-wrap:balance}
.sub{display:flex;align-items:center;justify-content:center;gap:clamp(14px,1.6vw,24px);margin-top:clamp(12px,2vw,26px);font:700 clamp(11px,1.4vw,14px)/1 var(--sans);letter-spacing:.42em;color:var(--gold-soft);padding-left:.42em}
.sub::before,.sub::after{content:"";width:clamp(48px,7vw,120px);height:1px;background:linear-gradient(90deg,transparent,var(--gold-soft))}
.sub::after{transform:scaleX(-1)}
.tithi{margin:clamp(16px,2.4vw,32px) auto 0;font:500 clamp(17px,2vw,21px)/1.4 var(--serif);color:var(--cream);text-wrap:balance;max-width:44ch}
.tithi b{font-weight:700;color:var(--gold-hi)}
.count{margin:clamp(10px,1.4vw,18px) auto 0;font:500 16.5px/1.45 var(--serif);color:var(--cream);max-width:60ch;text-wrap:balance}
@media (min-width:1000px){.count{max-width:none}}   /* one line across on computers, brighter (Darpan, 26 Oct 2026: too faint) */

/* Computers and iPads on their side (from 1000px): a calmer top (Darpan, 30 Oct 2026: "Too much going on in a small
   space", he picked "matching cards"). The day buttons, the big date and its subtitle in the middle; either side of them
   two matching cards the same height: Screensaver and the email sign up on the left, Where Bapa is now on the right.
   The tithi under the date, between the cards; the count under them. The page's own order is kept, so phones and upright tablets are
   unchanged: the header's lines join the page's grid here (display:contents). With the text made bigger (Aa, the page is
   zoomed) the cards would not fit beside the date, so the page keeps the one tall column phones have (Darpan, 30 Oct
   2026: the cards ran off the screen and the tithi was off centre). */
@media (min-width:1000px){
  html:not([style^="zoom"]):not([style*=" zoom"]) .wrap{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);column-gap:24px;align-items:start}
  html:not([style^="zoom"]):not([style*=" zoom"]) .wrap>*{grid-column:1/-1}
  html:not([style^="zoom"]):not([style*=" zoom"]) .datebar{grid-area:1/2}
  html:not([style^="zoom"]):not([style*=" zoom"]) header{display:contents}
  html:not([style^="zoom"]):not([style*=" zoom"]) header>*{grid-column:2}
  html:not([style^="zoom"]):not([style*=" zoom"]) h1{grid-row:2;margin-top:clamp(10px,1.2vw,18px);font-size:clamp(58px,5.6vw,80px)}
  html:not([style^="zoom"]):not([style*=" zoom"]) .sub{grid-row:3;margin-top:12px}
  html:not([style^="zoom"]):not([style*=" zoom"]) .count,html:not([style^="zoom"]):not([style*=" zoom"]) .yir,html:not([style^="zoom"]):not([style*=" zoom"]) #mocknote{grid-column:1/-1;justify-self:center}
  html:not([style^="zoom"]):not([style*=" zoom"]) .tithi{grid-row:4;margin:10px auto 0}
  html:not([style^="zoom"]):not([style*=" zoom"]) .count{grid-row:5;margin:12px 0 0;font-size:15.5px}
  html:not([style^="zoom"]):not([style*=" zoom"]) .yir{grid-row:6}
  html:not([style^="zoom"]):not([style*=" zoom"]) #mocknote{grid-row:7}
  html:not([style^="zoom"]):not([style*=" zoom"]) header .bapa-now{grid-area:1/3/5/4;justify-self:end;align-self:stretch;margin:0;max-width:100%;min-width:0}
  html:not([style^="zoom"]):not([style*=" zoom"]) header .side{grid-area:1/1/5/2;justify-self:start;align-self:stretch;width:clamp(330px,28vw,420px);max-width:100%;min-width:0;display:flex;flex-direction:column;
    justify-content:center;align-items:center;gap:14px;padding:12px 18px;background:rgba(0,0,0,.22);border:1px solid rgba(217,164,65,.38);
    border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,.25);position:relative}
  html:not([style^="zoom"]):not([style*=" zoom"]) header .side-lbl{display:block;font:700 10px/1.2 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--gold-soft)}
  html:not([style^="zoom"]):not([style*=" zoom"]) header .ss-launch{order:1;margin:0}
  html:not([style^="zoom"]):not([style*=" zoom"]) header .ss-big{padding:12px 26px;font-size:12.5px}
  html:not([style^="zoom"]):not([style*=" zoom"]) header .ss-big svg{width:18px;height:18px}
  html:not([style^="zoom"]):not([style*=" zoom"]) header .remind{order:2;margin:0;max-width:none;padding:0}
  html:not([style^="zoom"]):not([style*=" zoom"]) header .remind .rm-open{border:0;border-bottom:1px solid rgba(217,164,65,.5);border-radius:0;padding:2px 0;font-size:11px}
  html:not([style^="zoom"]):not([style*=" zoom"]) header .remind form{position:absolute;left:0;top:calc(100% + 10px);z-index:5;width:420px;margin:0;padding:14px;background:#2a0a12;
    border:1px solid rgba(217,164,65,.38);border-radius:14px;box-shadow:0 10px 24px rgba(0,0,0,.45)}
  html:not([style^="zoom"]):not([style*=" zoom"]) .board{margin-top:18px}
}
@media (min-width:1000px) and (max-width:1359px){html:not([style^="zoom"]):not([style*=" zoom"]) header .side{width:300px}}
/* iPads on their side: the day buttons get the whole top row, so the date between the cards has room */
@media (min-width:1000px) and (max-width:1179px){
  html:not([style^="zoom"]):not([style*=" zoom"]) .datebar{grid-column:1/-1}
  html:not([style^="zoom"]):not([style*=" zoom"]) header .bapa-now{grid-row:2/5}
  html:not([style^="zoom"]):not([style*=" zoom"]) header .side{grid-row:2/5;width:260px}
  html:not([style^="zoom"]):not([style*=" zoom"]) header .ss-big{padding:11px 20px;font-size:11.5px}
  html:not([style^="zoom"]):not([style*=" zoom"]) header .bapa-now .bn-town small{display:none}
}
/* phones and upright tablets: the email and Screensaver buttons stay just where they were */
.side{display:contents}
.side-lbl{display:none}

/* board */
.board{position:relative;margin-top:30px}
.cords{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.cards{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));column-gap:clamp(12px,1.6vw,26px);row-gap:clamp(30px,3.4vw,46px);padding-top:16px}
@media (max-width:520px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.slot{display:flex;flex-direction:column;align-items:center;min-width:0}
.card{position:relative;display:block;width:100%;background:linear-gradient(var(--ivory-top),var(--ivory-bot));border:1px solid var(--ivory-edge);padding:3.5% 3.5% 0;box-shadow:0 10px 18px rgba(0,0,0,.42),0 2px 4px rgba(0,0,0,.3);cursor:pointer;text-align:center;text-decoration:none;transform-origin:50% -12px;will-change:transform}
.peg{position:absolute;left:50%;top:-17px;width:12px;height:30px;margin-left:-6px;border-radius:6px 6px 3px 3px;background:linear-gradient(90deg,#6b4022,#b07a4a 30%,#9a6538 55%,#5d361c);box-shadow:1px 3px 4px rgba(0,0,0,.45);z-index:2}
.peg::after{content:"";position:absolute;left:1px;right:1px;top:12px;height:3px;background:#3a2210;opacity:.7}
.photo{position:relative;aspect-ratio:3/4;max-width:100%;overflow:hidden;background:var(--maroon-deep)}
/* each photo sits on its own layer with its softened fill; the next photo's layer fades in on top of the one showing,
   which stays fully there until it is covered, so the change is a clean dissolve with no dark dip in the middle
   (Darpan, 28 Oct 2026: some pictures weren't fading or changing as expected) */
.photo .layer{position:absolute;inset:0;opacity:0;z-index:0}
.photo .layer.on{opacity:1}
.photo .layer.top{z-index:1;transition:opacity 3s ease-in-out}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* and it never sits still: each photo drifts slowly closer to Bapa's face and back, out of step with the others, so the
   board feels alive between the changes (Darpan, 28 Oct 2026) */
.photo .layer img:not(.bg){transform-origin:var(--fx,50%) var(--fy,30%);animation:breathe 20s ease-in-out infinite alternate;animation-delay:var(--wait,0s)}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(var(--zoom,1.03))}}
.paused .photo .layer img{animation-play-state:paused}
/* Darpan, 25 Oct 2026 (the On this day picture's rules): Bapa's whole head stays in the frame; any space left when it
   has to zoom out is filled with the photo's own colours, softened (make.fill) */
.photo img.placed{inset:auto;max-width:none;object-fit:fill}
.photo img.bg{inset:-8%;width:116%;height:116%;object-fit:cover;filter:blur(12px) brightness(.72)}
.photo .words{position:absolute;inset:0;z-index:2;display:grid;place-items:center;padding:12%;background:radial-gradient(circle at 50% 40%,#5a1626,var(--maroon-deep));transition:opacity 3s ease-in-out}
.photo .words p{margin:0;font:500 clamp(14px,1.3vw,16px)/1.35 var(--serif);font-style:italic;color:var(--gold-hi);text-align:center;text-wrap:balance;overflow-wrap:anywhere;transition:opacity 1.5s ease-in-out}
.photo .words.off{opacity:0}
.photo.story{display:grid;place-items:center;padding:12%;background:radial-gradient(circle at 50% 40%,#5a1626,var(--maroon-deep))}
.photo.story p{margin:0;font:500 clamp(14px,1.3vw,16px)/1.35 var(--serif);font-style:italic;color:var(--gold-hi);text-wrap:balance}
.label{padding:9px 2px 10px;color:var(--maroon-ink)}
.yr{font:700 clamp(24px,2.3vw,30px)/1 var(--serif)}
.pl{margin-top:6px;font:800 clamp(12.5px,1.1vw,15px)/1.2 var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--maroon-ink);text-wrap:balance;overflow-wrap:anywhere}   /* year and place are the biggest words on a card (Darpan, 26 Oct 2026) */
.ti{margin-top:4px;font:500 12.5px/1.25 var(--serif);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev{margin-top:4px;font:500 12.5px/1.25 var(--serif);text-wrap:balance;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.fest{display:inline-block;margin-top:5px;max-width:100%;font:700 8.5px/1.25 var(--sans);letter-spacing:.14em;text-transform:uppercase;background:var(--maroon-ink);color:var(--gold-hi);padding:3px 7px;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.of{margin-top:5px;font:700 8.5px/1 var(--sans);letter-spacing:.16em;color:rgba(110,20,36,.6);font-variant-numeric:tabular-nums}
.cap{margin-top:11px;min-height:2.8em;width:100%;text-align:center;font:500 15px/1.35 var(--serif);color:var(--cream);transition:opacity 1.5s ease-in-out;text-wrap:balance;max-width:100%;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.cap.fade{opacity:0}

.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:28px;align-items:center}
.controls select{font:700 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;background:rgba(0,0,0,.25);color:var(--gold-hi);border:1px solid rgba(217,164,65,.45);border-radius:999px;padding:9px 12px;cursor:pointer}
.controls label{font:700 10px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--gold-soft)}

/* every photo of the day */
.all{margin-top:56px;border-top:1px solid rgba(217,164,65,.22);padding-top:30px}
.all>h2{margin:0;text-align:center;font:700 clamp(28px,4vw,42px)/1.1 var(--serif);color:var(--gold-hi);text-wrap:balance}
.all>p{text-align:center;color:var(--mist);margin:8px 0 0;font-size:15px}
.yeargroup{margin-top:34px;scroll-margin-top:16px}
.yhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding-bottom:10px;border-bottom:1px solid rgba(217,164,65,.18)}
.yhead h3{margin:0;font:700 30px/1 var(--serif);color:var(--gold-hi)}
.yhead .caps{color:var(--gold-soft)}
.yhead .it{font:500 16px var(--serif);font-style:italic;color:var(--cream)}
.yhead .fest{margin:0;background:var(--gold-soft);color:var(--maroon-out)}
.yhead a{margin-left:auto}
/* the gold Photos button: that day's photos in Search (Darpan, 28 Oct 2026) */
.go{display:inline-block;padding:6px 13px;border:1px solid var(--go,var(--gold-soft));border-radius:999px;color:var(--go,var(--gold-soft));font:600 11.5px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.go:hover,.go:focus-visible{background:var(--go,var(--gold-soft));color:var(--go-on,var(--maroon-out));outline:none}
.vcap{--go:var(--maroon-ink);--go-on:var(--gold-hi)}
.vcap .go{margin-top:9px}
.story-line{margin:12px 0 0;font:500 16px/1.45 var(--serif);font-style:italic;color:var(--cream);max-width:70ch}
.story-line b{font-style:normal;font:700 10px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--gold-soft);margin-right:8px}
.day-story .paras{max-width:70ch}
.day-story .paras.many{max-width:none;columns:34ch 3;column-gap:40px}   /* a long story uses the whole width on a wide screen (Darpan, 26 Oct 2026) */
.day-story .more{margin:0;padding-top:8px;font:400 15px/1.55 var(--serif);color:var(--cream);opacity:.88;break-inside:avoid}
.day-story .diary{margin:8px 0 0;padding:0;list-style:none;max-width:70ch}
.day-story .diary li{position:relative;margin:0 0 5px;padding-left:16px;font:400 15px/1.45 var(--serif);color:var(--cream);opacity:.9}
.day-story .diary li::before{content:"";position:absolute;left:2px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--gold-soft)}
.viewer .vcap p.vday{margin:7px auto 0;max-width:70ch;font:italic 400 14px/1.45 var(--serif);opacity:.85;text-wrap:balance;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.tripnote{margin:18px 0 0;font:700 10px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--gold-soft)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-top:12px}
.thumb{display:block;padding:5px 5px 0;background:linear-gradient(var(--ivory-top),var(--ivory-bot));border:0;cursor:pointer;box-shadow:0 4px 8px rgba(0,0,0,.35);min-width:0}
.thumb .im{display:block;aspect-ratio:1;max-width:100%;background:var(--maroon-deep) center/cover no-repeat;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb small{display:block;padding:5px 2px 6px;font:500 11.5px/1.25 var(--serif);color:var(--maroon-ink);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}


/* the wide view and the slideshow */
.viewer{position:fixed;inset:0;z-index:60;background:rgba(14,3,6,.96);display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.vtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.vtop .caps{color:var(--gold-soft)}
.vstage{position:relative;display:grid;place-items:center;min-height:0;padding:12px 0}
.vframe{background:linear-gradient(var(--ivory-top),var(--ivory-bot));padding:10px 10px 0;max-width:100%;max-height:100%;display:flex;flex-direction:column;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.vframe img{display:block;max-width:min(92vw,1100px);max-height:calc(100vh - 230px);object-fit:contain;margin:0 auto}
.vframe .none{width:min(80vw,520px);aspect-ratio:4/3;display:grid;place-items:center;padding:8%;background:radial-gradient(circle at 50% 40%,#5a1626,var(--maroon-deep));color:var(--gold-hi);font:500 italic 20px/1.4 var(--serif);text-align:center}
.thumb .im.words{display:grid;place-items:center;padding:8px;background:radial-gradient(circle at 50% 40%,#5a1626,var(--maroon-deep));color:var(--gold-hi);font:500 italic 12px/1.3 var(--serif);text-align:center;overflow:hidden}
.vcap{padding:10px 6px 12px;color:var(--maroon-ink);text-align:center;max-width:min(92vw,1100px)}
.vcap p{margin:0;font:500 17px/1.35 var(--serif);text-wrap:balance}
.vcap div{margin-top:5px;font:700 9.5px/1.4 var(--sans);letter-spacing:.18em;text-transform:uppercase}
.vnav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.viewer.play .vframe img{animation:breathe 7s ease-in-out both}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.025)}}

/* choose a day */
.picker{position:fixed;inset:0;z-index:40;background:rgba(14,3,6,.9);display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.pbox{background:linear-gradient(var(--ivory-top),var(--ivory-bot));color:var(--maroon-ink);width:min(440px,100%);padding:20px 18px 18px;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.pbox h2{margin:0;font:700 26px var(--serif);text-align:center}
.months{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.months button{background:none;border:1px solid var(--ivory-edge);border-radius:999px;width:38px;height:38px;cursor:pointer;color:var(--maroon-ink);font:700 16px var(--sans)}
.months b{font:600 22px var(--serif)}
.daygrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.daygrid button{aspect-ratio:1;border:1px solid var(--ivory-edge);background:rgba(255,255,255,.4);color:var(--maroon-ink);font:600 17px var(--serif);cursor:pointer;border-radius:3px;font-variant-numeric:tabular-nums}
.daygrid button.on{background:var(--maroon-ink);color:var(--gold-hi);border-color:var(--maroon-ink)}
.daygrid button.today{box-shadow:inset 0 0 0 2px var(--gold)}
.pbox .pill{margin:16px auto 0;display:flex;width:max-content;color:var(--maroon-ink);border-color:var(--ivory-edge);background:none}

.loading{text-align:center;margin:60px 0;color:var(--mist);font:500 18px var(--serif);font-style:italic}
.mocknote{margin:14px auto 0;max-width:62ch;text-align:center;font:500 14px/1.45 var(--serif);color:var(--gold-hi);background:rgba(0,0,0,.25);border:1px dashed rgba(217,164,65,.45);padding:9px 14px}
@media (prefers-reduced-motion:reduce){.photo .layer.top{transition-duration:1.2s}.photo .layer img{animation:none!important}.cap{transition:none}.viewer.play .vframe img{animation:none}}
/* Easier to read on a phone: the smallest words a little bigger (website review, 28 Oct 2026) */

<script>
// Where things are. The website build fills these in; a mockup may replace SRC.day and SRC.photo.
const SRC = {
  day: mmdd => fetch('{{DATA}}' + mmdd + '.json').then(r => { if (!r.ok) throw r.status; return r.json(); }),
  photo: p => '{{PHOTOS}}s/' + p[0] + '/' + p[1],
  big: p => '{{PHOTOS}}m/' + p[0] + '/' + p[1],
  search: d => '{{SEARCH}}#' + (d.length === 5 ? 'day=' : 'date=') + d,   // '10-24' every year on this date, '2014-10-24' one day
};
if (window.MOCK) Object.assign(SRC, window.MOCK);

const $ = id => document.getElementById(id);
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const LEN = [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const pad = n => String(n).padStart(2, '0');
let now = new Date();
let TODAY = pad(now.getMonth() + 1) + '-' + pad(now.getDate());
const nice = m => `${+m.slice(3)} ${MONTHS[+m.slice(0, 2) - 1]}`;
const short = m => `${+m.slice(3)} ${MONTHS[+m.slice(0, 2) - 1].slice(0, 3)}`;
function shift(m, n) {
  const d = new Date(2000, +m.slice(0, 2) - 1, +m.slice(3) + n);   // 2000 has 29 February
  return pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
// Today only tags these 12 festivals, matched across the calendar's spellings (Darpan, 26 Oct 2026: "just these 12")
const KEEP = [['Diwali', /^diwali\b/i], ['Annakut', /annakut/i], ['New Year', /bestu|nutan varsh|^new year$/i],
  ['Janmashtami', /janmashtami/i], ['Guru Purnima', /guru purnima/i], ['Swaminarayan Jayanti', /hari-?nom|swaminarayan jayanti|swaminarayan's birthday/i],
  ['Vasant Panchami', /vasant panch/i], ['Holi', /^holi\b/i], ['Rathyatra', /rath ?yatra/i], ['Raksha Bandhan', /raksha ?bandhan/i],
  ['Ekadashi', /^(?!.*(smart|shra?d?dh|vruddhi|sabha)).*ek[aãp]dashi/i], ['Pushpadolotsav', /pushpadol|fuldol/i]];
const festsOf = c => {
  if (!c) return [];
  const parts = [c[1], c[2]].filter(Boolean).join(';').split(/[;,\/]/).map(x => x.trim()).filter(Boolean);
  return KEEP.filter(([, re]) => parts.some(x => re.test(x))).map(([name]) => name);
};
const festOf = c => festsOf(c).join(' · ');
const tithiOf = c => c ? c[0] : '';
// What each On this day post says beyond its one line (Darpan, 29 Oct 2026: "lots more information ... incorporate more"):
// s = [year, place, line, {ti: Indian date, h: title, w: [paragraphs, or the UK diary's lines], l: 1 for a diary day}],
// and a card's own year keeps the stories it tells in Y.day = [[line, title, [words], diary], ...] and Y.ti
const said = t => String(t || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const tail = line => String(line || '').replace(/^[^:]{0,60}\bin [^:]+:\s*/, '');   // 'Pramukh Swami Maharaj in London: Dhanteras'
const told = (Y, stories) => (Y && Y.day || []).concat((stories || []).filter(s => s[3]).map(s => [s[2], s[3].h || '', s[3].w || [], s[3].l || 0]));
const dayTi = (Y, stories) => (Y && Y.ti) || ((stories || []).find(s => s[3] && s[3].ti) || [, , , {}])[3].ti || '';
// the day's occasion, for the card's frame: the post's title, its line, or the next thing done that day, whichever the
// photo captions don't already say
function occasion(Y, stories, photos) {
  const caps = new Set(photos.flatMap(p => [said(p[2]), said(p[5])]));
  for (const [line, h, w, l] of told(Y, stories))
    for (const t of [h, tail(line)].concat(l ? w : []))
      if (t && t.length <= 80 && !caps.has(said(t))) return t;
  return '';
}
// the whole story, for under the year's photos and in the wide view
function storyHTML(line, h, w, l) {
  const top = h || tail(line) || line;
  const rest = (w || []).filter(t => said(t) !== said(top) && said(t) !== said(tail(line)));
  return `<div class="day-story"><p class="story-line"><b>On this day</b>${esc(top)}</p>` +
    (rest.length ? (l ? `<ul class="diary">${rest.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : `<div class="paras${rest.length > 2 ? ' many' : ''}">${rest.map(t => `<p class="more">${esc(t)}</p>`).join('')}</div>`) : '') + '</div>';
}
function storyShort(Y, stories, photo) {   // a few words for the wide view: what else the post says about the day
  for (const [line, h, w, l] of told(Y, stories)) {
    const t = (l ? w.filter(x => said(x) !== said(photo)).join(' · ') : (w[0] || '')) || h || '';
    if (t && said(t) !== said(photo)) return t;
  }
  return '';
}

let DAY = null, cards = [], everyPhoto = [], timers = [], paused = false, showing = null;

// On this day means the years gone by: today, and the days still to come this year, never show this year's own card or
// story, only on the days already past (Darpan, 28 Oct 2026: "no 2026 pictures on the present day, doesn't make sense").
// Worked out in the browser from its own clock, so it turns over by itself at New Year.
function pastOnly(D) {
  if (D.date < TODAY) return D;
  const y = now.getFullYear();
  return Object.assign({}, D, {years: D.years.filter(Y => Y.y < y), stories: (D.stories || []).filter(s => s[0] < y)});
}

// the date in the address (#10-24) opens that day; no date opens today
function wanted() { const h = location.hash.slice(1); return /^\d\d-\d\d$/.test(h) && +h.slice(3) <= LEN[+h.slice(0, 2) - 1] ? h : TODAY; }

async function open(mmdd, push) {
  stop();
  showing = mmdd;
  if (push) history.replaceState(null, '', mmdd === TODAY ? location.pathname + location.search : '#' + mmdd);
  $('title').textContent = nice(mmdd);
  $('subtitle').textContent = mmdd === TODAY ? "TODAY IN BAPA'S DIARY" : "IN BAPA'S DIARY";
  $('prev').textContent = '‹ ' + short(shift(mmdd, -1));
  $('next').textContent = short(shift(mmdd, 1)) + ' ›';
  $('back-today').hidden = mmdd === TODAY;
  $('loading').hidden = false; $('board').hidden = $('controls').hidden = $('all').hidden = true;
  $('tithi').hidden = true; $('count').textContent = ''; $('mocknote').innerHTML = '';
  document.title = mmdd === TODAY ? "Bapa's Diary" : `${nice(mmdd)} in Bapa's Diary`;
  let data;
  try { data = await SRC.day(mmdd); } catch (e) { $('loading').textContent = 'This day could not be opened. Please try again in a moment.'; return; }
  if (showing !== mmdd) return;
  DAY = pastOnly(data);
  $('loading').hidden = true;
  render();
}

function render() {
  const D = DAY, year = String(now.getFullYear());
  // this date in the BAPS calendar this year
  const c = D.cal && D.cal[year];
  if (c) {
    const f = [c[1], c[2]].filter(Boolean).join('; ');
    $('tithi').innerHTML = `${D.date === TODAY ? 'Today is' : `In ${year} this date is`} <b>${esc(c[0])}</b>${f ? ', ' + esc(f) : ''}`;
    $('tithi').hidden = false;
  }
  // one card per year: its photos, or, for the older years, the On this day story
  const byYear = {};
  D.years.forEach(Y => byYear[Y.y] = {Y, stories: []});
  D.stories.forEach(s => {   // the same story can come from two sources: show it once
    const [y, place, line] = s;
    const b = byYear[y] = byYear[y] || {Y: null, place, stories: []};
    if (!b.stories.some(o => o[2] === line)) b.stories.push(s);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => a - b);
  everyPhoto = [];
  const n = D.years.reduce((s, Y) => s + Y.p.length + (Y.t || []).length, 0);
  const shown = D.years.filter(Y => Y.p.length || (Y.t || []).length).length;
  $('count').textContent = n ? `${shown} years and ${n.toLocaleString()} photos from this day.`
                             : `${years.length} years remembered on this day.`;
  if (window.MOCK && MOCK.note && MOCK.note(D.date)) $('mocknote').innerHTML = `<p class="mocknote">${MOCK.note(D.date)}</p>`;

  $('cards').innerHTML = ''; $('groups').innerHTML = '';
  // a card only for a year with photos of Bapa; a year with only its On this day lines lists them below, with no empty
  // card on the rope (Darpan, 26 Oct 2026)
  const hasPhotos = b => b.Y && (b.Y.p.length || (b.Y.t || []).length);
  // the first impression is a mix: about half the cards open on a close up, half on an activity photo, shuffled at
  // each visit (Darpan, 26 Oct 2026)
  const withPhotos = years.filter(y => hasPhotos(byYear[y]));
  const order = withPhotos.map((_, i) => i).sort(() => Math.random() - .5), closeUp = new Set(order.slice(0, Math.ceil(order.length / 2)));
  cards = withPhotos.map((y, i) => card(y, byYear[y], closeUp.has(i)));
  years.filter(y => !hasPhotos(byYear[y])).forEach(y => group(y, null, byYear[y].place, DAY.cal && DAY.cal[y], byYear[y].stories));
  [...$('groups').children].sort((a, b) => a.id.slice(1) - b.id.slice(1)).forEach(g => $('groups').append(g));
  $('board').hidden = $('controls').hidden = false;
  $('search-day').href = SRC.search(D.date);
  $('all-title').textContent = `Every photo from ${D.title}`;
  $('all-count').textContent = n ? `${n.toLocaleString()} photos, year by year` : 'No photos on this day yet';
  $('all').hidden = !n;
  requestAnimationFrame(cords);
  start();
}

function card(y, {Y, place, stories}, want = true) {
  const photos = Y ? (Y.p.length ? Y.p : Y.t || []) : [];
  const where = Y ? Y.place : place;
  const cal = DAY.cal && DAY.cal[y];
  const slot = document.createElement('div'); slot.className = 'slot';
  const el = document.createElement('a'); el.className = 'card';
  el.href = '#y' + y;
  el.addEventListener('click', e => { e.preventDefault(); const g = $('y' + y); if (g) g.scrollIntoView({behavior: reduce ? 'auto' : 'smooth'}); else if (photos.length) view(0); });
  el.setAttribute('aria-label', photos.length ? `${y}, ${where}: see all ${photos.length} photos` : `${y}, ${where}`);
  const ph = document.createElement('div'); ph.className = 'photo';
  const c = {y, el, slot, photos, k: -1, imgs: [], cur: 0, rest: hang(y), at: 0};
  lean(c, c.rest);
  if (photos.length) {   // two layers, each a photo over its softened fill: one showing, the other ready for the next photo
    c.layers = [0, 1].map(() => {
      const l = document.createElement('div'), g = new Image(), i = new Image();
      l.className = 'layer'; g.alt = i.alt = ''; g.className = 'bg'; g.setAttribute('aria-hidden', 'true');
      l.append(g, i); ph.append(l);
      return l;
    });
    c.imgs = c.layers.map(l => l.lastChild); c.bgs = c.layers.map(l => l.firstChild);
  } else {
    ph.classList.add('story'); ph.innerHTML = `<p>${esc(stories[0] ? stories[0][2] : '')}</p>`;
  }
  el.innerHTML = '<div class="peg"></div>';
  el.append(ph);
  const fest = festOf(cal), ti = tithiOf(cal) || dayTi(Y, stories), ev = occasion(Y, stories, photos);
  const lab = document.createElement('div'); lab.className = 'label';
  // the Indian date from the post itself in years the BAPS calendar doesn't cover, and the day's occasion (29 Oct 2026)
  lab.innerHTML = `<div class="yr">${y}</div><div class="pl">${esc(where || '')}</div>` +
    (ti ? `<div class="ti">${esc(ti)}</div>` : '') + (ev ? `<div class="ev">${esc(ev)}</div>` : '') +
    (fest ? `<div class="fest">${esc(fest)}</div>` : '');   // no "4 of 4" counter (Darpan, 26 Oct 2026)
  el.append(lab);
  const cap = document.createElement('div'); cap.className = 'cap';
  cap.textContent = photos.length ? '' : 'On this day';
  slot.append(el, cap); $('cards').append(slot);
  Object.assign(c, {cap, of: lab.querySelector('.of'), ph});
  requestAnimationFrame(() => lean(c, c.rest));
  el.addEventListener('pointermove', e => nudge(c, e));
  el.addEventListener('pointerleave', () => c.lastX = null);
  el.addEventListener('pointerdown', e => { c.lastX = e.clientX - 30 * (Math.random() < .5 ? 1 : -1); nudge(c, e); });
  const close = p => !!(p[4] && p[4][7]);   // want: this card opens on a close up (true) or an activity photo (false)
  const first = photos.findIndex(p => p[3] && close(p) === want);
  if (photos.length) show(c, first >= 0 ? first : Math.max(0, photos.findIndex(p => p[3])), true);   // open on a darshan of Bapa
  if (photos.length > 1) (c.pre = new Image()).src = SRC.photo(photos[(c.k + 1) % photos.length]);   // its next photo loads straight away, ready for the first fade
  group(y, Y, where, cal, stories);
  return c;
}

// Each card hangs a little crooked on its peg, the way real photos do on a cord (Darpan liked the uneven hang, 24 Oct 2026).
// Brushed by the mouse (or a finger), it swings like a pendulum: out one way, back past straight the other way, and
// slowly settles, the way a photo really would. Never more than about four degrees from where it hangs.
const swinging = new Set();
function hang(y) { let h = y * 2654435761 % 4294967296; h = ((h ^ (h >>> 15)) >>> 0) % 1000 / 1000; return +((h * 2 - 1) * 2.2).toFixed(2); }
function nudge(c, e) {   // only ever moves when someone brushes it, so it stays on even with reduced motion
  const r = c.el.getBoundingClientRect();
  const dx = c.lastX == null ? 0 : e.clientX - c.lastX;
  c.lastX = e.clientX;
  const low = Math.max(0, Math.min(1, (e.clientY - r.top) / r.height));
  // a clockwise turn swings the bottom to the left, so a push to the right turns it the other way: it goes where it was hit
  c.v = Math.max(-.22, Math.min(.22, (c.v || 0) - Math.max(-1, Math.min(1, dx / 30)) * (.3 + low) * .07));
  c.a = c.a || 0;
  if (!swinging.size) requestAnimationFrame(swing);
  swinging.add(c);
}
// Swiped sideways on a phone, the cards swing on their cord as the row moves under the finger, a little behind it the
// way a hanging photo would, and settle back by themselves (Darpan, 28 Oct 2026). Only the cards on the screen move.
let lastLeft = null;
$('cards').addEventListener('scroll', () => {
  const box = $('cards'), left = box.scrollLeft, dx = lastLeft == null ? 0 : left - lastLeft;
  lastLeft = left;
  if (!dx) return;
  const w = box.clientWidth;
  cards.forEach(c => {
    const r = c.slot.getBoundingClientRect();
    if (r.right < 0 || r.left > w) return;
    // the row slides left (dx > 0), so the card's bottom trails to the right: an anticlockwise turn
    c.v = Math.max(-.12, Math.min(.12, (c.v || 0) - Math.max(-1, Math.min(1, dx / 40)) * .018));
    c.a = c.a || 0;
    if (!swinging.size) requestAnimationFrame(swing);
    swinging.add(c);
  });
}, {passive: true});
// the caption under a card leans with it, from the same peg, so it always sits centred under the card (Darpan, 26 Oct 2026)
function lean(c, deg) {   // the card and its caption turn together on the peg, so the caption can never drift off centre
  c.slot.style.transformOrigin = '50% -12px';
  c.slot.style.transform = `rotate(${deg}deg)`;
}
addEventListener('resize', () => cards.forEach(c => lean(c, c.rest + (c.a || 0))));
function swing() {
  swinging.forEach(c => {
    c.v += -c.a * .0033;   // the peg pulls it back towards hanging (one swing there and back takes about two seconds)
    c.v *= .992;           // and each swing is a little smaller than the last
    c.a = Math.max(-4, Math.min(4, c.a + c.v));
    lean(c, (c.rest + c.a).toFixed(3));
    if (Math.abs(c.a) < .01 && Math.abs(c.v) < .002) { c.a = c.v = 0; lean(c, c.rest); swinging.delete(c); }
  });
  if (swinging.size) requestAnimationFrame(swing);
}

function focus(p) { const f = p[4]; return f ? `${(f[0] * 100).toFixed(1)}% ${Math.min(100, f[1] * 115).toFixed(1)}%` : '50% 28%'; }

// make.crop_to, the On this day picture's framing (Darpan, 25 Oct 2026): the photo fills the card around Bapa, his face
// about 38 percent of the way down, and never slices through his head, pagh included; when his head is bigger than the
// card it zooms out just enough, and the space left shows the photo's own colours, softened. p[4] is where his face is
// [centre x, centre y, x, y, w, h, width / height, close darshan], as parts of the photo. Returns true when there is space left.
function frame(img, p) {
  const box = img.parentNode, w = box.clientWidth, h = box.clientHeight, iw = img.naturalWidth, ih = img.naturalHeight;
  const f = p[4] && p[4].length > 7 ? p[4] : null;
  if (!f || !w || !h || !iw || !ih) {   // where his face is isn't known yet: as before
    img.classList.remove('placed'); img.removeAttribute('style'); img.style.objectPosition = focus(p); return false;
  }
  let [cw, ch] = iw / ih > w / h ? [ih * w / h, ih] : [iw, iw * h / w];
  const fx = f[2] * iw, fy = f[3] * ih, fw = f[4] * iw, fh = f[5] * ih;
  const head = [fx - .35 * fw, fy - .5 * fh, fx + 1.35 * fw, fy + 1.4 * fh];   // the detector's box starts at the brow
  const grow = Math.max(1, (head[2] - head[0]) / cw / .96, (head[3] - head[1]) / ch / .96);
  cw *= grow; ch *= grow;
  let x0 = fx + fw / 2 - cw / 2, y0 = fy + fh / 2 - ch * .38;
  y0 = Math.min(Math.max(y0, head[3] - ch), head[1]);   // never slice through the head
  y0 = Math.max(y0, head[1] - ch * .14);                 // and not much space above it
  x0 = Math.min(Math.max(x0, head[2] - cw), head[0]);
  x0 = cw <= iw ? Math.min(Math.max(0, x0), iw - cw) : (iw - cw) / 2;
  y0 = ch <= ih ? Math.min(Math.max(0, y0), ih - ch) : (ih - ch) / 2;
  img.classList.add('placed');
  // the slow drift closes in on his face, never so far that it cuts into his head
  const ox = fx + fw / 2, oy = fy + fh / 2, fit = (edge, far) => far > 0 ? edge / far : 9;
  const room = Math.min(fit(ox - x0, ox - head[0]), fit(x0 + cw - ox, head[2] - ox), fit(oy - y0, oy - head[1]), fit(y0 + ch - oy, head[3] - oy));
  img.style.setProperty('--zoom', Math.max(1, Math.min(1.08, room * .99)).toFixed(3));
  img.style.setProperty('--fx', (ox / iw * 100).toFixed(1) + '%');
  img.style.setProperty('--fy', (oy / ih * 100).toFixed(1) + '%');
  Object.assign(img.style, {width: iw / cw * 100 + '%', height: ih / ch * 100 + '%', left: -x0 / cw * 100 + '%', top: -y0 / ch * 100 + '%'});
  return cw > iw + 1 || ch > ih + 1;
}
addEventListener('resize', () => cards.forEach(c => (c.imgs || []).forEach((i, n) => { if (!i.p) return; const gap = frame(i, i.p), g = c.bgs[n]; g.hidden = !gap; if (gap && g.src !== i.src) g.src = i.src; })));

function show(c, k, first) {
  const p = c.photos[k], url = SRC.photo(p);
  c.k = k;
  // a photo not copied to the website yet: the card shows its caption in the frame instead, like a diary line
  const done = missing => {
    if (c.of) c.of.textContent = `${k + 1} of ${c.photos.length}`;
    let w = c.ph.querySelector('.words');
    if (missing && !w) { c.ph.insertAdjacentHTML('beforeend', '<div class="words"><p></p></div>'); w = c.ph.querySelector('.words'); }
    if (w) {
      const t = w.querySelector('p');
      if (missing && t.textContent && !w.classList.contains('off')) {   // a caption already in the frame fades into the next
        t.style.opacity = 0;
        setTimeout(() => { t.textContent = p[2] || 'Darshan'; t.style.opacity = 1; }, 1500);
      } else if (missing) t.textContent = p[2] || 'Darshan';
      w.classList.toggle('off', !missing);
    }
    c.cap.classList.add('fade');
    setTimeout(() => { c.cap.textContent = p[5] || p[2]; c.cap.classList.remove('fade'); }, first ? 0 : 1500);
  };
  if (!url) return done(true);
  // the hidden layer takes the next photo; it only fades in once the photo is fully loaded and ready to paint, so a
  // change never starts half drawn, and a photo that will not load is simply passed over
  const i = first ? 0 : 1 - c.cur, layer = c.layers[i], next = c.imgs[i], bg = c.bgs[i], ticket = c.ticket = (c.ticket || 0) + 1;
  c.busy = true;
  const give = () => { if (ticket === c.ticket) c.busy = false; };
  const wait = setTimeout(give, 15000);
  const swap = () => {
    if (ticket !== c.ticket) return;
    clearTimeout(wait);
    next.p = p;
    const gap = frame(next, p);
    bg.hidden = !gap; if (gap) bg.src = url;
    next.style.setProperty('--wait', `-${(Math.random() * 20).toFixed(1)}s`);   // each card drifts out of step with the rest
    const old = c.layers[c.cur];
    c.cur = i; done(false);
    if (first) { layer.classList.add('on'); c.busy = false; return; }
    layer.classList.add('top'); void layer.offsetWidth; layer.classList.add('on');
    setTimeout(() => {   // covered: the old photo goes, and this card may change again
      if (ticket !== c.ticket) return;
      old.classList.remove('on'); layer.classList.remove('top'); c.busy = false;
    }, reduce ? 1300 : 3100);
  };
  next.onload = () => (next.decode ? next.decode().catch(() => {}) : Promise.resolve()).then(() => requestAnimationFrame(swap));
  next.onerror = () => { if (ticket !== c.ticket) return; clearTimeout(wait); c.busy = false; done(true); };
  next.src = url;
  const after = c.photos[(k + 1) % c.photos.length], ahead = after && after !== p && SRC.photo(after);
  if (ahead) (c.pre = new Image()).src = ahead;   // the card's next photo loads quietly now, so its change is ready when its turn comes
}

// The board is always moving: every second one of the cards on the screen starts fading to its next photo, the one that
// has waited longest going first, so the fades follow one another and never start together (Darpan, 28 Oct 2026: "in the
// first second, a picture should fade. The next second, another picture"). A card rests at least four seconds
// between changes, and cards off the screen wait until they are seen. A year with a single photo keeps it, drifting gently.
const inView = new Set();
const watch = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => {
  const c = cards.find(x => x.el === e.target);
  if (c) e.isIntersecting ? inView.add(c) : inView.delete(c);
}), {threshold: .35}) : null;
let last = null;
function beat() {
  const rest = 4000 * (reduce ? 1.6 : 1), t = Date.now();
  const ready = cards.filter(c => c.photos.length > 1 && !c.busy && t - c.at >= rest && c !== last && (!watch || inView.has(c)) && (!c.pre || c.pre.complete))   // next photo already here, so the fade starts on the beat
    .sort((a, b) => a.at - b.at);
  const c = ready[Math.floor(Math.random() * Math.min(3, ready.length))];   // one of the three that waited longest
  if (c) { last = c; c.at = t; show(c, (c.k + 1) % c.photos.length); }
}
function start() {
  stop();
  if (paused || document.hidden) return;
  if (watch) { inView.clear(); cards.forEach(c => watch.observe(c.el)); }
  // the first fade starts within a second of opening, then a new one every second (Darpan, 28 Oct 2026: "the fades are
  // constantly running", never a still page while it settles)
  const every = +$('speed').value * (reduce ? 1.6 : 1);
  timers.push(setTimeout(() => { beat(); timers.push(setInterval(beat, every)); }, Math.min(800, every)));
}
function stop() { timers.forEach(clearInterval); timers = []; if (watch) watch.disconnect(); }
$('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? 'Play' : 'Pause'; $('board').classList.toggle('paused', paused); start(); };
$('speed').onchange = start;
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

// how many cards on each rope: the top ropes full, then only the bottom ropes step down one card at a time, never
// more than the rope above, never more than one fewer, never below half a full rope (Darpan, 29 Oct 2026: "want top
// rows to be full, just the bottom ones"). Most full ropes wins, then the fullest top rope, then the most steps, then the fewest ropes
// (today's 30 cards: 8, 8, 7, 7; 26: 8, 7, 6, 5; 21: 8, 7, 6; 13: 7, 6; 5: 5)
function steps(total, fit) {
  let best = [total], score = -1;
  const low = Math.ceil(fit / 2), c = [];
  (function walk(left, top) {
    if (!left) {
      const s = c.filter(k => k === fit).length * 1e6 + c[0] * 1e4 + new Set(c).size * 100 - c.length;
      if (s > score) { score = s; best = c.slice(); }
      return;
    }
    for (let k = Math.min(top, left); k >= (c.length ? Math.max(1, top - 1) : 1); k--) {   // the top rope may hold fewer than fit
      if (k < low && k !== left) continue;   // only a lone short rope may sit below half
      c.push(k); walk(left - k, k); c.pop();
    }
  })(total, fit);
  return best;
}

// one cord per row of cards, drawn through the pegs
function cords() {
  // the cords run the full width of the window, edge to edge (Darpan, 24 Oct 2026). On computers the cards fill that
  // width too, as many to a row as fit, and each row hangs in a real curve: the rope sags in the middle and the cards
  // ride on it, the side ones a little higher (Darpan, 26 Oct 2026)
  const svg = $('cords'), board = $('board'), vw = document.documentElement.clientWidth, wide = vw > 760, rows = {};
  if (wide) {
    const w = board.parentElement.getBoundingClientRect(), g = Math.max(40, vw * .035);   // a safe gap from the window edge (Darpan, 26 Oct 2026: "a tiny bit more breathing space")
    board.style.marginLeft = Math.round(g - w.left) + 'px'; board.style.marginRight = Math.round(g - (vw - w.right)) + 'px';
  } else board.style.marginLeft = board.style.marginRight = '';
  // bigger cards, up to 8 to a rope, and each rope down holds one fewer, stepping gently (8, 7, 6, 5), every rope
  // centred (Darpan, 29 Oct 2026: "8 and then 7, 6, 5. So it's spread out across and everything should be centered").
  // The grid has two columns per card, so a rope one card shorter starts half a card in and sits in the middle.
  const grid = $('cards');
  if (wide) {
    const gw = grid.clientWidth, gap = parseFloat(getComputedStyle(grid).columnGap) || 20, fit = Math.max(1, Math.min(8, Math.floor((gw + gap) / (168 + gap))));
    const per = steps(cards.length, fit), n = per[0] || 1;
    grid.style.gridTemplateColumns = `repeat(${2 * n},minmax(0,1fr))`;
    let i = 0;
    per.forEach(k => { for (let j = 0; j < k; j++, i++) cards[i].slot.style.gridColumn = `${j ? 'auto' : n - k + 1} / span 2`; });
  } else { grid.style.gridTemplateColumns = ''; cards.forEach(c => c.slot.style.gridColumn = ''); }
  cards.forEach(c => lean(c, c.rest + (c.a || 0)));   // the cards changed size: each caption swings from the new peg height
  const b = board.getBoundingClientRect(), D = wide ? Math.min(64, vw * .032) : 0;
  svg.style.left = -b.left + 'px'; svg.style.width = vw + 'px';
  $('cards').style.paddingTop = (16 + D / 2) + 'px';
  cards.forEach(c => {
    rows[c.slot.offsetTop] = 1;
    const r = c.slot.getBoundingClientRect(), t = (r.left + r.width / 2) / vw;   // where the peg is across the window, 0 to 1
    c.slot.style.translate = D ? `0 ${(D * (1 - (2 * t - 1) ** 2) - D / 2).toFixed(1)}px` : '';
  });
  svg.innerHTML = `<defs><filter id="ropeshade" x="-5%" y="-50%" width="110%" height="200%"><feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#000" flood-opacity=".45"/></filter></defs>` +
    Object.keys(rows).map(t => {
      const y = +t - 5, a = y - D / 2, q = y + 1.5 * D;   // a parabola: ends D/2 above the pegs' line, middle D/2 below
      const d = `M 0 ${a.toFixed(1)} Q ${vw / 2} ${q.toFixed(1)} ${vw} ${a.toFixed(1)}`;
      // a twisted rope: a dark core, the strands, short slanted shadows where they twist, and a light catch on top
      return `<g filter="url(#ropeshade)"><path d="${d}" fill="none" stroke="#5a3a1c" stroke-width="6.5" stroke-linecap="round"/>` +
        `<path d="${d}" fill="none" stroke="var(--cord)" stroke-width="5"/>` +
        `<path d="${d}" fill="none" stroke="#7a5228" stroke-width="5" stroke-dasharray="2.2 3.6" opacity=".75"/>` +
        `<path d="${d}" fill="none" stroke="#f1d9a8" stroke-width="1.2" stroke-dasharray="3.6 2.2" stroke-dashoffset="1" opacity=".55" transform="translate(0 -1.3)"/></g>`;
    }).join('');
}
addEventListener('resize', () => requestAnimationFrame(cords));
new ResizeObserver(() => requestAnimationFrame(cords)).observe($('cards'));
document.fonts && document.fonts.ready.then(cords);

// every photo of the day, year by year
function group(y, Y, where, cal, stories) {
  if (!Y && !stories.length) return;
  const g = document.createElement('section'); g.className = 'yeargroup'; g.id = 'y' + y;
  const fest = festOf(cal), ti = tithiOf(cal) || dayTi(Y, stories);
  g.innerHTML = `<div class="yhead"><h3>${y}</h3><span class="caps">${esc(where || '')}</span>` +
    (ti ? `<span class="it">${esc(ti)}</span>` : '') + (fest ? `<span class="fest">${esc(fest)}</span>` : '') +
    `<a class="go" href="${esc(SRC.search(y + '-' + DAY.date))}">See more &rsaquo;</a></div>` +
    told(Y, stories).map(t => storyHTML(...t)).join('');
  const add = (list, note) => {
    if (!list || !list.length) return;
    if (note) g.insertAdjacentHTML('beforeend', `<p class="tripnote">${note}</p>`);
    const grid = document.createElement('div'); grid.className = 'thumbs';
    list.forEach(p => {
      const i = everyPhoto.length;
      everyPhoto.push({p, y, where, cal, trip: note ? Y.trip : null, ti: !cal && dayTi(Y, stories), more: storyShort(Y, stories, p[2])});
      const b = document.createElement('button'); b.className = 'thumb'; b.type = 'button';
      const url = SRC.photo(p);
      b.innerHTML = `<span class="im">${url ? `<img loading="lazy" decoding="async" alt="${esc(p[2])}" src="${esc(url)}" style="object-position:${focus(p)}">` : ''}</span><small>${esc(p[2] || 'Darshan')}</small>`;
      const im = b.querySelector('.im'), words = () => { im.classList.add('words'); im.textContent = p[2] || 'Darshan'; };
      if (!url) words(); else b.querySelector('img').onerror = words;
      b.onclick = () => view(i);
      grid.append(b);
    });
    g.append(grid);
  };
  if (Y) add(Y.p);
  if (Y && Y.trip) add(Y.t, `${Y.p.length ? 'From the same trip' : 'From these days'}, ${tripText(Y.trip)}`);
  $('groups').append(g);
}
function tripText([a, b]) {
  const d = s => `${+s.slice(8)} ${MONTHS[+s.slice(5, 7) - 1]}`;
  return a === b ? d(a) : `${d(a)} to ${d(b)}`;
}

// the wide view, which is also the slideshow
let vi = 0, vtimer = null, lastFocus = null;
function view(i, play) {
  if (!everyPhoto.length) return;
  if ($('viewer').hidden) { lastFocus = document.activeElement; $('viewer').hidden = false; document.body.style.overflow = 'hidden'; $('vclose').focus(); }
  vi = (i + everyPhoto.length) % everyPhoto.length;
  const {p, y, where, cal, trip, ti, more} = everyPhoto[vi];
  const url = SRC.big(p) || SRC.photo(p);
  const when = trip ? tripText(trip) + ' ' + y : `${DAY.title} ${y}`;
  const none = `<div class="none">${esc(p[2] || 'Darshan')}</div>`;
  $('vstage').innerHTML = `<figure class="vframe" style="margin:0">${url ? `<img alt="${esc(p[2])}" src="${esc(url)}">` : none}` +
    `<figcaption class="vcap"><p>${esc(p[2] || 'Darshan')}</p><div>${esc([when, where, (cal && cal[0]) || ti, festOf(cal)].filter(Boolean).join(' · '))}</div>` +
    (more ? `<p class="vday">${esc(more)}</p>` : '') +
    `<a class="go" href="${esc(trip && trip[0] !== trip[1] ? `{{SEARCH}}#place=${encodeURIComponent(String(where || '').split(',')[0])}&from=${trip[0]}&to=${trip[1]}` : SRC.search(trip ? trip[0] : y + '-' + DAY.date))}">See more &rsaquo;</a></figcaption></figure>`;
  const img = $('vstage').querySelector('img');
  if (img) img.onerror = () => img.outerHTML = none;
  $('vpos').textContent = `${vi + 1} of ${everyPhoto.length}`;
  if (play !== undefined) setPlay(play);
  const n = everyPhoto[(vi + 1) % everyPhoto.length].p, pre = SRC.big(n) || SRC.photo(n);
  if (pre) new Image().src = pre;   // the next photo is ready before it is needed
}
function setPlay(on) {
  clearInterval(vtimer); vtimer = null;
  $('viewer').classList.toggle('play', on);
  $('vplay').textContent = on ? 'Pause' : 'Play';
  if (on) vtimer = setInterval(() => view(vi + 1), reduce ? 9000 : 6000);
}
function shut() {
  setPlay(false); $('viewer').hidden = true; document.body.style.overflow = '';
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  lastFocus && lastFocus.focus();
}
$('vclose').onclick = shut;
// a click on the dark around the photo closes it, back to the page underneath (Darpan, 26 Oct)
$('viewer').addEventListener('click', e => { if (!e.target.closest('.vframe, button, a')) shut(); });
$('vprev').onclick = () => view(vi - 1);
$('vnext').onclick = () => view(vi + 1);
$('vplay').onclick = () => setPlay(!vtimer);
$('slideshow').onclick = () => {
  view(0, true);
  const fs = $('viewer').requestFullscreen; if (fs) fs.call($('viewer')).catch(() => {});
};
let sx = null;
$('vstage').addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive: true});
$('vstage').addEventListener('touchend', e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) view(vi + (dx < 0 ? 1 : -1)); sx = null; });

// choosing a day
let pm = 0;
function month(m) {
  pm = (m + 12) % 12;
  $('pm-name').textContent = MONTHS[pm];
  $('daygrid').innerHTML = '';
  for (let d = 1; d <= LEN[pm]; d++) {
    const k = pad(pm + 1) + '-' + pad(d), b = document.createElement('button');
    b.type = 'button'; b.textContent = d; b.setAttribute('aria-label', `${d} ${MONTHS[pm]}`);
    if (k === showing) b.className = 'on'; if (k === TODAY) b.classList.add('today');
    b.onclick = () => { $('picker').hidden = true; open(k, true); scrollTo({top: 0}); };
    $('daygrid').append(b);
  }
}
$('choose').onclick = () => { month(+showing.slice(0, 2) - 1); $('picker').hidden = false; $('pm-name').focus && $('daygrid').querySelector('.on, button').focus(); };
$('pm-prev').onclick = () => month(pm - 1);
$('pm-next').onclick = () => month(pm + 1);
$('pclose').onclick = () => { $('picker').hidden = true; $('choose').focus(); };
$('picker').addEventListener('click', e => { if (e.target === $('picker')) $('pclose').click(); });
$('prev').onclick = () => open(shift(showing, -1), true);
$('next').onclick = () => open(shift(showing, 1), true);
$('back-today').onclick = () => open(TODAY, true);

addEventListener('keydown', e => {
  if (!$('picker').hidden && e.key === 'Escape') { $('pclose').click(); return; }
  if ($('viewer').hidden) return;
  if (e.key === 'Escape') shut();
  else if (e.key === 'ArrowRight') view(vi + 1);
  else if (e.key === 'ArrowLeft') view(vi - 1);
});
addEventListener('hashchange', () => { if (/^#\d\d-\d\d$/.test(location.hash) || !location.hash) open(wanted()); });

open(wanted());
// left open overnight (a tablet on a stand), today's page moves on to the new day at midnight, like the TV player
// (whole website review, 28 Oct 2026); a day someone picked stays as it is
setInterval(() => {
  const d = new Date(), t = pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  if (t === TODAY) return;
  const was = TODAY;
  now = d; TODAY = t;
  if (showing === was) open(TODAY, true);
}, 60000);
</script>
