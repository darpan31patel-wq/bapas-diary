<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
/* Then and now (bapas-diary.com/then-and-now/): one pair at a time, two equal frames side by side joined by a gold seam that names the years between;
   the site's maroon and gold look, like the About page. Built by tools/build_then_now.py. */
:root {
  --maroon-out: #160509; --maroon-in: #42101c; --maroon: #6e1424;
  --gold-hi: #ffe296; --gold: #d9a441; --gold-deep: #a8742a; --paper: #f3ead9; --muted: #c9b79a;
  --title: Cinzel, "Trajan Pro", Georgia, serif; --serif: Lora, Georgia, "Times New Roman", serif;
  --script: "Cormorant Garamond", Garamond, Georgia, serif; --sans: Arimo, Arial, Helvetica, sans-serif;
  --fade: 3s;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  background: radial-gradient(120% 80% at 50% 0%, var(--maroon-in), var(--maroon-out) 70%) fixed, var(--maroon-out);
  color: var(--paper); font: 400 16px/1.55 var(--serif);
}
/* Darpan, 26 Oct 2026: wide screens use the full width, so the pair grows edge to edge (only held back so both photos still fit the screen's height) */
main { margin: 0 auto; padding-block: 56px 48px;
  padding-left: max(clamp(16px, 2.5vw, 40px), env(safe-area-inset-left, 0px)); padding-right: max(clamp(16px, 2.5vw, 40px), env(safe-area-inset-right, 0px));
  display: grid; gap: 22px; }
header { text-align: center; display: grid; gap: 6px; }
.crumb { font: 700 11px/1 var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
.crumb a { color: var(--muted); text-decoration: none; } .crumb a:hover { color: var(--gold-hi); }
.crumb b { color: var(--gold); font-weight: 700; }
/* Darpan, 26 Oct 2026: the page is called Legacy, "Years apart, the same blessings" under it (the menu tab stays Then and now) */
h1 { margin: 0; font: 600 clamp(30px, 5.4vw, 52px)/1.05 var(--title); letter-spacing: .1em; color: var(--gold-hi); text-wrap: balance; }
.tagline { font: italic 500 clamp(20px, 2.8vw, 27px)/1.2 var(--script); color: var(--paper); }
.where { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 4px 14px; margin-top: 8px; padding-top: 10px;
  border-top: 1px solid rgba(217,164,65,.3); max-width: 36rem; margin-inline: auto; width: 100%; }
#place { font: 600 clamp(17px, 2.2vw, 22px)/1.2 var(--title); letter-spacing: .08em; color: var(--gold); }
.moment { font: italic 500 clamp(17px, 2.2vw, 21px)/1.2 var(--script); color: var(--muted); }

.pair { display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; gap: 0;
  width: min(100%, calc((100vh - 340px) * 8 / 3 + 120px)); min-width: min(100%, 720px); margin-inline: auto; }
figure { margin: 0; display: grid; grid-template-rows: auto 1fr; gap: 10px; min-width: 0; align-content: start; }
.frame { position: relative; aspect-ratio: 4 / 3; max-width: 100%; overflow: hidden; border: 1px solid var(--gold-deep);
  background: var(--maroon-out); box-shadow: 0 18px 40px rgba(0,0,0,.45); }
.frame .layer { position: absolute; inset: 0; opacity: 0; transition: opacity var(--fade) ease-in-out; }
.frame .layer.on { opacity: 1; }
.frame .bg { position: absolute; inset: -20px; background-size: cover; background-position: center; filter: blur(18px) brightness(.45); }
.frame img { position: relative; width: 100%; height: 100%; object-fit: contain; display: block; }
/* Darpan, 26 Oct 2026: every change of pair fades slowly, over 3 seconds; the words fade out and back in over the same time */
.soft { transition: opacity calc(var(--fade) / 2) ease-in-out; }
.soft.out { opacity: 0; }
figcaption { text-align: center; display: grid; gap: 2px; align-content: start; }
.guru { font: 600 clamp(13px, 1.7vw, 17px)/1.25 var(--title); letter-spacing: .04em; color: var(--gold-hi); }
.date { font: 700 11px/1.4 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--gold); font-variant-numeric: tabular-nums; }
.cap { font: italic 400 14px/1.45 var(--serif); color: var(--muted); }

.seam { position: relative; width: clamp(34px, 7vw, 92px); display: grid; place-items: center; }
.seam::before { content: ""; position: absolute; top: 4%; bottom: 30%; left: 50%; width: 1px; background: linear-gradient(transparent, var(--gold), transparent); }
.years { position: relative; display: grid; place-items: center; width: clamp(34px, 6.4vw, 78px); aspect-ratio: 1; border-radius: 50%;
  border: 1px solid var(--gold); background: var(--maroon); color: var(--gold-hi); text-align: center; margin-bottom: 26%; }
.years b { display: block; font: 600 clamp(14px, 2.6vw, 26px)/1 var(--title); }
.years small { display: block; font: 700 clamp(7px, .9vw, 9px)/1.2 var(--sans); letter-spacing: .14em; text-transform: uppercase; }

.nav { display: flex; justify-content: center; align-items: center; gap: 14px; }
.back { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--gold-deep); background: transparent; color: var(--gold-hi); font: 400 24px/1 var(--serif); cursor: pointer; }
.back:hover { border-color: var(--gold); background: rgba(217,164,65,.08); }
/* one Next button (Darpan, 26 Oct 2026: "just a NEXT button will do") */
.next { display: inline-flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 34px; border: 1px solid var(--gold); border-radius: 999px;
  background: var(--gold); color: var(--maroon-out); font: 700 14px/1 var(--sans); letter-spacing: .24em; text-transform: uppercase; cursor: pointer; }
.next span { font: 400 24px/1 var(--serif); letter-spacing: 0; }
.next:hover { background: var(--gold-hi); border-color: var(--gold-hi); }
button:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }
.links { text-align: center; font: 400 13px/1.6 var(--sans); color: var(--muted); }
.links a { color: var(--gold); }
.note { max-width: 62ch; margin: 6px auto 0; text-align: center; font: 400 13px/1.6 var(--sans); color: var(--muted);

@media (max-width: 560px) { .cap { font-size: 12px; } }
@media (prefers-reduced-motion: reduce) { :root { --fade: 0s; } }

.seam .years { width: clamp(46px, 6.4vw, 78px); }
.seam .years small { font-size: 9.5px; letter-spacing: .05em; }

const R2 = 'https://photos.bapas-diary.com/';
PAIRS.forEach(p => ['psm', 'msm'].forEach(g => p[g].src = R2 + (p[g].t || 'm') + '/' + p[g].album + '/' + encodeURIComponent(p[g].file)));
const slug = p => short(p).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

let i = 0;
function layer(frame, src, alt) {
  const old = [...frame.children], l = document.createElement('div'); l.className = 'layer';
  l.innerHTML = '<div class="bg"></div><img alt="">'; l.firstChild.style.backgroundImage = `url(${src})`;
  const img = l.lastChild; img.alt = alt; frame.append(l);
  const go = () => requestAnimationFrame(() => { l.classList.add('on'); old.forEach(o => { o.classList.remove('on'); setTimeout(() => o.remove(), fadeMs + 100); }); });
  img.onload = img.onerror = go; img.src = src;
}
const fadeMs = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fade')) * 1000 || 0;
let words = null;
function show(n) {
  i = (n + PAIRS.length) % PAIRS.length; const p = PAIRS[i], pl = short(p.place);
  for (const [k, s] of [['p', p.psm], ['m', p.msm]])
    layer($(k + 'frame'), s.src, (k === 'p' ? 'Pramukh Swami Maharaj' : 'Mahant Swami Maharaj') + ', ' + pl + ', ' + fmt(s.date));
  const soft = document.querySelectorAll('.soft'), first = !$('place').dataset.set;
  const text = () => {
    $('place').textContent = pl; $('place').dataset.set = 1; $('crumb').textContent = pl; $('moment').textContent = p.moment;
    for (const [k, s] of [['p', p.psm], ['m', p.msm]]) {
      $(k + 'date').textContent = fmt(s.date); $(k + 'cap').textContent = clean(s.cap);
      $(k + 'link').href = '/search/#date=' + s.date; $(k + 'y').textContent = s.date.slice(0, 4);
    }
    const gap = +p.msm.date.slice(0, 4) - +p.psm.date.slice(0, 4);
    $('gap').textContent = gap; $('gap').nextElementSibling.textContent = gap === 1 ? 'year' : 'years';
    soft.forEach(e => e.classList.remove('out'));
  };
  clearTimeout(words);
  if (first || !fadeMs) text(); else { soft.forEach(e => e.classList.add('out')); words = setTimeout(text, fadeMs / 2); }
  history.replaceState(null, '', '#' + slug(p.place));
}
$('next').onclick = () => show(i + 1); $('prev').onclick = () => show(i - 1);
// Darpan, 26 Oct 2026: after 10 seconds with nobody touching the page, the next pair comes by itself
const IDLE = 10000; let idle = null;
const rest = () => { clearTimeout(idle); idle = setTimeout(() => { show(i + 1); rest(); }, IDLE + fadeMs); };
['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(t => addEventListener(t, rest, { passive: true }));
document.addEventListener('visibilitychange', () => document.hidden ? clearTimeout(idle) : rest());
rest();
// a swipe on a phone: left for the next pair, right to go back
let sx = null; $('pair').addEventListener('touchstart', e => sx = e.touches[0].clientX, { passive: true });
$('pair').addEventListener('touchend', e => { if (sx == null) return; const d = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(d) > 50) show(i + (d < 0 ? 1 : -1)); });
addEventListener('keydown', e => { if (e.key === 'ArrowLeft') show(i - 1); if (e.key === 'ArrowRight') show(i + 1); });
const want = PAIRS.findIndex(p => slug(p.place) === location.hash.slice(1));
show(want >= 0 ? want : 0);
addEventListener('hashchange', () => { const k = PAIRS.findIndex(p => slug(p.place) === location.hash.slice(1)); if (k >= 0 && slug(PAIRS[k].place) !== slug(PAIRS[i].place)) show(k); });
