<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
/* Then and now (bapas-diary.com/then-and-now/): one pair at a time, two equal frames side by side joined by a gold seam that names the years between;
   the site's maroon and gold look, like the About page. Built by tools/build_then_now.py. */
:root {
  --maroon-out: #160509; --maroon-in: #42101c; --maroon: #6e1424;
  --gold-hi: #ffe296; --gold: #d9a441; --gold-deep: #a8742a; --paper: #f3ead9; --muted: #c9b79a;
  --title: Cinzel, "Trajan Pro", Georgia, serif; --serif: Lora, Georgia, "Times New Roman", serif;
  --script: "Cormorant Garamond", Garamond, Georgia, serif; --sans: Arimo, Arial, Helvetica, sans-serif;
  --fade: 3s;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  background: radial-gradient(120% 80% at 50% 0%, var(--maroon-in), var(--maroon-out) 70%) fixed, var(--maroon-out);
  color: var(--paper); font: 400 16px/1.55 var(--serif);
}
/* Darpan, 26 Oct 2026: wide screens use the full width, so the pair grows edge to edge (only held back so both photos still fit the screen's height) */
main { margin: 0 auto; padding-block: 56px 48px;
  padding-left: max(clamp(16px, 2.5vw, 40px), env(safe-area-inset-left, 0px)); padding-right: max(clamp(16px, 2.5vw, 40px), env(safe-area-inset-right, 0px));
  display: grid; gap: 22px; }
header { text-align: center; display: grid; gap: 6px; }
.crumb { font: 700 11px/1 var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
.crumb a { color: var(--muted); text-decoration: none; } .crumb a:hover { color: var(--gold-hi); }
.crumb b { color: var(--gold); font-weight: 700; }
/* Darpan, 26 Oct 2026: the page is called Legacy, "Years apart, the same blessings" under it (the menu tab stays Then and now) */
/* Darpan, 28 Oct 2026: the title is "The same blessings, through the years" (his pick), smaller, in the same lettering as the other pages' headings */
h1 { margin: 0; font: 600 clamp(22px, 2.9vw, 32px)/1.2 var(--title); letter-spacing: .03em; color: var(--gold-hi); text-wrap: balance; }
.tagline { font: italic 500 clamp(20px, 2.8vw, 27px)/1.2 var(--script); color: var(--paper); }
.where { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 4px 14px; margin-top: 8px; padding-top: 10px;
  border-top: 1px solid rgba(217,164,65,.3); max-width: 36rem; margin-inline: auto; width: 100%; }
/* Darpan, 28 Oct 2026: the words a little bigger, the photos a little smaller */
#place { font: 600 clamp(20px, 2.6vw, 28px)/1.2 var(--title); letter-spacing: .08em; color: var(--gold); }
.moment { font: italic 500 clamp(20px, 2.6vw, 27px)/1.2 var(--script); color: var(--muted); }

.pair { display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; gap: 0;
  width: min(100%, 86vw, calc((100vh - 420px) * 8 / 3 + 120px)); min-width: min(100%, 680px); margin-inline: auto; }
figure { margin: 0; display: grid; grid-template-rows: auto 1fr; gap: 10px; min-width: 0; align-content: start; }
.frame { position: relative; aspect-ratio: 4 / 3; max-width: 100%; overflow: hidden; border: 1px solid var(--gold-deep);

.frame .layer { position: absolute; inset: 0; opacity: 0; transition: opacity var(--fade) ease-in-out; }
.frame .layer.on { opacity: 1; }
.frame .bg { position: absolute; inset: -20px; background-size: cover; background-position: center; filter: blur(18px) brightness(.45); }
.frame img { position: relative; width: 100%; height: 100%; object-fit: contain; display: block; }
/* Darpan, 26 Oct 2026: every change of pair fades slowly, over 3 seconds; the words fade out and back in over the same time */
.soft { transition: opacity calc(var(--fade) / 2) ease-in-out; }
.soft.out { opacity: 0; }
figcaption { text-align: center; display: grid; gap: 2px; align-content: start; }
/* the gold Photos button under each photo: that day in Search (Darpan, 28 Oct 2026) */
.go { display: inline-block; margin-top: 8px; padding: 6px 13px; border: 1px solid var(--gold); border-radius: 999px; color: var(--gold); font: 600 11.5px/1.2 var(--sans); letter-spacing: .08em; text-transform: uppercase; text-decoration: none; }

.guru { font: 600 clamp(15px, 2vw, 21px)/1.25 var(--title); letter-spacing: .04em; color: var(--gold-hi); }
.pl { font: 600 clamp(14px, 1.6vw, 17px)/1.3 var(--title); letter-spacing: .06em; color: var(--gold); }
.pl:empty { display: none; }
.date { font: 700 13px/1.4 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--gold); font-variant-numeric: tabular-nums; }
.cap { font: italic 400 clamp(15px, 1.5vw, 18px)/1.45 var(--serif); color: var(--muted); }

.seam { position: relative; width: clamp(34px, 7vw, 92px); display: grid; place-items: center; }
.seam::before { content: ""; position: absolute; top: 4%; bottom: 30%; left: 50%; width: 1px; background: linear-gradient(transparent, var(--gold), transparent); }
.years { position: relative; display: grid; place-items: center; width: clamp(34px, 6.4vw, 78px); aspect-ratio: 1; border-radius: 50%;

.years b { display: block; font: 600 clamp(14px, 2.6vw, 26px)/1 var(--title); }
.years small { display: block; font: 700 clamp(7px, .9vw, 9px)/1.2 var(--sans); letter-spacing: .14em; text-transform: uppercase; }

.nav { display: flex; justify-content: center; align-items: center; gap: 14px; }
.back { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--gold-deep); background: transparent; color: var(--gold-hi); font: 400 24px/1 var(--serif); cursor: pointer; }
.back:hover { border-color: var(--gold); background: rgba(217,164,65,.08); }
/* one Next button (Darpan, 26 Oct 2026: "just a NEXT button will do") */
.next { display: inline-flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 34px; border: 1px solid var(--gold); border-radius: 999px;

.next span { font: 400 24px/1 var(--serif); letter-spacing: 0; }
.next:hover { background: var(--gold-hi); border-color: var(--gold-hi); }
button:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }
.links { text-align: center; font: 400 15px/1.6 var(--sans); color: var(--muted); }

@media (max-width: 560px) { .cap { font-size: 12px; } }
@media (prefers-reduced-motion: reduce) { :root { --fade: 0s; } }
