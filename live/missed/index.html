<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Searches that found nothing</title>
<style>
:root{--maroon-deep:#2a0a12;--gold-hi:#ffe296;--gold-soft:#d9a441;--cream:#fff3dc;--mist:#d8c3a5}
body{margin:0;background:radial-gradient(circle at 50% 0,#5a1626,var(--maroon-deep) 60%);color:var(--cream);font:16px/1.5 'Lora',Georgia,serif;min-height:100vh;padding:28px 16px 60px}
main{max-width:720px;margin:0 auto}
h1{font:500 26px/1.2 'Lora',Georgia,serif;color:var(--gold-hi);margin:0 0 4px}
p.l{margin:0 0 20px;color:var(--mist)}
form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
input{flex:1 1 200px;font:inherit;padding:10px 14px;border-radius:999px;border:1px solid rgba(217,164,65,.5);background:rgba(0,0,0,.3);color:var(--cream)}
button{font:700 11px 'Poppins',system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#3d0e19;background:var(--gold-soft);border:0;border-radius:999px;padding:10px 18px;cursor:pointer}
h2{font:700 10.5px/1 'Poppins',system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-soft);margin:26px 0 8px;border-bottom:1px solid rgba(217,164,65,.3);padding-bottom:8px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dotted rgba(217,164,65,.18)}
li span:last-child{color:var(--mist);font-variant-numeric:tabular-nums}
.note{color:var(--mist);font-style:italic}
</style>
</head>
<body>
<main>
<h1>Searches that found nothing</h1>
<p class="l">The words people typed into Search that gave no photos or stories, by day, most often first. Only the words and the day are kept.</p>
<form id="f"><input id="k" type="password" placeholder="The word (MISSED_KEY)" autocomplete="current-password"><button type="submit">Show</button></form>
<div id="out"><p class="note">Type the word and press Show.</p></div>
</main>
<script>
const $ = id => document.getElementById(id), out = $('out');
const nice = d => new Date(d + 'T12:00:00Z').toLocaleDateString('en-GB', {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'});
async function show(key) {
  out.innerHTML = '<p class="note">Looking…</p>';
  const r = await fetch('/api/missed?key=' + encodeURIComponent(key), {cache: 'no-store'});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { out.innerHTML = `<p class="note">${j.error === 'no store yet' ? 'The store is not set up yet.' : 'That is not the word.'}</p>`; return; }
  try { localStorage.setItem('bapas-diary-missed', key); } catch (e) {}
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  out.innerHTML = j.days.length ? j.days.map(([day, list]) => `<h2>${nice(day)}</h2><ul>${list.map(([q, n]) => `<li><span>${esc(q)}</span><span>${n === 1 ? 'once' : n + ' times'}</span></li>`).join('')}</ul>`).join('')
    : '<p class="note">Nothing saved yet: every search so far found something.</p>';
}
$('f').addEventListener('submit', e => { e.preventDefault(); show($('k').value.trim()); });
try { const k = localStorage.getItem('bapas-diary-missed'); if (k) { $('k').value = k; show(k); } } catch (e) {}
</script>
</body>
</html>
