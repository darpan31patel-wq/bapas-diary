<style>

* { box-sizing: border-box; }

/* the chosen day, down the middle (Darpan, 30 Oct 2026: no Jay Swaminarayan or the two portraits; "Murti Darshan" at the

.feature { display: flex; flex-direction: column; align-items: center; gap: 14px; margin: 0 0 48px; }

.arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(255,226,150,.6);

  background: linear-gradient(#ffe296, #d9a441); }
.col { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px; border-radius: 999px; font: 500 12.5px var(--poppins-f); color: #f3e6cc;

.dot { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(255,255,255,.35); }

.strip { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; }

  box-shadow: 0 0 0 1px rgba(217,164,65,.35); opacity: .78; transition: opacity .2s, box-shadow .2s; }
.strip img { display: block; width: 100%; height: 100%; object-fit: cover; }

/* looking back */

.seg button.on { background: linear-gradient(#ffe296, #d9a441); color: #3b1219; border-color: transparent; }

.chips:empty { display: none; }

  background: rgba(22,5,9,.35); color: #ecd6ab; font: 500 13px var(--poppins-f); cursor: pointer; }
.chips button.on { border-color: var(--gold-hi); background: rgba(217,164,65,.2); color: #fff3cf; }
.chips small { opacity: .7; }
h3.group { display: flex; align-items: center; gap: 12px; margin: 26px 0 12px; font: 600 22px var(--lora-f); color: var(--gold-hi); }

/* By day, as the Calendar page (Darpan, 30 Oct 2026: "the same style as the calendar we have already, a scrolling bar
   left to right with the dates underneath, I don't like this long format that you scroll down"): the months side by
   side in five week rows, oldest on the left, scrolled sideways by wheel, drag, swipe or the arrows; the month's name
   above fades as the months pass; under them a bar of the months to jump to. Look C: ivory cards, the date on a dark
   backing, the festival in gold along the bottom, softly faded until the mouse comes near (else around the chosen day) */
.dcal { --cw: 120px; --g: 8px; --mgap: clamp(28px, 4vw, 64px); }
.mtitle { position: relative; height: clamp(40px, 6vh, 60px); margin: 0 0 6px; }
.mtitle span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; white-space: nowrap;
  font: 500 clamp(30px, 5vh, 52px)/1 var(--lora-f); background: linear-gradient(180deg, #ffe296, #ce9840); -webkit-background-clip: text; background-clip: text; color: transparent;
  transition: opacity .7s ease, transform .7s ease; }
.mtitle span.out { opacity: 0; transform: translateY(8px); }
.dtrack { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; cursor: grab; outline: none; margin: 0 calc(-1 * max(16px, 2.2vw)); }
.dtrack::-webkit-scrollbar { display: none; }
.dtrack.drag { cursor: grabbing; }
.dribbon { display: flex; align-items: center; gap: var(--mgap); width: max-content; padding-block: 4px 12px; }
.dmonth { flex: none; width: calc(7 * var(--cw) + 6 * var(--g)); height: var(--mh, 500px); display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
  grid-template-rows: 26px repeat(5, minmax(0, 1fr)); gap: var(--g); transition: opacity .25s linear; }
.cal-wkd { font: 700 clamp(11px, 1.6vh, 14px) var(--sans); letter-spacing: .22em; color: #c9a98a; text-align: center; text-transform: uppercase; align-self: end; }
.dmonth .empty { min-width: 0; border: 1px dashed rgba(234,223,200,.13); border-radius: 3px; }
.dbar { display: flex; align-items: center; gap: 6px; max-width: 1180px; margin: 6px auto 0; padding: 6px; border: 1px solid rgba(206,152,64,.35); border-radius: 18px; background: rgba(22,5,9,.55); }
.dmonths { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: safe center; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.dmonths::-webkit-scrollbar { display: none; }
.dmonths .mo { flex: 0 1 96px; min-width: 52px; border: 0; background: none; padding: 7px 8px; border-radius: 12px; cursor: pointer;
  font: 700 12px var(--sans); letter-spacing: .06em; color: #c9a98a; transition: background .25s, color .25s; }
.dmonths .mo:hover { color: var(--gold-hi); background: rgba(206,152,64,.14); }
.dmonths .mo.on { background: linear-gradient(180deg, #ffe296, #ce9840); color: #160509; }
.dmonths .ymark { flex: none; font: 700 12px var(--sans); letter-spacing: .14em; color: #160509; background: #ce9840; border-radius: 10px; padding: 4px 9px; margin: 0 6px; }
.jarr { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(206,152,64,.5); background: none; color: var(--gold-hi);
  font: 600 22px/1 var(--lora-f); cursor: pointer; display: grid; place-items: center; padding: 0 0 3px; }
.jarr:hover { background: rgba(206,152,64,.18); }
.jarr:disabled { opacity: .3; cursor: default; }
.dmonths .mo:focus-visible, .jarr:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 1px; }
.card { --q: 0; position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 4px; border: 0; border-radius: 3px; cursor: pointer; text-align: center;
  background: linear-gradient(170deg, #f8f2e4, #eadfc8); color: #3a1a12;
  filter: grayscale(calc(.82 - .82 * var(--q))) brightness(calc(.55 + .45 * var(--q)));
  box-shadow: 0 4px 12px rgba(0,0,0,.3), 0 0 calc(30px * var(--q)) calc(6px * var(--q)) rgba(255,206,110,calc(.38 * var(--q))); transition: box-shadow .3s; }
.card:hover, .card:focus-visible { z-index: 2; outline: none; filter: none;
  box-shadow: 0 0 0 2px #ffe296, 0 0 18px 4px rgba(255,214,120,.55), 0 0 42px 10px rgba(206,152,64,.35), 0 6px 16px rgba(0,0,0,.42); }
.card.on { filter: none; box-shadow: 0 0 0 2px #ffe296, 0 6px 16px rgba(0,0,0,.42); }
.card .win { position: relative; flex: 1; min-height: 0; width: 100%; overflow: hidden; background: #2a0a10; }
.card .num { position: absolute; left: 3px; top: 3px; font: 600 clamp(14px, 1.5vw, 22px)/1 var(--lora-f); color: #f8f2e4; text-shadow: 0 1px 3px rgba(0,0,0,.6);
  padding: .12em .28em .16em; border-radius: .3em; background: rgba(22,5,9,.5); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
.card .cfest { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 5px 4px; font: 700 clamp(8px, .72vw, 10.5px)/1.2 var(--sans); letter-spacing: .06em;
  color: #ffe296; background: linear-gradient(0deg, rgba(22,5,9,.92), rgba(22,5,9,0)); text-wrap: balance; }
.card.blank { cursor: default; }
.card.blank .win { display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #fbf6ea, #e9dcc0); }
.card.blank .bnum { font: 600 clamp(20px, 2.4vw, 36px)/1 var(--lora-f); color: #6e1424; opacity: .55; }
@media (max-width: 760px) {
  .cal-wkd { font-size: 9px; letter-spacing: .1em; }
  .card { padding: 2px; }
  .card .num { font-size: 12px; left: 2px; top: 2px; }
  .dmonth .card .cfest { display: none; }
  .dtrack { margin: 0 -16px; }
  .dbar { padding: 4px; } .jarr { width: 30px; height: 30px; }
  .dmonths .mo { min-width: 44px; padding: 8px 6px; font-size: 11.5px; }

/* By colour, festival and murti: each colour, or each month, in its own softly framed section with room around it

.sect { margin: 0 0 clamp(30px, 3.6vw, 52px); padding: clamp(14px, 1.8vw, 24px) clamp(14px, 2vw, 28px) clamp(18px, 2.2vw, 30px);

}
.card .cfest { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card.future { background: none; border: 1.5px dashed rgba(255,226,150,.6); padding: 3px; box-shadow: none; filter: none; }
.card.future .win { background: radial-gradient(circle at 50% 40%, #fdf9f0, #efe4cc); opacity: .92; border-radius: 2px; }

.dot.big { width: 16px; height: 16px; }

.none { margin: 40px auto; text-align: center; font: 400 16px var(--poppins-f); color: #cfae78; }

/* the mandir's own colours: no On this day photo finish on these murti photos */
.page img { filter: none !important; }
/* By festival: a timeline of the Indian year, Kartak to Aso, with a button for each festival that comes every year, no dates
   and no photos; a tap shows that festival's darshan from every year the archive has (Darpan, 30 Oct 2026: "don't show all
   the pictures, just give all the buttons"; "I want festivals for the whole year that are repeated every year. So it doesn't
   need to be the date with it... maybe like a timeline situation... where you click on them and it will show you all the
   pictures for that festival") */
.tline { position: relative; max-width: 1500px; margin: 0 auto; padding-left: 8px; }
.tline::before { content: ""; position: absolute; left: 172px; top: 10px; bottom: 10px; width: 2px;
  background: linear-gradient(rgba(217,164,65,.05), rgba(217,164,65,.6) 6%, rgba(217,164,65,.6) 94%, rgba(217,164,65,.05)); }
.tmonth { position: relative; display: grid; grid-template-columns: 150px 1fr; gap: 0 44px; padding: 0 0 clamp(22px, 2.4vw, 34px); }
.tmonth::before { content: ""; position: absolute; left: 158px; top: 9px; width: 14px; height: 14px; border-radius: 50%;
  background: linear-gradient(#ffe296, #d9a441); box-shadow: 0 0 0 4px rgba(22,5,9,.9), 0 0 14px rgba(255,226,150,.4); }
.tmonth h3 { margin: 0; text-align: right; font: 600 22px/1.2 var(--lora-f); color: var(--gold-hi); }
.tmonth h3 small { display: block; margin-top: 3px; font: 500 11px var(--poppins-f); letter-spacing: .12em; text-transform: uppercase; color: #cfae78; }

  border: 1px solid rgba(217,164,65,.4); background: rgba(22,5,9,.45); color: #f6e3bb; text-align: left; cursor: pointer;
  transition: background .2s, border-color .2s, transform .2s; }
.fbtn b { font: 600 16px/1.25 var(--lora-f); color: #f6e3bb; }
.fbtn i { font: normal 500 11.5px/1.3 var(--poppins-f); letter-spacing: .03em; color: #cfae78; }
.fbtn i span { white-space: nowrap; }
.fbtn:hover, .fbtn:focus-visible { border-color: var(--gold-hi); background: rgba(217,164,65,.16); transform: translateY(-1px); }
.fback { display: flex; justify-content: center; margin: 0 0 22px; }
.fback button { padding: 9px 20px; border-radius: 999px; border: 1px solid rgba(217,164,65,.45); background: rgba(22,5,9,.35); color: #e3c48e;
  font: 600 13px var(--poppins-f); letter-spacing: .06em; cursor: pointer; }
.fback button:hover { border-color: var(--gold-hi); color: #fff3cf; }
.seg { scroll-margin-top: 76px; }

}
@media (prefers-reduced-motion: reduce) { .card, .tile .t, .strip button { transition: none; } }

<script>
(function () {
  const PHOTOS = "https://photos.bapas-diary.com/darshan/";
  const CAL = window.DARSHAN_CAL || {};
  const WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], WDL = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const MON = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  // the mandir's ten photos each morning, in its own order
  const MURTIS = [["ddm", "Central shrine"], ["ddm_c", "Central shrine, close"], ["gm", "Ghanshyam Maharaj"], ["gm_c", "Ghanshyam Maharaj, close"],
    ["hkm_c", "Harikrishna Maharaj"], ["varni", "Nilkanth Varni"], ["bm", "Bhagatji Maharaj"], ["sm", "Shastriji Maharaj"], ["ym", "Yogiji Maharaj"], ["psm", "Pramukh Swami Maharaj"]];
  const NAME = Object.fromEntries(MURTIS);
  const COLOURS = { Red: "#c4182c", Pink: "#e0508f", Orange: "#ef7d1a", Yellow: "#f2c71c", Green: "#3f9a4a", Blue: "#2f5fc4", Purple: "#8a4fc0", White: "#f4efe4" };
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const nice = d => { const [y, m, dd] = d.split("-"); return `${+dd} ${MON[m - 1]} ${y}`; };
  const short = d => { const [, m, dd] = d.split("-"); return `${+dd} ${MON[m - 1].slice(0, 3)}`; };
  const src = (size, D, code) => `${PHOTOS}${size}/${D.d.replace(/-/g, "")}/${code}.jpg`;
  const both = c => c.length > 1 ? `${c[0]} and ${c[1].toLowerCase()}` : c[0];

  const DAYS = (window.DARSHAN_DAYS || []).filter(D => D && D.d && D.k && D.k.length).map(D => {
    const [y, m, dd] = D.d.split("-").map(Number), cal = CAL[D.d] || [];
    return { d: D.d, k: D.k, c: (D.c && D.c.length ? D.c : ["White"]).filter(c => COLOURS[c]), i: cal[0] || "", f: cal[1] || "", w: WDL[new Date(y, m - 1, dd).getDay()] };
  });
  const N = DAYS.length;
  if (!N) { $("big-box").innerHTML = `<p class="none">The darshan photos are not loading just now. Please try again in a few minutes.</p>`; return; }
  const BY = {}; DAYS.forEach((D, i) => BY[D.d] = i);
  let day = N - 1, code = DAYS[N - 1].k[0], view = "day", chip = null;
  const fromHash = () => { const h = location.hash.slice(1); if (BY[h] != null) { day = BY[h]; if (!DAYS[day].k.includes(code)) code = DAYS[day].k[0]; return true; } return false; };
  fromHash();

  function showDay() {
    const D = DAYS[day];
    if (!D.k.includes(code)) code = D.k[0];
    const big = $("big");
    big.src = src("m", D, code); big.alt = `${NAME[code]}, Neasden mandir, ${nice(D.d)}`;
    $("k-week").textContent = day === N - 1 ? `Latest · ${D.w}` : D.w;
    $("k-date").textContent = nice(D.d);
    $("k-ind").textContent = D.i;
    $("k-tags").innerHTML = (D.f ? `<span class="fest">${esc(D.f)}</span>` : "") +
      `<span class="col">${D.c.map(c => `<span class="dot" style="background:${COLOURS[c]}"></span>`).join("")}${both(D.c)} shringar</span>`;
    $("k-murti").textContent = NAME[code];
    $("strip").innerHTML = D.k.map(c =>
      `<button class="${c === code ? "on" : ""}" data-c="${c}" title="${NAME[c]}" aria-label="${NAME[c]}"><img src="${src("s", D, c)}" alt="" loading="lazy"></button>`).join("");
    $("prev").disabled = day === 0; $("next").disabled = day === N - 1;
    document.querySelectorAll("#grid .tile").forEach(t => t.classList.toggle("on", +t.dataset.day === day));
    requestAnimationFrame(spot);
  }
  const go = i => { day = i; showDay(); if (view === "day" && R) goMonth(R.months.findIndex(mo => mo.dataset.m === DAYS[i].d.slice(0, 7)), true); try { history.replaceState(null, "", "#" + DAYS[i].d); } catch (e) {} };
  $("strip").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { code = b.dataset.c; showDay(); } });
  $("prev").onclick = () => { if (day > 0) go(day - 1); };
  $("next").onclick = () => { if (day < N - 1) go(day + 1); };
  addEventListener("keydown", e => {
    if (e.target.closest && e.target.closest("input, textarea")) return;
    if (e.key === "ArrowLeft") $("prev").click(); if (e.key === "ArrowRight") $("next").click();
  });
  addEventListener("hashchange", () => { if (fromHash()) showDay(); });

  const tile = (i, c, label, extra) =>
    `<button class="tile" data-day="${i}" data-code="${c}"><span class="t"><img src="${src("s", DAYS[i], c)}" alt="" loading="lazy"></span><b>${esc(label)}</b>${extra || ""}</button>`;
  const newest = () => DAYS.map((D, i) => i).reverse();

  // the Indian months from the Gujarati new year, and roughly when each falls
  const IMONTHS = [["Kartak", "Oct to Nov"], ["Magshar", "Nov to Dec"], ["Posh", "Dec to Jan"], ["Maha", "Jan to Feb"], ["Fagan", "Feb to Mar"],
    ["Chaitra", "Mar to Apr"], ["Vaishakh", "Apr to May"], ["Jeth", "May to Jun"], ["Ashadh", "Jun to Jul"], ["Shravan", "Jul to Aug"],
    ["Bhadarvo", "Aug to Sep"], ["Aso", "Sep to Oct"]];
  const TITHI = ["Padvo", "Bij", "Trij", "Choth", "Pancham", "Chhath", "Satam", "Atham", "Nom", "Dasham", "Ekadashi", "Baras", "Teras", "Chaudas", "Punam"];
  // where an Indian date ("Adhik Jeth Sud Pancham", "Aso Vad Chaudas/Amas") falls in the year: month, then Sud or Vad, then tithi
  const ipos = ind => { const w = (ind || "").replace(/^Adhik /, "").split(/[ /]+/), m = IMONTHS.findIndex(x => x[0] === w[0]);
    if (m < 0) return null; const t = TITHI.indexOf(w[2]); return { m, at: m * 30 + (w[1] === "Vad" ? 15 : 0) + (t < 0 ? 14 : t) }; };
  // not festivals: the calendar's eclipses, shraddh days, full and new moons and national days
  const NOT_FEST = new Set(["Eclipse", "Shraddh", "Punam", "Amas", "Republic Day", "Independence Day"]);
  let FESTS = null;
  function festivals() {
    if (FESTS) return FESTS;
    const by = {};
    DAYS.forEach((D, i) => (D.f || "").split(/\s*;\s*/).forEach(n => { if (n && !NOT_FEST.has(n)) (by[n] = by[n] || []).push(i); }));
    const most = a => { const c = {}; a.forEach(x => c[x] = (c[x] || 0) + 1); const [k, n] = Object.entries(c).sort((x, y) => y[1] - x[1])[0] || []; return n > a.length / 2 ? k : ""; };
    FESTS = Object.entries(by).map(([name, list]) => {
      // a day with no Indian date goes by its English month (November is about Kartak)
      const years = new Set(list.map(i => DAYS[i].d.slice(0, 4))).size, ps = list.map(i => ipos(DAYS[i].i) ||
        { m: (+DAYS[i].d.slice(5, 7) + 1) % 12, at: ((+DAYS[i].d.slice(5, 7) + 1) % 12) * 30 + 15 }).sort((a, b) => a.at - b.at);
      const mid = ps[ps.length >> 1], every = list.length > 3 * years;
      // a guru's day kept on its English date shows that date; a festival on its tithi shows the usual tithi
      const md = most(list.map(i => DAYS[i].d.slice(5))), ind = most(list.map(i => DAYS[i].i.replace(/^Adhik /, ""))) || DAYS[list[list.length - 1]].i.replace(/^Adhik /, "");
      const when = every ? "" : md && list.length > 1 ? `${+md.slice(3)} ${MON[+md.slice(0, 2) - 1]}` : ind;
      return { name, list, years, days: list.length, when, month: every ? -1 : mid.m, at: every ? 999 : mid.at };
    }).sort((a, b) => a.at - b.at || a.name.localeCompare(b.name));
    return FESTS;
  }

  function render() {
    let chips = "", html = "";
    const first = i => DAYS[i].k.includes("ddm") ? "ddm" : DAYS[i].k[0];
    const fday = i => DAYS[i].f ? `<i class="f">${esc(DAYS[i].f)}</i>` : "";
    // a framed section of tiles, one for each colour or month
    const sect = (head, list) => `<section class="sect"><h3 class="group">${head}</h3><div class="grid">${list}</div></section>`;
    const byMonth = (list, head, each) => {
      const months = [...new Set(list.map(i => DAYS[i].d.slice(0, 7)))];
      return months.map(m => { const l = list.filter(i => DAYS[i].d.startsWith(m)), [y, mm] = m.split("-").map(Number);
        return sect(`${MON[mm - 1]} ${y} <small>${head(l.length)}</small>`, l.map(each).join("")); }).join("");
    };
    if (view === "day") {
      // the months side by side as on the Calendar page, a sixth week wrapping into the empty boxes of the first
      const months = [...new Set(DAYS.map(D => D.d.slice(0, 7)))];
      html += `<div class="dcal"><div class="mtitle" aria-live="polite"><span id="t0"></span><span id="t1" class="out"></span></div>` +
        `<div class="dtrack" id="dtrack" tabindex="0" aria-label="The days, scroll sideways"><div class="dribbon" id="dribbon">`;
      months.forEach(m => {
        const [y, mm] = m.split("-").map(Number), start = new Date(y, mm - 1, 1).getDay(), len = new Date(y, mm, 0).getDate(), cells = Array(35).fill(`<div class="empty"></div>`);
        for (let dd = 1; dd <= len; dd++) {
          const iso = `${m}-${String(dd).padStart(2, "0")}`, i = BY[iso], p = (start + dd - 1) % 35;
          if (i == null) { cells[p] = `<div class="card blank${iso > DAYS[N - 1].d ? " future" : ""}"><div class="win"><span class="bnum">${dd}</span></div></div>`; continue; }
          const D = DAYS[i];
          cells[p] = `<button class="card tile" data-day="${i}" data-code="${first(i)}" aria-label="${nice(D.d)}${D.f ? ", " + esc(D.f) : ""}"><div class="win"><img src="${src("s", D, first(i))}" alt="" loading="lazy" draggable="false"><span class="num">${dd}</span>${D.f ? `<span class="cfest">${esc(D.f)}</span>` : ""}</div></button>`;
        }
        html += `<div class="dmonth" data-m="${m}">` + WD.map(w => `<div class="cal-wkd">${w}</div>`).join("") + cells.join("") + `</div>`;
      });
      let yr = 0;
      html += `</div></div><div class="dbar"><button class="jarr" id="mprev" type="button" aria-label="Month before">&#8249;</button><div class="dmonths" id="dmonths" role="group" aria-label="Months">` +
        months.map((m, j) => { const [y, mm] = m.split("-").map(Number), mark = y !== yr ? `<span class="ymark">${y}</span>` : ""; yr = y;
          return `${mark}<button class="mo" type="button" data-j="${j}" title="${MON[mm - 1]} ${y}">${MON[mm - 1].slice(0, 3)}</button>`; }).join("") +
        `</div><button class="jarr" id="mnext" type="button" aria-label="Month after">&#8250;</button></div></div>`;
    } else if (view === "colour") {
      // a day shows under both of its main colours, each colour in its own section
      const counts = {}; DAYS.forEach(D => D.c.forEach(c => counts[c] = (counts[c] || 0) + 1));
      const list = Object.keys(COLOURS).filter(c => counts[c]);
      if (chip && !counts[chip]) chip = null;
      chips = `<button data-c="" class="${chip ? "" : "on"}">All colours</button>` + list.map(c =>
        `<button data-c="${c}" class="${chip === c ? "on" : ""}"><span class="dot" style="background:${COLOURS[c]}"></span>${c} <small>${counts[c]}</small></button>`).join("");
      (chip ? [chip] : list).forEach(c => {
        html += sect(`<span class="dot big" style="background:${COLOURS[c]}"></span>${c} <small>${counts[c]} ${counts[c] === 1 ? "day" : "days"}</small>`,
          newest().filter(i => DAYS[i].c.includes(c)).map(i => tile(i, first(i), short(DAYS[i].d), fday(i))).join(""));
      });
    } else if (view === "fest") {
      // the Indian year as a timeline, Kartak to Aso: each festival once, in the month it usually falls, with its tithi (or
      // its English date, for a guru's day kept on one) and how many years of darshan there are; a tap shows them all
      const F = festivals();
      if (chip && !F.some(f => f.name === chip)) chip = null;
      if (!F.length) html += `<p class="none">No festival days yet.</p>`;
      else if (!chip) {
        html += `<div class="tline">` + IMONTHS.map(([m, eng], j) => {
          const l = F.filter(f => f.month === j); if (!l.length) return "";
          return `<section class="tmonth"><h3>${m}<small>${eng}</small></h3><div class="fbtns">` + l.map(f =>
            `<button class="fbtn" type="button" data-f="${esc(f.name)}"><b>${esc(f.name)}</b><i>${esc(f.when)}${f.when ? " · " : ""}<span>${f.years} ${f.years === 1 ? "year" : "years"}</span></i></button>`).join("") +
            `</div></section>`; }).join("") + `</div>`;
        const every = F.filter(f => f.month < 0);
        if (every.length) html += `<div class="tline"><section class="tmonth"><h3>Every month</h3><div class="fbtns">` + every.map(f =>
          `<button class="fbtn" type="button" data-f="${esc(f.name)}"><b>${esc(f.name)}</b><i>${f.days} days · <span>${f.years} ${f.years === 1 ? "year" : "years"}</span></i></button>`).join("") + `</div></section></div>`;
      } else {
        const f = F.find(f => f.name === chip), list = f.list.slice().reverse();   // newest year first
        html += `<div class="fback"><button type="button" data-back="1">&#8249; All festivals</button></div><div class="fhead"><h3>${esc(chip)}</h3>${f.when ? `<p>${esc(f.when)}</p>` : ""}</div>`;
        if (f.month < 0) {
          // a day of every month: one photo a day, each year in its own section
          [...new Set(list.map(i => DAYS[i].d.slice(0, 4)))].forEach(y => {
            const l = list.filter(i => DAYS[i].d.startsWith(y));
            html += sect(`${y} <small>${l.length} ${l.length === 1 ? "day" : "days"}</small>`, l.map(i => tile(i, first(i), short(DAYS[i].d), DAYS[i].i ? `<i>${esc(DAYS[i].i)}</i>` : "")).join(""));
          });
        } else {
          // each year's festival day with all its photos
          html += list.map(i => sect(`${DAYS[i].d.slice(0, 4)} <small>${short(DAYS[i].d)}${DAYS[i].i ? " · " + esc(DAYS[i].i) : ""}</small>`,
            DAYS[i].k.map(c => tile(i, c, NAME[c] || "")).join(""))).join("");
        }
      }
    } else {
      const c = chip || "gm_c";
      chips = MURTIS.map(([k, name]) => `<button data-c="${k}" class="${c === k ? "on" : ""}">${name}</button>`).join("");
      html += byMonth(newest().filter(i => DAYS[i].k.includes(c)), n => `${esc(NAME[c])} · ${n} ${n === 1 ? "day" : "days"}`, i => tile(i, c, short(DAYS[i].d), fday(i)));
    }
    $("chips").innerHTML = chips; $("grid").innerHTML = html;
    document.querySelectorAll("#grid .tile").forEach(t => t.classList.toggle("on", +t.dataset.day === day));
    if (view === "day") ribbon();
    requestAnimationFrame(spot);
  }

  // By day, the Calendar page's ribbon: five rows of days fill the height, every month the same width, the months fade
  // by how far they are from the middle; the month in the middle names the title and lights up in the bar underneath
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let R = null, dragMoved = false;
  function sizeRibbon() {
    if (!R) return;
    const W = R.track.clientWidth, g = Math.max(4, Math.min(10, innerHeight * .009)), h = Math.max(320, Math.min(780, innerHeight * .64));
    const cw = Math.max(30, Math.min(((h - 26 - 5 * g) / 5) * 1.11, (W - 32 - 6 * g) / 7));
    R.MW = 7 * cw + 6 * g;
    const st = R.box.style; st.setProperty("--cw", cw + "px"); st.setProperty("--g", g + "px"); st.setProperty("--mh", 26 + 5 * g + 5 * (cw / 1.11) + "px");
    const pad = Math.max(16, (W - R.MW) / 2); R.ribbon.style.paddingInline = pad + "px";
    const m = R.months, n = m.length;
    R.PAD = m[0].offsetLeft; R.GAP = n > 1 ? (m[n - 1].offsetLeft - m[0].offsetLeft) / (n - 1) - R.MW : 0;
  }
  function goMonth(j, smooth) {
    if (!R) return;
    const left = R.PAD + j * (R.MW + R.GAP) - (R.track.clientWidth - R.MW) / 2;
    R.track.scrollTo({ left, behavior: smooth && !reduce ? "smooth" : "auto" });
  }
  let flip = 0;
  function frame() {
    R.tick = false;
    const W = R.track.clientWidth, mid = R.track.scrollLeft + W / 2, n = R.months.length;
    const j = Math.max(0, Math.min(n - 1, Math.round((mid - R.PAD - R.MW / 2) / (R.MW + R.GAP))));
    R.months.forEach((mo, i) => { const c = R.PAD + i * (R.MW + R.GAP) + R.MW / 2, edge = Math.max(0, Math.abs(c - mid) - R.MW / 2);
      mo.style.opacity = Math.max(.28, 1 - edge / (W * .55)).toFixed(3); });
    if (j !== R.cur) {
      R.cur = j; const [y, mm] = R.months[j].dataset.m.split("-").map(Number), t = [$("t0"), $("t1")];
      t[1 - flip].textContent = `${MON[mm - 1]} ${y}`; t[1 - flip].classList.remove("out"); t[flip].classList.add("out"); flip = 1 - flip;
      R.bar.querySelectorAll(".mo").forEach(b => { const on = +b.dataset.j === j; b.classList.toggle("on", on); if (on) R.bar.scrollLeft = b.offsetLeft - R.bar.offsetLeft - (R.bar.clientWidth - b.offsetWidth) / 2; });   // only the bar moves, never the page
      $("mprev").disabled = j === 0; $("mnext").disabled = j === n - 1;
    }
    spot();
  }
  const kick = () => { if (R && !R.tick) { R.tick = true; requestAnimationFrame(frame); } };
  function ribbon() {
    const track = $("dtrack");
    R = { box: track.parentNode, track, ribbon: $("dribbon"), bar: $("dmonths"), months: [...track.querySelectorAll(".dmonth")], cur: -1, tick: false };
    flip = 0; sizeRibbon();
    const want = R.months.findIndex(mo => mo.dataset.m === DAYS[day].d.slice(0, 7));
    goMonth(want < 0 ? R.months.length - 1 : want, false); frame();
    track.addEventListener("scroll", kick, { passive: true });
    // the mouse wheel moves the days sideways, and the page on up or down once the first or last month is reached
    track.addEventListener("wheel", e => {
      if (e.ctrlKey || e.metaKey || Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
      const max = track.scrollWidth - track.clientWidth;
      if ((e.deltaY < 0 && track.scrollLeft <= 0) || (e.deltaY > 0 && track.scrollLeft >= max - 1)) return;
      track.scrollLeft += e.deltaY; e.preventDefault();
    }, { passive: false });
    track.addEventListener("keydown", e => { if (e.key === "ArrowLeft" || e.key === "ArrowRight") e.stopPropagation(); });
    let down = null;
    track.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse") return; down = { x: e.clientX, s: track.scrollLeft }; dragMoved = false; });
    track.addEventListener("pointermove", e => { if (!down) return; const dx = e.clientX - down.x; if (Math.abs(dx) > 4) { dragMoved = true; track.classList.add("drag"); } track.scrollLeft = down.s - dx; });
    const up = () => { down = null; track.classList.remove("drag"); setTimeout(() => dragMoved = false, 0); };
    track.addEventListener("pointerup", up); track.addEventListener("pointerleave", up);
    R.bar.addEventListener("click", e => { const b = e.target.closest(".mo"); if (b) goMonth(+b.dataset.j, true); });
    $("mprev").onclick = () => goMonth(Math.max(0, R.cur - 1), true);
    $("mnext").onclick = () => goMonth(Math.min(R.months.length - 1, R.cur + 1), true);
  }
  addEventListener("resize", () => { if (view === "day" && R) { const j = R.cur; sizeRibbon(); goMonth(j, false); kick(); } });
  $("seg").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    view = b.dataset.v; chip = null; R = null;
    document.querySelectorAll("#seg button").forEach(x => { x.classList.toggle("on", x === b); x.setAttribute("aria-selected", x === b); }); render();
  });
  $("chips").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { chip = b.dataset.c || null; render(); } });
  $("grid").addEventListener("click", e => {
    const fb = e.target.closest(".fbtn, [data-back]");
    if (fb) { chip = fb.dataset.f || null; render(); $("seg").scrollIntoView({ block: "start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); return; }
    const t = e.target.closest(".tile"); if (!t || dragMoved) return;
    code = t.dataset.code; go(+t.dataset.day);
    scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  });

  // the Calendar page's look C: every day softly faded, the days near the mouse (else around the chosen day) come up in colour
  let spotXY = null, raf = 0;
  function spot() {
    raf = 0; let p = spotXY;
    if (!p) { const on = document.querySelector("#grid .card.on"); if (on) { const r = on.getBoundingClientRect(); p = [r.left + r.width / 2, r.top + r.height / 2]; } }
    document.querySelectorAll("#grid .card").forEach(c => {
      let q = 0;
      if (p) { const r = c.getBoundingClientRect(), d = Math.hypot((r.left + r.width / 2 - p[0]) / (r.width * 1.08 * 2.5), (r.top + r.height / 2 - p[1]) / (r.height * 1.08));
        q = Math.max(0, Math.min(1, (1.4 - d) / .6)); q = q * q * (3 - 2 * q); }
      c.style.setProperty("--q", q.toFixed(3));
    });
  }
  const spotAt = p => { spotXY = p; if (!raf) raf = requestAnimationFrame(spot); };
  $("grid").addEventListener("pointermove", e => { if (e.pointerType === "mouse") spotAt([e.clientX, e.clientY]); }, { passive: true });
  $("grid").addEventListener("pointerleave", () => spotAt(null));

  render(); showDay();
})();
</script>
</body>
</html>
